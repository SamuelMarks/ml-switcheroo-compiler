[pytest]
addopts = -p no:jaxtyping -n auto --dist loadfile -x
asyncio_default_fixture_loop_scope = function
pythonpath = src .
testpaths =
    tests
    tests_js
filterwarnings =
    ignore::DeprecationWarning:matplotlib.*
    ignore:.*'resetCache' deprecated.*:UserWarning
    ignore:.*'resetCache' deprecated.*:DeprecationWarning
