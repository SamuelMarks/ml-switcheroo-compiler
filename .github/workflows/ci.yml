name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write

env:
  UV_DYNAMIC_VERSIONING_BYPASS: "2.2.0"
  PDM_BUILD_SCM_VERSION: "2.2.0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/checkout@v4
      with:
        repository: SamuelMarks/ml-switcheroo-ir
        path: ml-switcheroo-ir

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install --upgrade setuptools wheel
        python3 -m pip install ruff build radon pylint mypy interrogate
        python3 -m pip install -r requirements.txt
        python3 -m pip install -r requirements-dev.txt
        for req in requirements-backend-*.txt; do python3 -m pip install -r "$req" || true; done
        python3 -m pip install -e ./ml-switcheroo-ir
        if [ -f "pyproject.toml" ]; then python3 -m pip install -e . --no-deps; fi

    - name: Check Code Formatting (Ruff)
      run: ruff format --config pyproject.toml --check

    - name: Check Linting (Ruff)
      run: ruff check --config pyproject.toml

    - name: Static Type Checking (MyPy)
      run: mypy --config-file pyproject.toml src/ml_switcheroo_compiler scripts tests

    - name: Docstring Coverage (Interrogate & Granular AST Check)
      run: |
        interrogate -c pyproject.toml src/ml_switcheroo_compiler scripts tests
        python3 scripts/check_docs.py src/ml_switcheroo_compiler scripts tests

    - name: Architectural, Dependency, Typing & Test AST Guards
      run: |
        python3 scripts/lint_dependencies.py
        python3 scripts/lint_numpy_leak.py
        python3 scripts/lint_dynamic_numpy.py
        python3 scripts/lint_any.py --max-count 0
        python3 scripts/lint_typing.py
        python3 scripts/lint_pass.py --check-zero-assertions

    - name: Cyclomatic Complexity
      run: |
        radon cc src/ -a --total-average | grep "Average complexity: A"

    - name: Duplicate Code Check
      run: |
        pids=""
        for d in src/ml_switcheroo_compiler/*/; do
          pylint "$d" --disable=all --enable=duplicate-code --ignore-patterns=".*stubs?\.pyi" &
          pids="$pids $!"
        done
        for pid in $pids; do
          if ! wait "$pid"; then
            kill $pids 2>/dev/null || true
            exit 1
          fi
        done

    - name: Validate Backend Mappings, Parameters & Rules
      run: |
        python3 scripts/validate_backend_mappings.py
        python3 scripts/validate_parameters.py
        python3 scripts/validate_rules.py

    - name: Check Snapshot Drift
      run: python3 scripts/check_snapshot_drift.py

    - name: Run JavaScript Runtime Tests
      run: node --test tests_js/*.js

    - name: Build Package
      run: python3 -m build

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        backend: [cupy, dask, jax, keras, mlx, numba, numpy, onnx, sparse, tensorflow, torch]
    steps:
    - uses: actions/checkout@v4

    - uses: actions/checkout@v4
      with:
        repository: SamuelMarks/ml-switcheroo-ir
        path: ml-switcheroo-ir

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install --upgrade setuptools wheel
        python3 -m pip install pytest pytest-cov pytest-mock pytest-asyncio pytest-xdist mypy
        python3 -m pip install -r requirements.txt
        python3 -m pip install -r requirements-dev.txt
        python3 -m pip install -r requirements-backend-${{ matrix.backend }}.txt || true
        python3 -m pip install -e ./ml-switcheroo-ir
        if [ -f "pyproject.toml" ]; then python3 -m pip install -e . --no-deps; fi

    - name: Test & Coverage
      run: |
        # Set KERAS_BACKEND for frameworks that Keras directly supports
        export KERAS_BACKEND=${{ matrix.backend }}
        if [ "${KERAS_BACKEND}" = "cupy" ] || [ "${KERAS_BACKEND}" = "dask" ] || [ "${KERAS_BACKEND}" = "keras" ] || [ "${KERAS_BACKEND}" = "mlx" ] || [ "${KERAS_BACKEND}" = "numba" ] || [ "${KERAS_BACKEND}" = "onnx" ] || [ "${KERAS_BACKEND}" = "sparse" ]; then
          export KERAS_BACKEND=numpy
        fi
        pytest -n auto --dist loadfile -x --cov=src/ml_switcheroo_compiler --cov=scripts --cov-branch --cov-report=xml --cov-fail-under=0

    - name: Upload Coverage
      uses: actions/upload-artifact@v4
      with:
        name: coverage-${{ matrix.python-version }}-${{ matrix.backend }}
        path: .coverage
        include-hidden-files: true

  update-badges:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/checkout@v4
      with:
        repository: SamuelMarks/ml-switcheroo-ir
        path: ml-switcheroo-ir

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install coverage
        python3 -m pip install -r requirements.txt
        python3 -m pip install -r requirements-dev.txt
        python3 -m pip install -e ./ml-switcheroo-ir
        if [ -f "pyproject.toml" ]; then python3 -m pip install -e . --no-deps; fi

    - name: Download all coverage files
      uses: actions/download-artifact@v4
      with:
        path: coverage-files

    - name: Combine Coverage
      run: |
        for dir in coverage-files/*/; do
          mv "$dir/.coverage" ".coverage.$(basename $dir)"
        done
        python3 -m coverage combine
        python3 -m coverage report --show-missing --fail-under=100
        python3 -m coverage xml -o coverage.xml

    - name: Update Badges
      run: |
        python3 scripts/update_badges.py
        if ! git diff --exit-code README.md; then
          echo "Coverage badges in README.md are out of date. Please run pre-commit or the update badges script locally and commit the changes."
          exit 1
        fi
