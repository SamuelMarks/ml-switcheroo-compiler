name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/checkout@v7
      with:
        repository: SamuelMarks/ml-switcheroo-ir
        path: ml-switcheroo-ir

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install --upgrade setuptools wheel
        python3 -m pip install ruff pytest pytest-cov build radon
        python3 -m pip install -e ./ml-switcheroo-ir
        if [ -f "pyproject.toml" ]; then python3 -m pip install -e . || true; fi
        for req in requirements*.txt; do python3 -m pip install -r "$req" || true; done

    - name: Check Code Formatting (Ruff)
      run: ruff format --config pyproject.toml --check

    - name: Check Linting (Ruff)
      run: ruff check --config pyproject.toml

    - name: Test & Coverage
      run: |
        pytest --cov=. --cov-report=xml

    - name: Cyclomatic Complexity
      run: radon cc src/ -nc --fail-under 1

    - name: Update Badges
      run: |
        python3 scripts/update_badges.py
        if ! git diff --exit-code README.md; then
          echo "Coverage badges in README.md are out of date. Please run pre-commit or the update badges script locally and commit the changes."
          exit 1
        fi

    - name: Build Package
      run: python3 -m build
