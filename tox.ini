[tox]
requires = tox>=4.20, tox-uv>=1.11
envlist = cupy, dask, jax, keras, mlx, numba, numpy, onnx, sparse, tensorflow, torch, coverage-report
isolated_build = true

[testenv]
runner = uv-venv-runner
setenv =
    COVERAGE_FILE = {toxworkdir}/.coverage.{envname}
    KERAS_BACKEND = {envname}
    UV_DYNAMIC_VERSIONING_BYPASS = 2.2.0
    PDM_BUILD_SCM_VERSION = 2.2.0
commands =
    pytest -n auto --dist loadfile -x --cov=src/ml_switcheroo_compiler --cov-branch --cov-report= --cov-fail-under=0 {posargs}

[testenv:cupy]
extras = dev,cupy
setenv =
    COVERAGE_FILE = {toxworkdir}/.coverage.{envname}
    KERAS_BACKEND = numpy

[testenv:dask]
extras = dev,dask
setenv =
    COVERAGE_FILE = {toxworkdir}/.coverage.{envname}
    KERAS_BACKEND = numpy

[testenv:jax]
extras = dev,jax

[testenv:keras]
extras = dev,keras
setenv =
    COVERAGE_FILE = {toxworkdir}/.coverage.{envname}
    KERAS_BACKEND = numpy

[testenv:mlx]
extras = dev,mlx
setenv =
    COVERAGE_FILE = {toxworkdir}/.coverage.{envname}
    KERAS_BACKEND = numpy

[testenv:numba]
extras = dev,numba
setenv =
    COVERAGE_FILE = {toxworkdir}/.coverage.{envname}
    KERAS_BACKEND = numpy

[testenv:numpy]
extras = dev,numpy

[testenv:onnx]
extras = dev,onnx
setenv =
    COVERAGE_FILE = {toxworkdir}/.coverage.{envname}
    KERAS_BACKEND = numpy

[testenv:sparse]
extras = dev,sparse
setenv =
    COVERAGE_FILE = {toxworkdir}/.coverage.{envname}
    KERAS_BACKEND = numpy

[testenv:tensorflow]
extras = dev,tensorflow

[testenv:torch]
extras = dev,torch

[testenv:coverage-report]
depends = cupy, dask, jax, keras, mlx, numba, numpy, onnx, sparse, tensorflow, torch
runner = uv-venv-runner
skip_install = true
deps = coverage[toml]
setenv =
    COVERAGE_FILE = {toxworkdir}/.coverage
commands =
    coverage combine --keep {toxworkdir}
    coverage report --show-missing --fail-under=100
    coverage xml -o {toxinidir}/coverage.xml
    coverage html -d {toxinidir}/htmlcov
