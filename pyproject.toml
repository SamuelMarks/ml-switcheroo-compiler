[build-system]
requires = ["hatchling", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[project]
name = "ml-switcheroo-compiler"
version = "0.1.0"
description = "Abstract ML Machine Compiler for Reverse-Mode AD, Optimization, and Graph Functionalization."
authors = [{ name = "Samuel Marks" }]
requires-python = ">=3.10"
dynamic = ["dependencies", "optional-dependencies"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]

[tool.hatch.metadata.hooks.requirements_txt.optional-dependencies]
dev = ["requirements-dev.txt"]
jax = ["requirements-backend-jax.txt"]
torch = ["requirements-backend-torch.txt"]
mlx = ["requirements-backend-mlx.txt"]
keras = ["requirements-backend-keras.txt"]
numpy = ["requirements-backend-numpy.txt"]
cupy = ["requirements-backend-cupy.txt"]
dask = ["requirements-backend-dask.txt"]
tensorflow = ["requirements-backend-tensorflow.txt"]
onnx = ["requirements-backend-onnx.txt"]
numba = ["requirements-backend-numba.txt"]
sparse = ["requirements-backend-sparse.txt"]

[tool.hatch.build.targets.wheel]
packages = ["src/ml_switcheroo_compiler"]

[tool.ruff]
target-version = "py310"
exclude = ["ml-switcheroo-ir"]
line-length = 300
lint.select = ["E", "F", "UP", "B", "I", "C901", "PLR09", "D"]
lint.ignore = ["B905", "B009", "B010"]

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
strict = true
disallow_any_explicit = true
disallow_any_generics = true
disallow_untyped_defs = true
disallow_subclassing_any = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = [
    "torch",
    "torch.*",
    "jax",
    "jax.*",
    "scipy",
    "scipy.*",
    "tensorflow",
    "tensorflow.*",
    "keras",
    "keras.*",
    "dask",
    "dask.*",
    "onnx",
    "onnx.*",
    "mlx",
    "mlx.*",
    "cupy",
    "cupy.*",
    "numba",
    "numba.*",
    "sparse",
    "sparse.*",
    "pyarrow",
    "pyarrow.*",
    "awkward",
    "awkward.*",
    "transformers",
    "transformers.*",
]
follow_imports = "skip"


[tool.coverage.run]
branch = true
omit = [
    "ml-switcheroo-ir/*",
    "tests/*",
    "tests_js/*",
    "docs/*",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
]
omit = [
    "ml-switcheroo-ir/*",
    "tests/*",
    "tests_js/*",
    "docs/*",
]

[tool.interrogate]
ignore-init-method = false
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
ignore-nested-functions = false
ignore-nested-classes = false
ignore-setters = false
ignore-overloaded-functions = false
fail-under = 100
exclude = ["tests", "docs", "ml-switcheroo-ir"]
ignore-regex = []
# possible values: 0 (minimal output), 1 (-v), 2 (-vv)
verbose = 0
quiet = false
whitelist-regex = []
color = true
omit-covered-files = false
generate-badge = "."
badge-format = "svg"
