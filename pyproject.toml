[build-system]
requires = ["hatchling", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[project]
name = "ml-switcheroo-compiler"
description = "Abstract ML Machine Compiler for Reverse-Mode AD, Optimization, and Graph Functionalization."
authors = [{ name = "Samuel Marks" }]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Compilers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dynamic = ["version", "dependencies", "optional-dependencies"]

[project.scripts]
ml-switcheroo-compiler = "ml_switcheroo_compiler.cli:main"
ml_switcheroo_compiler = "ml_switcheroo_compiler.cli:main"

[tool.hatch.version]
path = "src/ml_switcheroo_compiler/__init__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]

[tool.hatch.metadata.hooks.requirements_txt.optional-dependencies]
dev = ["requirements-dev.txt"]
jax = ["requirements-backend-jax.txt"]
torch = ["requirements-backend-torch.txt"]
mlx = ["requirements-backend-mlx.txt"]
keras = ["requirements-backend-keras.txt"]
numpy = ["requirements-backend-numpy.txt"]
cupy = ["requirements-backend-cupy.txt"]
dask = ["requirements-backend-dask.txt"]
tensorflow = ["requirements-backend-tensorflow.txt"]
onnx = ["requirements-backend-onnx.txt"]
numba = ["requirements-backend-numba.txt"]
sparse = ["requirements-backend-sparse.txt"]

[tool.hatch.build.targets.wheel]
packages = ["src/ml_switcheroo_compiler"]

[tool.ruff]
target-version = "py310"
exclude = ["ml-switcheroo-ir"]
line-length = 300
lint.select = ["E", "F", "UP", "B", "I", "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "D", "ANN401", "PGH003", "TID251"]
lint.ignore = ["B905"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"cdd._DynamicAttrType".msg = "Disguised Any smuggling via cdd._DynamicAttrType is strictly banned; use concrete types or protocols."
"typing.Any".msg = "typing.Any is strictly banned; use concrete types, generics, or structural protocols."
"typing.cast".msg = "typing.cast is strictly banned; use proper type narrowing or runtime validation."
"typing_extensions.Any".msg = "typing_extensions.Any is strictly banned; use concrete types, generics, or structural protocols."
"typing_extensions.cast".msg = "typing_extensions.cast is strictly banned; use proper type narrowing or runtime validation."
"operator.attrgetter".msg = "operator.attrgetter is strictly banned; access attributes directly on strongly-typed objects."
"operator.itemgetter".msg = "operator.itemgetter is strictly banned; index directly on strongly-typed mappings/sequences."
"operator.methodcaller".msg = "operator.methodcaller is strictly banned; invoke methods directly on strongly-typed protocols."

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
mypy_path = ["src"]
plugins = ["pydantic.mypy"]
strict = true
disallow_any_explicit = true
disallow_any_generics = true
disallow_any_decorated = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_subclassing_any = true
warn_return_any = true
extra_checks = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disable_error_code = ["override"]
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "truthy-iterable",
    "possibly-undefined",
    "redundant-self",
    "unimported-reveal",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_any_decorated = false

[[tool.mypy.overrides]]
module = [
    "torch",
    "torch.*",
    "jax",
    "jax.*",
    "scipy",
    "scipy.*",
    "tensorflow",
    "tensorflow.*",
    "keras",
    "keras.*",
    "dask",
    "dask.*",
    "onnx",
    "onnx.*",
    "mlx",
    "mlx.*",
    "cupy",
    "cupy.*",
    "numba",
    "numba.*",
    "sparse",
    "sparse.*",
    "pyarrow",
    "pyarrow.*",
    "awkward",
    "awkward.*",
    "transformers",
    "transformers.*",
]
follow_imports = "skip"


[tool.coverage.run]
branch = true
omit = [
    "ml-switcheroo-ir/*",
    "tests/*",
    "tests_js/*",
    "docs/*",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
]
omit = [
    "ml-switcheroo-ir/*",
    "tests/*",
    "tests_js/*",
    "docs/*",
]

[tool.interrogate]
ignore-init-method = false
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
ignore-nested-functions = false
ignore-nested-classes = false
ignore-setters = false
ignore-overloaded-functions = true
fail-under = 100
exclude = ["docs", "ml-switcheroo-ir"]
ignore-regex = []
# possible values: 0 (minimal output), 1 (-v), 2 (-vv)
verbose = 0
quiet = false
whitelist-regex = []
color = true
omit-covered-files = false
generate-badge = "."
badge-format = "svg"
