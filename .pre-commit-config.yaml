repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-yaml
  - id: trailing-whitespace
  - id: end-of-file-fixer
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.17
  hooks:
  - id: ruff
    args:
    - --fix
  - id: ruff-format
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v1.19.1
  hooks:
  - id: mypy
    args:
    - --ignore-missing-imports
    - --follow-imports=skip
    additional_dependencies:
    - types-requests
    - types-PyYAML
    files: ^src/ml_switcheroo_compiler/(?!backends/edge/(webgpu|wasm).py).*\.py$
- repo: local
  hooks:
  - id: update-badges
    name: Update Badges
    entry: python3 scripts/update_badges.py
    language: python
    additional_dependencies: [coverage]
    pass_filenames: false
  - id: generate-exports
    name: Generate Module Exports
    entry: python3 scripts/generate_exports.py
    language: system
    files: ^src/ml_switcheroo_compiler/(?!backends/edge/(webgpu|wasm).py).*\.py$
    pass_filenames: false
  - id: numpy-leak-check
    name: Check for NumPy Leaks
    entry: python3 scripts/lint_numpy_leak.py
    language: system
    files: ^src/ml_switcheroo_compiler/(?!backends/edge/(webgpu|wasm).py).*\.py$
    pass_filenames: false
- repo: local
  hooks:
  - id: pylint
    name: pylint
    entry: pylint --disable=all --enable=too-many-instance-attributes
    language: python
    types: [python]
    files: ^src/ml_switcheroo_compiler/(?!backends/edge/(webgpu|wasm).py)
    additional_dependencies: [pylint]
- repo: local
  hooks:
  - id: radon
    name: radon
    entry: radon cc --min C
    language: python
    types:
    - python
    files: ^src/ml_switcheroo_compiler/(?!backends/edge/(webgpu|wasm).py)
    additional_dependencies:
    - radon
- repo: local
  hooks:
  - id: xenon
    name: xenon
    entry: xenon --max-absolute D --max-modules C --max-average B
    language: python
    types: [python]
    files: ^src/ml_switcheroo_compiler/(?!backends/edge/(webgpu|wasm).py)
    additional_dependencies: [xenon]
- repo: local
  hooks:
  - id: check-any
    name: Check typing.Any usage
    entry: bash -c "rg -n 'typing\.Any' src/ml_switcheroo_compiler/ | wc -l"
    language: system
    always_run: true
    pass_filenames: false
- repo: https://github.com/econchick/interrogate
  rev: 1.7.0
  hooks:
  - id: interrogate
    args: [-c, pyproject.toml, src/]
    pass_filenames: false
- repo: local
  hooks:
  - id: validate-backend-mappings
    name: Validate Backend Mappings
    entry: python scripts/validate_backend_mappings.py
    language: python
    files: ^src/ml_switcheroo_compiler/backends/.*\.py$
    pass_filenames: false
