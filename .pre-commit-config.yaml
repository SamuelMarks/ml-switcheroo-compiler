repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-yaml
  - id: trailing-whitespace
  - id: end-of-file-fixer
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.17
  hooks:
  - id: ruff
    args:
    - --fix
    files: ^src/ml_switcheroo_compiler/
  - id: ruff-format
    files: ^src/ml_switcheroo_compiler/
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v2.1.0
  hooks:
  - id: mypy
    args:
    - --ignore-missing-imports
    - --follow-imports=skip
    additional_dependencies:
    - types-requests
    files: ^src/ml_switcheroo_compiler/transforms/pass_manager.py
- repo: local
  hooks:
  - id: detect-leaks
    name: Detect Dependency Leaks
    entry: ./scripts/detect_leaks.py
    language: system
    files: ^src/ml_switcheroo_compiler/
    pass_filenames: false
