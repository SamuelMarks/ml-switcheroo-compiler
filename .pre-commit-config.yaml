repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-yaml
  - id: trailing-whitespace
  - id: end-of-file-fixer
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.17
  hooks:
  - id: ruff
    args:
    - --fix
  - id: ruff-format
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v1.19.1
  hooks:
  - id: mypy
    args:
    - --ignore-missing-imports
    - --follow-imports=skip
    additional_dependencies:
    - types-requests
    files: ^src/ml_switcheroo_compiler/transforms/pass_manager.py
- repo: local
  hooks:
  - id: update-badges
    name: Update Badges
    entry: python3 scripts/update_badges.py
    language: python
    additional_dependencies: [coverage]
    pass_filenames: false
  - id: generate-exports
    name: Generate Module Exports
    entry: python3 scripts/generate_exports.py
    language: system
    files: ^src/ml_switcheroo_compiler/.*\.py$
    pass_filenames: false
  - id: numpy-leak-check
    name: Check for NumPy Leaks
    entry: python3 scripts/lint_numpy_leak.py
    language: system
    files: ^src/ml_switcheroo_compiler/.*\.py$
    pass_filenames: false
- repo: local
  hooks:
  - id: pylint
    name: pylint
    entry: pylint --disable=all --enable=too-many-instance-attributes
    language: python
    types: [python]
    files: ^src/ml_switcheroo_compiler/
    additional_dependencies: [pylint]
- repo: local
  hooks:
  - id: radon
    name: radon
    entry: radon cc --min C
    language: python
    types:
    - python
    files: ^src/ml_switcheroo_compiler/
    additional_dependencies:
    - radon
- repo: local
  hooks:
  - id: xenon
    name: xenon
    entry: xenon --max-absolute D --max-modules C --max-average B
    language: python
    types: [python]
    files: ^src/ml_switcheroo_compiler/
    additional_dependencies: [xenon]
