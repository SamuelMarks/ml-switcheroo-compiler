repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-yaml
  - id: trailing-whitespace
  - id: end-of-file-fixer
- repo: local
  hooks:
  - id: ruff
    name: ruff
    entry: ruff check
    args: [--config, pyproject.toml, --fix]
    language: system
    types: [python]
    require_serial: true
  - id: ruff-format
    name: ruff format
    entry: ruff format
    args: [--config, pyproject.toml]
    language: system
    types: [python]
    require_serial: true
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v1.19.1
  hooks:
  - id: mypy
    args:
    - --ignore-missing-imports
    - --follow-imports=skip
    additional_dependencies:
    - types-requests
    - types-PyYAML
    - pydantic
    - libcst
    files: ^src/ml_switcheroo_compiler/(?!backends/edge/(webgpu|wasm).py).*\.py$
- repo: local
  hooks:
  - id: pytest-coverage
    name: Run Pytest and Collect Coverage
    entry: pytest -n auto --cov=src/ml_switcheroo_compiler
    language: system
    pass_filenames: false
    files: \.py$
    stages: [pre-push]
  - id: update-badges
    name: Update Badges
    entry: python3 scripts/update_badges.py
    language: system
    pass_filenames: false
    files: \.py$
    stages: [pre-push]
  - id: generate-exports
    name: Generate Module Exports
    entry: python3 scripts/generate_exports.py
    language: system
    files: ^src/ml_switcheroo_compiler/(?!backends/edge/(webgpu|wasm).py).*\.py$
    pass_filenames: false
  - id: numpy-leak-check
    name: Check for NumPy Leaks
    entry: python3 scripts/lint_numpy_leak.py
    language: system
    files: ^src/ml_switcheroo_compiler/(?!backends/edge/(webgpu|wasm).py).*\.py$
    pass_filenames: false
- repo: local
  hooks:
  - id: check-any
    name: Check typing.Any usage
    entry: bash -c "rg -n 'typing\.Any' src/ml_switcheroo_compiler/ | wc -l"
    language: system
    pass_filenames: false
    files: \.py$
- repo: local
  hooks:
  - id: validate-backend-mappings
    name: Validate Backend Mappings
    entry: python scripts/validate_backend_mappings.py
    language: python
    additional_dependencies: [pyyaml]
    files: ^src/ml_switcheroo_compiler/backends/.*\.(py|yaml)$
    pass_filenames: false
