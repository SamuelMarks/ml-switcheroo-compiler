default_stages:
- pre-commit
repos:
- hooks:
  - id: check-yaml
  - id: trailing-whitespace
  - exclude: \.pb$
    id: end-of-file-fixer
  repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
- hooks:
  - args:
    - --config
    - pyproject.toml
    - --fix
    entry: ruff check
    id: ruff
    language: system
    name: ruff
    require_serial: true
    types:
    - python
  - args:
    - --config
    - pyproject.toml
    entry: ruff format
    id: ruff-format
    language: system
    name: ruff format
    require_serial: true
    types:
    - python
  - args:
    - --config-file
    - pyproject.toml
    entry: mypy
    files: ^src/ml_switcheroo_compiler/.*\.py$
    id: mypy
    language: system
    name: mypy
    require_serial: true
    types:
    - python
  repo: local
- hooks:
  - entry: pytest -n auto --dist loadfile --cov=src/ml_switcheroo_compiler --cov-branch --cov-fail-under=100
    files: \.py$
    id: pytest-coverage
    language: system
    name: Run Pytest and Collect Coverage
    pass_filenames: false
    stages:
    - pre-push
  - entry: python3 scripts/update_badges.py
    files: \.py$
    id: update-badges
    language: system
    name: Update Badges
    pass_filenames: false
    stages:
    - pre-push
  - entry: python3 scripts/generate_exports.py
    files: ^src/ml_switcheroo_compiler/.*\.py$
    id: generate-exports
    language: system
    name: Generate Module Exports
    pass_filenames: false
  - entry: python3 scripts/lint_numpy_leak.py
    files: ^src/ml_switcheroo_compiler/.*\.py$
    id: numpy-leak-check
    language: system
    name: Check for NumPy Leaks
    pass_filenames: false
  - entry: python3 scripts/lint_dynamic_numpy.py
    files: ^src/ml_switcheroo_compiler/.*\.py$
    id: dynamic-numpy-import-check
    language: system
    name: Guard Against Dynamic NumPy Imports Outside NumPy Backend
    pass_filenames: false
  - entry: python3 scripts/lint_dependencies.py
    files: ^src/ml_switcheroo_compiler/.*\.py$
    id: dependency-isolation-check
    language: system
    name: Check Dependency Isolation
    pass_filenames: false
  - entry: python3 scripts/lint_any.py --max-count 0
    files: \.py$
    id: lint-any
    language: system
    name: Check typing.Any usage
    pass_filenames: false
  - entry: python3 scripts/lint_pass.py --check-zero-assertions
    files: \.py$
    id: lint-pass
    language: system
    name: Check Tautological Assertions and Bare Pass
    pass_filenames: false
  - entry: interrogate -c pyproject.toml src/ml_switcheroo_compiler scripts
    files: ^(src/ml_switcheroo_compiler|scripts)/.*\.py$
    id: interrogate-docs
    language: system
    name: Check Docstring Coverage
    pass_filenames: false
  repo: local
- hooks:
  - entry: python3 scripts/validate_backend_mappings.py --snapshot-dir ../ml-ecosystem-snapshots
    files: ^src/ml_switcheroo_compiler/backends/.*\.(py|yaml)$
    id: validate-backend-mappings
    language: system
    name: Validate Backend Mappings
    pass_filenames: false
  - entry: python3 scripts/validate_parameters.py --snapshot-dir ../ml-ecosystem-snapshots
    files: ^src/ml_switcheroo_compiler/(backends|ops)/.*\.(py|yaml)$
    id: validate-parameters
    language: system
    name: Validate Zero Hallucinated Parameters
    pass_filenames: false
  - entry: python3 scripts/validate_rules.py --snapshot-dir ../ml-ecosystem-snapshots
    files: ^src/ml_switcheroo_compiler/backends/.*\.(py|yaml)$
    id: validate-rules
    language: system
    name: Validate Rule 4 (N-to-M utility)
    pass_filenames: false
  - entry: python3 scripts/check_snapshot_drift.py --old ../ml-ecosystem-snapshots
    files: ^src/ml_switcheroo_compiler/.*
    id: check-snapshot-drift
    language: system
    name: Check Snapshot Drift
    pass_filenames: false
  repo: local
