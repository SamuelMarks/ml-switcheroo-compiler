backend_name: jax
operations:
  AccumulateN:
    target_api: _execute_accumulate_n
  ActivityRegularization:
    custom_code: 'lambda x, **kwargs: x'
    target_api: custom_op
  AdaptiveAvgPool2D:
    target_api: _execute_adaptive_avg_pool
  AdaptiveAvgPool3D:
    target_api: _execute_adaptive_avg_pool
  AdaptiveLogSoftmaxWithLoss:
    custom_code: 'lambda input, target, *args, **kwargs: (target, jax.numpy.zeros((),
      dtype=target.dtype))'
    target_api: custom_op
  AdaptiveMaxPool2D:
    target_api: _execute_adaptive_max_pool
  AdaptiveMaxPool3D:
    target_api: _execute_adaptive_max_pool
  AdaptiveMaxPool3D_Indices:
    custom_code: 'lambda *args, **kwargs: (_execute_adaptive_max_pool(*args, **kwargs),
      _execute_adaptive_max_pool(*args, **kwargs))'
    target_api: custom_op
  AddN:
    target_api: _execute_accumulate_n
  Adjoint:
    custom_code: 'lambda x, **kwargs: jax.numpy.conj(jax.numpy.transpose(x))'
    target_api: custom_op
  AllGather:
    custom_code: 'lambda tensor, *args, **kwargs: jax.lax.all_gather(tensor, axis_name=kwargs.get(''axis_name'',
      ''i'')) if hasattr(jax.lax, ''all_gather'') else jax.numpy.stack([tensor])'
    target_api: custom_op
  AllReduce:
    custom_code: 'lambda tensor, *args, **kwargs: jax.lax.psum(tensor, axis_name=kwargs.get(''axis_name'',
      ''i'')) if kwargs.get(''op_type'', ''sum'').lower() == ''sum'' else jax.lax.pmax(tensor,
      axis_name=kwargs.get(''axis_name'', ''i''))'
    target_api: custom_op
  AllToAll:
    custom_code: 'lambda tensor, *args, **kwargs: jax.lax.all_to_all(tensor, kwargs.get(''axis_name'',
      ''i''), kwargs.get(''split_axis'', 0), kwargs.get(''concat_axis'', 0)) if hasattr(jax.lax,
      ''all_to_all'') else tensor'
    target_api: custom_op
  AlphaDropout:
    custom_code: 'lambda x, **kwargs: jax.numpy.where(jax.random.bernoulli(jax.random.PRNGKey(0),
      1.0 - kwargs.get(''p'', 0.5), x.shape), x, 0.0)'
    target_api: custom_op
  AsString:
    custom_code: 'lambda arr, **kwargs: str(arr)'
    target_api: custom_op
  Assert:
    custom_code: 'lambda condition, data, summarize=3, **kwargs: None'
    target_api: custom_op
  Assign:
    custom_code: 'lambda ref, value, **kwargs: value'
    target_api: custom_op
  AssignAdd:
    custom_code: 'lambda ref, value, **kwargs: ref + value'
    target_api: custom_op
  AssignSub:
    custom_code: 'lambda ref, value, **kwargs: ref - value'
    target_api: custom_op
  AssignVariable:
    custom_code: 'lambda ref, value, **kwargs: value'
    target_api: custom_op
  AssociativeScan:
    custom_code: 'lambda *args, **kwargs: args[1] if len(args) > 1 and callable(args[0])
      else args[0]'
    target_api: custom_op
  Atleast1d:
    target_api: jax.numpy.atleast_1d
  Atleast2d:
