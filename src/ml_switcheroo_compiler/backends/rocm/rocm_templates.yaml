      \ float* C, int N) {\n    int id = hipBlockIdx_x * hipBlockDim_x + hipThreadIdx_x;\n\
      \    if (id < N) {\n        C[id] = fabsf(A[id]);\n    }\n}\n"
    grid_calc:
      x: ({num_elements} + block_{node_idx}.x - 1) / block_{node_idx}.x
      y: '1'
      z: '1'
    type_mappings:
      bfloat16: hip_bfloat16
