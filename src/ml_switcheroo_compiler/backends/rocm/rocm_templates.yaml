      \ C, int N) {\n    __shared__ float s_val[256];\n    __shared__ int s_idx[256];\n\
      \    int tid = hipThreadIdx_x;\n    int id = hipBlockIdx_x * hipBlockDim_x +\
      \ hipThreadIdx_x;\n    s_val[tid] = (id < N) ? A[id] : -1e38f;\n    s_idx[tid]\
      \ = (id < N) ? id : 0;\n    __syncthreads();\n    for (int s = hipBlockDim_x\
      \ / 2; s > 0; s >>= 1) {\n        if (tid < s) {\n            if (s_val[tid\
      \ + s] > s_val[tid] || (s_val[tid + s] == s_val[tid] && s_idx[tid + s] < s_idx[tid]))\
      \ {\n                s_val[tid] = s_val[tid + s];\n                s_idx[tid]\
      \ = s_idx[tid + s];\n            }\n        }\n        __syncthreads();\n  \
      \  }\n    if (tid == 0) {\n        C[hipBlockIdx_x] = (float)s_idx[0];\n   \
      \ }\n}\n"
    grid_calc:
      x: ({num_elements} + block_{node_idx}.x - 1) / block_{node_idx}.x
      y: '1'
      z: '1'
