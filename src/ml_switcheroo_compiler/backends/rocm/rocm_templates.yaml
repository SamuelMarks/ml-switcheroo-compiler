templates:
  matmul:
    workgroup_size: [16, 16, 1]
    body: |
      #include <hip/hip_runtime.h>
      __global__ void matmul(const float* A, const float* B, float* C, int M, int N, int K) {
          int row = hipBlockIdx_y * hipBlockDim_y + hipThreadIdx_y;
          int col = hipBlockIdx_x * hipBlockDim_x + hipThreadIdx_x;
          if (row < M && col < N) {
              float sum = 0.0f;
              for (int i = 0; i < K; ++i) {
                  sum += A[row * K + i] * B[i * N + col];
              }
              C[row * N + col] = sum;
          }
      }
  add:
    workgroup_size: [256, 1, 1]
    body: |
      #include <hip/hip_runtime.h>
      __global__ void add(const float* A, const float* B, float* C, int N) {
          int id = hipBlockIdx_x * hipBlockDim_x + hipThreadIdx_x;
          if (id < N) {
              C[id] = A[id] + B[id];
          }
      }
  sub:
    workgroup_size: [256, 1, 1]
    body: |
      #include <hip/hip_runtime.h>
      __global__ void sub(const float* A, const float* B, float* C, int N) {
          int id = hipBlockIdx_x * hipBlockDim_x + hipThreadIdx_x;
          if (id < N) {
              C[id] = A[id] - B[id];
          }
      }
  mul:
    workgroup_size: [256, 1, 1]
    body: |
      #include <hip/hip_runtime.h>
      __global__ void mul(const float* A, const float* B, float* C, int N) {
          int id = hipBlockIdx_x * hipBlockDim_x + hipThreadIdx_x;
          if (id < N) {
              C[id] = A[id] * B[id];
          }
      }
  div:
    workgroup_size: [256, 1, 1]
    body: |
      #include <hip/hip_runtime.h>
      __global__ void div(const float* A, const float* B, float* C, int N) {
          int id = hipBlockIdx_x * hipBlockDim_x + hipThreadIdx_x;
          if (id < N) {
              C[id] = A[id] / B[id];
          }
      }
  relu:
    workgroup_size: [256, 1, 1]
    body: |
      #include <hip/hip_runtime.h>
      __global__ void relu(const float* A, float* C, int N) {
          int id = hipBlockIdx_x * hipBlockDim_x + hipThreadIdx_x;
          if (id < N) {
              C[id] = fmaxf(0.0f, A[id]);
          }
      }
  sigmoid:
    workgroup_size: [256, 1, 1]
    body: |
      #include <hip/hip_runtime.h>
      __global__ void sigmoid(const float* A, float* C, int N) {
          int id = hipBlockIdx_x * hipBlockDim_x + hipThreadIdx_x;
          if (id < N) {
              C[id] = 1.0f / (1.0f + expf(-A[id]));
          }
      }
  sum:
    workgroup_size: [256, 1, 1]
    body: |
      #include <hip/hip_runtime.h>
      __global__ void sum(const float* A, float* C, int N) {
          int id = hipBlockIdx_x * hipBlockDim_x + hipThreadIdx_x;
          if (id == 0) {
              float s = 0.0f;
              for (int i = 0; i < N; ++i) {
                  s += A[i];
              }
              C[0] = s;
          }
      }
