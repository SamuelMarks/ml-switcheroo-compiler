      \          for (int kw = 0; kw < KW; ++kw) {\n                s += X[((n * C\
      \ + c) * H + (oh * 2 + kh)) * W + (ow * 2 + kw)];\n            }\n        }\n\
      \        Y[((n * C + c) * H_out + oh) * W_out + ow] = s / float(KH * KW);\n\
      \    }\n}\n"
