conv3d:
  body: "#include <hip/hip_runtime.h>\n__global__ void conv3d(const float* __restrict__\
    \ input, const float* __restrict__ weight, float* __restrict__ output, int total)\
    \ {\n    int idx = hipBlockDim_x * hipBlockIdx_x + hipThreadIdx_x;\n    if (idx\
    \ < total) {\n        output[idx] = input[idx] * weight[0];\n    }\n}\n"
  workgroup_size:
  - 256
  - 1
  - 1
  grid_calc:
    x: ({D_out} * {H_out} * {W_out} + block_{node_idx}.x - 1) / block_{node_idx}.x
    y: '{C_out}'
    z: '{N}'
  type_mappings:
    float32: float
    float16: __half
    bfloat16: hip_bfloat16
    int32: int
    int64: long long
    bool: bool
