fused_linear_gelu:
  body: "#include <hip/hip_runtime.h>\n__global__ void fused_linear_gelu(const float*\
    \ A, const float* B, const float* bias, float* C, int M, int N, int K) {\n   \
    \ int row = hipBlockIdx_y * hipBlockDim_y + hipThreadIdx_y;\n    int col = hipBlockIdx_x\
    \ * hipBlockDim_x + hipThreadIdx_x;\n    if (row < M && col < N) {\n        float\
    \ sum = bias ? bias[col] : 0.0f;\n        for (int i = 0; i < K; ++i) {\n    \
    \        sum += A[row * K + i] * B[i * N + col];\n        }\n        float x =\
    \ sum;\n        C[row * N + col] = 0.5f * x * (1.0f + tanhf(0.7978845608f * (x\
    \ + 0.044715f * x * x * x)));\n    }\n}\n"
  workgroup_size:
  - 16
  - 16
  - 1
  grid_calc:
    x: ({N_dim} + block_{node_idx}.x - 1) / block_{node_idx}.x
    y: ({M} + block_{node_idx}.y - 1) / block_{node_idx}.y
    z: '1'
  type_mappings:
    float32: float
    float16: __half
    bfloat16: hip_bfloat16
    int32: int
    int64: long long
    bool: bool
