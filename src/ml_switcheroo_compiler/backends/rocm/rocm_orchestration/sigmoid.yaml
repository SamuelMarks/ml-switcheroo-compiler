sigmoid:
  body: "#include <hip/hip_runtime.h>\n__global__ void sigmoid(const float* A, float*\
    \ C, int N) {\n    int id = hipBlockIdx_x * hipBlockDim_x + hipThreadIdx_x;\n\
    \    if (id < N) {\n        C[id] = 1.0f / (1.0f + expf(-A[id]));\n    }\n}\n"
  workgroup_size:
  - 256
  - 1
  - 1
