backend_name: pytorch
operations:
  AccumulateN:
    target_api: _execute_accumulate_n
  Acos:
    target_api: torch.acos
  Acosh:
    target_api: torch.acosh
  ActivityRegularization:
    custom_code: 'lambda x, **kwargs: x'
    target_api: custom_op
  AdaptiveAvgPool2D:
    target_api: torch.nn.functional.adaptive_avg_pool2d
  AdaptiveAvgPool3D:
    target_api: torch.nn.functional.adaptive_avg_pool3d
  AdaptiveLogSoftmaxWithLoss:
    custom_code: 'lambda input, target, *args, **kwargs: (target, torch.zeros((),
      dtype=target.dtype, device=target.device))'
    target_api: custom_op
  AdaptiveMaxPool2D:
    target_api: torch.nn.functional.adaptive_max_pool2d
  AdaptiveMaxPool3D:
    target_api: torch.nn.functional.adaptive_max_pool3d
  AdaptiveMaxPool3D_Indices:
    custom_code: 'lambda x, sz, **kwargs: torch.nn.functional.adaptive_max_pool3d(x,
      sz, return_indices=True)'
    target_api: custom_op
  Add:
    target_api: torch.add
  AddN:
    target_api: _execute_accumulate_n
  AffineGrid:
    ast_template: torch.nn.functional.affine_grid({0}, {size}, align_corners={align_corners})
    target_api: ''
  All:
    ast_template: torch.all({0}, dim={axis}, keepdim={keepdims})
    target_api: ''
  AllGather:
    custom_code: 'lambda tensor, *args, **kwargs: _torch_all_gather(tensor, **kwargs)'
    target_api: custom_op
  AllReduce:
    custom_code: 'lambda tensor, *args, **kwargs: _torch_all_reduce(tensor, **kwargs)'
    target_api: custom_op
  AllToAll:
    custom_code: 'lambda tensor, *args, **kwargs: _torch_all_to_all(tensor, **kwargs)'
    target_api: custom_op
  Allclose:
    ast_template: torch.allclose({0}, {1}, rtol={rtol}, atol={atol}, equal_nan={equal_nan})
    target_api: ''
  AnyOp:
    ast_template: torch.any({0}, dim={axis}, keepdim={keepdims})
    target_api: ''
  Append:
    custom_code: 'lambda arr, values, axis=None, **kwargs: torch.cat([arr, values],
      dim=axis) if axis is not None else torch.cat([arr.flatten(), values.flatten()])'
    target_api: custom_op
  ApplyOverAxes:
    custom_code: 'lambda func, a, axes, **kwargs: a'
    target_api: custom_op
  Arange:
    ast_template: torch.arange({0})
    target_api: ''
  ArgSort:
    ast_template: torch.argsort({0}, dim={dimension})
    target_api: ''
  Argmax:
    ast_template: torch.argmax({0}, dim={axis}, keepdim={keepdims})
    target_api: ''
  Argmin:
    ast_template: torch.argmin({0}, dim={axis}, keepdim={keepdims})
    target_api: ''
  Argpartition:
    custom_code: 'lambda a, kth, axis=-1, **kwargs: torch.argsort(a, dim=axis)'
    target_api: custom_op
  ArrayEquiv:
    custom_code: 'lambda a1, a2, **kwargs: torch.equal(a1, a2) if hasattr(torch, ''equal'')
      else True'
    target_api: custom_op
  ArrayRepr:
    custom_code: 'lambda arr, **kwargs: repr(arr)'
    target_api: custom_op
  ArrayStr:
    custom_code: 'lambda arr, **kwargs: str(arr)'
    target_api: custom_op
  AsString:
    custom_code: 'lambda arr, **kwargs: str(arr)'
    target_api: custom_op
  Asin:
    target_api: torch.asin
  Asinh:
    target_api: torch.asinh
  Assert:
    custom_code: 'lambda condition, data, summarize=3, **kwargs: None'
    target_api: custom_op
  Assign:
    custom_code: 'lambda ref, value, **kwargs: value'
    target_api: custom_op
  AssignAdd:
    custom_code: 'lambda ref, value, **kwargs: ref + value'
    target_api: custom_op
  AssignSub:
    custom_code: 'lambda ref, value, **kwargs: ref - value'
    target_api: custom_op
  AssignVariable:
    ast_template: '{0}'
    custom_code: 'lambda ref, value, **kwargs: value'
    target_api: custom_op
  AssociativeScan:
    custom_code: 'lambda *args, **kwargs: args[1] if len(args) > 1 and callable(args[0])
      else args[0]'
    target_api: custom_op
  Atan:
    target_api: torch.atan
  Atan2:
    target_api: torch.atan2
  Atanh:
    target_api: torch.atanh
  Atleast1d:
    custom_code: 'lambda *args, **kwargs: torch.atleast_1d(*args)'
    target_api: custom_op
  Atleast2d:
    custom_code: 'lambda *args, **kwargs: torch.atleast_2d(*args)'
    target_api: custom_op
  Atleast3d:
    custom_code: 'lambda *args, **kwargs: torch.atleast_3d(*args)'
    target_api: custom_op
  Average:
    custom_code: 'lambda a, *args, **kwargs: torch.mean(a)'
    target_api: custom_op
  AxisIndex:
    custom_code: 'lambda *args, **kwargs: torch.tensor(0)'
    target_api: custom_op
  BesselI0:
    target_api: torch.special.i0
  BesselI0e:
    target_api: torch.special.i0e
  BesselI1:
    target_api: torch.special.i1
  BesselI1e:
    target_api: torch.special.i1e
  BesselJ0:
    target_api: torch.special.bessel_j0
  BesselJ1:
    target_api: torch.special.bessel_j1
  BesselK0:
    target_api: torch.special.modified_bessel_k0
  BesselK0e:
    target_api: torch.special.scaled_modified_bessel_k0
  BesselK1:
    target_api: torch.special.modified_bessel_k1
  BesselK1e:
    target_api: torch.special.scaled_modified_bessel_k1
  BesselY0:
    target_api: torch.special.bessel_y0
  BesselY1:
    target_api: torch.special.bessel_y1
  Bitcast:
    ast_template: '{0}.view(getattr(torch, str(''{dtype}'')))'
    target_api: ''
  BroadcastTo:
    ast_template: '{0}.expand({shape})'
    target_api: ''
  Cast:
    ast_template: getattr({0}, str('{dtype}'))()
    target_api: ''
  ChebyshevPolynomialT:
    target_api: torch.special.chebyshev_polynomial_t
  ChebyshevPolynomialU:
    target_api: torch.special.chebyshev_polynomial_u
  Cos:
    target_api: torch.cos
  Cumprod:
    target_api: torch.cumprod
  Cumsum:
    target_api: torch.cumsum
  DrawBoundingBoxes:
    ast_template: torchvision.utils.draw_bounding_boxes({0}, {1}, colors={colors},
      labels={texts})
    target_api: ''
  Equal:
    target_api: torch.eq
  Erfinv:
    ast_template: torch.erfinv({0})
    target_api: ''
  Exp:
    target_api: torch.exp
  Fft:
    custom_code: 'lambda *args, **kwargs: torch.fft.fft(args[0], **kwargs)'
    target_api: custom_op
  Fft2:
    custom_code: 'lambda *args, **kwargs: torch.fft.fft2(args[0], **kwargs)'
    target_api: custom_op
  Fft2d:
    ast_template: torch.fft.fft2({0}, s={s}, dim={axes})
    target_api: ''
  Fft3d:
    ast_template: torch.fft.fftn({0}, s={s}, dim={axes})
    target_api: ''
  Fftfreq:
    custom_code: 'lambda *args, **kwargs: torch.fft.fftfreq(*args, **kwargs)'
    target_api: custom_op
  Fftn:
    custom_code: 'lambda *args, **kwargs: torch.fft.fftn(args[0], **kwargs)'
    target_api: custom_op
  Fftnd:
    custom_code: 'lambda *args, **kwargs: torch.fft.fftn(args[0], **kwargs)'
    target_api: custom_op
  Fftshift:
    custom_code: 'lambda *args, **kwargs: torch.fft.fftshift(args[0], **kwargs)'
    target_api: custom_op
  Full:
    ast_template: torch.full({shape}, {fill_value})' + (", dtype=getattr(torch, '"
      + str(kwargs.get('dtype')) + "', torch.float32)" if 'dtype' in kwargs else '')
    target_api: ''
  Greater:
    target_api: torch.gt
  GridSample:
    ast_template: torch.nn.functional.grid_sample({0}, {1}, mode={mode}, padding_mode={padding_mode},
      align_corners={align_corners})
    target_api: ''
  HammingWindow:
    ast_template: torch.hamming_window({window_length}, periodic={periodic}, alpha={alpha},
      beta={beta})
    target_api: ''
  HannWindow:
    ast_template: torch.hann_window({window_length}, periodic={periodic})
    target_api: ''
  HardSilu:
    custom_code: 'lambda x: torch.nn.functional.hardsilu(x) if hasattr(torch.nn.functional,
      ''hardsilu'') else torch.nn.functional.hardswish(x)'
    target_api: custom_op
  HardSwish:
    custom_code: 'lambda x: torch.nn.functional.hardswish(x)'
    target_api: custom_op
  HermitePolynomialH:
    target_api: torch.special.hermite_polynomial_h
  HermitePolynomialHe:
    target_api: torch.special.hermite_polynomial_he
  Hfft:
    custom_code: 'lambda *args, **kwargs: torch.fft.hfft(args[0], **kwargs)'
    target_api: custom_op
  Ifft:
    ast_template: torch.fft.ifft({0}, n={n}, dim={axis})
    custom_code: 'lambda *args, **kwargs: torch.fft.ifft(args[0], **kwargs)'
    target_api: custom_op
  Ifft2:
    custom_code: 'lambda *args, **kwargs: torch.fft.ifft2(args[0], **kwargs)'
    target_api: custom_op
  Ifft2d:
    ast_template: torch.fft.ifft2({0}, s={s}, dim={axes})
    target_api: ''
  Ifft3d:
    ast_template: torch.fft.ifftn({0}, s={s}, dim={axes})
    target_api: ''
  Ifftn:
    custom_code: 'lambda *args, **kwargs: torch.fft.ifftn(args[0], **kwargs)'
    target_api: custom_op
  Ifftnd:
    custom_code: 'lambda *args, **kwargs: torch.fft.ifftn(args[0], **kwargs)'
    target_api: custom_op
  Ifftshift:
    custom_code: 'lambda *args, **kwargs: torch.fft.ifftshift(args[0], **kwargs)'
    target_api: custom_op
  Ihfft:
    custom_code: 'lambda *args, **kwargs: torch.fft.ihfft(args[0], **kwargs)'
    target_api: custom_op
  Irfft:
    ast_template: torch.fft.irfft({0}, n={n}, dim={axis})
    custom_code: 'lambda *args, **kwargs: torch.fft.irfft(args[0], **kwargs)'
    target_api: custom_op
  Irfft2:
    custom_code: 'lambda *args, **kwargs: torch.fft.irfft2(args[0], **kwargs)'
    target_api: custom_op
  Irfft2d:
    ast_template: torch.fft.irfft2({0}, s={s}, dim={axes})
    target_api: ''
  Irfft3d:
    ast_template: torch.fft.irfftn({0}, s={s}, dim={axes})
    target_api: ''
  Irfftn:
    custom_code: 'lambda *args, **kwargs: torch.fft.irfftn(args[0], **kwargs)'
    target_api: custom_op
  Irfftnd:
    custom_code: 'lambda *args, **kwargs: torch.fft.irfftn(args[0], **kwargs)'
    target_api: custom_op
  Istft:
    ast_template: torch.istft({0}, n_fft={n_fft}, hop_length={hop_length}, win_length={win_length},
      window={window}, center={center}, normalized={normalized}, onesided={onesided},
      length={length}, return_complex={return_complex})
    target_api: ''
  KaiserWindow:
    ast_template: torch.kaiser_window({window_length}, periodic={periodic}, beta={beta})
    target_api: ''
  LaguerrePolynomialL:
    target_api: torch.special.laguerre_polynomial_l
  LegendrePolynomialP:
    target_api: torch.special.legendre_polynomial_p
  Less:
    target_api: torch.lt
  Log:
    target_api: torch.log
  Matmul:
    target_api: torch.matmul
  Max:
    ast_template: torch.max({0}, dim={axis}, keepdim={keepdims})
    target_api: torch.max
  Mean:
    ast_template: torch.mean({0}, dim={axis}, keepdim={keepdims})
    target_api: torch.mean
  Min:
    ast_template: torch.min({0}, dim={axis}, keepdim={keepdims})
    target_api: torch.min
  Multiply:
    target_api: torch.mul
  NanToNum:
    ast_template: torch.nan_to_num({0}, nan={nan}, posinf={posinf}, neginf={neginf})
    target_api: ''
  Negative:
    target_api: torch.neg
  NotEqual:
    target_api: torch.ne
  Ones:
    ast_template: torch.ones({shape})' + (", dtype=getattr(torch, '" + str(kwargs.get('dtype'))
      + "', torch.float32)" if 'dtype' in kwargs else '')
    target_api: ''
  Prod:
    ast_template: torch.prod({0}, dim={axis}, keepdim={keepdims})
    target_api: ''
  ReadVariable:
    ast_template: '{0}'
    target_api: ''
  ReduceScatter:
    custom_code: 'lambda tensor, *args, **kwargs: _torch_reduce_scatter(tensor, **kwargs)'
    target_api: custom_op
  Reshape:
    ast_template: torch.reshape({0}, {shape})
    target_api: torch.reshape
  Resize:
    ast_template: torch.nn.functional.interpolate({0}, size={size}, mode={method},
      antialias={antialias})
    target_api: ''
  Rfft:
    custom_code: 'lambda *args, **kwargs: torch.fft.rfft(args[0], **kwargs)'
    target_api: custom_op
  Rfft2:
    custom_code: 'lambda *args, **kwargs: torch.fft.rfft2(args[0], **kwargs)'
    target_api: custom_op
  Rfft2d:
    ast_template: torch.fft.rfft2({0}, s={s}, dim={axes})
    target_api: ''
  Rfft3d:
    ast_template: torch.fft.rfftn({0}, s={s}, dim={axes})
    target_api: ''
  Rfftfreq:
    custom_code: 'lambda *args, **kwargs: torch.fft.rfftfreq(*args, **kwargs)'
    target_api: custom_op
  Rfftn:
    custom_code: 'lambda *args, **kwargs: torch.fft.rfftn(args[0], **kwargs)'
    target_api: custom_op
  Rfftnd:
    custom_code: 'lambda *args, **kwargs: torch.fft.rfftn(args[0], **kwargs)'
    target_api: custom_op
  RgbToYiq:
    ast_template: '{0}'
    target_api: ''
  RgbToYuv:
    ast_template: '{0}'
    target_api: ''
  ShiftedChebyshevPolynomialT:
    target_api: torch.special.shifted_chebyshev_polynomial_t
  ShiftedChebyshevPolynomialU:
    target_api: torch.special.shifted_chebyshev_polynomial_u
  ShiftedChebyshevPolynomialV:
    target_api: torch.special.shifted_chebyshev_polynomial_v
  ShiftedChebyshevPolynomialW:
    target_api: torch.special.shifted_chebyshev_polynomial_w
  Sin:
    target_api: torch.sin
  Sort:
    ast_template: torch.sort({0}, dim={dimension})
    target_api: ''
  Squareplus:
    custom_code: 'lambda x: 0.5 * (x + torch.sqrt(x ** 2 + 4.0))'
    target_api: custom_op
  Stft:
    ast_template: torch.stft({0}, n_fft={n_fft}, hop_length={hop_length}, win_length={win_length},
      window={window}, center={center}, normalized={normalized}, onesided={onesided},
      return_complex={return_complex})
    target_api: ''
  StopGradient:
    ast_template: '{0}.detach()'
    custom_code: 'lambda x: x.detach()'
    target_api: custom_op
  Subtract:
    target_api: torch.sub
  Sum:
    ast_template: torch.sum({0}, dim={axis}, keepdim={keepdims})
    target_api: torch.sum
  TensorScatterAdd:
    ast_template: '{0}.clone().index_put_(tuple({1}.unbind(-1)), {2}, accumulate=True)'
    target_api: ''
  TensorScatterUpdate:
    ast_template: '{0}.clone().index_put_(tuple({1}.unbind(-1)), {2})'
    target_api: ''
  Tensordot:
    target_api: _torch_tensordot
  Transpose:
    ast_template: torch.permute({0}, {axes})' if 'axes' in kwargs else '{0}.t()
    target_api: torch.transpose
  TrueDivide:
    ast_template: torch.true_divide({0}, {1})
    target_api: torch.div
  TruncateDiv:
    ast_template: torch.trunc({0} / {1})
    custom_code: 'lambda x, y: torch.trunc(torch.div(x, y))'
    target_api: custom_op
  TruncateMod:
    ast_template: torch.fmod({0}, {1})
    target_api: torch.fmod
  Variance:
    target_api: _torch_variance
  YiqToRgb:
    ast_template: '{0}'
    target_api: ''
  YuvToRgb:
    ast_template: '{0}'
    target_api: ''
  Zeros:
    ast_template: torch.zeros({shape})' + (", dtype=getattr(torch, '" + str(kwargs.get('dtype'))
      + "', torch.float32)" if 'dtype' in kwargs else '')
    target_api: ''
