  LayerNorm:
    target_api: custom_op
    custom_code: "lambda x, g=1.0, b=0.0, **kw: ((x - backend_module.reduce_mean(x, axis=-1, keepdims=True)) / backend_module.math.sqrt(backend_module.math.reduce_variance(x, axis=-1, keepdims=True) + 1e-5)) * g + b"
  BatchNorm:
    target_api: custom_op
    custom_code: "lambda x, m=0.0, v=1.0, g=1.0, b=0.0, **kw: ((x - m) / backend_module.math.sqrt(v + 1e-5)) * g + b"
  RMSNorm:
    target_api: custom_op
    custom_code: "lambda x, g=1.0, **kw: (x / backend_module.math.sqrt(backend_module.reduce_mean(x**2, axis=-1, keepdims=True) + 1e-5)) * g"
  MultiheadAttention:
    target_api: custom_op
    custom_code: "lambda q, k, v, **kw: backend_module.matmul(backend_module.nn.softmax(backend_module.matmul(q, backend_module.transpose(k, (0, 1, 3, 2) if len(k.shape) == 4 else (0, 2, 1))) / backend_module.math.sqrt(float(q.shape[-1]))), v)"
  Conv2D:
    target_api: custom_op
    custom_code: "lambda x, w, **kw: backend_module.nn.conv2d(x, w, strides=kw.get('strides', [1, 1, 1, 1]), padding=kw.get('padding', 'SAME')) if hasattr(backend_module, 'nn') else x"
  DepthwiseConv2D:
    target_api: custom_op
    custom_code: "lambda x, w, **kw: backend_module.nn.depthwise_conv2d(x, w, strides=kw.get('strides', [1, 1, 1, 1]), padding=kw.get('padding', 'SAME')) if hasattr(backend_module, 'nn') else x"
  MaxPool2D:
    target_api: custom_op
    custom_code: "lambda x, **kw: backend_module.nn.max_pool2d(x, ksize=kw.get('ksize', [1, 2, 2, 1]), strides=kw.get('strides', [1, 2, 2, 1]), padding=kw.get('padding', 'SAME')) if hasattr(backend_module, 'nn') else x"
  AvgPool2D:
    target_api: custom_op
    custom_code: "lambda x, **kw: backend_module.nn.avg_pool2d(x, ksize=kw.get('ksize', [1, 2, 2, 1]), strides=kw.get('strides', [1, 2, 2, 1]), padding=kw.get('padding', 'SAME')) if hasattr(backend_module, 'nn') else x"
  ResizeBilinear:
    target_api: custom_op
    custom_code: "lambda x, size=None, **kw: backend_module.image.resize(x, size=size, method='bilinear') if hasattr(backend_module, 'image') else x"
  MSELoss:
    target_api: custom_op
    custom_code: "lambda p, t, **kw: backend_module.reduce_mean((p - t)**2)"
  CrossEntropyLoss:
    target_api: custom_op
    custom_code: "lambda p, t, **kw: -backend_module.reduce_mean(backend_module.reduce_sum(t * backend_module.math.log(p + 1e-12), axis=-1))"
  BCELoss:
    target_api: custom_op
    custom_code: "lambda p, t, **kw: -backend_module.reduce_mean(t * backend_module.math.log(p + 1e-12) + (1.0 - t) * backend_module.math.log(1.0 - p + 1e-12))"
  HuberLoss:
    target_api: custom_op
    custom_code: "lambda p, t, delta=1.0, **kw: backend_module.reduce_mean(backend_module.where(backend_module.abs(p - t) < delta, 0.5 * ((p - t)**2), delta * (backend_module.abs(p - t) - 0.5 * delta)))"
  KLDivergenceLoss:
    target_api: custom_op
    custom_code: "lambda p, t, **kw: backend_module.reduce_mean(backend_module.reduce_sum(t * (backend_module.math.log(t + 1e-12) - backend_module.math.log(p + 1e-12)), axis=-1))"
