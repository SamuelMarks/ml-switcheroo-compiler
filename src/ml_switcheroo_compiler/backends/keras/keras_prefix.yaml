    def keras_gaussian_blur(images, kernel_size=None, sigma=None, padding='same', data_format=None):
        if kernel_size is None:
            kernel_size = (3, 3)
        elif isinstance(kernel_size, int):
            kernel_size = (kernel_size, kernel_size)
        else:
            kernel_size = (int(kernel_size[0]), int(kernel_size[1]))
        if sigma is None:
            sigma = (1.0, 1.0)
        elif isinstance(sigma, (int, float)):
            sigma = (float(sigma), float(sigma))
        else:
            sigma = (float(sigma[0]), float(sigma[1]))
        df = data_format or "channels_last"
        return kops.image.gaussian_blur(images, kernel_size=kernel_size, sigma=sigma, data_format=df)

  keras_elastic_transform: |
    def keras_elastic_transform(images, displacement, interpolation='bilinear', fill_value=0.0, data_format=None):
        if displacement is None:
            return images
        disp = kops.convert_to_tensor(displacement)
        df = data_format or "channels_last"
        transposed = False
        if df == "channels_first" and len(kops.shape(images)) >= 4:
            images = kops.transpose(images, (0, 2, 3, 1))
            transposed = True
        shp = kops.shape(images)
        if len(shp) < 2:
            return images
        h, w = (shp[-3], shp[-2]) if len(shp) >= 3 else (shp[-2], shp[-1])
        y = kops.cast(kops.arange(h), "float32")
        x = kops.cast(kops.arange(w), "float32")
        yy, xx = kops.meshgrid(y, x, indexing="ij")
        disp_y = disp[..., 0] if kops.shape(disp)[-1] >= 1 else 0.0
        disp_x = disp[..., 1] if kops.shape(disp)[-1] >= 2 else 0.0
        coords = kops.stack([yy + disp_y, xx + disp_x], axis=0)
        order = 1 if interpolation == "bilinear" else 0
        if len(shp) == 4:
            b, c = shp[0], shp[-1]
            out_list = []
            for bi in range(b):
                c_list = []
                for ci in range(c):
                    ch_img = images[bi, :, :, ci]
                    ch_out = kops.image.map_coordinates(ch_img, coords, order=order, fill_value=fill_value)
                    c_list.append(ch_out)
                out_list.append(kops.stack(c_list, axis=-1))
            res = kops.stack(out_list, axis=0)
        elif len(shp) == 3:
            c = shp[-1]
            c_list = []
            for ci in range(c):
                ch_img = images[:, :, ci]
                ch_out = kops.image.map_coordinates(ch_img, coords, order=order, fill_value=fill_value)
                c_list.append(ch_out)
            res = kops.stack(c_list, axis=-1)
        else:
            res = kops.image.map_coordinates(images, coords, order=order, fill_value=fill_value)
        if transposed:
            res = kops.transpose(res, (0, 3, 1, 2))
        return res

  keras_power_iteration: |
    def keras_power_iteration(w, num_iters, u=None):
        if u is None:
            u = kops.ones(w.shape[:-2] + (w.shape[-2], 1), dtype=w.dtype)
        for _ in range(num_iters):
            w_t = kops.swapaxes(w, -1, -2)
            v = kops.matmul(w_t, u)
            v = v / (kops.sqrt(kops.sum(v ** 2, axis=-2, keepdims=True)) + 1e-12)
            u = kops.matmul(w, v)
            u = u / (kops.sqrt(kops.sum(u ** 2, axis=-2, keepdims=True)) + 1e-12)
        sigma = kops.matmul(kops.swapaxes(u, -1, -2), kops.matmul(w, v))
        return kops.squeeze(v, -1), kops.squeeze(u, -1), kops.squeeze(kops.squeeze(sigma, -1), -1)
