  keras_median_filter: |
    def keras_median_filter(images, kernel_size, padding='same', data_format=None):
        if kernel_size is None:
            kernel_size = 3
        if isinstance(kernel_size, int):
            kh, kw = kernel_size, kernel_size
        else:
            kh, kw = int(kernel_size[0]), int(kernel_size[1])
        df = data_format or "channels_last"
        transposed = False
        if df == "channels_first" and len(kops.shape(images)) >= 4:
            images = kops.transpose(images, (0, 2, 3, 1))
            transposed = True
            df = "channels_last"
        shp = kops.shape(images)
        c = shp[-1]
        patches = kops.image.extract_patches(images, size=(kh, kw), strides=1, padding=padding, data_format=df)
        p_shp = kops.shape(patches)
        reshaped = kops.reshape(patches, (p_shp[0], p_shp[1], p_shp[2], kh * kw, c))
        res = kops.median(reshaped, axis=-2)
        if transposed:
            res = kops.transpose(res, (0, 3, 1, 2))
        return res

