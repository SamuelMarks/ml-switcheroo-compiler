    target_api: custom_op
    custom_code: "lambda x, axis=None, keepdims=False, **kw: backend_module.ops.norm(x, ord=2, axis=axis, keepdims=keepdims)"
  CumSum:
    target_api: keras.ops.cumsum
    kwarg_translations:
      dim: axis
  CumProd:
    target_api: keras.ops.cumprod
    kwarg_translations:
      dim: axis
  Cond:
    target_api: keras.ops.cond
  If:
    target_api: keras.ops.cond
  WhileLoop:
    target_api: keras.ops.while_loop
  While:
    target_api: keras.ops.while_loop
  ArgMax:
    target_api: keras.ops.argmax
    kwarg_translations:
      dim: axis
  ArgMin:
    target_api: keras.ops.argmin
    kwarg_translations:
      dim: axis
  LayerNorm:
    target_api: custom_op
    custom_code: "lambda x, g=1.0, b=0.0, **kw: ((x - backend_module.ops.mean(x, axis=-1, keepdims=True)) / backend_module.ops.sqrt(backend_module.ops.var(x, axis=-1, keepdims=True) + 1e-5)) * g + b"
  BatchNorm:
    target_api: custom_op
    custom_code: "lambda x, m=0.0, v=1.0, g=1.0, b=0.0, **kw: ((x - m) / backend_module.ops.sqrt(v + 1e-5)) * g + b"
  RMSNorm:
    target_api: custom_op
    custom_code: "lambda x, g=1.0, **kw: (x / backend_module.ops.sqrt(backend_module.ops.mean(x**2, axis=-1, keepdims=True) + 1e-5)) * g"
  MultiheadAttention:
    target_api: custom_op
    custom_code: "lambda q, k, v, **kw: backend_module.ops.matmul(backend_module.ops.softmax(backend_module.ops.matmul(q, backend_module.ops.transpose(k, (0, 1, 3, 2) if len(k.shape) == 4 else (0, 2, 1))) / backend_module.ops.sqrt(float(q.shape[-1]))), v)"
  Conv2D:
    target_api: custom_op
    custom_code: "lambda x, w, **kw: backend_module.ops.conv(x, w, strides=kw.get('strides', [1, 1]), padding=kw.get('padding', 'same')) if hasattr(backend_module.ops, 'conv') else x"
  DepthwiseConv2D:
    target_api: custom_op
    custom_code: "lambda x, w, **kw: backend_module.ops.depthwise_conv(x, w, strides=kw.get('strides', [1, 1]), padding=kw.get('padding', 'same')) if hasattr(backend_module.ops, 'depthwise_conv') else x"
  MaxPool2D:
    target_api: custom_op
    custom_code: "lambda x, **kw: backend_module.ops.max_pool(x, pool_size=kw.get('pool_size', [2, 2]), strides=kw.get('strides', [2, 2]), padding=kw.get('padding', 'same')) if hasattr(backend_module.ops, 'max_pool') else x"
  AvgPool2D:
    target_api: custom_op
    custom_code: "lambda x, **kw: backend_module.ops.average_pool(x, pool_size=kw.get('pool_size', [2, 2]), strides=kw.get('strides', [2, 2]), padding=kw.get('padding', 'same')) if hasattr(backend_module.ops, 'average_pool') else x"
  ResizeBilinear:
    target_api: custom_op
    custom_code: "lambda x, size=None, **kw: backend_module.ops.image.resize(x, size=size, interpolation='bilinear') if hasattr(backend_module.ops, 'image') else x"
  MSELoss:
    target_api: custom_op
    custom_code: "lambda p, t, **kw: backend_module.ops.mean((p - t)**2)"
  CrossEntropyLoss:
    target_api: custom_op
    custom_code: "lambda p, t, **kw: -backend_module.ops.mean(backend_module.ops.sum(t * backend_module.ops.log(p + 1e-12), axis=-1))"
  BCELoss:
    target_api: custom_op
    custom_code: "lambda p, t, **kw: -backend_module.ops.mean(t * backend_module.ops.log(p + 1e-12) + (1.0 - t) * backend_module.ops.log(1.0 - p + 1e-12))"
  HuberLoss:
    target_api: custom_op
    custom_code: "lambda p, t, delta=1.0, **kw: backend_module.ops.mean(backend_module.ops.where(backend_module.ops.abs(p - t) < delta, 0.5 * ((p - t)**2), delta * (backend_module.ops.abs(p - t) - 0.5 * delta)))"
  KLDivergenceLoss:
    target_api: custom_op
    custom_code: "lambda p, t, **kw: backend_module.ops.mean(backend_module.ops.sum(t * (backend_module.ops.log(t + 1e-12) - backend_module.ops.log(p + 1e-12)), axis=-1))"
