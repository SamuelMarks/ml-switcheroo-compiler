      - "rocm"
      - "hip"
      - "rdna"
  edge_onnx:
    framework: "onnx"
    snapshot_glob: "onnx_v*.json"
    status: "available"
    canonical_roots:
      - "onnx"
      - "ai.onnx"
  webgpu:
    framework: "webgpu"
    snapshot_glob: "wgsl_v*.json"
    status: "available"
    canonical_roots:
      - "webgpu"
      - "wgsl"
  metal:
    framework: "metal"
    snapshot_glob: "metal_v*.json"
    status: "available"
    canonical_roots:
      - "metal"
      - "msl"
  numba:
    framework: "numba"
    snapshot_glob: "numba_v*.json"
