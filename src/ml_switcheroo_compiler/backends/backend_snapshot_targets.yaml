    snapshot_glob: "stablehlo_v*.json"
    status: "available"
    canonical_roots:
      - "stablehlo"
  edge_mlir:
    framework: "mlir"
    snapshot_glob: "mlir_v*.json"
    status: "available"
    canonical_roots:
      - "mlir"
  cuda:
    framework: "cuda"
    snapshot_glob: "nvidia_sass_v*.json"
