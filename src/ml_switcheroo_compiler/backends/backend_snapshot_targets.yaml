# Declarative mapping of compiler backends to static framework snapshot targets
version: "1.0.0"
targets:
  pytorch:
    framework: "torch"
    snapshot_glob: "torch_v*.json"
    status: "available"
    canonical_roots:
      - "torch"
      - "pytorch"
      - "torchaudio"
      - "torchvision"
  jax:
    framework: "jax"
    snapshot_glob: "jax_v*.json"
    status: "available"
    canonical_roots:
      - "jax"
      - "jax.numpy"
      - "jax.lax"
      - "jax.nn"
      - "jnp"
  mlx:
    framework: "mlx"
    snapshot_glob: "mlx_v*.json"
    status: "available"
    canonical_roots:
      - "mlx"
      - "mlx.core"
      - "mlx.nn"
      - "mx"
  tensorflow:
    framework: "tensorflow"
    snapshot_glob: "tensorflow_v*.json"
    status: "available"
    canonical_roots:
      - "tensorflow"
      - "tf"
  keras:
    framework: "keras"
    snapshot_glob: "keras_v*.json"
    status: "available"
    canonical_roots:
      - "keras"
      - "keras.ops"
      - "keras_ops"
  numpy:
    framework: "numpy"
    snapshot_glob: "numpy_v*.json"
    status: "available"
    canonical_roots:
      - "numpy"
      - "np"
  cupy:
    framework: "cupy"
    snapshot_glob: "cupy_v*.json"
