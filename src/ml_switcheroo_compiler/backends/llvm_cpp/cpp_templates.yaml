prelude: |
  #include <iostream>
  #include <vector>
  #include <cmath>
  #include <numeric>
  #include <algorithm>
  #include <cassert>
  #include <cstdlib>
  #include <cstring>
  #include <memory>
  #ifdef USE_BLAS
  #include <cblas.h>
  #endif

  template<typename T, size_t Alignment = 64>
  struct AlignedBuffer {
      T* ptr = nullptr;
      size_t num_bytes = 0;

      AlignedBuffer(size_t bytes) : num_bytes(bytes) {
          size_t aligned_bytes = (bytes + Alignment - 1) & ~(Alignment - 1);
          if (aligned_bytes == 0) aligned_bytes = Alignment;
  #if defined(_MSC_VER)
          ptr = static_cast<T*>(_aligned_malloc(aligned_bytes, Alignment));
  #elif defined(__APPLE__) || defined(_POSIX_C_SOURCE) && _POSIX_C_SOURCE >= 200112L
          void* raw = nullptr;
          if (posix_memalign(&raw, Alignment, aligned_bytes) == 0) {
              ptr = static_cast<T*>(raw);
          }
  #else
          ptr = static_cast<T*>(std::aligned_alloc(Alignment, aligned_bytes));
  #endif
          if (ptr && bytes > 0) std::memset(ptr, 0, bytes);
      }

      ~AlignedBuffer() {
  #if defined(_MSC_VER)
          if (ptr) _aligned_free(ptr);
  #else
          if (ptr) std::free(ptr);
  #endif
      }

      T* data() { return ptr; }
      const T* data() const { return ptr; }
      size_t size() const { return num_bytes; }
  };

  template<typename T>
  struct NDArrayView {
      std::vector<T> data;
      std::vector<int> shape;
      std::vector<int> strides;
      bool bounds_checked = true;

      NDArrayView() = default;

      NDArrayView(const std::vector<int>& s, T* external_buffer = nullptr) : shape(s) {
          int n = 1;
          for (int dim : s) n *= dim;
          data.resize(n, 0.0f);
          if (external_buffer != nullptr) {
              std::memcpy(data.data(), external_buffer, n * sizeof(T));
          }
          strides.resize(s.size(), 1);
          for (int i = (int)s.size() - 2; i >= 0; --i) {
              strides[i] = strides[i + 1] * s[i + 1];
          }
      }

      T& get(const std::vector<int>& indices) {
          int offset = 0;
          for (size_t i = 0; i < indices.size(); ++i) {
              int idx = (shape[i] == 1) ? 0 : indices[i];
              if (bounds_checked) {
                  assert(idx >= 0 && idx < shape[i] && "NDArrayView coordinate index out of bounds");
              }
              offset += idx * strides[i];
          }
          if (bounds_checked) {
              assert(offset >= 0 && offset < (int)data.size() && "NDArrayView linear offset out of bounds");
          }
          return data[offset];
      }

      const T& get(const std::vector<int>& indices) const {
          int offset = 0;
          for (size_t i = 0; i < indices.size(); ++i) {
              int idx = (shape[i] == 1) ? 0 : indices[i];
              if (bounds_checked) {
                  assert(idx >= 0 && idx < shape[i] && "NDArrayView coordinate index out of bounds");
              }
              offset += idx * strides[i];
          }
          if (bounds_checked) {
              assert(offset >= 0 && offset < (int)data.size() && "NDArrayView linear offset out of bounds");
          }
          return data[offset];
      }

      int size() const { return data.size(); }
  };

  inline std::vector<int> broadcast_shape(const std::vector<int>& s1, const std::vector<int>& s2) {
      std::vector<int> out_shape;
      int n1 = s1.size(), n2 = s2.size();
      int ndim = std::max(n1, n2);
      out_shape.resize(ndim, 1);
      for (int i = 0; i < ndim; ++i) {
          int d1 = (n1 - 1 - i >= 0) ? s1[n1 - 1 - i] : 1;
          int d2 = (n2 - 1 - i >= 0) ? s2[n2 - 1 - i] : 1;
          out_shape[ndim - 1 - i] = std::max(d1, d2);
      }
      return out_shape;
  }

  inline void inc_indices(std::vector<int>& indices, const std::vector<int>& shape) {
      for (int i = (int)shape.size() - 1; i >= 0; --i) {
          indices[i]++;
          if (indices[i] < shape[i]) break;
          indices[i] = 0;
      }
  }
