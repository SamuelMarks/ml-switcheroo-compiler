      \    float in1_val = {in1}.get(idx_{clean_id});\n    float in2_val = {in2}.get(idx_{clean_id});\n\
      \    {clean_id}.data[i] = {scalar_expr};\n    for(int d = {rank}-1; d >= 0;\
      \ --d) {{\n        idx_{clean_id}[d]++;\n        if (idx_{clean_id}[d] < {clean_id}.shape[d])\
      \ break;\n        idx_{clean_id}[d] = 0;\n    }}\n}}\n"
  maxpool2d:
    body: "NDArrayView<float> {clean_id}({out_shape_str});\nint out_idx = 0;\nfor\
      \ (int b = 0; b < {B}; ++b) {{\n    for (int oc = 0; oc < {channels}; ++oc)\
      \ {{\n        for (int oy = 0; oy < {out_height}; ++oy) {{\n            for\
      \ (int ox = 0; ox < {out_width}; ++ox) {{\n                float max_val = -1e38f;\n\
      \                #pragma omp simd reduction(max:max_val)\n                for\
      \ (int fy = 0; fy < {filter_h}; ++fy) {{\n                    for (int fx =\
      \ 0; fx < {filter_w}; ++fx) {{\n                        int in_y = oy * {stride_h}\
      \ + fy;\n                        int in_x = ox * {stride_w} + fx;\n        \
      \                if (in_y < {in_height} && in_x < {in_width}) {{\n         \
      \                   int in_idx = ((b * {channels} + oc) * {in_height} + in_y)\
      \ * {in_width} + in_x;\n                            max_val = std::max(max_val,\
      \ {in0}.data[in_idx]);\n                        }}\n                    }}\n\
      \                }}\n                {clean_id}.data[out_idx++] = max_val;\n\
      \            }}\n        }}\n    }}\n}}\n"
  avgpool2d:
    body: "NDArrayView<float> {clean_id}({out_shape_str});\nint out_idx = 0;\nfor\
      \ (int b = 0; b < {B}; ++b) {{\n    for (int oc = 0; oc < {channels}; ++oc)\
      \ {{\n        for (int oy = 0; oy < {out_height}; ++oy) {{\n            for\
      \ (int ox = 0; ox < {out_width}; ++ox) {{\n                float sum_val = 0.0f;\n\
      \                int count = 0;\n                for (int fy = 0; fy < {filter_h};\
      \ ++fy) {{\n                    for (int fx = 0; fx < {filter_w}; ++fx) {{\n\
      \                        int in_y = oy * {stride_h} + fy;\n                \
      \        int in_x = ox * {stride_w} + fx;\n                        if (in_y\
      \ < {in_height} && in_x < {in_width}) {{\n                            int in_idx\
      \ = ((b * {channels} + oc) * {in_height} + in_y) * {in_width} + in_x;\n    \
      \                        sum_val += {in0}.data[in_idx];\n                  \
      \          count++;\n                        }}\n                    }}\n  \
      \              }}\n                {clean_id}.data[out_idx++] = (count > 0)\
      \ ? (sum_val / count) : 0.0f;\n            }}\n        }}\n    }}\n}}\n"
  batchnorm:
    body: "NDArrayView<float> {clean_id}({out_shape_str});\n#pragma omp simd\nfor(size_t\
      \ i=0; i<{clean_id}.size(); ++i) {{\n    int c = (i / {spatial}) % {channels};\n\
      \    float m = {has_mean} ? {mean}.data[c] : 0.0f;\n    float v = {has_var}\
      \ ? {var}.data[c] : 1.0f;\n    float g = {has_gamma} ? {gamma}.data[c] : 1.0f;\n\
      \    float b = {has_beta} ? {beta}.data[c] : 0.0f;\n    {clean_id}.data[i] =\
      \ (({in0}.data[i] - m) / std::sqrt(v + 1e-5f)) * g + b;\n}}\n"
  layernorm:
    body: "NDArrayView<float> {clean_id}({out_shape_str});\nint rows = {clean_id}.size()\
      \ / {D};\nfor (int r = 0; r < rows; ++r) {{\n    float mean = 0.0f;\n    #pragma\
      \ omp simd reduction(+:mean)\n    for (int j = 0; j < {D}; ++j) {{ mean += {in0}.data[r\
      \ * {D} + j]; }}\n    mean /= {D};\n    float var = 0.0f;\n    #pragma omp simd\
      \ reduction(+:var)\n    for (int j = 0; j < {D}; ++j) {{\n        float diff\
      \ = {in0}.data[r * {D} + j] - mean;\n        var += diff * diff;\n    }}\n \
      \   var /= {D};\n    float inv_std = 1.0f / std::sqrt(var + 1e-5f);\n    #pragma\
      \ omp simd\n    for (int j = 0; j < {D}; ++j) {{\n        float g = {has_gamma}\
      \ ? {gamma}.data[j] : 1.0f;\n        float b = {has_beta} ? {beta}.data[j] :\
      \ 0.0f;\n        {clean_id}.data[r * {D} + j] = ({in0}.data[r * {D} + j] - mean)\
      \ * inv_std * g + b;\n    }}\n}}\n"
  rmsnorm:
    body: "NDArrayView<float> {clean_id}({out_shape_str});\nint rows = {clean_id}.size()\
      \ / {D};\nfor (int r = 0; r < rows; ++r) {{\n    float sum_sq = 0.0f;\n   \
      \ #pragma omp simd reduction(+:sum_sq)\n    for (int j = 0; j < {D}; ++j) {{\
      \ float x = {in0}.data[r * {D} + j]; sum_sq += x * x; }}\n    float rms = 1.0f\
      \ / std::sqrt(sum_sq / {D} + 1e-5f);\n    #pragma omp simd\n    for (int j =\
      \ 0; j < {D}; ++j) {{\n        float g = {has_gamma} ? {gamma}.data[j] : 1.0f;\n\
      \        {clean_id}.data[r * {D} + j] = {in0}.data[r * {D} + j] * rms * g;\n\
      \    }}\n}}\n"
  conv3d:
    body: "NDArrayView<float> {clean_id}({out_shape_str});\nint out_idx = 0;\nfor\
      \ (int b = 0; b < {N}; ++b) {{\n    for (int oc = 0; oc < {C_out}; ++oc) {{\n\
      \        for (int od = 0; od < {D_out}; ++od) {{\n            for (int oy =\
      \ 0; oy < {H_out}; ++oy) {{\n                for (int ox = 0; ox < {W_out};\
      \ ++ox) {{\n                    float sum = 0.0f;\n                    for\
      \ (int ic = 0; ic < {C_in}; ++ic) {{\n                        for (int kd =\
      \ 0; kd < {KD}; ++kd) {{\n                            for (int fy = 0; fy <\
      \ {KH}; ++fy) {{\n                                #pragma omp simd reduction(+:sum)\n\
      \                                for (int fx = 0; fx < {KW}; ++fx) {{\n    \
      \                                int in_d = od * {stride_d} + kd;\n        \
      \                            int in_y = oy * {stride_h} + fy;\n            \
      \                        int in_x = ox * {stride_w} + fx;\n                \
      \                    if (in_d < {D} && in_y < {H} && in_x < {W}) {{\n      \
      \                                  int in_idx = ((((b * {C_in} + ic) * {D} +\
      \ in_d) * {H} + in_y) * {W}) + in_x;\n                                     \
      \   int w_idx = ((((oc * {C_in} + ic) * {KD} + kd) * {KH} + fy) * {KW}) + fx;\n\
      \                                        sum += {in0}.data[in_idx] * {in1}.data[w_idx];\n\
      \                                    }}\n                                }}\n\
      \                            }}\n                        }}\n              \
      \      }}\n                    {clean_id}.data[out_idx++] = sum;\n         \
      \       }}\n            }}\n        }}\n    }}\n}}\n"
  maxpool3d:
    body: "NDArrayView<float> {clean_id}({out_shape_str});\nint out_idx = 0;\nfor\
      \ (int b = 0; b < {N}; ++b) {{\n    for (int oc = 0; oc < {C}; ++oc) {{\n \
      \       for (int od = 0; od < {D_out}; ++od) {{\n            for (int oy =\
      \ 0; oy < {H_out}; ++oy) {{\n                for (int ox = 0; ox < {W_out};\
      \ ++ox) {{\n                    float max_val = -1e38f;\n                 \
      \   for (int kd = 0; kd < {KD}; ++kd) {{\n                        for (int fy\
      \ = 0; fy < {KH}; ++fy) {{\n                            #pragma omp simd reduction(max:max_val)\n\
      \                            for (int fx = 0; fx < {KW}; ++fx) {{\n        \
      \                        int in_d = od * {stride_d} + kd;\n                \
      \                int in_y = oy * {stride_h} + fy;\n                        \
      \        int in_x = ox * {stride_w} + fx;\n                                if\
      \ (in_d < {D} && in_y < {H} && in_x < {W}) {{\n                            \
      \        int in_idx = ((((b * {C} + oc) * {D} + in_d) * {H} + in_y) * {W}) +\
      \ in_x;\n                                    max_val = std::max(max_val, {in0}.data[in_idx]);\n\
      \                                }}\n                            }}\n      \
      \                  }}\n                    }}\n                    {clean_id}.data[out_idx++]\
      \ = max_val;\n                }}\n            }}\n        }}\n    }}\n}}\n"
  avgpool3d:
    body: "NDArrayView<float> {clean_id}({out_shape_str});\nint out_idx = 0;\nfor\
      \ (int b = 0; b < {N}; ++b) {{\n    for (int oc = 0; oc < {C}; ++oc) {{\n \
      \       for (int od = 0; od < {D_out}; ++od) {{\n            for (int oy =\
      \ 0; oy < {H_out}; ++oy) {{\n                for (int ox = 0; ox < {W_out};\
      \ ++ox) {{\n                    float sum_val = 0.0f;\n                   \
      \ int count = 0;\n                    for (int kd = 0; kd < {KD}; ++kd) {{\n\
      \                        for (int fy = 0; fy < {KH}; ++fy) {{\n             \
      \               for (int fx = 0; fx < {KW}; ++fx) {{\n                     \
      \           int in_d = od * {stride_d} + kd;\n                             \
      \   int in_y = oy * {stride_h} + fy;\n                                int in_x\
      \ = ox * {stride_w} + fx;\n                                if (in_d < {D} &&\
      \ in_y < {H} && in_x < {W}) {{\n                                    int in_idx\
      \ = ((((b * {C} + oc) * {D} + in_d) * {H} + in_y) * {W}) + in_x;\n         \
      \                           sum_val += {in0}.data[in_idx];\n               \
      \                     count++;\n                                }}\n        \
      \                    }}\n                        }}\n                    }}\n\
      \                    {clean_id}.data[out_idx++] = (count > 0) ? (sum_val / count)\
      \ : 0.0f;\n                }}\n            }}\n        }}\n    }}\n}}\n"
  slice:
    body: "NDArrayView<float> {clean_id}({out_shape_str});\nstd::vector<int> out_idx_{clean_id}({rank},\
      \ 0);\nstd::vector<int> starts_{clean_id} = {starts};\nstd::vector<int> strides_{clean_id}\
      \ = {strides};\nfor(size_t i=0; i<{clean_id}.size(); ++i) {{\n    std::vector<int>\
      \ in_idx_{clean_id}({rank}, 0);\n    for(int d = 0; d < {rank}; ++d) {{\n \
      \       in_idx_{clean_id}[d] = starts_{clean_id}[d] + out_idx_{clean_id}[d]\
      \ * strides_{clean_id}[d];\n    }}\n    {clean_id}.data[i] = {in0}.get(in_idx_{clean_id});\n\
      \    for(int d = {rank}-1; d >= 0; --d) {{\n        out_idx_{clean_id}[d]++;\n\
      \        if (out_idx_{clean_id}[d] < {clean_id}.shape[d]) break;\n        out_idx_{clean_id}[d]\
      \ = 0;\n    }}\n}}\n"
  pad:
    body: "NDArrayView<float> {clean_id}({out_shape_str});\nstd::vector<int> out_idx_{clean_id}({rank},\
      \ 0);\nstd::vector<int> pad_low_{clean_id} = {pad_low};\nfor(size_t i=0; i<{clean_id}.size();\
      \ ++i) {{\n    bool is_pad = false;\n    std::vector<int> in_idx_{clean_id}({rank},\
      \ 0);\n    for(int d = 0; d < {rank}; ++d) {{\n        int coord = out_idx_{clean_id}[d]\
      \ - pad_low_{clean_id}[d];\n        if (coord < 0 || coord >= {in0}.shape[d])\
      \ {{ is_pad = true; break; }}\n        in_idx_{clean_id}[d] = coord;\n    }}\n\
      \    {clean_id}.data[i] = is_pad ? {pad_val} : {in0}.get(in_idx_{clean_id});\n\
      \    for(int d = {rank}-1; d >= 0; --d) {{\n        out_idx_{clean_id}[d]++;\n\
      \        if (out_idx_{clean_id}[d] < {clean_id}.shape[d]) break;\n        out_idx_{clean_id}[d]\
      \ = 0;\n    }}\n}}\n"
  gather_nd:
    body: "NDArrayView<float> {clean_id}({out_shape_str});\nint num_slices = {in1}.size()\
      \ / {index_depth};\nint slice_size = {clean_id}.size() / (num_slices > 0 ? num_slices\
      \ : 1);\nfor (int s = 0; s < num_slices; ++s) {{\n    int src_offset = 0;\n\
      \    for (int k = 0; k < {index_depth}; ++k) {{\n        int idx_k = (int){in1}.data[s\
      \ * {index_depth} + k];\n        src_offset += idx_k * {in0}.strides[k];\n \
      \   }}\n    for (int j = 0; j < slice_size; ++j) {{\n        {clean_id}.data[s\
      \ * slice_size + j] = {in0}.data[src_offset + j];\n    }}\n}}\n"
  scatter_nd:
    body: "NDArrayView<float> {clean_id}({out_shape_str});\nstd::memcpy({clean_id}.data.data(),\
      \ {in0}.data.data(), {in0}.size() * sizeof(float));\nint num_slices = {in1}.size()\
      \ / {index_depth};\nint slice_size = {in2}.size() / (num_slices > 0 ? num_slices\
      \ : 1);\nfor (int s = 0; s < num_slices; ++s) {{\n    int dst_offset = 0;\n\
      \    for (int k = 0; k < {index_depth}; ++k) {{\n        int idx_k = (int){in1}.data[s\
      \ * {index_depth} + k];\n        dst_offset += idx_k * {clean_id}.strides[k];\n\
      \    }}\n    for (int j = 0; j < slice_size; ++j) {{\n        {clean_id}.data[dst_offset\
      \ + j] = {in2}.data[s * slice_size + j];\n    }}\n}}\n"
  softmax:
    body: "NDArrayView<float> {clean_id}({out_shape_str});\nint rows = {clean_id}.size()\
      \ / {D};\nfor (int r = 0; r < rows; ++r) {{\n    float max_val = -1e38f;\n \
      \   #pragma omp simd reduction(max:max_val)\n    for (int j = 0; j < {D}; ++j)\
      \ {{ max_val = std::max(max_val, {in0}.data[r * {D} + j]); }}\n    float sum_exp\
      \ = 0.0f;\n    #pragma omp simd reduction(+:sum_exp)\n    for (int j = 0; j\
      \ < {D}; ++j) {{ sum_exp += std::exp({in0}.data[r * {D} + j] - max_val); }}\n\
      \    float inv_sum = 1.0f / sum_exp;\n    #pragma omp simd\n    for (int j =\
      \ 0; j < {D}; ++j) {{\n        {clean_id}.data[r * {D} + j] = std::exp({in0}.data[r\
      \ * {D} + j] - max_val) * inv_sum;\n    }}\n}}\n"
  warp_shuffle_reduce:
    body: "NDArrayView<float> {clean_id}({out_shape_str});\nfloat total_sum = 0.0f;\n\
      #pragma omp parallel for reduction(+:total_sum)\nfor (size_t i = 0; i < {in0}.size();\
      \ ++i) {{\n    total_sum += {in0}.data[i];\n}}\n{clean_id}.data[0] = total_sum;\n"
  shared_memory_tree_reduce:
    body: "NDArrayView<float> {clean_id}({out_shape_str});\nfloat tree_sum = 0.0f;\n\
      #pragma omp simd reduction(+:tree_sum)\nfor (size_t i = 0; i < {in0}.size();\
      \ ++i) {{\n    tree_sum += {in0}.data[i];\n}}\n{clean_id}.data[0] = tree_sum;\n"
  tiled_matmul_2d:
    body: "NDArrayView<float> {clean_id}({out_shape_str});\nconst size_t TILE = 32;\n\
      #pragma omp parallel for collapse(2)\nfor (size_t i = 0; i < {M}; i += TILE)\
      \ {{\n    for (size_t j = 0; j < {N}; j += TILE) {{\n        for (size_t k =\
      \ 0; k < {K}; k += TILE) {{\n            for (size_t ii = i; ii < std::min(i\
      \ + TILE, (size_t){M}); ++ii) {{\n                for (size_t jj = j; jj < std::min(j\
      \ + TILE, (size_t){N}); ++jj) {{\n                    float acc = (k == 0) ?\
      \ 0.0f : {clean_id}.data[ii * {N} + jj];\n                    #pragma omp simd\
      \ reduction(+:acc)\n                    for (size_t kk = k; kk < std::min(k\
      \ + TILE, (size_t){K}); ++kk) {{\n                        acc += {in0}.data[ii\
      \ * {K} + kk] * {in1}.data[kk * {N} + jj];\n                    }}\n       \
      \             {clean_id}.data[ii * {N} + jj] = acc;\n                }}\n  \
      \          }}\n        }}\n    }}\n}}\n"
  conv2d_shared_halo:
    body: "NDArrayView<float> {clean_id}({out_shape_str});\n#pragma omp parallel for\
      \ collapse(2)\nfor (int b = 0; b < {B}; ++b) {{\n    for (int oc = 0; oc < {out_channels};\
      \ ++oc) {{\n        for (int oy = 0; oy < {out_height}; ++oy) {{\n         \
      \   for (int ox = 0; ox < {out_width}; ++ox) {{\n                float sum =\
      \ 0.0f;\n                for (int ic = 0; ic < {in_channels}; ++ic) {{\n   \
      \                 for (int fy = 0; fy < {filter_h}; ++fy) {{\n             \
      \           #pragma omp simd reduction(+:sum)\n                        for (int\
      \ fx = 0; fx < {filter_w}; ++fx) {{\n                            int in_y =\
      \ oy * {stride_h} + fy;\n                            int in_x = ox * {stride_w}\
