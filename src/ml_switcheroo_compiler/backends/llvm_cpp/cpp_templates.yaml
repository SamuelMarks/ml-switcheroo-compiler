templates:
  unary:
    body: |
      NDArrayView<float> {clean_id}({out_shape_str});
      for(size_t i=0; i<{clean_id}.size(); ++i) {{
          {clean_id}.data[i] = {scalar_expr};
      }}
  binary:
    body: |
      NDArrayView<float> {clean_id}({out_shape_str});
      std::vector<int> idx_{clean_id}({rank}, 0);
      for(size_t i=0; i<{clean_id}.size(); ++i) {{
          float in0_val = {in0}.get(idx_{clean_id});
          float in1_val = {in1}.get(idx_{clean_id});
          {clean_id}.data[i] = {scalar_expr};

          // update index
          for(int d = {rank}-1; d >= 0; --d) {{
              idx_{clean_id}[d]++;
              if (idx_{clean_id}[d] < {clean_id}.shape[d]) break;
              idx_{clean_id}[d] = 0;
          }}
      }}
  matmul:
    body: |
      NDArrayView<float> {clean_id}({out_shape_str});
      #ifdef USE_BLAS
      cblas_sgemm(CblasRowMajor, CblasNoTrans, CblasNoTrans, {M}, {N}, {K}, 1.0f, {in0}.data.data(), {K}, {in1}.data.data(), {N}, 0.0f, {clean_id}.data.data(), {N});
      #else
      for (size_t i = 0; i < {M}; ++i) {{
          for (size_t j = 0; j < {N}; ++j) {{
              float sum = 0.0f;
              for (size_t k = 0; k < {K}; ++k) {{
                  sum += {in0}.data[i * {K} + k] * {in1}.data[k * {N} + j];
              }}
              {clean_id}.data[i * {N} + j] = sum;
          }}
      }}
      #endif
  reduction:
    body: |
      NDArrayView<float> {clean_id}({out_shape_str});
      if ({in0}.size() > 0) {{
          float res = {init_val}f;
          for(size_t i=0; i<{in0}.size(); ++i) {{
              float val = {in0}.data[i];
              res = {scalar_expr};
          }}
          {clean_id}.data[0] = {final_combine};
      }}
  fallback_copy:
    body: |
      NDArrayView<float> {clean_id}({out_shape_str});
      for(size_t i=0; i<{clean_id}.size(); ++i) {{
          {clean_id}.data[i] = {in0}.data[i];
      }}
prelude: |
  #include <iostream>
  #include <vector>
  #include <cmath>
  #include <numeric>
  #include <algorithm>
  #include <cassert>
  #ifdef USE_BLAS
  #include <cblas.h>
  #endif

  template<typename T>
  struct NDArrayView {
      std::vector<T> data;
      std::vector<int> shape;
      std::vector<int> strides;

      NDArrayView() = default;

      NDArrayView(const std::vector<int>& s) : shape(s) {
          int n = 1;
          for (int dim : s) n *= dim;
          data.resize(n, 0.0f);
          strides.resize(s.size(), 1);
          for (int i = (int)s.size() - 2; i >= 0; --i) {
              strides[i] = strides[i + 1] * s[i + 1];
          }
      }

      // Support broadcasting indexing
      T& get(const std::vector<int>& indices) {
          int offset = 0;
          for (size_t i = 0; i < indices.size(); ++i) {
              // Broadcasting: if dimension is 1, index is effectively 0 for that dim
              int idx = (shape[i] == 1) ? 0 : indices[i];
              offset += idx * strides[i];
          }
          return data[offset];
      }

      const T& get(const std::vector<int>& indices) const {
          int offset = 0;
          for (size_t i = 0; i < indices.size(); ++i) {
              int idx = (shape[i] == 1) ? 0 : indices[i];
              offset += idx * strides[i];
          }
          return data[offset];
      }

      int size() const { return data.size(); }
  };

  // Helper for broadcasting
  inline std::vector<int> broadcast_shape(const std::vector<int>& s1, const std::vector<int>& s2) {
      std::vector<int> out_shape;
      int n1 = s1.size(), n2 = s2.size();
      int ndim = std::max(n1, n2);
      out_shape.resize(ndim, 1);
      for (int i = 0; i < ndim; ++i) {
          int d1 = (n1 - 1 - i >= 0) ? s1[n1 - 1 - i] : 1;
          int d2 = (n2 - 1 - i >= 0) ? s2[n2 - 1 - i] : 1;
          out_shape[ndim - 1 - i] = std::max(d1, d2);
      }
      return out_shape;
  }

  inline void inc_indices(std::vector<int>& indices, const std::vector<int>& shape) {
      for (int i = (int)shape.size() - 1; i >= 0; --i) {
          indices[i]++;
          if (indices[i] < shape[i]) break;
          indices[i] = 0;
      }
  }
