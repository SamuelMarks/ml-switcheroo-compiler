  pow:
    template: binary
    scalar_expr: std::pow(in0_val, in1_val)
  maximum:
    template: binary
    scalar_expr: std::max(in0_val, in1_val)
  minimum:
    template: binary
    scalar_expr: std::min(in0_val, in1_val)
  equal:
    template: binary
    scalar_expr: '(in0_val == in1_val) ? 1.0f : 0.0f'
  notequal:
    template: binary
    scalar_expr: '(in0_val != in1_val) ? 1.0f : 0.0f'
  less:
    template: binary
    scalar_expr: '(in0_val < in1_val) ? 1.0f : 0.0f'
  lessequal:
    template: binary
    scalar_expr: '(in0_val <= in1_val) ? 1.0f : 0.0f'
  greater:
    template: binary
    scalar_expr: '(in0_val > in1_val) ? 1.0f : 0.0f'
  greaterequal:
    template: binary
    scalar_expr: '(in0_val >= in1_val) ? 1.0f : 0.0f'
  floor:
    template: unary
    scalar_expr: std::floor(in0_val)
  ceil:
    template: unary
    scalar_expr: std::ceil(in0_val)
  round:
    template: unary
    scalar_expr: std::round(in0_val)
  trunc:
    template: unary
    scalar_expr: std::trunc(in0_val)
  sign:
    template: unary
    scalar_expr: '(in0_val > 0.0f) ? 1.0f : ((in0_val < 0.0f) ? -1.0f : 0.0f)'
  square:
    template: unary
    scalar_expr: in0_val * in0_val
  reciprocal:
    template: unary
    scalar_expr: 1.0f / in0_val
  rsqrt:
    template: unary
    scalar_expr: 1.0f / std::sqrt(in0_val)
  log2:
    template: unary
    scalar_expr: std::log2(in0_val)
  log10:
    template: unary
    scalar_expr: std::log10(in0_val)
  exp2:
    template: unary
    scalar_expr: std::exp2(in0_val)
  expm1:
    template: unary
    scalar_expr: std::expm1(in0_val)
  log1p:
    template: unary
    scalar_expr: std::log1p(in0_val)
  erf:
    template: unary
    scalar_expr: std::erf(in0_val)
  erfc:
    template: unary
    scalar_expr: std::erfc(in0_val)
  gelu:
    template: unary
    scalar_expr: 0.5f * in0_val * (1.0f + std::erf(in0_val * 0.7071067811865475f))
  silu:
    template: unary
    scalar_expr: in0_val / (1.0f + std::exp(-in0_val))
  leakyrelu:
    template: unary
    scalar_expr: '(in0_val > 0.0f) ? in0_val : (0.01f * in0_val)'
  elu:
    template: unary
    scalar_expr: '(in0_val > 0.0f) ? in0_val : (std::exp(in0_val) - 1.0f)'
  selu:
    template: unary
    scalar_expr: '1.05070098f * ((in0_val > 0.0f) ? in0_val : (1.67326324f * (std::exp(in0_val)
      - 1.0f)))'
  clamp:
    template: ternary
    scalar_expr: std::min(std::max(in0_val, in1_val), in2_val)
  logical_and:
    template: binary
    scalar_expr: '(in0_val != 0.0f && in1_val != 0.0f) ? 1.0f : 0.0f'
  logical_or:
    template: binary
    scalar_expr: '(in0_val != 0.0f || in1_val != 0.0f) ? 1.0f : 0.0f'
  logical_not:
    template: unary
    scalar_expr: '(in0_val == 0.0f) ? 1.0f : 0.0f'
  bitwise_and:
    template: binary
    scalar_expr: (float)((int)in0_val & (int)in1_val)
  bitwise_or:
    template: binary
    scalar_expr: (float)((int)in0_val | (int)in1_val)
  bitwise_xor:
    template: binary
    scalar_expr: (float)((int)in0_val ^ (int)in1_val)
  bitwise_not:
    template: unary
    scalar_expr: (float)(~(int)in0_val)
prelude: "#include <iostream>\n#include <vector>\n#include <cmath>\n#include <numeric>\n\
  #include <algorithm>\n#include <cassert>\n#include <cstdlib>\n#include <cstring>\n\
  #include <memory>\n#ifdef USE_BLAS\n#include <cblas.h>\n#endif\n\ntemplate<typename\
