templates:
  if_op:
    body: |
      if ({cond_var}.data[0] > 0.0f) {{
      {then_body}
      }} else {{
      {else_body}
      }}
  loop_op:
    body: |
      while (true) {{
      {cond_body}{loop_body}
          break;
      }}
  unary:
    body: |
      NDArrayView<float> {clean_id}({out_shape_str});
      #pragma omp simd
      for(size_t i=0; i<{clean_id}.size(); ++i) {{
          {clean_id}.data[i] = {scalar_expr};
      }}
  binary:
    body: |
      NDArrayView<float> {clean_id}({out_shape_str});
      std::vector<int> idx_{clean_id}({rank}, 0);
      for(size_t i=0; i<{clean_id}.size(); ++i) {{
          float in0_val = {in0}.get(idx_{clean_id});
          float in1_val = {in1}.get(idx_{clean_id});
          {clean_id}.data[i] = {scalar_expr};
          /* update index */
          for(int d = {rank}-1; d >= 0; --d) {{
              idx_{clean_id}[d]++;
              if (idx_{clean_id}[d] < {clean_id}.shape[d]) break;
              idx_{clean_id}[d] = 0;
          }}
      }}
  matmul:
    body: |
      NDArrayView<float> {clean_id}({out_shape_str});
      #ifdef USE_BLAS
      cblas_sgemm(CblasRowMajor, CblasNoTrans, CblasNoTrans, {M}, {N}, {K}, 1.0f, {in0}.data.data(), {K}, {in1}.data.data(), {N}, 0.0f, {clean_id}.data.data(), {N});
      #else
      for (size_t i = 0; i < {M}; ++i) {{
          for (size_t j = 0; j < {N}; ++j) {{
              float sum = 0.0f;
              #pragma omp simd reduction(+:sum)
              for (size_t k = 0; k < {K}; ++k) {{
                  sum += {in0}.data[i * {K} + k] * {in1}.data[k * {N} + j];
              }}
              {clean_id}.data[i * {N} + j] = sum;
          }}
      }}
      #endif
  reduction:
    body: |
      NDArrayView<float> {clean_id}({out_shape_str});
      if ({in0}.size() > 0) {{
          float res = {init_val}f;
          #pragma omp simd
          for(size_t i=0; i<{in0}.size(); ++i) {{
              float val = {in0}.data[i];
              res = {scalar_expr};
          }}
          {clean_id}.data[0] = {final_combine};
      }}
  fallback_copy:
    body: |
      NDArrayView<float> {clean_id}({out_shape_str});
      #pragma omp simd
      for(size_t i=0; i<{clean_id}.size(); ++i) {{
          {clean_id}.data[i] = {in0}.data[i];
      }}
  conv2d:
    body: |
      NDArrayView<float> {clean_id}({out_shape_str});
      int out_idx = 0;
      for (int b = 0; b < {B}; ++b) {{
          for (int oc = 0; oc < {out_channels}; ++oc) {{
              for (int oy = 0; oy < {out_height}; ++oy) {{
                  for (int ox = 0; ox < {out_width}; ++ox) {{
                      float sum = 0.0f;
                      for (int ic = 0; ic < {in_channels}; ++ic) {{
                          for (int fy = 0; fy < {filter_h}; ++fy) {{
                              #pragma omp simd reduction(+:sum)
                              for (int fx = 0; fx < {filter_w}; ++fx) {{
                                  int in_y = oy * {stride_h} + fy;
                                  int in_x = ox * {stride_w} + fx;
                                  int in_idx = ((b * {in_channels} + ic) * {in_height} + in_y) * {in_width} + in_x;
                                  int w_idx = ((oc * {in_channels} + ic) * {filter_h} + fy) * {filter_w} + fx;
                                  sum += {in0}.data[in_idx] * {in1}.data[w_idx];
                              }}
                          }}
                      }}
                      {clean_id}.data[out_idx++] = sum;
                  }}
              }}
          }}
      }}
  scan:
    body: |
      NDArrayView<float> {clean_id}({out_shape_str});
      if ({in0}.size() > 0) {{
          float acc = 0.0f;
          for(size_t i=0; i<{in0}.size(); ++i) {{
              acc = acc + {in0}.data[i];
              {clean_id}.data[i] = acc;
          }}
      }}
  attention:
    body: |
      NDArrayView<float> {clean_id}({out_shape_str});
      #pragma omp simd
      for(size_t i=0; i<{clean_id}.size(); ++i) {{
          {clean_id}.data[i] = 0.0f;
      }}
  input:
    body: "NDArrayView<float> {clean_id}({out_shape_str}{offset_str}); // Input"
  constant:
    body: |
      NDArrayView<float> {clean_id}({out_shape_str});
      for(size_t i=0; i<{clean_id}.size(); ++i) {{ {clean_id}.data[i] = {val}; }}
  output:
    body: "// Output {in0}"
  unimplemented_fallback:
    body: "NDArrayView<float> {clean_id}({out_shape_str}); // Fallback Unimplemented {op}"

