      \ i=0; i<{clean_id}.size(); ++i) {{\n    {clean_id}.data[i] = {in0}.data[i];\n\
      }}\n"
  conv2d:
    body: "NDArrayView<float> {clean_id}({out_shape_str});\nint out_idx = 0;\nfor\
      \ (int b = 0; b < {B}; ++b) {{\n    for (int oc = 0; oc < {out_channels}; ++oc)\
