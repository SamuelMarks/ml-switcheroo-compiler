templates:
  if_op:
    body: "    if ({cond_var}.data[0] > 0.0f) {{\n{then_body}    }} else {{\n{else_body}    }}\n"
  loop_op:
    body: "    while (true) {{\n{cond_body}{loop_body}        break;\n    }}\n"
  unary:
    body: "NDArrayView<float> {clean_id}({out_shape_str});\nfor(size_t i=0; i<{clean_id}.size();\
      \ ++i) {{\n    {clean_id}.data[i] = {scalar_expr};\n}}\n"
  binary:
    body: "NDArrayView<float> {clean_id}({out_shape_str});\nstd::vector<int> idx_{clean_id}({rank},\
      \ 0);\nfor(size_t i=0; i<{clean_id}.size(); ++i) {{\n    float in0_val = {in0}.get(idx_{clean_id});\n\
      \    float in1_val = {in1}.get(idx_{clean_id});\n    {clean_id}.data[i] = {scalar_expr};\n\
      \n    // update index\n    for(int d = {rank}-1; d >= 0; --d) {{\n        idx_{clean_id}[d]++;\n\
      \        if (idx_{clean_id}[d] < {clean_id}.shape[d]) break;\n        idx_{clean_id}[d]\
      \ = 0;\n    }}\n}}\n"
  matmul:
    body: "NDArrayView<float> {clean_id}({out_shape_str});\n#ifdef USE_BLAS\ncblas_sgemm(CblasRowMajor,\
      \ CblasNoTrans, CblasNoTrans, {M}, {N}, {K}, 1.0f, {in0}.data, {K}, {in1}.data,\
      \ {N}, 0.0f, {clean_id}.data, {N});\n#else\nfor (size_t i = 0; i < {M};\
      \ ++i) {{\n    for (size_t j = 0; j < {N}; ++j) {{\n        float sum = 0.0f;\n\
      \        for (size_t k = 0; k < {K}; ++k) {{\n            sum += {in0}.data[i\
      \ * {K} + k] * {in1}.data[k * {N} + j];\n        }}\n        {clean_id}.data[i\
      \ * {N} + j] = sum;\n    }}\n}}\n#endif\n"
  reduction:
    body: "NDArrayView<float> {clean_id}({out_shape_str});\nif ({in0}.size() > 0)\
      \ {{\n    float res = {init_val}f;\n    for(size_t i=0; i<{in0}.size(); ++i)\
      \ {{\n        float val = {in0}.data[i];\n        res = {scalar_expr};\n   \
      \ }}\n    {clean_id}.data[0] = {final_combine};\n}}\n"
  fallback_copy:
    body: "NDArrayView<float> {clean_id}({out_shape_str});\nfor(size_t i=0; i<{clean_id}.size();\
      \ ++i) {{\n    {clean_id}.data[i] = {in0}.data[i];\n}}\n"
  conv2d:
    body: "NDArrayView<float> {clean_id}({out_shape_str});\nint out_idx = 0;\nfor\
      \ (int b = 0; b < {B}; ++b) {{\n    for (int oc = 0; oc < {out_channels}; ++oc)\
      \ {{\n        for (int oy = 0; oy < {out_height}; ++oy) {{\n            for\
      \ (int ox = 0; ox < {out_width}; ++ox) {{\n                float sum = 0.0f;\n\
      \                for (int ic = 0; ic < {in_channels}; ++ic) {{\n           \
      \         for (int fy = 0; fy < {filter_h}; ++fy) {{\n                     \
      \   for (int fx = 0; fx < {filter_w}; ++fx) {{\n                           \
      \ int in_y = oy * {stride_h} + fy;\n                            int in_x = ox\
      \ * {stride_w} + fx;\n                            int in_idx = ((b * {in_channels}\
      \ + ic) * {in_height} + in_y) * {in_width} + in_x;\n                       \
      \     int w_idx = ((oc * {in_channels} + ic) * {filter_h} + fy) * {filter_w}\
      \ + fx;\n                            sum += {in0}.data[in_idx] * {in1}.data[w_idx];\n\
      \                        }}\n                    }}\n                }}\n  \
      \              {clean_id}.data[out_idx++] = sum;\n            }}\n        }}\n\
      \    }}\n}}\n"
  scan:
    body: "NDArrayView<float> {clean_id}({out_shape_str});\nif ({in0}.size() > 0) {{\n    float acc = 0.0f;\n    for(size_t i=0; i<{in0}.size(); ++i) {{\n        acc = acc + {in0}.data[i];\n        {clean_id}.data[i] = acc;\n    }}\n}}\n"
  attention:
    body: "NDArrayView<float> {clean_id}({out_shape_str});\n// Mock C++ dot-product attention\nfor(size_t i=0; i<{clean_id}.size(); ++i) {{\n    {clean_id}.data[i] = 0.0f;\n}}\n"
prelude: "#include <iostream>\n#include <vector>\n#include <cmath>\n#include <numeric>\n\
  #include <algorithm>\n#include <cassert>\n#ifdef USE_BLAS\n#include <cblas.h>\n\
  #endif\n\ntemplate<typename T>\nstruct NDArrayView {\n    std::vector<T> data;\n\
  \    std::vector<int> shape;\n    std::vector<int> strides;\n\n    NDArrayView()\
  \ = default;\n\n    NDArrayView(const std::vector<int>& s) : shape(s) {\n      \
  \  int n = 1;\n        for (int dim : s) n *= dim;\n        data.resize(n, 0.0f);\n\
  \        strides.resize(s.size(), 1);\n        for (int i = (int)s.size() - 2; i\
  \ >= 0; --i) {\n            strides[i] = strides[i + 1] * s[i + 1];\n        }\n\
  \    }\n\n    // Support broadcasting indexing\n    T& get(const std::vector<int>&\
  \ indices) {\n        int offset = 0;\n        for (size_t i = 0; i < indices.size();\
  \ ++i) {\n            // Broadcasting: if dimension is 1, index is effectively 0\
  \ for that dim\n            int idx = (shape[i] == 1) ? 0 : indices[i];\n      \
  \      offset += idx * strides[i];\n        }\n        return data[offset];\n  \
  \  }\n\n    const T& get(const std::vector<int>& indices) const {\n        int offset\
  \ = 0;\n        for (size_t i = 0; i < indices.size(); ++i) {\n            int idx\
  \ = (shape[i] == 1) ? 0 : indices[i];\n            offset += idx * strides[i];\n\
  \        }\n        return data[offset];\n    }\n\n    int size() const { return\
  \ data.size(); }\n};\n\n// Helper for broadcasting\ninline std::vector<int> broadcast_shape(const\
  \ std::vector<int>& s1, const std::vector<int>& s2) {\n    std::vector<int> out_shape;\n\
  \    int n1 = s1.size(), n2 = s2.size();\n    int ndim = std::max(n1, n2);\n   \
  \ out_shape.resize(ndim, 1);\n    for (int i = 0; i < ndim; ++i) {\n        int\
  \ d1 = (n1 - 1 - i >= 0) ? s1[n1 - 1 - i] : 1;\n        int d2 = (n2 - 1 - i >=\
  \ 0) ? s2[n2 - 1 - i] : 1;\n        out_shape[ndim - 1 - i] = std::max(d1, d2);\n\
  \    }\n    return out_shape;\n}\n\ninline void inc_indices(std::vector<int>& indices,\
  \ const std::vector<int>& shape) {\n    for (int i = (int)shape.size() - 1; i >=\
  \ 0; --i) {\n        indices[i]++;\n        if (indices[i] < shape[i]) break;\n\
  \        indices[i] = 0;\n    }\n}\n"
