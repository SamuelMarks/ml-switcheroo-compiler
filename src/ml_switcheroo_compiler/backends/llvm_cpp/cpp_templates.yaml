templates:
  if_op:
    body: 'if ({cond_var}.data[0] > 0.0f) {{

      {then_body}

      }} else {{

      {else_body}

      }}

      '
  loop_op:
    body: "while (true) {{\n{cond_body}{loop_body}\n    break;\n}}\n"
  unary:
    body: "NDArrayView<float> {clean_id}({out_shape_str});\n#pragma omp simd\nfor(size_t\
      \ i=0; i<{clean_id}.size(); ++i) {{\n    float in0_val = {in0}.data[i];\n    {clean_id}.data[i] = {scalar_expr};\n\
      }}\n"
  binary:
    body: "NDArrayView<float> {clean_id}({out_shape_str});\nstd::vector<int> idx_{clean_id}({rank},\
      \ 0);\nfor(size_t i=0; i<{clean_id}.size(); ++i) {{\n    float in0_val = {in0}.get(idx_{clean_id});\n\
      \    float in1_val = {in1}.get(idx_{clean_id});\n    {clean_id}.data[i] = {scalar_expr};\n\
      \    /* update index */\n    for(int d = {rank}-1; d >= 0; --d) {{\n       \
      \ idx_{clean_id}[d]++;\n        if (idx_{clean_id}[d] < {clean_id}.shape[d])\
      \ break;\n        idx_{clean_id}[d] = 0;\n    }}\n}}\n"
  matmul:
    body: "NDArrayView<float> {clean_id}({out_shape_str});\n#ifdef USE_BLAS\ncblas_sgemm(CblasRowMajor,\
      \ CblasNoTrans, CblasNoTrans, {M}, {N}, {K}, 1.0f, {in0}.data.data(), {K}, {in1}.data.data(),\
      \ {N}, 0.0f, {clean_id}.data.data(), {N});\n#else\nfor (size_t i = 0; i < {M};\
      \ ++i) {{\n    for (size_t j = 0; j < {N}; ++j) {{\n        float sum = 0.0f;\n\
      \        #pragma omp simd reduction(+:sum)\n        for (size_t k = 0; k < {K};\
      \ ++k) {{\n            sum += {in0}.data[i * {K} + k] * {in1}.data[k * {N} +\
      \ j];\n        }}\n        {clean_id}.data[i * {N} + j] = sum;\n    }}\n}}\n\
      #endif\n"
  reduction:
    body: "NDArrayView<float> {clean_id}({out_shape_str});\nif ({in0}.size() > 0)\
      \ {{\n    float res = {init_val}f;\n    #pragma omp simd\n    for(size_t i=0;\
      \ i<{in0}.size(); ++i) {{\n        float val = {in0}.data[i];\n        res =\
      \ {scalar_expr};\n    }}\n    {clean_id}.data[0] = {final_combine};\n}}\n"
  fallback_copy:
    body: "NDArrayView<float> {clean_id}({out_shape_str});\n#pragma omp simd\nfor(size_t\
      \ i=0; i<{clean_id}.size(); ++i) {{\n    {clean_id}.data[i] = {in0}.data[i];\n\
      }}\n"
  conv2d:
    body: "NDArrayView<float> {clean_id}({out_shape_str});\nint out_idx = 0;\nfor\
      \ (int b = 0; b < {B}; ++b) {{\n    for (int oc = 0; oc < {out_channels}; ++oc)\
      \ {{\n        for (int oy = 0; oy < {out_height}; ++oy) {{\n            for\
      \ (int ox = 0; ox < {out_width}; ++ox) {{\n                float sum = 0.0f;\n\
      \                for (int ic = 0; ic < {in_channels}; ++ic) {{\n           \
      \         for (int fy = 0; fy < {filter_h}; ++fy) {{\n                     \
      \   #pragma omp simd reduction(+:sum)\n                        for (int fx =\
      \ 0; fx < {filter_w}; ++fx) {{\n                            int in_y = oy *\
      \ {stride_h} + fy;\n                            int in_x = ox * {stride_w} +\
      \ fx;\n                            int in_idx = ((b * {in_channels} + ic) *\
      \ {in_height} + in_y) * {in_width} + in_x;\n                            int\
      \ w_idx = ((oc * {in_channels} + ic) * {filter_h} + fy) * {filter_w} + fx;\n\
      \                            sum += {in0}.data[in_idx] * {in1}.data[w_idx];\n\
      \                        }}\n                    }}\n                }}\n  \
      \              {clean_id}.data[out_idx++] = sum;\n            }}\n        }}\n\
      \    }}\n}}\n"
  scan:
    body: "NDArrayView<float> {clean_id}({out_shape_str});\nif ({in0}.size() > 0)\
      \ {{\n    float acc = 0.0f;\n    for(size_t i=0; i<{in0}.size(); ++i) {{\n \
      \       acc = acc + {in0}.data[i];\n        {clean_id}.data[i] = acc;\n    }}\n\
      }}\n"
  attention:
    body: "NDArrayView<float> {clean_id}({out_shape_str});\n#pragma omp simd\nfor(size_t\
      \ i=0; i<{clean_id}.size(); ++i) {{\n    {clean_id}.data[i] = 0.0f;\n}}\n"
  input:
    body: NDArrayView<float> {clean_id}({out_shape_str}{offset_str}); // Input
  constant:
    body: 'NDArrayView<float> {clean_id}({out_shape_str});

      for(size_t i=0; i<{clean_id}.size(); ++i) {{ {clean_id}.data[i] = {val}; }}

      '
  output:
    body: // Output {in0}
  unimplemented_fallback:
    body: "NDArrayView<float> {clean_id}({out_shape_str}); // Fallback Unimplemented {op}\nfor(size_t i=0; i<{clean_id}.size(); ++i) {{ {clean_id}.data[i] = 0.0f; }}\n"
  ternary:
    body: "NDArrayView<float> {clean_id}({out_shape_str});\nstd::vector<int> idx_{clean_id}({rank},\
      \ 0);\nfor(size_t i=0; i<{clean_id}.size(); ++i) {{\n    float in0_val = {in0}.get(idx_{clean_id});\n\
      \    float in1_val = {in1}.get(idx_{clean_id});\n    float in2_val = {in2}.get(idx_{clean_id});\n\
      \    {clean_id}.data[i] = {scalar_expr};\n    for(int d = {rank}-1; d >= 0;\
      \ --d) {{\n        idx_{clean_id}[d]++;\n        if (idx_{clean_id}[d] < {clean_id}.shape[d])\
      \ break;\n        idx_{clean_id}[d] = 0;\n    }}\n}}\n"
  maxpool2d:
    body: "NDArrayView<float> {clean_id}({out_shape_str});\nint out_idx = 0;\nfor\
      \ (int b = 0; b < {B}; ++b) {{\n    for (int oc = 0; oc < {channels}; ++oc)\
      \ {{\n        for (int oy = 0; oy < {out_height}; ++oy) {{\n            for\
      \ (int ox = 0; ox < {out_width}; ++ox) {{\n                float max_val = -1e38f;\n\
      \                #pragma omp simd reduction(max:max_val)\n                for\
      \ (int fy = 0; fy < {filter_h}; ++fy) {{\n                    for (int fx =\
      \ 0; fx < {filter_w}; ++fx) {{\n                        int in_y = oy * {stride_h}\
      \ + fy;\n                        int in_x = ox * {stride_w} + fx;\n        \
      \                if (in_y < {in_height} && in_x < {in_width}) {{\n         \
      \                   int in_idx = ((b * {channels} + oc) * {in_height} + in_y)\
      \ * {in_width} + in_x;\n                            max_val = std::max(max_val,\
      \ {in0}.data[in_idx]);\n                        }}\n                    }}\n\
      \                }}\n                {clean_id}.data[out_idx++] = max_val;\n\
      \            }}\n        }}\n    }}\n}}\n"
  avgpool2d:
    body: "NDArrayView<float> {clean_id}({out_shape_str});\nint out_idx = 0;\nfor\
      \ (int b = 0; b < {B}; ++b) {{\n    for (int oc = 0; oc < {channels}; ++oc)\
      \ {{\n        for (int oy = 0; oy < {out_height}; ++oy) {{\n            for\
      \ (int ox = 0; ox < {out_width}; ++ox) {{\n                float sum_val = 0.0f;\n\
      \                int count = 0;\n                for (int fy = 0; fy < {filter_h};\
      \ ++fy) {{\n                    for (int fx = 0; fx < {filter_w}; ++fx) {{\n\
      \                        int in_y = oy * {stride_h} + fy;\n                \
      \        int in_x = ox * {stride_w} + fx;\n                        if (in_y\
      \ < {in_height} && in_x < {in_width}) {{\n                            int in_idx\
      \ = ((b * {channels} + oc) * {in_height} + in_y) * {in_width} + in_x;\n    \
      \                        sum_val += {in0}.data[in_idx];\n                  \
      \          count++;\n                        }}\n                    }}\n  \
      \              }}\n                {clean_id}.data[out_idx++] = (count > 0)\
      \ ? (sum_val / count) : 0.0f;\n            }}\n        }}\n    }}\n}}\n"
  batchnorm:
    body: "NDArrayView<float> {clean_id}({out_shape_str});\n#pragma omp simd\nfor(size_t\
      \ i=0; i<{clean_id}.size(); ++i) {{\n    {clean_id}.data[i] = ({in0}.data[i]\
      \ - {mean}.data[i % {channels}]) / std::sqrt({var}.data[i % {channels}] + 1e-5f)\
      \ * {gamma}.data[i % {channels}] + {beta}.data[i % {channels}];\n}}\n"
  layernorm:
    body: "NDArrayView<float> {clean_id}({out_shape_str});\nint rows = {clean_id}.size()\
      \ / {D};\nfor (int r = 0; r < rows; ++r) {{\n    float mean = 0.0f;\n    #pragma\
      \ omp simd reduction(+:mean)\n    for (int j = 0; j < {D}; ++j) {{ mean += {in0}.data[r\
      \ * {D} + j]; }}\n    mean /= {D};\n    float var = 0.0f;\n    #pragma omp simd\
      \ reduction(+:var)\n    for (int j = 0; j < {D}; ++j) {{\n        float diff\
      \ = {in0}.data[r * {D} + j] - mean;\n        var += diff * diff;\n    }}\n \
      \   var /= {D};\n    float inv_std = 1.0f / std::sqrt(var + 1e-5f);\n    #pragma\
      \ omp simd\n    for (int j = 0; j < {D}; ++j) {{\n        {clean_id}.data[r\
      \ * {D} + j] = ({in0}.data[r * {D} + j] - mean) * inv_std;\n    }}\n}}\n"
  softmax:
    body: "NDArrayView<float> {clean_id}({out_shape_str});\nint rows = {clean_id}.size()\
      \ / {D};\nfor (int r = 0; r < rows; ++r) {{\n    float max_val = -1e38f;\n \
      \   #pragma omp simd reduction(max:max_val)\n    for (int j = 0; j < {D}; ++j)\
      \ {{ max_val = std::max(max_val, {in0}.data[r * {D} + j]); }}\n    float sum_exp\
      \ = 0.0f;\n    #pragma omp simd reduction(+:sum_exp)\n    for (int j = 0; j\
      \ < {D}; ++j) {{ sum_exp += std::exp({in0}.data[r * {D} + j] - max_val); }}\n\
      \    float inv_sum = 1.0f / sum_exp;\n    #pragma omp simd\n    for (int j =\
      \ 0; j < {D}; ++j) {{\n        {clean_id}.data[r * {D} + j] = std::exp({in0}.data[r\
      \ * {D} + j] - max_val) * inv_sum;\n    }}\n}}\n"
  warp_shuffle_reduce:
    body: "NDArrayView<float> {clean_id}({out_shape_str});\nfloat total_sum = 0.0f;\n\
      #pragma omp parallel for reduction(+:total_sum)\nfor (size_t i = 0; i < {in0}.size();\
      \ ++i) {{\n    total_sum += {in0}.data[i];\n}}\n{clean_id}.data[0] = total_sum;\n"
  shared_memory_tree_reduce:
    body: "NDArrayView<float> {clean_id}({out_shape_str});\nfloat tree_sum = 0.0f;\n\
      #pragma omp simd reduction(+:tree_sum)\nfor (size_t i = 0; i < {in0}.size();\
      \ ++i) {{\n    tree_sum += {in0}.data[i];\n}}\n{clean_id}.data[0] = tree_sum;\n"
  tiled_matmul_2d:
    body: "NDArrayView<float> {clean_id}({out_shape_str});\nconst size_t TILE = 32;\n\
      #pragma omp parallel for collapse(2)\nfor (size_t i = 0; i < {M}; i += TILE)\
      \ {{\n    for (size_t j = 0; j < {N}; j += TILE) {{\n        for (size_t k =\
      \ 0; k < {K}; k += TILE) {{\n            for (size_t ii = i; ii < std::min(i\
      \ + TILE, (size_t){M}); ++ii) {{\n                for (size_t jj = j; jj < std::min(j\
      \ + TILE, (size_t){N}); ++jj) {{\n                    float acc = (k == 0) ?\
      \ 0.0f : {clean_id}.data[ii * {N} + jj];\n                    #pragma omp simd\
      \ reduction(+:acc)\n                    for (size_t kk = k; kk < std::min(k\
      \ + TILE, (size_t){K}); ++kk) {{\n                        acc += {in0}.data[ii\
      \ * {K} + kk] * {in1}.data[kk * {N} + jj];\n                    }}\n       \
      \             {clean_id}.data[ii * {N} + jj] = acc;\n                }}\n  \
      \          }}\n        }}\n    }}\n}}\n"
  conv2d_shared_halo:
    body: "NDArrayView<float> {clean_id}({out_shape_str});\n#pragma omp parallel for\
      \ collapse(2)\nfor (int b = 0; b < {B}; ++b) {{\n    for (int oc = 0; oc < {out_channels};\
      \ ++oc) {{\n        for (int oy = 0; oy < {out_height}; ++oy) {{\n         \
      \   for (int ox = 0; ox < {out_width}; ++ox) {{\n                float sum =\
      \ 0.0f;\n                for (int ic = 0; ic < {in_channels}; ++ic) {{\n   \
      \                 for (int fy = 0; fy < {filter_h}; ++fy) {{\n             \
      \           #pragma omp simd reduction(+:sum)\n                        for (int\
      \ fx = 0; fx < {filter_w}; ++fx) {{\n                            int in_y =\
      \ oy * {stride_h} + fy;\n                            int in_x = ox * {stride_w}\
      \ + fx;\n                            int in_idx = ((b * {in_channels} + ic)\
      \ * {in_height} + in_y) * {in_width} + in_x;\n                            int\
      \ w_idx = ((oc * {in_channels} + ic) * {filter_h} + fy) * {filter_w} + fx;\n\
      \                            sum += {in0}.data[in_idx] * {in1}.data[w_idx];\n\
      \                        }}\n                    }}\n                }}\n  \
      \              int out_idx = ((b * {out_channels} + oc) * {out_height} + oy)\
      \ * {out_width} + ox;\n                {clean_id}.data[out_idx] = sum;\n   \
      \         }}\n        }}\n    }}\n}}\n"
  maxpool2d_dynamic:
    body: "NDArrayView<float> {clean_id}({out_shape_str});\n#pragma omp parallel for\
      \ collapse(2)\nfor (int b = 0; b < {B}; ++b) {{\n    for (int oc = 0; oc < {channels};\
      \ ++oc) {{\n        for (int oy = 0; oy < {out_height}; ++oy) {{\n         \
      \   for (int ox = 0; ox < {out_width}; ++ox) {{\n                float max_val\
      \ = -1e38f;\n                for (int fy = 0; fy < {filter_h}; ++fy) {{\n  \
      \                  #pragma omp simd reduction(max:max_val)\n               \
      \     for (int fx = 0; fx < {filter_w}; ++fx) {{\n                        int\
      \ in_y = oy * {stride_h} + fy * {dilation_h} - {pad_h};\n                  \
      \      int in_x = ox * {stride_w} + fx * {dilation_w} - {pad_w};\n         \
      \               if (in_y >= 0 && in_y < {in_height} && in_x >= 0 && in_x < {in_width})\
      \ {{\n                            int in_idx = ((b * {channels} + oc) * {in_height}\
      \ + in_y) * {in_width} + in_x;\n                            max_val = std::max(max_val,\
      \ {in0}.data[in_idx]);\n                        }}\n                    }}\n\
      \                }}\n                int out_idx = ((b * {channels} + oc) *\
      \ {out_height} + oy) * {out_width} + ox;\n                {clean_id}.data[out_idx]\
      \ = max_val;\n            }}\n        }}\n    }}\n}}\n"
  avgpool2d_dynamic:
    body: "NDArrayView<float> {clean_id}({out_shape_str});\n#pragma omp parallel for\
      \ collapse(2)\nfor (int b = 0; b < {B}; ++b) {{\n    for (int oc = 0; oc < {channels};\
      \ ++oc) {{\n        for (int oy = 0; oy < {out_height}; ++oy) {{\n         \
      \   for (int ox = 0; ox < {out_width}; ++ox) {{\n                float sum_val\
      \ = 0.0f;\n                int count = 0;\n                for (int fy = 0;\
      \ fy < {filter_h}; ++fy) {{\n                    for (int fx = 0; fx < {filter_w};\
      \ ++fx) {{\n                        int in_y = oy * {stride_h} + fy * {dilation_h}\
      \ - {pad_h};\n                        int in_x = ox * {stride_w} + fx * {dilation_w}\
      \ - {pad_w};\n                        if (in_y >= 0 && in_y < {in_height} &&\
      \ in_x >= 0 && in_x < {in_width}) {{\n                            int in_idx\
      \ = ((b * {channels} + oc) * {in_height} + in_y) * {in_width} + in_x;\n    \
      \                        sum_val += {in0}.data[in_idx];\n                  \
      \          count++;\n                        }}\n                    }}\n  \
      \              }}\n                int out_idx = ((b * {channels} + oc) * {out_height}\
      \ + oy) * {out_width} + ox;\n                {clean_id}.data[out_idx] = (count\
      \ > 0) ? (sum_val / count) : 0.0f;\n            }}\n        }}\n    }}\n}}\n"
operations:
  sin:
    template: unary
    scalar_expr: std::sin(in0_val)
  cos:
    template: unary
    scalar_expr: std::cos(in0_val)
  tan:
    template: unary
    scalar_expr: std::tan(in0_val)
  sinh:
    template: unary
    scalar_expr: std::sinh(in0_val)
  cosh:
    template: unary
    scalar_expr: std::cosh(in0_val)
  tanh:
    template: unary
    scalar_expr: std::tanh(in0_val)
  asin:
    template: unary
    scalar_expr: std::asin(in0_val)
  acos:
    template: unary
    scalar_expr: std::acos(in0_val)
  atan:
    template: unary
    scalar_expr: std::atan(in0_val)
  exp:
