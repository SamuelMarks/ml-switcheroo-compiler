    scalar_expr: std::max(0.0f, in0_val)
  sigmoid:
    template: unary
    scalar_expr: 1.0f / (1.0f + std::exp(-in0_val))
  add:
    template: binary
    scalar_expr: in0_val + in1_val
  mul:
    template: binary
    scalar_expr: in0_val * in1_val
  div:
    template: binary
    scalar_expr: in0_val / in1_val
  sub:
    template: binary
