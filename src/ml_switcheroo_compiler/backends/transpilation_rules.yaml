import_remappings:
  jax:
    torch: "jax"
    torch.nn: "flax.linen"
    torch.nn.functional: "jax.nn"
    numpy: "jax.numpy"
  pytorch:
    jax: "torch"
    jax.numpy: "torch"
    flax.linen: "torch.nn"
    jax.nn: "torch.nn.functional"
    numpy: "torch"
  mlx:
    torch: "mlx.core"
    torch.nn: "mlx.nn"
    numpy: "mlx.core"
  keras:
    torch: "keras.ops"
    torch.nn: "keras.layers"
    numpy: "keras.ops"
  numpy:
    torch: "numpy"
    jax.numpy: "numpy"
    mlx.core: "numpy"

frameworks:
  jax:
    target_module: jax
    module_path:
    - jax
    - numpy
    kwarg_map:
      dim: axis
      keepdim: keepdims
    class_bases:
      nn.Module:
      - flax
      - linen
      - Module
    method_map:
      forward: __call__
    broadcast_method: broadcast_to
  mlx:
    target_module: mlx.core
    module_path:
    - mlx
    - core
    kwarg_map:
      dim: axis
      keepdim: keepdims
    class_bases: {}
    method_map: {}
    broadcast_method: broadcast_to
  pytorch:
    target_module: torch
    module_path:
    - torch
    kwarg_map:
      axis: dim
      keepdims: keepdim
    class_bases:
      flax.linen.Module:
      - nn
      - Module
    method_map:
      __call__: forward
    broadcast_method: expand
  keras:
    target_module: keras
    module_path:
    - keras
    - ops
    kwarg_map:
      dim: axis
      keepdim: keepdims
    class_bases:
      Model:
      - keras
      - Model
    method_map:
      compute: call
      forward: call
      call: call
    broadcast_method: broadcast_to
  dask:
    target_module: dask.array
    module_path:
    - dask
    - array
    kwarg_map: {}
    class_bases: {}
    method_map: {}
    broadcast_method: broadcast_to
  cupy:
    target_module: cupy
    module_path:
    - cupy
    kwarg_map: {}
    class_bases: {}
    method_map: {}
    broadcast_method: broadcast_to
  numpy:
    target_module: numpy
    module_path:
    - numpy
    kwarg_map:
      dim: axis
      keepdim: keepdims
    class_bases: {}
    method_map: {}
    broadcast_method: broadcast_to
syntactic_patterns:
  state_lifting_patterns:
  - module_class: nn.Linear
    param_names:
    - weight
    - bias
    functional_op: Linear
    init_mapping:
      weight: init_linear_weight
      bias: init_linear_bias
  - module_class: nn.Conv2d
    param_names:
    - weight
    - bias
    functional_op: Conv2D
    init_mapping:
      weight: init_conv_weight
      bias: init_conv_bias
  - module_class: nn.LayerNorm
    param_names:
    - weight
    - bias
    functional_op: LayerNorm
    init_mapping:
      weight: init_ones
      bias: init_zeros
  - module_class: nn.BatchNorm2d
    param_names:
    - weight
    - bias
    - running_mean
    - running_var
    functional_op: BatchNorm
    init_mapping:
      weight: init_ones
      bias: init_zeros
  - module_class: nn.Embedding
    param_names:
    - weight
    functional_op: Embedding
    init_mapping:
      weight: init_embedding_weight
  - module_class: nn.Dropout
    param_names: []
    functional_op: Dropout
    init_mapping: {}
  - module_class: nn.GroupNorm
    param_names:
    - weight
    - bias
    functional_op: GroupNorm
    init_mapping:
      weight: init_ones
      bias: init_zeros
  - module_class: nn.RMSNorm
    param_names:
    - weight
    functional_op: RMSNorm
    init_mapping:
      weight: init_ones
  - module_class: nn.MultiheadAttention
    param_names:
    - in_proj_weight
    - in_proj_bias
    - out_proj.weight
    - out_proj.bias
    functional_op: MultiheadAttention
    init_mapping:
      in_proj_weight: init_attention_weight
      in_proj_bias: init_attention_bias
      out_proj.weight: init_attention_weight
      out_proj.bias: init_attention_bias
  tensor_creation_rewrites:
  - pattern: torch.tensor
    replacement: jnp.array
    source_framework: pytorch
    target_framework: jax
  - pattern: torch.zeros
    replacement: jnp.zeros
    source_framework: pytorch
    target_framework: jax
  - pattern: torch.ones
    replacement: jnp.ones
    source_framework: pytorch
    target_framework: jax
  - pattern: torch.arange
    replacement: jnp.arange
    source_framework: pytorch
    target_framework: jax
  - pattern: torch.randn
    replacement: jax.random.normal
    source_framework: pytorch
    target_framework: jax
  slicing_rewrites:
  - pattern: narrow
    replacement: slice
    description: Rewrite tensor.narrow into explicit slicing
  - pattern: select
    replacement: take
    description: Rewrite tensor.select into indexed selection
  method_to_function_rewrites:
  - pattern: view
    replacement: reshape
    description: Convert PyTorch tensor.view() into tensor.reshape()
  - pattern: permute
    replacement: transpose
    description: Convert tensor.permute() into tensor.transpose()
  - pattern: contiguous
    replacement: identity
    description: Convert tensor.contiguous() into identity passthrough
