# Declarative whitelist of valid built-in symbols, operators, and primitive methods
version: "1.0.0"

symbols:
  - "add"
  - "sub"
  - "mul"
  - "div"
  - "truediv"
  - "floordiv"
  - "mod"
  - "pow"
  - "and"
  - "or"
  - "xor"
  - "invert"
  - "lshift"
  - "rshift"
  - "abs"
  - "pos"
  - "neg"
  - "round"
  - "trunc"
  - "floor"
  - "ceil"
  - "getattr"
  - "type"
  - "tuple"
  - "list"
  - "dict"
  - "set"
  - "bool"
  - "int"
  - "float"
  - "str"
  - "slice"
  - "print"
  - "len"
  - "range"
  - "enumerate"
  - "zip"
  - "map"
  - "filter"
  - "isinstance"
  - "issubclass"
  - "sum"
  - "min"
  - "max"
  - "any"
  - "all"
  - "eq"
  - "ne"
  - "lt"
  - "le"
  - "gt"
  - "ge"
  - "not"
  - "contains"
  - "in"
  - "is"
  - "is_not"
  - "not_in"
  - "__setitem__"
  - "__getitem__"
  - "shape"
  - "dtype"
  - "ndim"
  - "size"
  - "get"
  - "hasattr"
  - "callable"
  - "lower"
  - "upper"
  - "split"
  - "startswith"
