  - "join"
  - "items"
  - "keys"
  - "values"
  - "format"
  - "append"
  - "pop"
  - "update"
  - "item"
  - "astype"
  - "reshape"
  - "transpose"
  - "swapaxes"
  - "squeeze"
  - "unsqueeze"
  - "flatten"
  - "view"
  - "permute"
  - "contiguous"
