  Relu:
    target_api: custom_op
    custom_code: "lambda x: backend_module.maximum(x, 0)"
  Sigmoid:
    target_api: custom_op
    custom_code: "lambda x: 1 / (1 + backend_module.exp(-x))"
  Silu:
    target_api: custom_op
    custom_code: "lambda x: x / (1 + backend_module.exp(-x))"
  SiLU:
    target_api: custom_op
    custom_code: "lambda x: x / (1 + backend_module.exp(-x))"
  GELU:
    target_api: custom_op
    custom_code: "lambda x: 0.5 * x * (1.0 + backend_module.tanh(0.7978845608 * (x + 0.044715 * (x**3))))"
  Gelu:
    target_api: custom_op
    custom_code: "lambda x: 0.5 * x * (1.0 + backend_module.tanh(0.7978845608 * (x + 0.044715 * (x**3))))"
  ELU:
    target_api: custom_op
    custom_code: "lambda x, alpha=1.0, **kw: backend_module.where(x > 0, x, alpha * (backend_module.exp(x) - 1.0))"
  Elu:
    target_api: custom_op
    custom_code: "lambda x, alpha=1.0, **kw: backend_module.where(x > 0, x, alpha * (backend_module.exp(x) - 1.0))"
  LeakyReLU:
    target_api: custom_op
    custom_code: "lambda x, negative_slope=0.01, **kw: backend_module.where(x > 0, x, negative_slope * x)"
  LeakyRelu:
    target_api: custom_op
    custom_code: "lambda x, negative_slope=0.01, **kw: backend_module.where(x > 0, x, negative_slope * x)"
  Softplus:
    target_api: custom_op
    custom_code: "lambda x, **kw: backend_module.log(1.0 + backend_module.exp(x))"
  Softmax:
    target_api: custom_op
    custom_code: "lambda x, axis=-1, **kw: backend_module.exp(x - backend_module.max(x, axis=axis, keepdims=True)) / backend_module.sum(backend_module.exp(x - backend_module.max(x, axis=axis, keepdims=True)), axis=axis, keepdims=True)"
  LogSoftmax:
    target_api: custom_op
    custom_code: "lambda x, axis=-1, **kw: (x - backend_module.max(x, axis=axis, keepdims=True)) - backend_module.log(backend_module.sum(backend_module.exp(x - backend_module.max(x, axis=axis, keepdims=True)), axis=axis, keepdims=True))"
  MatMul:
    target_api: cupy.matmul
  BatchMatMul:
    target_api: cupy.matmul
  BatchMatmul:
    target_api: cupy.matmul
  Einsum:
    target_api: cupy.einsum
  SVD:
    target_api: cupy.linalg.svd
  QR:
    target_api: cupy.linalg.qr
  Cholesky:
    target_api: cupy.linalg.cholesky
  Solve:
    target_api: cupy.linalg.solve
  Det:
    target_api: cupy.linalg.det
  Norm:
    target_api: cupy.linalg.norm
    kwarg_translations:
      dim: axis
      keepdim: keepdims
  L2Normalize:
    target_api: custom_op
    custom_code: "lambda x, axis=-1, **kw: x / backend_module.linalg.norm(x, axis=axis, keepdims=True)"
  ReduceSum:
    target_api: cupy.sum
    kwarg_translations:
