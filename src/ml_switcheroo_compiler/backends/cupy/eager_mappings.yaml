  ReduceAny:
    target_api: cupy.any
    kwarg_translations:
      dim: axis
      keepdim: keepdims
  ReduceL2:
    target_api: custom_op
    custom_code: "lambda x, axis=None, keepdims=False, **kw: backend_module.linalg.norm(x, ord=2, axis=axis, keepdims=keepdims)"
  CumSum:
    target_api: cupy.cumsum
    kwarg_translations:
      dim: axis
  CumProd:
    target_api: cupy.cumprod
    kwarg_translations:
      dim: axis
  ArgMax:
    target_api: cupy.argmax
    kwarg_translations:
      dim: axis
  ArgMin:
    target_api: cupy.argmin
    kwarg_translations:
      dim: axis
  LayerNorm:
    target_api: custom_op
    custom_code: "lambda x, g=1.0, b=0.0, **kw: ((x - backend_module.mean(x, axis=-1, keepdims=True)) / backend_module.sqrt(backend_module.var(x, axis=-1, keepdims=True) + 1e-5)) * g + b"
  BatchNorm:
    target_api: custom_op
    custom_code: "lambda x, m=0.0, v=1.0, g=1.0, b=0.0, **kw: ((x - m) / backend_module.sqrt(v + 1e-5)) * g + b"
  RMSNorm:
    target_api: custom_op
    custom_code: "lambda x, g=1.0, **kw: (x / backend_module.sqrt(backend_module.mean(x**2, axis=-1, keepdims=True) + 1e-5)) * g"
  MultiheadAttention:
    target_api: custom_op
    custom_code: "lambda q, k, v, **kw: backend_module.matmul(backend_module.softmax(backend_module.matmul(q, backend_module.transpose(k, (0, 1, 3, 2) if k.ndim == 4 else (0, 2, 1))) / backend_module.sqrt(float(q.shape[-1]))), v)"
  Conv2D:
    target_api: custom_op
    custom_code: "lambda x, w, **kw: backend_module.conv2d(x, w, **kw)"
  DepthwiseConv2D:
    target_api: custom_op
    custom_code: "lambda x, w, **kw: x"
  MaxPool2D:
    target_api: custom_op
    custom_code: "lambda x, **kw: backend_module.maxpool2d(x, **kw)"
  AvgPool2D:
    target_api: custom_op
    custom_code: "lambda x, **kw: backend_module.avgpool2d(x, **kw)"
  ResizeBilinear:
    target_api: custom_op
    custom_code: "lambda x, size=None, **kw: backend_module.resize_bilinear(x, size=size, **kw)"
  Eig:
    target_api: cupy.linalg.eig
  Eigh:
    target_api: cupy.linalg.eigh
  MSELoss:
    target_api: custom_op
    custom_code: "lambda p, t, **kw: backend_module.mean((p - t)**2)"
  CrossEntropyLoss:
    target_api: custom_op
    custom_code: "lambda p, t, **kw: -backend_module.mean(backend_module.sum(t * backend_module.log(p + 1e-12), axis=-1))"
  BCELoss:
    target_api: custom_op
    custom_code: "lambda p, t, **kw: -backend_module.mean(t * backend_module.log(p + 1e-12) + (1.0 - t) * backend_module.log(1.0 - p + 1e-12))"
  HuberLoss:
    target_api: custom_op
    custom_code: "lambda p, t, delta=1.0, **kw: backend_module.mean(backend_module.where(backend_module.abs(p - t) < delta, 0.5 * ((p - t)**2), delta * (backend_module.abs(p - t) - 0.5 * delta)))"
  KLDivergenceLoss:
    target_api: custom_op
    custom_code: "lambda p, t, **kw: backend_module.mean(backend_module.sum(t * (backend_module.log(t + 1e-12) - backend_module.log(p + 1e-12)), axis=-1))"
