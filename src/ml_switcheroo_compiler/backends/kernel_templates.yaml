    opcode: "GroupNorm"
    workgroup_dims: [256, 1, 1]
    thread_indexing_formula: "int ng = blockIdx.x;"
    memory_layout_requirements: ["contiguous"]
    body: "/* Group normalization across channel groups */"
    cuda_body: "__global__ void groupnorm_kernel(const float* X, const float* gamma, const float* beta, float* Y, int N, int G, int C_per_G, int spatial, float eps) { int ng = blockIdx.x; if (ng < N * G) { int group_size = C_per_G * spatial; int base = ng * group_size; float mean = 0.0f; for (int i = 0; i < group_size; ++i) mean += X[base + i]; mean /= (float)group_size; float var = 0.0f; for (int i = 0; i < group_size; ++i) { float d = X[base + i] - mean; var += d * d; } var /= (float)group_size; float inv_std = rsqrtf(var + eps); for (int i = 0; i < group_size; ++i) { int c = (ng % G) * C_per_G + (i / spatial); float g = gamma ? gamma[c] : 1.0f; float b = beta ? beta[c] : 0.0f; Y[base + i] = g * (X[base + i] - mean) * inv_std + b; } } }"
