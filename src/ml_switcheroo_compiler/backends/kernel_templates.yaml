    metal_body: "kernel void sub_kernel(device const float* in0 [[buffer(0)]], device const float* in1 [[buffer(1)]], device float* out [[buffer(2)]], uint idx [[thread_position_in_grid]]) { out[idx] = in0[idx] - in1[idx]; }"
