    thread_indexing_formula: "int idx = blockIdx.x * blockDim.x + threadIdx.x;"
    memory_layout_requirements: ["contiguous", "nchw"]
    body: "/* Global 2D average pooling over spatial dimensions H x W */"
    cuda_body: "__global__ void globalavgpool2d_kernel(const float* X, float* Y, int N, int C, int H, int W) { int idx = blockIdx.x * blockDim.x + threadIdx.x; if (idx < N * C) { int b = idx / C; int c = idx % C; float sum = 0.0f; int hw = H * W; int base = (b * C + c) * hw; for (int i = 0; i < hw; ++i) { sum += X[base + i]; } Y[idx] = sum / (float)hw; } }"
