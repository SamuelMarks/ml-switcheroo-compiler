    workgroup_dims: [256, 1, 1]
    thread_indexing_formula: "int idx = blockIdx.x * blockDim.x + threadIdx.x;"
    memory_layout_requirements: ["contiguous", "nchw"]
    body: "/* Batch normalization across channels */"
    cuda_body: "__global__ void batchnorm_kernel(const float* X, const float* mean, const float* var, const float* gamma, const float* beta, float* Y, int N, int C, int spatial, float eps) { int idx = blockIdx.x * blockDim.x + threadIdx.x; int total = N * C * spatial; if (idx < total) { int c = (idx / spatial) % C; float m = mean[c]; float v = var[c]; float g = gamma ? gamma[c] : 1.0f; float b = beta ? beta[c] : 0.0f; Y[idx] = g * (X[idx] - m) * rsqrtf(v + eps) + b; } }"
    rocm_body: "__global__ void batchnorm_kernel(const float* X, const float* mean, const float* var, const float* gamma, const float* beta, float* Y, int N, int C, int spatial, float eps) { int idx = hipBlockIdx_x * hipBlockDim_x + hipThreadIdx_x; int total = N * C * spatial; if (idx < total) { int c = (idx / spatial) % C; float m = mean[c]; float v = var[c]; float g = gamma ? gamma[c] : 1.0f; float b = beta ? beta[c] : 0.0f; Y[idx] = g * (X[idx] - m) * rsqrtf(v + eps) + b; } }"
    metal_body: "kernel void batchnorm_kernel(device const float* X [[buffer(0)]], device const float* mean [[buffer(1)]], device const float* var [[buffer(2)]], device const float* gamma [[buffer(3)]], device const float* beta [[buffer(4)]], device float* Y [[buffer(5)]], constant uint4& dims [[buffer(6)]], uint idx [[thread_position_in_grid]]) { uint total = dims.x * dims.y * dims.z; if (idx < total) { uint c = (idx / dims.z) % dims.y; float m = mean[c]; float v = var[c]; float g = gamma[c]; float b = beta[c]; Y[idx] = g * (X[idx] - m) * rsqrt(v + 1e-5f) + b; } }"
    parameters:
      - name: "X"
        param_type: "pointer"
        source: "input"
        source_index: 0
      - name: "mean"
        param_type: "pointer"
        source: "input"
        source_index: 1
      - name: "var"
        param_type: "pointer"
        source: "input"
        source_index: 2
      - name: "gamma"
        param_type: "pointer"
        source: "input"
        source_index: 3
      - name: "beta"
        param_type: "pointer"
        source: "input"
        source_index: 4
      - name: "Y"
        param_type: "pointer"
        source: "output"
