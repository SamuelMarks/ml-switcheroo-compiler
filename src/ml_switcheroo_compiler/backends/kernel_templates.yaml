    workgroup_dims: [256, 1, 1]
    thread_indexing_formula: "int row = blockIdx.x;"
    memory_layout_requirements: ["contiguous", "row-major"]
    body: "/* Root Mean Square normalization */"
    cuda_body: "__global__ void rmsnorm_kernel(const float* X, const float* gamma, float* Y, int rows, int cols, float eps) { int row = blockIdx.x; if (row < rows) { float sum_sq = 0.0f; for (int i = 0; i < cols; ++i) { float x = X[row * cols + i]; sum_sq += x * x; } float rms = rsqrtf(sum_sq / (float)cols + eps); for (int i = 0; i < cols; ++i) { float g = gamma ? gamma[i] : 1.0f; Y[row * cols + i] = g * X[row * cols + i] * rms; } } }"
