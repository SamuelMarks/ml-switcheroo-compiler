  MaxPool3D:
    opcode: "MaxPool3D"
    workgroup_dims: [16, 16, 1]
    thread_indexing_formula: "int b = blockIdx.z; int c = blockIdx.y; int dhw = blockIdx.x * blockDim.x + threadIdx.x;"
    memory_layout_requirements: ["contiguous"]
    body: "/* 3D max pooling */"
    cuda_body: "__global__ void maxpool3d_kernel(const float* X, float* Y, int N, int C, int D, int H, int W, int KD, int KH, int KW, int D_out, int H_out, int W_out) { int b = blockIdx.z; int c = blockIdx.y; int dhw = blockIdx.x * blockDim.x + threadIdx.x; if (b < N && c < C && dhw < D_out * H_out * W_out) { int od = dhw / (H_out * W_out); int rem = dhw % (H_out * W_out); int oh = rem / W_out; int ow = rem % W_out; float max_val = -1e38f; for (int kd = 0; kd < KD; ++kd) { for (int kh = 0; kh < KH; ++kh) { for (int kw = 0; kw < KW; ++kw) { int id = od + kd; int ih = oh + kh; int iw = ow + kw; if (id < D && ih < H && iw < W) { float val = X[(((b * C + c) * D + id) * H + ih) * W + iw]; if (val > max_val) max_val = val; } } } } Y[(((b * C + c) * D_out + od) * H_out + oh) * W_out + ow] = max_val; } }"
    rocm_body: "__global__ void maxpool3d_kernel(const float* X, float* Y, int N, int C, int D, int H, int W, int KD, int KH, int KW, int D_out, int H_out, int W_out) { int b = hipBlockIdx_z; int c = hipBlockIdx_y; int dhw = hipBlockIdx_x * hipBlockDim_x + hipThreadIdx_x; if (b < N && c < C && dhw < D_out * H_out * W_out) { int od = dhw / (H_out * W_out); int rem = dhw % (H_out * W_out); int oh = rem / W_out; int ow = rem % W_out; float max_val = -1e38f; for (int kd = 0; kd < KD; ++kd) { for (int kh = 0; kh < KH; ++kh) { for (int kw = 0; kw < KW; ++kw) { int id = od + kd; int ih = oh + kh; int iw = ow + kw; if (id < D && ih < H && iw < W) { float val = X[(((b * C + c) * D + id) * H + ih) * W + iw]; if (val > max_val) max_val = val; } } } } Y[(((b * C + c) * D_out + od) * H_out + oh) * W_out + ow] = max_val; } }"
    metal_body: "kernel void maxpool3d_kernel(device const float* X [[buffer(0)]], device float* Y [[buffer(1)]], constant uint4& dims0 [[buffer(2)]], constant uint4& dims1 [[buffer(3)]], uint3 gid [[thread_position_in_grid]]) { uint b = gid.z; uint c = gid.y; uint dhw = gid.x; uint N = dims0.x; uint C = dims0.y; uint D = dims0.z; uint H = dims0.w; uint W = dims1.x; uint KD = dims1.y; uint KH = dims1.z; uint KW = dims1.w; uint D_out = D - KD + 1; uint H_out = H - KH + 1; uint W_out = W - KW + 1; if (b < N && c < C && dhw < D_out * H_out * W_out) { uint od = dhw / (H_out * W_out); uint rem = dhw % (H_out * W_out); uint oh = rem / W_out; uint ow = rem % W_out; float max_val = -1e38f; for (uint kd = 0; kd < KD; ++kd) { for (uint kh = 0; kh < KH; ++kh) { for (uint kw = 0; kw < KW; ++kw) { uint id = od + kd; uint ih = oh + kh; uint iw = ow + kw; if (id < D && ih < H && iw < W) { float val = X[(((b * C + c) * D + id) * H + ih) * W + iw]; if (val > max_val) max_val = val; } } } } Y[(((b * C + c) * D_out + od) * H_out + oh) * W_out + ow] = max_val; } }"
