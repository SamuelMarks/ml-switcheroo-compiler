  LayerNorm:
    opcode: "LayerNorm"
    workgroup_dims: [256, 1, 1]
    thread_indexing_formula: "int row = blockIdx.x;"
    memory_layout_requirements: ["contiguous", "row-major"]
    body: "/* Layer normalization across feature dimensions */"
    cuda_body: "__global__ void layernorm_kernel(const float* X, const float* gamma, const float* beta, float* Y, int rows, int cols, float eps) { int row = blockIdx.x; if (row < rows) { float mean = 0.0f; for (int i = 0; i < cols; ++i) mean += X[row * cols + i]; mean /= (float)cols; float var = 0.0f; for (int i = 0; i < cols; ++i) { float d = X[row * cols + i] - mean; var += d * d; } var /= (float)cols; float inv_std = rsqrtf(var + eps); for (int i = 0; i < cols; ++i) { float g = gamma ? gamma[i] : 1.0f; float b = beta ? beta[i] : 0.0f; Y[row * cols + i] = g * (X[row * cols + i] - mean) * inv_std + b; } } }"
    rocm_body: "__global__ void layernorm_kernel(const float* X, const float* gamma, const float* beta, float* Y, int rows, int cols, float eps) { int row = hipBlockIdx_x; if (row < rows) { float mean = 0.0f; for (int i = 0; i < cols; ++i) mean += X[row * cols + i]; mean /= (float)cols; float var = 0.0f; for (int i = 0; i < cols; ++i) { float d = X[row * cols + i] - mean; var += d * d; } var /= (float)cols; float inv_std = rsqrtf(var + eps); for (int i = 0; i < cols; ++i) { float g = gamma ? gamma[i] : 1.0f; float b = beta ? beta[i] : 0.0f; Y[row * cols + i] = g * (X[row * cols + i] - mean) * inv_std + b; } } }"
    metal_body: "kernel void layernorm_kernel(device const float* X [[buffer(0)]], device const float* gamma [[buffer(1)]], device const float* beta [[buffer(2)]], device float* Y [[buffer(3)]], constant uint2& dims [[buffer(4)]], uint row [[thread_position_in_grid]]) { if (row < dims.x) { uint cols = dims.y; float mean = 0.0f; for (uint i = 0; i < cols; ++i) mean += X[row * cols + i]; mean /= float(cols); float var = 0.0f; for (uint i = 0; i < cols; ++i) { float d = X[row * cols + i] - mean; var += d * d; } var /= float(cols); float inv_std = rsqrt(var + 1e-5f); for (uint i = 0; i < cols; ++i) { float g = gamma[i]; float b = beta[i]; Y[row * cols + i] = g * (X[row * cols + i] - mean) * inv_std + b; } } }"
