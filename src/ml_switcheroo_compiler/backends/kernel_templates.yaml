    thread_indexing_formula: "int b = blockIdx.z; int c = blockIdx.y; int hw = blockIdx.x * blockDim.x + threadIdx.x;"
    memory_layout_requirements: ["contiguous", "nchw"]
    body: "/* 2D average pooling */"
    cuda_body: "__global__ void avgpool2d_kernel(const float* X, float* Y, int N, int C, int H, int W, int KH, int KW, int H_out, int W_out) { int b = blockIdx.z; int c = blockIdx.y; int hw = blockIdx.x * blockDim.x + threadIdx.x; if (b < N && c < C && hw < H_out * W_out) { int oh = hw / W_out; int ow = hw % W_out; float sum = 0.0f; for (int kh = 0; kh < KH; ++kh) { for (int kw = 0; kw < KW; ++kw) { sum += X[((b * C + c) * H + (oh + kh)) * W + (ow + kw)]; } } Y[((b * C + c) * H_out + oh) * W_out + ow] = sum / (float)(KH * KW); } }"
    rocm_body: "__global__ void avgpool2d_kernel(const float* X, float* Y, int N, int C, int H, int W, int KH, int KW, int H_out, int W_out) { int b = hipBlockIdx_z; int c = hipBlockIdx_y; int hw = hipBlockIdx_x * hipBlockDim_x + hipThreadIdx_x; if (b < N && c < C && hw < H_out * W_out) { int oh = hw / W_out; int ow = hw % W_out; float sum = 0.0f; for (int kh = 0; kh < KH; ++kh) { for (int kw = 0; kw < KW; ++kw) { sum += X[((b * C + c) * H + (oh + kh)) * W + (ow + kw)]; } } Y[((b * C + c) * H_out + oh) * W_out + ow] = sum / (float)(KH * KW); } }"
