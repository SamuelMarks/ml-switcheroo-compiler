  Div:
    opcode: "Div"
    workgroup_dims: [256, 1, 1]
    thread_indexing_formula: "int idx = blockIdx.x * blockDim.x + threadIdx.x;"
    memory_layout_requirements: ["contiguous"]
    body: "out[idx] = in0[idx] / in1[idx];"
    cuda_body: "__global__ void div_kernel(const float* in0, const float* in1, float* out, int n) { int idx = blockIdx.x * blockDim.x + threadIdx.x; if (idx < n) out[idx] = in0[idx] / in1[idx]; }"
    rocm_body: "__global__ void div_kernel(const float* in0, const float* in1, float* out, int n) { int idx = hipBlockIdx_x * hipBlockDim_x + hipThreadIdx_x; if (idx < n) out[idx] = in0[idx] / in1[idx]; }"
    metal_body: "kernel void div_kernel(device const float* in0 [[buffer(0)]], device const float* in1 [[buffer(1)]], device float* out [[buffer(2)]], uint idx [[thread_position_in_grid]]) { out[idx] = in0[idx] / in1[idx]; }"
