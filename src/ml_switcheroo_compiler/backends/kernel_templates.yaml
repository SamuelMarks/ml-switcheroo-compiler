    workgroup_dims: [16, 16, 1]
    thread_indexing_formula: "int b = blockIdx.z; int oc = blockIdx.y; int hw = blockIdx.x * blockDim.x + threadIdx.x;"
    memory_layout_requirements: ["contiguous", "nchw"]
    body: "float sum = 0.0f; /* 2D spatial convolution */"
    parameters:
