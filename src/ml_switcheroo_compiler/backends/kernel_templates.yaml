kernel_templates:
  Add:
    opcode: "Add"
    workgroup_dims: [256, 1, 1]
    thread_indexing_formula: "int idx = blockIdx.x * blockDim.x + threadIdx.x;"
    memory_layout_requirements: ["contiguous"]
    body: "out[idx] = in0[idx] + in1[idx];"
    cuda_body: "__global__ void add_kernel(const float* in0, const float* in1, float* out, int n) { int idx = blockIdx.x * blockDim.x + threadIdx.x; if (idx < n) out[idx] = in0[idx] + in1[idx]; }"
    rocm_body: "__global__ void add_kernel(const float* in0, const float* in1, float* out, int n) { int idx = hipBlockIdx_x * hipBlockDim_x + hipThreadIdx_x; if (idx < n) out[idx] = in0[idx] + in1[idx]; }"
    metal_body: "kernel void add_kernel(device const float* in0 [[buffer(0)]], device const float* in1 [[buffer(1)]], device float* out [[buffer(2)]], constant uint& n [[buffer(3)]], uint idx [[thread_position_in_grid]]) { if (idx < n) out[idx] = in0[idx] + in1[idx]; }"
    parameters:
      - name: "in0"
        param_type: "pointer"
        source: "input"
        source_index: 0
      - name: "in1"
        param_type: "pointer"
        source: "input"
        source_index: 1
      - name: "out"
        param_type: "pointer"
        source: "output"
        source_index: 0
      - name: "n"
        param_type: "int"
        source: "num_elements"

  Sub:
    opcode: "Sub"
    workgroup_dims: [256, 1, 1]
    thread_indexing_formula: "int idx = blockIdx.x * blockDim.x + threadIdx.x;"
    memory_layout_requirements: ["contiguous"]
    body: "out[idx] = in0[idx] - in1[idx];"
    cuda_body: "__global__ void sub_kernel(const float* in0, const float* in1, float* out, int n) { int idx = blockIdx.x * blockDim.x + threadIdx.x; if (idx < n) out[idx] = in0[idx] - in1[idx]; }"
    rocm_body: "__global__ void sub_kernel(const float* in0, const float* in1, float* out, int n) { int idx = hipBlockIdx_x * hipBlockDim_x + hipThreadIdx_x; if (idx < n) out[idx] = in0[idx] - in1[idx]; }"
    metal_body: "kernel void sub_kernel(device const float* in0 [[buffer(0)]], device const float* in1 [[buffer(1)]], device float* out [[buffer(2)]], constant uint& n [[buffer(3)]], uint idx [[thread_position_in_grid]]) { if (idx < n) out[idx] = in0[idx] - in1[idx]; }"
    parameters:
      - name: "in0"
        param_type: "pointer"
        source: "input"
        source_index: 0
      - name: "in1"
        param_type: "pointer"
        source: "input"
        source_index: 1
      - name: "out"
        param_type: "pointer"
        source: "output"
        source_index: 0
      - name: "n"
        param_type: "int"
        source: "num_elements"

  Mul:
    opcode: "Mul"
    workgroup_dims: [256, 1, 1]
    thread_indexing_formula: "int idx = blockIdx.x * blockDim.x + threadIdx.x;"
    memory_layout_requirements: ["contiguous"]
    body: "out[idx] = in0[idx] * in1[idx];"
    cuda_body: "__global__ void mul_kernel(const float* in0, const float* in1, float* out, int n) { int idx = blockIdx.x * blockDim.x + threadIdx.x; if (idx < n) out[idx] = in0[idx] * in1[idx]; }"
    rocm_body: "__global__ void mul_kernel(const float* in0, const float* in1, float* out, int n) { int idx = hipBlockIdx_x * hipBlockDim_x + hipThreadIdx_x; if (idx < n) out[idx] = in0[idx] * in1[idx]; }"
    metal_body: "kernel void mul_kernel(device const float* in0 [[buffer(0)]], device const float* in1 [[buffer(1)]], device float* out [[buffer(2)]], constant uint& n [[buffer(3)]], uint idx [[thread_position_in_grid]]) { if (idx < n) out[idx] = in0[idx] * in1[idx]; }"
    parameters:
      - name: "in0"
        param_type: "pointer"
        source: "input"
        source_index: 0
      - name: "in1"
        param_type: "pointer"
        source: "input"
        source_index: 1
      - name: "out"
        param_type: "pointer"
        source: "output"
        source_index: 0
      - name: "n"
        param_type: "int"
        source: "num_elements"

  Div:
    opcode: "Div"
    workgroup_dims: [256, 1, 1]
    thread_indexing_formula: "int idx = blockIdx.x * blockDim.x + threadIdx.x;"
    memory_layout_requirements: ["contiguous"]
    body: "out[idx] = in0[idx] / in1[idx];"
    cuda_body: "__global__ void div_kernel(const float* in0, const float* in1, float* out, int n) { int idx = blockIdx.x * blockDim.x + threadIdx.x; if (idx < n) out[idx] = in0[idx] / in1[idx]; }"
    rocm_body: "__global__ void div_kernel(const float* in0, const float* in1, float* out, int n) { int idx = hipBlockIdx_x * hipBlockDim_x + hipThreadIdx_x; if (idx < n) out[idx] = in0[idx] / in1[idx]; }"
    metal_body: "kernel void div_kernel(device const float* in0 [[buffer(0)]], device const float* in1 [[buffer(1)]], device float* out [[buffer(2)]], constant uint& n [[buffer(3)]], uint idx [[thread_position_in_grid]]) { if (idx < n) out[idx] = in0[idx] / in1[idx]; }"
    parameters:
      - name: "in0"
        param_type: "pointer"
        source: "input"
        source_index: 0
      - name: "in1"
        param_type: "pointer"
        source: "input"
        source_index: 1
      - name: "out"
        param_type: "pointer"
        source: "output"
        source_index: 0
      - name: "n"
        param_type: "int"
        source: "num_elements"

  Relu:
    opcode: "Relu"
    workgroup_dims: [256, 1, 1]
    thread_indexing_formula: "int idx = blockIdx.x * blockDim.x + threadIdx.x;"
    memory_layout_requirements: ["contiguous"]
    body: "out[idx] = in0[idx] > 0.0f ? in0[idx] : 0.0f;"
    cuda_body: "__global__ void relu_kernel(const float* in0, float* out, int n) { int idx = blockIdx.x * blockDim.x + threadIdx.x; if (idx < n) out[idx] = fmaxf(0.0f, in0[idx]); }"
    rocm_body: "__global__ void relu_kernel(const float* in0, float* out, int n) { int idx = hipBlockIdx_x * hipBlockDim_x + hipThreadIdx_x; if (idx < n) out[idx] = fmaxf(0.0f, in0[idx]); }"
    metal_body: "kernel void relu_kernel(device const float* in0 [[buffer(0)]], device float* out [[buffer(1)]], constant uint& n [[buffer(2)]], uint idx [[thread_position_in_grid]]) { if (idx < n) out[idx] = max(0.0f, in0[idx]); }"
    parameters:
      - name: "in0"
        param_type: "pointer"
        source: "input"
        source_index: 0
      - name: "out"
        param_type: "pointer"
        source: "output"
        source_index: 0
      - name: "n"
        param_type: "int"
        source: "num_elements"

  MatMul:
    opcode: "MatMul"
    workgroup_dims: [16, 16, 1]
    thread_indexing_formula: "int row = blockIdx.y * blockDim.y + threadIdx.y; int col = blockIdx.x * blockDim.x + threadIdx.x;"
    memory_layout_requirements: ["contiguous", "row-major"]
    body: "float sum = 0.0f; for (int k = 0; k < K; ++k) sum += in0[row * K + k] * in1[k * N + col]; out[row * N + col] = sum;"
    cuda_body: "__global__ void matmul_kernel(const float* A, const float* B, float* C, int M, int N, int K) { int row = blockIdx.y * blockDim.y + threadIdx.y; int col = blockIdx.x * blockDim.x + threadIdx.x; if (row < M && col < N) { float sum = 0.0f; for (int k = 0; k < K; ++k) sum += A[row * K + k] * B[k * N + col]; C[row * N + col] = sum; } }"
    rocm_body: "__global__ void matmul_kernel(const float* A, const float* B, float* C, int M, int N, int K) { int row = hipBlockIdx_y * hipBlockDim_y + hipThreadIdx_y; int col = hipBlockIdx_x * hipBlockDim_x + hipThreadIdx_x; if (row < M && col < N) { float sum = 0.0f; for (int k = 0; k < K; ++k) sum += A[row * K + k] * B[k * N + col]; C[row * N + col] = sum; } }"
    metal_body: "kernel void matmul_kernel(device const float* A [[buffer(0)]], device const float* B [[buffer(1)]], device float* C [[buffer(2)]], constant uint4& dims [[buffer(3)]], uint2 gid [[thread_position_in_grid]]) { uint row = gid.y; uint col = gid.x; uint M = dims.x; uint N = dims.y; uint K = dims.z; if (row < M && col < N) { float sum = 0.0f; for (uint k = 0; k < K; ++k) sum += A[row * K + k] * B[k * N + col]; C[row * N + col] = sum; } }"
    parameters:
      - name: "A"
        param_type: "pointer"
        source: "input"
        source_index: 0
      - name: "B"
        param_type: "pointer"
        source: "input"
        source_index: 1
      - name: "C"
        param_type: "pointer"
        source: "output"
        source_index: 0
      - name: "M"
        param_type: "int"
        source: "shape"
        source_key: "M"
      - name: "N"
        param_type: "int"
        source: "shape"
        source_key: "N"
      - name: "K"
        param_type: "int"
        source: "shape"
        source_key: "K"

  BatchMatMul:
    opcode: "BatchMatMul"
    workgroup_dims: [16, 16, 1]
    thread_indexing_formula: "int b = blockIdx.z; int row = blockIdx.y * blockDim.y + threadIdx.y; int col = blockIdx.x * blockDim.x + threadIdx.x;"
    memory_layout_requirements: ["contiguous", "row-major"]
    body: "float sum = 0.0f; for (int k = 0; k < K; ++k) sum += A[b * M * K + row * K + k] * B[b * K * N + k * N + col]; C[b * M * N + row * N + col] = sum;"
    cuda_body: "__global__ void batchmatmul_kernel(const float* A, const float* B, float* C, int B_sz, int M, int N, int K) { int b = blockIdx.z; int row = blockIdx.y * blockDim.y + threadIdx.y; int col = blockIdx.x * blockDim.x + threadIdx.x; if (b < B_sz && row < M && col < N) { float sum = 0.0f; for (int k = 0; k < K; ++k) sum += A[b * M * K + row * K + k] * B[b * K * N + k * N + col]; C[b * M * N + row * N + col] = sum; } }"
    rocm_body: "__global__ void batchmatmul_kernel(const float* A, const float* B, float* C, int B_sz, int M, int N, int K) { int b = hipBlockIdx_z; int row = hipBlockIdx_y * hipBlockDim_y + hipThreadIdx_y; int col = hipBlockIdx_x * hipBlockDim_x + hipThreadIdx_x; if (b < B_sz && row < M && col < N) { float sum = 0.0f; for (int k = 0; k < K; ++k) sum += A[b * M * K + row * K + k] * B[b * K * N + k * N + col]; C[b * M * N + row * N + col] = sum; } }"
    metal_body: "kernel void batchmatmul_kernel(device const float* A [[buffer(0)]], device const float* B [[buffer(1)]], device float* C [[buffer(2)]], constant uint4& dims [[buffer(3)]], uint3 gid [[thread_position_in_grid]]) { uint b = gid.z; uint row = gid.y; uint col = gid.x; uint B_sz = dims.x; uint M = dims.y; uint N = dims.z; uint K = dims.w; if (b < B_sz && row < M && col < N) { float sum = 0.0f; for (uint k = 0; k < K; ++k) sum += A[b * M * K + row * K + k] * B[b * K * N + k * N + col]; C[b * M * N + row * N + col] = sum; } }"
    parameters:
      - name: "A"
        param_type: "pointer"
        source: "input"
        source_index: 0
      - name: "B"
        param_type: "pointer"
        source: "input"
        source_index: 1
      - name: "C"
        param_type: "pointer"
        source: "output"
        source_index: 0
      - name: "B_sz"
        param_type: "int"
        source: "shape"
        source_key: "batch_size"
      - name: "M"
        param_type: "int"
        source: "shape"
        source_key: "M"
      - name: "N"
        param_type: "int"
        source: "shape"
        source_key: "N"
      - name: "K"
        param_type: "int"
        source: "shape"
        source_key: "K"

  Conv2D:
    opcode: "Conv2D"
    workgroup_dims: [16, 16, 1]
    thread_indexing_formula: "int b = blockIdx.z; int oc = blockIdx.y; int hw = blockIdx.x * blockDim.x + threadIdx.x;"
    memory_layout_requirements: ["contiguous", "nchw"]
    body: "float sum = 0.0f; /* 2D spatial convolution */"
    cuda_body: "__global__ void conv2d_kernel(const float* X, const float* W, float* Y, int N, int C_in, int H, int W_in, int C_out, int KH, int KW, int H_out, int W_out) { int b = blockIdx.z; int oc = blockIdx.y; int hw = blockIdx.x * blockDim.x + threadIdx.x; if (b < N && oc < C_out && hw < H_out * W_out) { int oh = hw / W_out; int ow = hw % W_out; float sum = 0.0f; for (int ic = 0; ic < C_in; ++ic) { for (int kh = 0; kh < KH; ++kh) { for (int kw = 0; kw < KW; ++kw) { int ih = oh + kh; int iw = ow + kw; if (ih < H && iw < W_in) { sum += X[((b * C_in + ic) * H + ih) * W_in + iw] * W[((oc * C_in + ic) * KH + kh) * KW + kw]; } } } } Y[((b * C_out + oc) * H_out + oh) * W_out + ow] = sum; } }"
    rocm_body: "__global__ void conv2d_kernel(const float* X, const float* W, float* Y, int N, int C_in, int H, int W_in, int C_out, int KH, int KW, int H_out, int W_out) { int b = hipBlockIdx_z; int oc = hipBlockIdx_y; int hw = hipBlockIdx_x * hipBlockDim_x + hipThreadIdx_x; if (b < N && oc < C_out && hw < H_out * W_out) { int oh = hw / W_out; int ow = hw % W_out; float sum = 0.0f; for (int ic = 0; ic < C_in; ++ic) { for (int kh = 0; kh < KH; ++kh) { for (int kw = 0; kw < KW; ++kw) { int ih = oh + kh; int iw = ow + kw; if (ih < H && iw < W_in) { sum += X[((b * C_in + ic) * H + ih) * W_in + iw] * W[((oc * C_in + ic) * KH + kh) * KW + kw]; } } } } Y[((b * C_out + oc) * H_out + oh) * W_out + ow] = sum; } }"
    metal_body: "kernel void conv2d_kernel(device const float* X [[buffer(0)]], device const float* W [[buffer(1)]], device float* Y [[buffer(2)]], constant uint4& dims0 [[buffer(3)]], constant uint4& dims1 [[buffer(4)]], uint3 gid [[thread_position_in_grid]]) { uint b = gid.z; uint oc = gid.y; uint hw = gid.x; uint N = dims0.x; uint C_in = dims0.y; uint H = dims0.z; uint W_in = dims0.w; uint C_out = dims1.x; uint KH = dims1.y; uint KW = dims1.z; uint W_out = dims1.w; uint H_out = H - KH + 1; if (b < N && oc < C_out && hw < H_out * W_out) { uint oh = hw / W_out; uint ow = hw % W_out; float sum = 0.0f; for (uint ic = 0; ic < C_in; ++ic) { for (uint kh = 0; kh < KH; ++kh) { for (uint kw = 0; kw < KW; ++kw) { uint ih = oh + kh; uint iw = ow + kw; if (ih < H && iw < W_in) { sum += X[((b * C_in + ic) * H + ih) * W_in + iw] * W[((oc * C_in + ic) * KH + kh) * KW + kw]; } } } } Y[((b * C_out + oc) * H_out + oh) * W_out + ow] = sum; } }"
    parameters:
      - name: "x"
        param_type: "pointer"
        source: "input"
        source_index: 0
      - name: "w"
        param_type: "pointer"
        source: "input"
        source_index: 1
      - name: "out"
        param_type: "pointer"
        source: "output"
        source_index: 0

  ReduceSum:
    opcode: "ReduceSum"
    workgroup_dims: [256, 1, 1]
    thread_indexing_formula: "int idx = blockIdx.x * blockDim.x + threadIdx.x;"
    memory_layout_requirements: ["contiguous"]
    body: "atomicAdd(out, in0[idx]);"
    cuda_body: "__global__ void reducesum_kernel(const float* in0, float* out, int n) { int idx = blockIdx.x * blockDim.x + threadIdx.x; if (idx < n) { atomicAdd(out, in0[idx]); } }"
    rocm_body: "__global__ void reducesum_kernel(const float* in0, float* out, int n) { int idx = hipBlockIdx_x * hipBlockDim_x + hipThreadIdx_x; if (idx < n) { atomicAdd(out, in0[idx]); } }"
    metal_body: "kernel void reducesum_kernel(device const float* in0 [[buffer(0)]], device atomic_float* out [[buffer(1)]], constant uint& n [[buffer(2)]], uint idx [[thread_position_in_grid]]) { if (idx < n) { atomic_fetch_add_explicit(out, in0[idx], memory_order_relaxed); } }"
    parameters:
      - name: "in0"
        param_type: "pointer"
        source: "input"
        source_index: 0
      - name: "out"
        param_type: "pointer"
        source: "output"
        source_index: 0
      - name: "n"
        param_type: "int"
        source: "num_elements"

  # Non-linear activations
  Sigmoid:
    opcode: "Sigmoid"
    workgroup_dims: [256, 1, 1]
    thread_indexing_formula: "int idx = blockIdx.x * blockDim.x + threadIdx.x;"
    memory_layout_requirements: ["contiguous"]
    body: "out[idx] = 1.0f / (1.0f + expf(-in0[idx]));"
    cuda_body: "__global__ void sigmoid_kernel(const float* in0, float* out, int n) { int idx = blockIdx.x * blockDim.x + threadIdx.x; if (idx < n) out[idx] = 1.0f / (1.0f + expf(-in0[idx])); }"
    rocm_body: "__global__ void sigmoid_kernel(const float* in0, float* out, int n) { int idx = hipBlockIdx_x * hipBlockDim_x + hipThreadIdx_x; if (idx < n) out[idx] = 1.0f / (1.0f + expf(-in0[idx])); }"
    metal_body: "kernel void sigmoid_kernel(device const float* in0 [[buffer(0)]], device float* out [[buffer(1)]], constant uint& n [[buffer(2)]], uint idx [[thread_position_in_grid]]) { if (idx < n) out[idx] = 1.0f / (1.0f + exp(-in0[idx])); }"
    parameters:
      - name: "in0"
        param_type: "pointer"
        source: "input"
        source_index: 0
      - name: "out"
        param_type: "pointer"
        source: "output"
        source_index: 0
      - name: "n"
        param_type: "int"
        source: "num_elements"

  Tanh:
    opcode: "Tanh"
    workgroup_dims: [256, 1, 1]
    thread_indexing_formula: "int idx = blockIdx.x * blockDim.x + threadIdx.x;"
    memory_layout_requirements: ["contiguous"]
    body: "out[idx] = tanhf(in0[idx]);"
    cuda_body: "__global__ void tanh_kernel(const float* in0, float* out, int n) { int idx = blockIdx.x * blockDim.x + threadIdx.x; if (idx < n) out[idx] = tanhf(in0[idx]); }"
    rocm_body: "__global__ void tanh_kernel(const float* in0, float* out, int n) { int idx = hipBlockIdx_x * hipBlockDim_x + hipThreadIdx_x; if (idx < n) out[idx] = tanhf(in0[idx]); }"
    metal_body: "kernel void tanh_kernel(device const float* in0 [[buffer(0)]], device float* out [[buffer(1)]], constant uint& n [[buffer(2)]], uint idx [[thread_position_in_grid]]) { if (idx < n) out[idx] = tanh(in0[idx]); }"
    parameters:
      - name: "in0"
        param_type: "pointer"
        source: "input"
        source_index: 0
      - name: "out"
        param_type: "pointer"
        source: "output"
        source_index: 0
      - name: "n"
        param_type: "int"
        source: "num_elements"

  GELU:
    opcode: "GELU"
    workgroup_dims: [256, 1, 1]
    thread_indexing_formula: "int idx = blockIdx.x * blockDim.x + threadIdx.x;"
    memory_layout_requirements: ["contiguous"]
    body: "out[idx] = 0.5f * in0[idx] * (1.0f + tanhf(0.79788456f * (in0[idx] + 0.044715f * in0[idx] * in0[idx] * in0[idx])));"
    cuda_body: "__global__ void gelu_kernel(const float* in0, float* out, int n) { int idx = blockIdx.x * blockDim.x + threadIdx.x; if (idx < n) { float x = in0[idx]; out[idx] = 0.5f * x * (1.0f + tanhf(0.79788456f * (x + 0.044715f * x * x * x))); } }"
    rocm_body: "__global__ void gelu_kernel(const float* in0, float* out, int n) { int idx = hipBlockIdx_x * hipBlockDim_x + hipThreadIdx_x; if (idx < n) { float x = in0[idx]; out[idx] = 0.5f * x * (1.0f + tanhf(0.79788456f * (x + 0.044715f * x * x * x))); } }"
    metal_body: "kernel void gelu_kernel(device const float* in0 [[buffer(0)]], device float* out [[buffer(1)]], constant uint& n [[buffer(2)]], uint idx [[thread_position_in_grid]]) { if (idx < n) { float x = in0[idx]; out[idx] = 0.5f * x * (1.0f + tanh(0.79788456f * (x + 0.044715f * x * x * x))); } }"
    parameters:
      - name: "in0"
        param_type: "pointer"
        source: "input"
        source_index: 0
      - name: "out"
        param_type: "pointer"
        source: "output"
        source_index: 0
      - name: "n"
        param_type: "int"
        source: "num_elements"

  SiLU:
    opcode: "SiLU"
    workgroup_dims: [256, 1, 1]
    thread_indexing_formula: "int idx = blockIdx.x * blockDim.x + threadIdx.x;"
    memory_layout_requirements: ["contiguous"]
    body: "out[idx] = in0[idx] / (1.0f + expf(-in0[idx]));"
    cuda_body: "__global__ void silu_kernel(const float* in0, float* out, int n) { int idx = blockIdx.x * blockDim.x + threadIdx.x; if (idx < n) out[idx] = in0[idx] / (1.0f + expf(-in0[idx])); }"
    rocm_body: "__global__ void silu_kernel(const float* in0, float* out, int n) { int idx = hipBlockIdx_x * hipBlockDim_x + hipThreadIdx_x; if (idx < n) out[idx] = in0[idx] / (1.0f + expf(-in0[idx])); }"
    metal_body: "kernel void silu_kernel(device const float* in0 [[buffer(0)]], device float* out [[buffer(1)]], constant uint& n [[buffer(2)]], uint idx [[thread_position_in_grid]]) { if (idx < n) out[idx] = in0[idx] / (1.0f + exp(-in0[idx])); }"
    parameters:
      - name: "in0"
        param_type: "pointer"
        source: "input"
        source_index: 0
      - name: "out"
        param_type: "pointer"
        source: "output"
        source_index: 0
      - name: "n"
        param_type: "int"
        source: "num_elements"

  ELU:
    opcode: "ELU"
    workgroup_dims: [256, 1, 1]
    thread_indexing_formula: "int idx = blockIdx.x * blockDim.x + threadIdx.x;"
    memory_layout_requirements: ["contiguous"]
    body: "out[idx] = in0[idx] > 0.0f ? in0[idx] : (expf(in0[idx]) - 1.0f);"
