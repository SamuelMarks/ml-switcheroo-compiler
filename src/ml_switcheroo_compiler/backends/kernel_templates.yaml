    metal_body: "kernel void rmsnorm_kernel(device const float* X [[buffer(0)]], device const float* gamma [[buffer(1)]], device float* Y [[buffer(2)]], constant uint2& dims [[buffer(3)]], uint row [[thread_position_in_grid]]) { if (row < dims.x) { uint cols = dims.y; float sum_sq = 0.0f; for (uint i = 0; i < cols; ++i) { float x = X[row * cols + i]; sum_sq += x * x; } float rms = rsqrt(sum_sq / float(cols) + 1e-5f); for (uint i = 0; i < cols; ++i) { float g = gamma[i]; Y[row * cols + i] = g * X[row * cols + i] * rms; } } }"
