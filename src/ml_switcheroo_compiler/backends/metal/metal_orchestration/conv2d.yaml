conv2d:
  body: "#include <metal_stdlib>\nusing namespace metal;\nkernel void conv2d(\n  \
    \  const device float* A [[buffer(0)]],\n    device float* C [[buffer(1)]],\n\
    \    uint id [[thread_position_in_grid]])\n{\n    C[id] = A[id];\n}\n"
  workgroup_size:
  - 256
  - 1
  - 1
  grid_calc:
    x: '{H_out} * {W_out}'
    y: '{C_out}'
    z: '{N}'
  type_mappings:
    float32: float
    float16: half
    bfloat16: bfloat
    int32: int
    int64: long
    bool: bool
