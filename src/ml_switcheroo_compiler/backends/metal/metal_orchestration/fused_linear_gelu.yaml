fused_linear_gelu:
  body: "#include <metal_stdlib>\nusing namespace metal;\nkernel void fused_linear_gelu(\n\
    \    const device float* A [[buffer(0)]],\n    const device float* B [[buffer(1)]],\n\
    \    device float* C [[buffer(2)]],\n    uint id [[thread_position_in_grid]],\n\
    \    constant uint& N [[buffer(3)]])\n{\n    if (id < N) {\n        float x =\
    \ A[id] + B[id];\n        C[id] = 0.5f * x * (1.0f + tanh(0.79788456f * (x + 0.044715f\
    \ * x * x * x)));\n    }\n}\n"
  workgroup_size:
  - 256
  - 1
  - 1
  grid_calc:
    x: ({num_elements} + block_{node_idx}.x - 1) / block_{node_idx}.x
    y: '1'
    z: '1'
  type_mappings:
    bfloat16: bfloat
    bool: bool
    float16: half
    float32: float
    int32: int
    int64: long
