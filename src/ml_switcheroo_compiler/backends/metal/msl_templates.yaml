      \    const device float* A [[buffer(0)]],\n    device float* C [[buffer(1)]],\n\
      \    constant uint& N [[buffer(2)]],\n    uint id [[thread_position_in_grid]])\n\
      {\n    if (id < N) {\n        C[id] = sqrt(A[id]);\n    }\n}\n"
    workgroup_size:
    - 256
    - 1
    - 1
  sub:
    body: "#include <metal_stdlib>\nusing namespace metal;\nkernel void sub(\n   \
      \ const device float* A [[buffer(0)]],\n    const device float* B [[buffer(1)]],\n\
      \    device float* C [[buffer(2)]],\n    uint id [[thread_position_in_grid]],\n\
      \    constant uint& N [[buffer(3)]])\n{\n    if (id < N) {\n        C[id] =\
      \ A[id] - B[id];\n    }\n}\n"
    workgroup_size:
    - 256
    - 1
    - 1
  sum:
    body: "#include <metal_stdlib>\nusing namespace metal;\nkernel void sum(\n   \
      \ const device float* A [[buffer(0)]],\n    device float* C [[buffer(1)]],\n\
      \    uint id [[thread_position_in_grid]],\n    constant uint& N [[buffer(2)]])\n\
      {\n    // Very naive global sum for placeholder\n    if (id == 0) {\n      \
      \  float s = 0.0;\n        for (uint i = 0; i < N; ++i) {\n            s +=\
      \ A[i];\n        }\n        C[0] = s;\n    }\n}\n"
    workgroup_size:
    - 256
    - 1
    - 1
  tanh:
    body: "#include <metal_stdlib>\nusing namespace metal;\nkernel void tanh_kernel(\n\
      \    const device float* A [[buffer(0)]],\n    device float* C [[buffer(1)]],\n\
      \    constant uint& N [[buffer(2)]],\n    uint id [[thread_position_in_grid]])\n\
      {\n    if (id < N) {\n        C[id] = tanh(A[id]);\n    }\n}\n"
    workgroup_size:
    - 256
    - 1
    - 1
  triangularsolve:
    body: "#include <metal_stdlib>\nusing namespace metal;\nkernel void triangularsolve(\n\
      \    const device float* A [[buffer(0)]],\n    device float* C [[buffer(1)]],\n\
      \    uint id [[thread_position_in_grid]])\n{\n    C[id] = A[id];\n}\n"
    grid_calc:
      x: ({num_elements} + block_{node_idx}.x - 1) / block_{node_idx}.x
      y: '1'
      z: '1'
    type_mappings:
      bfloat16: bfloat
      bool: bool
      float16: half
      float32: float
      int32: int
      int64: long
    workgroup_size:
    - 256
    - 1
    - 1
