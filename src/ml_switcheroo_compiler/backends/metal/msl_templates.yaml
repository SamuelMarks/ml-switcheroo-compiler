      \    constant uint& stride_h [[buffer(10)]],\n    constant uint& stride_w [[buffer(11)]],\n\
      \    constant int& pad_h [[buffer(12)]],\n    constant int& pad_w [[buffer(13)]],\n\
      \    constant uint& dilation_h [[buffer(14)]],\n    constant uint& dilation_w\
      \ [[buffer(15)]],\n    uint3 tid [[thread_position_in_grid]])\n{\n    uint ox\
      \ = tid.x;\n    uint oy = tid.y;\n    uint bc = tid.z;\n    uint b = bc / C;\n\
      \    uint c = bc % C;\n    if (ox < out_W && oy < out_H && b < B) {\n      \
      \  float sum_val = 0.0f;\n        uint count = 0;\n        for (uint fy = 0;\
      \ fy < filter_h; ++fy) {\n            for (uint fx = 0; fx < filter_w; ++fx)\
      \ {\n                int in_y = int(oy * stride_h + fy * dilation_h) - pad_h;\n\
      \                int in_x = int(ox * stride_w + fx * dilation_w) - pad_w;\n\
      \                if (in_y >= 0 && in_y < int(H) && in_x >= 0 && in_x < int(W))\
      \ {\n                    sum_val += in[((b * C + c) * H + in_y) * W + in_x];\n\
      \                    count++;\n                }\n            }\n        }\n\
      \        out[((b * C + c) * out_H + oy) * out_W + ox] = (count > 0) ? (sum_val\
      \ / count) : 0.0f;\n    }\n}\n"
    grid_calc:
      x: ({out_W} + 15) / 16
      y: ({out_H} + 15) / 16
      z: '{B} * {C}'
    workgroup_size:
    - 16
    - 16
    - 1
