cst_rewrite_rules:
  method_substitutions:
    - match:
        pattern: "view"
        source_framework: "pytorch"
      replacement:
        target_name: "reshape"
        target_framework: "all"
      description: "Convert PyTorch tensor.view to functional reshape"

    - match:
        pattern: "permute"
        source_framework: "pytorch"
      replacement:
        target_name: "transpose"
        target_framework: "all"
      description: "Convert tensor.permute to functional transpose"

    - match:
        pattern: "dim"
        source_framework: "pytorch"
      replacement:
        target_name: "ndim"
        target_framework: "all"
      description: "Convert tensor.dim() to ndim property"

    - match:
        pattern: "size"
        source_framework: "pytorch"
      replacement:
        target_name: "shape"
        target_framework: "all"
      description: "Convert tensor.size() to shape attribute"

  chain_removals:
    - match:
        pattern: "contiguous"
        source_framework: "pytorch"
      description: "Strip non-functional PyTorch contiguous() calls"

  in_place_mutations:
    - match:
        pattern: "add_"
        source_framework: "pytorch"
      replacement:
        target_name: "add"
        target_framework: "all"
      description: "Convert in-place add_ to functional add"

    - match:
        pattern: "sub_"
        source_framework: "pytorch"
      replacement:
        target_name: "subtract"
        target_framework: "all"
      description: "Convert in-place sub_ to functional subtract"

    - match:
        pattern: "mul_"
        source_framework: "pytorch"
      replacement:
        target_name: "multiply"
        target_framework: "all"
      description: "Convert in-place mul_ to functional multiply"

    - match:
        pattern: "div_"
        source_framework: "pytorch"
      replacement:
        target_name: "divide"
        target_framework: "all"
      description: "Convert in-place div_ to functional divide"

    - match:
        pattern: "relu_"
        source_framework: "pytorch"
      replacement:
        target_name: "relu"
        target_framework: "all"
      description: "Convert in-place relu_ to functional relu"

  tensor_creation_rewrites:
    - match:
        pattern: "tensor"
        source_framework: "pytorch"
      replacement:
        target_name: "array"
        target_framework: "all"
      description: "Convert torch.tensor to target_module.array"

    - match:
        pattern: "randn"
        source_framework: "pytorch"
      replacement:
        target_name: "random.normal"
        target_framework: "jax"
      description: "Convert torch.randn to jax.random.normal"

    - match:
        pattern: "empty"
        source_framework: "pytorch"
      replacement:
        target_name: "empty"
        target_framework: "all"
      description: "Convert torch.empty to target_module.empty"

  slice_normalizations:
    - match:
        pattern: "narrow"
        source_framework: "pytorch"
      replacement:
        target_name: "slice"
        target_framework: "all"
      description: "Rewrite tensor.narrow into explicit slicing"

  broadcasting_rules:
    - source_method: "expand"
      target_method: "broadcast_to"
      source_framework: "pytorch"
      target_framework: "all"
    - source_method: "broadcast_to"
      target_method: "expand"
      source_framework: "jax"
      target_framework: "pytorch"

  argument_permutations:
    - match:
        pattern: "dim_to_axis"
      permutation:
        source_arg: "dim"
        target_arg: "axis"

    - match:
        pattern: "keepdim_to_keepdims"
      permutation:
        source_arg: "keepdim"
        target_arg: "keepdims"

  call_rules:
    - match:
        pattern: "view"
        source_framework: "pytorch"
      replacement:
        target_name: "reshape"
        target_framework: "jax"
      description: "Rewrite tensor.view() calls to reshape"
    - match:
        pattern: "permute"
        source_framework: "pytorch"
      replacement:
        target_name: "transpose"
        target_framework: "jax"
      description: "Rewrite tensor.permute() calls to transpose"
    - match:
        pattern: "t"
        source_framework: "pytorch"
      replacement:
        target_name: "swapaxes"
        target_framework: "jax"
      description: "Rewrite tensor.t() to swapaxes"

  attribute_rules:
    - match:
        pattern: "T"
        source_framework: "pytorch"
      replacement:
        target_name: "T"
        target_framework: "all"
      description: "Property access for transpose"
    - match:
        pattern: "ndim"
        source_framework: "all"
      replacement:
        target_name: "ndim"
        target_framework: "all"
      description: "Property access for number of dimensions"

  import_rules:
    - match:
        pattern: "torch"
        source_framework: "pytorch"
      replacement:
        target_name: "jax"
        target_framework: "jax"
      description: "Rewrite torch module import to jax"
    - match:
        pattern: "torch.nn"
        source_framework: "pytorch"
      replacement:
        target_name: "flax.linen"
        target_framework: "jax"
      description: "Rewrite torch.nn import to flax.linen"

  function_def_rules:
    - match:
        pattern: "forward"
        source_framework: "pytorch"
      replacement:
        target_name: "__call__"
        target_framework: "jax"
      description: "Rename forward method to __call__ in functional frameworks"
    - match:
        pattern: "__call__"
        source_framework: "jax"
      replacement:
        target_name: "forward"
        target_framework: "pytorch"
      description: "Rename __call__ method to forward in PyTorch"
