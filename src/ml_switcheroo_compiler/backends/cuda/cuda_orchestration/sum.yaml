sum:
  body: "__global__ void sum(const float* A, float* C, int N) {\n    int id = blockIdx.x\
    \ * blockDim.x + threadIdx.x;\n    if (id == 0) {\n        float s = 0.0f;\n \
    \       for (int i = 0; i < N; ++i) {\n            s += A[i];\n        }\n   \
    \     C[0] = s;\n    }\n}\n"
  workgroup_size:
  - 256
  - 1
  - 1
