  layernorm:
    body: "#version 300 es\nprecision highp float;\nuniform sampler2D A;\nuniform\
      \ int N;\nuniform float eps;\nout vec4 fragColor;\nvoid main() {\n    ivec2\
      \ coord = ivec2(gl_FragCoord.xy);\n    int row = coord.y;\n    int col = coord.x;\n\
      \    float sum = 0.0;\n    for (int i = 0; i < N; ++i) {\n        sum += texelFetch(A,\
      \ ivec2(i, row), 0).r;\n    }\n    float mean = sum / float(N);\n    float sq_diff\
      \ = 0.0;\n    for (int i = 0; i < N; ++i) {\n        float diff = texelFetch(A,\
      \ ivec2(i, row), 0).r - mean;\n        sq_diff += diff * diff;\n    }\n    float\
      \ variance = sq_diff / float(N);\n    float x = texelFetch(A, ivec2(col, row),\
      \ 0).r;\n    float norm = (x - mean) / sqrt(variance + eps);\n    fragColor\
      \ = vec4(norm, 0.0, 0.0, 0.0);\n}\n"
    uniforms:
    - N
    - eps
    custom_setup: 'gl.uniform1i(gl.getUniformLocation(prog_{clean_id}, ''N''), {width});

      gl.uniform1f(gl.getUniformLocation(prog_{clean_id}, ''eps''), 1e-5);

      '
  layer_norm:
    body: "#version 300 es\nprecision highp float;\nuniform sampler2D A;\nuniform\
      \ int N;\nuniform float eps;\nout vec4 fragColor;\nvoid main() {\n    ivec2\
      \ coord = ivec2(gl_FragCoord.xy);\n    int row = coord.y;\n    int col = coord.x;\n\
      \    float sum = 0.0;\n    for (int i = 0; i < N; ++i) {\n        sum += texelFetch(A,\
      \ ivec2(i, row), 0).r;\n    }\n    float mean = sum / float(N);\n    float sq_diff\
      \ = 0.0;\n    for (int i = 0; i < N; ++i) {\n        float diff = texelFetch(A,\
      \ ivec2(i, row), 0).r - mean;\n        sq_diff += diff * diff;\n    }\n    float\
