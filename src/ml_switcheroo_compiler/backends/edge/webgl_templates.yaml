  maxpool2d:
    body: "#version 300 es\nprecision highp float;\nuniform sampler2D A;\nuniform\
      \ int in_h;\nuniform int in_w;\nuniform int pool_h;\nuniform int pool_w;\nuniform\
      \ int stride_h;\nuniform int stride_w;\nuniform int pad_h;\nuniform int pad_w;\n\
      out vec4 fragColor;\nvoid main() {\n    ivec2 outCoord = ivec2(gl_FragCoord.xy);\n\
      \    int out_x = outCoord.x;\n    int out_y = outCoord.y;\n    float max_val\
      \ = -1.0e38;\n    for (int ph = 0; ph < pool_h; ++ph) {\n        for (int pw\
      \ = 0; pw < pool_w; ++pw) {\n            int in_x = out_x * stride_w + pw -\
      \ pad_w;\n            int in_y = out_y * stride_h + ph - pad_h;\n          \
      \  if (in_x >= 0 && in_x < in_w && in_y >= 0 && in_y < in_h) {\n           \
      \     float a = texelFetch(A, ivec2(in_x, in_y), 0).r;\n                max_val\
      \ = max(max_val, a);\n            }\n        }\n    }\n    fragColor = vec4(max_val,\
      \ 0.0, 0.0, 0.0);\n}\n"
    uniforms:
    - in_h
    - in_w
    - pool_h
    - pool_w
    - stride_h
    - stride_w
    - pad_h
    - pad_w
    custom_setup: 'gl.uniform1i(gl.getUniformLocation(prog_{clean_id}, ''in_h''),
      {in_h});

      gl.uniform1i(gl.getUniformLocation(prog_{clean_id}, ''in_w''), {in_w});

      gl.uniform1i(gl.getUniformLocation(prog_{clean_id}, ''pool_h''), 2);

      gl.uniform1i(gl.getUniformLocation(prog_{clean_id}, ''pool_w''), 2);

      gl.uniform1i(gl.getUniformLocation(prog_{clean_id}, ''stride_h''), 2);

      gl.uniform1i(gl.getUniformLocation(prog_{clean_id}, ''stride_w''), 2);

      gl.uniform1i(gl.getUniformLocation(prog_{clean_id}, ''pad_h''), 0);

      gl.uniform1i(gl.getUniformLocation(prog_{clean_id}, ''pad_w''), 0);

      '
