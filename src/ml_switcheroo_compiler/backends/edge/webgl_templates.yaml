templates:
  matmul: |
    #version 300 es
    precision highp float;
    uniform sampler2D A;
    uniform sampler2D B;
    uniform int N;
    uniform int K;
    uniform int M;
    out vec4 fragColor;
    void main() {
        ivec2 outCoord = ivec2(gl_FragCoord.xy);
        int row = outCoord.y;
        int col = outCoord.x;
        float sum = 0.0;
        for (int i = 0; i < K; ++i) {
            float a = texelFetch(A, ivec2(i, row), 0).r;
            float b = texelFetch(B, ivec2(col, i), 0).r;
            sum += a * b;
        }
        fragColor = vec4(sum, 0.0, 0.0, 0.0);
    }
  add: |
    #version 300 es
    precision highp float;
    uniform sampler2D A;
    uniform sampler2D B;
    out vec4 fragColor;
    void main() {
        ivec2 coord = ivec2(gl_FragCoord.xy);
        float a = texelFetch(A, coord, 0).r;
        float b = texelFetch(B, coord, 0).r;
        fragColor = vec4(a + b, 0.0, 0.0, 0.0);
    }
  sub: |
    #version 300 es
    precision highp float;
    uniform sampler2D A;
    uniform sampler2D B;
    out vec4 fragColor;
    void main() {
        ivec2 coord = ivec2(gl_FragCoord.xy);
        float a = texelFetch(A, coord, 0).r;
        float b = texelFetch(B, coord, 0).r;
        fragColor = vec4(a - b, 0.0, 0.0, 0.0);
    }
  mul: |
    #version 300 es
    precision highp float;
    uniform sampler2D A;
    uniform sampler2D B;
    out vec4 fragColor;
    void main() {
        ivec2 coord = ivec2(gl_FragCoord.xy);
        float a = texelFetch(A, coord, 0).r;
        float b = texelFetch(B, coord, 0).r;
        fragColor = vec4(a * b, 0.0, 0.0, 0.0);
    }
  div: |
    #version 300 es
    precision highp float;
    uniform sampler2D A;
    uniform sampler2D B;
    out vec4 fragColor;
    void main() {
        ivec2 coord = ivec2(gl_FragCoord.xy);
        float a = texelFetch(A, coord, 0).r;
        float b = texelFetch(B, coord, 0).r;
        fragColor = vec4(a / b, 0.0, 0.0, 0.0);
    }
  relu: |
    #version 300 es
    precision highp float;
    uniform sampler2D A;
    out vec4 fragColor;
    void main() {
        ivec2 coord = ivec2(gl_FragCoord.xy);
        float a = texelFetch(A, coord, 0).r;
        fragColor = vec4(max(0.0, a), 0.0, 0.0, 0.0);
    }
  sigmoid: |
    #version 300 es
    precision highp float;
    uniform sampler2D A;
    out vec4 fragColor;
    void main() {
        ivec2 coord = ivec2(gl_FragCoord.xy);
        float a = texelFetch(A, coord, 0).r;
        fragColor = vec4(1.0 / (1.0 + exp(-a)), 0.0, 0.0, 0.0);
    }

js_orchestration:
  init: |
    const canvas = document.createElement('canvas');
    const gl = canvas.getContext('webgl2');
    gl.getExtension('EXT_color_buffer_float');
    gl.getExtension('OES_texture_float_linear');
  create_texture: |
    function createTexture(gl, data, width, height) {
        const tex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.R32F, width, height, 0, gl.RED, gl.FLOAT, data);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        return tex;
    }
