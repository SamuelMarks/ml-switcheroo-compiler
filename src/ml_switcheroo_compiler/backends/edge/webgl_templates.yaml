templates:
  matmul:
    body: "#version 300 es\nprecision highp float;\nuniform sampler2D A;\nuniform\
      \ sampler2D B;\nuniform int M;\nuniform int N;\nuniform int K;\nout vec4 fragColor;\n\
      void main() {\n    ivec2 outCoord = ivec2(gl_FragCoord.xy);\n    int row = outCoord.y;\n\
      \    int col = outCoord.x;\n    float sum = 0.0;\n    for (int i = 0; i < K;\
      \ ++i) {\n        float a = texelFetch(A, ivec2(i, row), 0).r;\n        float\
      \ b = texelFetch(B, ivec2(col, i), 0).r;\n        sum += a * b;\n    }\n   \
      \ fragColor = vec4(sum, 0.0, 0.0, 0.0);\n}\n"
    uniforms:
    - M
    - N
    - K
    custom_setup: 'gl.uniform1i(gl.getUniformLocation(prog_{clean_id}, ''M''), {height});

      gl.uniform1i(gl.getUniformLocation(prog_{clean_id}, ''N''), {width});

      gl.uniform1i(gl.getUniformLocation(prog_{clean_id}, ''K''), {k_dim});

      '
  add:
    body: "#version 300 es\nprecision highp float;\nuniform sampler2D A;\nuniform\
      \ sampler2D B;\nout vec4 fragColor;\nvoid main() {\n    ivec2 coord = ivec2(gl_FragCoord.xy);\n\
      \    float a = texelFetch(A, coord, 0).r;\n    float b = texelFetch(B, coord,\
      \ 0).r;\n    fragColor = vec4(a + b, 0.0, 0.0, 0.0);\n}\n"
  sub:
    body: "#version 300 es\nprecision highp float;\nuniform sampler2D A;\nuniform\
      \ sampler2D B;\nout vec4 fragColor;\nvoid main() {\n    ivec2 coord = ivec2(gl_FragCoord.xy);\n\
      \    float a = texelFetch(A, coord, 0).r;\n    float b = texelFetch(B, coord,\
      \ 0).r;\n    fragColor = vec4(a - b, 0.0, 0.0, 0.0);\n}\n"
  mul:
    body: "#version 300 es\nprecision highp float;\nuniform sampler2D A;\nuniform\
      \ sampler2D B;\nout vec4 fragColor;\nvoid main() {\n    ivec2 coord = ivec2(gl_FragCoord.xy);\n\
      \    float a = texelFetch(A, coord, 0).r;\n    float b = texelFetch(B, coord,\
      \ 0).r;\n    fragColor = vec4(a * b, 0.0, 0.0, 0.0);\n}\n"
  div:
    body: "#version 300 es\nprecision highp float;\nuniform sampler2D A;\nuniform\
      \ sampler2D B;\nout vec4 fragColor;\nvoid main() {\n    ivec2 coord = ivec2(gl_FragCoord.xy);\n\
      \    float a = texelFetch(A, coord, 0).r;\n    float b = texelFetch(B, coord,\
      \ 0).r;\n    fragColor = vec4(a / b, 0.0, 0.0, 0.0);\n}\n"
  relu:
    body: "#version 300 es\nprecision highp float;\nuniform sampler2D A;\nout vec4\
      \ fragColor;\nvoid main() {\n    ivec2 coord = ivec2(gl_FragCoord.xy);\n   \
      \ float a = texelFetch(A, coord, 0).r;\n    fragColor = vec4(max(0.0, a), 0.0,\
      \ 0.0, 0.0);\n}\n"
  sigmoid:
    body: "#version 300 es\nprecision highp float;\nuniform sampler2D A;\nout vec4\
      \ fragColor;\nvoid main() {\n    ivec2 coord = ivec2(gl_FragCoord.xy);\n   \
      \ float a = texelFetch(A, coord, 0).r;\n    fragColor = vec4(1.0 / (1.0 + exp(-a)),\
      \ 0.0, 0.0, 0.0);\n}\n"
  tanh:
    body: "#version 300 es\nprecision highp float;\nuniform sampler2D A;\nout vec4\
      \ fragColor;\nvoid main() {\n    ivec2 coord = ivec2(gl_FragCoord.xy);\n   \
      \ float a = texelFetch(A, coord, 0).r;\n    fragColor = vec4(tanh(a), 0.0, 0.0,\
      \ 0.0);\n}\n"
  exp:
    body: "#version 300 es\nprecision highp float;\nuniform sampler2D A;\nout vec4\
      \ fragColor;\nvoid main() {\n    ivec2 coord = ivec2(gl_FragCoord.xy);\n   \
      \ float a = texelFetch(A, coord, 0).r;\n    fragColor = vec4(exp(a), 0.0, 0.0,\
      \ 0.0);\n}\n"
  log:
    body: "#version 300 es\nprecision highp float;\nuniform sampler2D A;\nout vec4\
      \ fragColor;\nvoid main() {\n    ivec2 coord = ivec2(gl_FragCoord.xy);\n   \
      \ float a = texelFetch(A, coord, 0).r;\n    fragColor = vec4(log(a), 0.0, 0.0,\
      \ 0.0);\n}\n"
  conv2d:
    body: "#version 300 es\nprecision highp float;\nuniform sampler2D A;\nuniform\
      \ sampler2D B;\nuniform int in_h;\nuniform int in_w;\nuniform int k_h;\nuniform\
      \ int k_w;\nuniform int stride_h;\nuniform int stride_w;\nuniform int pad_h;\n\
      uniform int pad_w;\nout vec4 fragColor;\nvoid main() {\n    ivec2 outCoord =\
      \ ivec2(gl_FragCoord.xy);\n    int out_x = outCoord.x;\n    int out_y = outCoord.y;\n\
      \    float sum = 0.0;\n    for (int kh = 0; kh < k_h; ++kh) {\n        for (int\
      \ kw = 0; kw < k_w; ++kw) {\n            int in_x = out_x * stride_w + kw -\
      \ pad_w;\n            int in_y = out_y * stride_h + kh - pad_h;\n          \
      \  if (in_x >= 0 && in_x < in_w && in_y >= 0 && in_y < in_h) {\n           \
      \     float a = texelFetch(A, ivec2(in_x, in_y), 0).r;\n                float\
      \ b = texelFetch(B, ivec2(kw, kh), 0).r;\n                sum += a * b;\n  \
      \          }\n        }\n    }\n    fragColor = vec4(sum, 0.0, 0.0, 0.0);\n\
      }\n"
    uniforms:
    - in_h
    - in_w
    - k_h
    - k_w
    - stride_h
    - stride_w
    - pad_h
    - pad_w
    custom_setup: 'gl.uniform1i(gl.getUniformLocation(prog_{clean_id}, ''in_h''),
      {in_h});

      gl.uniform1i(gl.getUniformLocation(prog_{clean_id}, ''in_w''), {in_w});

      gl.uniform1i(gl.getUniformLocation(prog_{clean_id}, ''k_h''), {k_h});

      gl.uniform1i(gl.getUniformLocation(prog_{clean_id}, ''k_w''), {k_w});

      gl.uniform1i(gl.getUniformLocation(prog_{clean_id}, ''stride_h''), 1);

      gl.uniform1i(gl.getUniformLocation(prog_{clean_id}, ''stride_w''), 1);

      gl.uniform1i(gl.getUniformLocation(prog_{clean_id}, ''pad_h''), 0);

      gl.uniform1i(gl.getUniformLocation(prog_{clean_id}, ''pad_w''), 0);

      '
