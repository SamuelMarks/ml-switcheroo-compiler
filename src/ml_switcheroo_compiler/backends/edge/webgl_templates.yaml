  batchnorm:
    body: "#version 300 es\nprecision highp float;\nuniform sampler2D A;\nuniform\
      \ float mean;\nuniform float var;\nuniform float gamma;\nuniform float beta;\n\
      uniform float eps;\nout vec4 fragColor;\nvoid main() {\n    ivec2 coord = ivec2(gl_FragCoord.xy);\n\
      \    float x = texelFetch(A, coord, 0).r;\n    float std_val = sqrt(var + eps);\n\
      \    float norm = (x - mean) / std_val;\n    fragColor = vec4(norm * gamma +\
      \ beta, 0.0, 0.0, 0.0);\n}\n"
    uniforms:
    - mean
    - var
    - gamma
    - beta
    - eps
    custom_setup: 'gl.uniform1f(gl.getUniformLocation(prog_{clean_id}, ''mean''),
      0.0);

      gl.uniform1f(gl.getUniformLocation(prog_{clean_id}, ''var''), 1.0);

      gl.uniform1f(gl.getUniformLocation(prog_{clean_id}, ''gamma''), 1.0);

      gl.uniform1f(gl.getUniformLocation(prog_{clean_id}, ''beta''), 0.0);

      gl.uniform1f(gl.getUniformLocation(prog_{clean_id}, ''eps''), 1e-5);

      '
