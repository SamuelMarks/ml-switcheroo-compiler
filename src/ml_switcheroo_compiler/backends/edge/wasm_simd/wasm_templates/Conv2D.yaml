Conv2D:
  body: "// SIMD Conv2D (Standard)
int B = {B};
int out_channels = {out_channels};

    int out_height = {out_height};
int out_width = {out_width};
int in_channels
    \ = {in_channels};
int in_height = {in_height};
int in_width = {in_width};

    int filter_h = {filter_h};
int filter_w = {filter_w};
int stride_h = {stride_h};

    int stride_w = {stride_w};

for (int b = 0; b < B; ++b) {{
    for (int oc
    \ = 0; oc < out_channels; ++oc) {{
        for (int oh = 0; oh < out_height;
    \ ++oh) {{
            for (int ow = 0; ow < out_width; ++ow) {{

    \       float acc = 0.0f;
                for (int ic = 0; ic < in_channels;
    \ ++ic) {{
                    for (int fh = 0; fh < filter_h; ++fh) {{

    \                      for (int fw = 0; fw < filter_w; ++fw) {{

    \                int ih = oh * stride_h + fh;

    \  int iw = ow * stride_w + fw;
                                if (ih < in_height
    \ && iw < in_width) {{
                                    int in_idx = ((b
    \ * in_channels + ic) * in_height + ih) * in_width + iw;

    \                int w_idx = ((oc * in_channels + ic) * filter_h + fh) * filter_w
    \ + fw;
                                    acc += buf_{in0}[in_idx] * buf_{in1}[w_idx];

    \                                }}
                        }}

    \       }}
                }}
                int out_idx = ((b * out_channels
    \ + oc) * out_height + oh) * out_width + ow;
                buf_{clean_id}[out_idx]
    \ = acc;
            }}
        }}
    }}
}}
"
