im2col_conv2d:
  body: "// SIMD Conv2D (Dynamic Boundary Peeling and Stride Handling)
int B = {B};

    int out_channels = {out_channels};
int out_height = {out_height};
int out_width
    \ = {out_width};
int in_channels = {in_channels};
int in_height = {in_height};

    int in_width = {in_width};
int filter_h = {filter_h};
int filter_w = {filter_w};

    int stride_h = {stride_h};
int stride_w = {stride_w};

for (int b = 0; b <
    \ B; ++b) {{
    for (int oc = 0; oc < out_channels; ++oc) {{
        for (int
    \ oh = 0; oh < out_height; ++oh) {{
            int ow = 0;
            for
    \ (; ow + 3 < out_width; ow += 4) {{
                v128_t acc = wasm_f32x4_splat(0.0f);

    \                for (int ic = 0; ic < in_channels; ++ic) {{

    \     for (int fh = 0; fh < filter_h; ++fh) {{
                        for (int
    \ fw = 0; fw < filter_w; ++fw) {{
                            int w_idx = ((oc
    \ * in_channels + ic) * filter_h + fh) * filter_w + fw;

    \        v128_t w_val = wasm_f32x4_splat(buf_{in1}[w_idx]);

    \             int ih = oh * stride_h + fh;
                            int iw0
    \ = ow * stride_w + fw;
                            int iw1 = (ow + 1) * stride_w
    \ + fw;
                            int iw2 = (ow + 2) * stride_w + fw;

    \                          int iw3 = (ow + 3) * stride_w + fw;

    \                float v0 = (ih < in_height && iw0 < in_width) ? buf_{in0}[((b
    \ * in_channels + ic) * in_height + ih) * in_width + iw0] : 0.0f;

    \                  float v1 = (ih < in_height && iw1 < in_width) ? buf_{in0}[((b
    \ * in_channels + ic) * in_height + ih) * in_width + iw1] : 0.0f;

    \                  float v2 = (ih < in_height && iw2 < in_width) ? buf_{in0}[((b
    \ * in_channels + ic) * in_height + ih) * in_width + iw2] : 0.0f;

    \                  float v3 = (ih < in_height && iw3 < in_width) ? buf_{in0}[((b
    \ * in_channels + ic) * in_height + ih) * in_width + iw3] : 0.0f;

    \                  v128_t in_vec = wasm_f32x4_make(v0, v1, v2, v3);

    \                    acc = wasm_f32x4_add(acc, wasm_f32x4_mul(in_vec, w_val));

    \                        }}
                    }}
                }}

    \            int out_idx = ((b * out_channels + oc) * out_height + oh) * out_width
    \ + ow;
                wasm_v128_store(&buf_{clean_id}[out_idx], acc);

    \          }}
            for (; ow < out_width; ++ow) {{
                float
    \ acc = 0.0f;
                for (int ic = 0; ic < in_channels; ++ic) {{

    \                    for (int fh = 0; fh < filter_h; ++fh) {{

    \           for (int fw = 0; fw < filter_w; ++fw) {{

    \      int ih = oh * stride_h + fh;
                            int iw = ow
    \ * stride_w + fw;
                            if (ih < in_height && iw < in_width)
    \ {{
                                int in_idx = ((b * in_channels + ic) *
    \ in_height + ih) * in_width + iw;
                                int w_idx
    \ = ((oc * in_channels + ic) * filter_h + fh) * filter_w + fw;

    \                   acc += buf_{in0}[in_idx] * buf_{in1}[w_idx];

    \                 }}
                        }}
                    }}

    \             }}
                int out_idx = ((b * out_channels + oc) * out_height
    \ + oh) * out_width + ow;
                buf_{clean_id}[out_idx] = acc;

    \           }}
        }}
    }}
}}
"
