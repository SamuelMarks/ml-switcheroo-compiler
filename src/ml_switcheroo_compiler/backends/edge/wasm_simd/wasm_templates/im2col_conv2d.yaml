im2col_conv2d:
  body: "// SIMD Conv2D (Direct Loop Peeling)\nint out_width = {out_width};\nint out_height\
    \ = {out_height};\nint in_channels = {in_channels};\nint out_channels = {out_channels};\n\
    int stride_h = {stride_h};\nint stride_w = {stride_w};\nint filter_h = {filter_h};\n\
    int filter_w = {filter_w};\n\nint limit_c = out_channels - (out_channels % 4);\n\
    for (int out_y = 0; out_y < out_height; out_y++) {{\n    for (int out_x = 0; out_x\
    \ < out_width; out_x++) {{\n        // SIMD Vectorized Output Channels\n     \
    \   for (int oc = 0; oc < limit_c; oc += 4) {{\n            v128_t sum_vec = wasm_f32x4_splat(0.0f);\n\
    \            for (int ic = 0; ic < in_channels; ic++) {{\n                for\
    \ (int fy = 0; fy < filter_h; fy++) {{\n                    for (int fx = 0; fx\
    \ < filter_w; fx++) {{\n                        int in_y = out_y * stride_h +\
    \ fy;\n                        int in_x = out_x * stride_w + fx;\n           \
    \             int in_idx = (in_y * {in_width} + in_x) * in_channels + ic;\n  \
    \                      v128_t in_val = wasm_f32x4_splat(buf_{in0}[in_idx]);\n\n\
    \                        int w_idx = ((fy * filter_w + fx) * in_channels + ic)\
    \ * out_channels + oc;\n                        v128_t w_val = wasm_v128_load(&buf_{in1}[w_idx]);\n\
    \n                        sum_vec = wasm_f32x4_add(sum_vec, wasm_f32x4_mul(in_val,\
    \ w_val));\n                    }}\n                }}\n            }}\n     \
    \       int out_idx = (out_y * out_width + out_x) * out_channels + oc;\n     \
    \       wasm_v128_store(&buf_{clean_id}[out_idx], sum_vec);\n        }}\n    \
    \    // Remainder loop\n        for (int oc = limit_c; oc < out_channels; oc++)\
    \ {{\n            float sum = 0.0f;\n            for (int ic = 0; ic < in_channels;\
    \ ic++) {{\n                for (int fy = 0; fy < filter_h; fy++) {{\n       \
    \             for (int fx = 0; fx < filter_w; fx++) {{\n                     \
    \   int in_y = out_y * stride_h + fy;\n                        int in_x = out_x\
    \ * stride_w + fx;\n                        int in_idx = (in_y * {in_width} +\
    \ in_x) * in_channels + ic;\n                        int w_idx = ((fy * filter_w\
    \ + fx) * in_channels + ic) * out_channels + oc;\n                        sum\
    \ += buf_{in0}[in_idx] * buf_{in1}[w_idx];\n                    }}\n         \
    \       }}\n            }}\n            int out_idx = (out_y * out_width + out_x)\
    \ * out_channels + oc;\n            buf_{clean_id}[out_idx] = sum;\n        }}\n\
    \    }}\n}}\n"
