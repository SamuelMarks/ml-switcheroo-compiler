matmul:
  body: "// SIMD MatMul with dynamic boundary peeling
int M = {M};
int N = {N};

    int K = {K};
for (int i = 0; i < M; ++i) {{
    int j = 0;
    for (; j + 3
    \ < N; j += 4) {{
        v128_t sum_vec = wasm_f32x4_splat(0.0f);

    \ for (int k = 0; k < K; ++k) {{
            v128_t a_val = wasm_f32x4_splat(buf_{in0}[i
    \ * K + k]);
            v128_t b_val = wasm_v128_load(&buf_{in1}[k * N + j]);

    \            sum_vec = wasm_f32x4_add(sum_vec, wasm_f32x4_mul(a_val, b_val));

    \        }}
        wasm_v128_store(&buf_{clean_id}[i * N + j], sum_vec);

    \   }}
    // Boundary peeling for remaining columns
    for (; j < N; ++j)
    \ {{
        float sum = 0.0f;
        for (int k = 0; k < K; ++k) {{

    \         sum += buf_{in0}[i * K + k] * buf_{in1}[k * N + j];
        }}

    \      buf_{clean_id}[i * N + j] = sum;
    }}
}}
"
