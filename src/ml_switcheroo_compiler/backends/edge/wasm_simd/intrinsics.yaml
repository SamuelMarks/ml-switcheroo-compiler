# WASM SIMD v128 Intrinsic Mappings for Math Ops
# Uses standard wasm_f32x4 intrinsics

intrinsics:
  Abs:
    macro_name: "WASM_ABS_F32X4"
    simd_expr: |
      return wasm_f32x4_abs(x);
    scalar_fallback: "std::abs({0})"
  Neg:
    macro_name: "WASM_NEG_F32X4"
    simd_expr: |
      return wasm_f32x4_neg(x);
    scalar_fallback: "-{0}"
  Sqrt:
    macro_name: "WASM_SQRT_F32X4"
    simd_expr: |
      return wasm_f32x4_sqrt(x);
    scalar_fallback: "std::sqrt({0})"
  Relu:
    macro_name: "WASM_RELU_F32X4"
    simd_expr: |
      return wasm_f32x4_max(x, wasm_f32x4_splat(0.0f));
    scalar_fallback: "std::max(0.0f, {0})"
  Exp:
    macro_name: "WASM_EXP_F32X4"
    simd_expr: |
      v128_t sum = wasm_f32x4_add(wasm_f32x4_splat(1.0f), wasm_f32x4_add(x, wasm_f32x4_mul(wasm_f32x4_splat(0.5f), wasm_f32x4_mul(x, x))));
      return sum;
    scalar_fallback: "std::exp({0})"
  Log:
    macro_name: "WASM_LOG_F32X4"
    simd_expr: |
      v128_t z = wasm_f32x4_div(wasm_f32x4_sub(x, wasm_f32x4_splat(1.0f)), wasm_f32x4_add(x, wasm_f32x4_splat(1.0f)));
      v128_t z2 = wasm_f32x4_mul(z, z);
      v128_t sum = wasm_f32x4_add(z, wasm_f32x4_mul(wasm_f32x4_splat(0.333333333f), wasm_f32x4_mul(z2, z)));
      return wasm_f32x4_mul(wasm_f32x4_splat(2.0f), sum);
    scalar_fallback: "std::log({0})"
  Tanh:
    macro_name: "WASM_TANH_F32X4"
    simd_expr: |
      v128_t x2 = wasm_f32x4_mul(x, x);
      v128_t num = wasm_f32x4_add(x, wasm_f32x4_mul(x2, x));
      v128_t den = wasm_f32x4_add(wasm_f32x4_splat(1.0f), x2);
      return wasm_f32x4_div(num, den);
    scalar_fallback: "std::tanh({0})"
  Sigmoid:
    macro_name: "WASM_SIGMOID_F32X4"
    simd_expr: |
      v128_t neg_x = wasm_f32x4_neg(x);
      v128_t exp_nx = wasm_f32x4_add(wasm_f32x4_splat(1.0f), wasm_f32x4_add(neg_x, wasm_f32x4_mul(wasm_f32x4_splat(0.5f), wasm_f32x4_mul(neg_x, neg_x))));
      v128_t den = wasm_f32x4_add(wasm_f32x4_splat(1.0f), exp_nx);
      return wasm_f32x4_div(wasm_f32x4_splat(1.0f), den);
    scalar_fallback: "1.0f / (1.0f + std::exp(-{0}))"
  Sin:
    macro_name: "WASM_SIN_F32X4"
    simd_expr: |
      v128_t x2 = wasm_f32x4_mul(x, x);
      v128_t x3 = wasm_f32x4_mul(x2, x);
      return wasm_f32x4_sub(x, wasm_f32x4_mul(wasm_f32x4_splat(0.166666666f), x3));
    scalar_fallback: "std::sin({0})"
  Cos:
    macro_name: "WASM_COS_F32X4"
    simd_expr: |
      v128_t x2 = wasm_f32x4_mul(x, x);
      return wasm_f32x4_sub(wasm_f32x4_splat(1.0f), wasm_f32x4_mul(wasm_f32x4_splat(0.5f), x2));
    scalar_fallback: "std::cos({0})"
  Ceil:
    macro_name: "WASM_CEIL_F32X4"
    simd_expr: |
      return wasm_f32x4_ceil(x);
    scalar_fallback: "std::ceil({0})"
  Floor:
    macro_name: "WASM_FLOOR_F32X4"
    simd_expr: |
      return wasm_f32x4_floor(x);
    scalar_fallback: "std::floor({0})"
  Round:
    macro_name: "WASM_ROUND_F32X4"
    simd_expr: |
      return wasm_f32x4_nearest(x);
    scalar_fallback: "std::round({0})"
  Trig:
    macro_name: "WASM_TRIG_F32X4"
    simd_expr: |
      v128_t x2 = wasm_f32x4_mul(x, x);
      v128_t x3 = wasm_f32x4_mul(x2, x);
      return wasm_f32x4_sub(x, wasm_f32x4_mul(wasm_f32x4_splat(0.166666666f), x3));
    scalar_fallback: "std::sin({0})"
  Add:
    macro_name: "WASM_ADD_F32X4"
    simd_expr: |
      return wasm_f32x4_add(a, b);
    scalar_fallback: "{0} + {1}"
  Sub:
    macro_name: "WASM_SUB_F32X4"
    simd_expr: |
      return wasm_f32x4_sub(a, b);
    scalar_fallback: "{0} - {1}"
  Mul:
    macro_name: "WASM_MUL_F32X4"
    simd_expr: |
      return wasm_f32x4_mul(a, b);
    scalar_fallback: "{0} * {1}"
  Div:
    macro_name: "WASM_DIV_F32X4"
    simd_expr: |
      return wasm_f32x4_div(a, b);
    scalar_fallback: "{0} / {1}"
  Min:
    macro_name: "WASM_MIN_F32X4"
    simd_expr: |
      return wasm_f32x4_min(a, b);
    scalar_fallback: "std::min({0}, {1})"
  Max:
    macro_name: "WASM_MAX_F32X4"
    simd_expr: |
      return wasm_f32x4_max(a, b);
    scalar_fallback: "std::max({0}, {1})"
  Minimum:
    macro_name: "WASM_MINIMUM_F32X4"
    simd_expr: |
      return wasm_f32x4_min(a, b);
    scalar_fallback: "std::min({0}, {1})"
  Maximum:
    macro_name: "WASM_MAXIMUM_F32X4"
    simd_expr: |
      return wasm_f32x4_max(a, b);
    scalar_fallback: "std::max({0}, {1})"
  Square:
    macro_name: "WASM_SQUARE_F32X4"
    simd_expr: |
      return wasm_f32x4_mul(x, x);
    scalar_fallback: "{0} * {0}"
  Cube:
    macro_name: "WASM_CUBE_F32X4"
    simd_expr: |
      return wasm_f32x4_mul(wasm_f32x4_mul(x, x), x);
    scalar_fallback: "{0} * {0} * {0}"
  Reciprocal:
    macro_name: "WASM_RECIPROCAL_F32X4"
    simd_expr: |
      return wasm_f32x4_div(wasm_f32x4_splat(1.0f), x);
    scalar_fallback: "1.0f / {0}"
  Rsqrt:
    macro_name: "WASM_RSQRT_F32X4"
    simd_expr: |
      return wasm_f32x4_div(wasm_f32x4_splat(1.0f), wasm_f32x4_sqrt(x));
    scalar_fallback: "1.0f / std::sqrt({0})"
  Trunc:
    macro_name: "WASM_TRUNC_F32X4"
    simd_expr: |
      return wasm_f32x4_trunc(x);
    scalar_fallback: "std::trunc({0})"
  Sign:
    macro_name: "WASM_SIGN_F32X4"
    simd_expr: |
      v128_t gt0 = wasm_f32x4_gt(x, wasm_f32x4_splat(0.0f));
      v128_t lt0 = wasm_f32x4_lt(x, wasm_f32x4_splat(0.0f));
      v128_t pos = wasm_v128_bitselect(wasm_f32x4_splat(1.0f), wasm_f32x4_splat(0.0f), gt0);
      return wasm_v128_bitselect(wasm_f32x4_splat(-1.0f), pos, lt0);
    scalar_fallback: "({0} > 0.0f) ? 1.0f : (({0} < 0.0f) ? -1.0f : 0.0f)"
  Relu6:
    macro_name: "WASM_RELU6_F32X4"
    simd_expr: |
      return wasm_f32x4_min(wasm_f32x4_max(x, wasm_f32x4_splat(0.0f)), wasm_f32x4_splat(6.0f));
    scalar_fallback: "std::min(std::max(0.0f, {0}), 6.0f)"
  LeakyRelu:
    macro_name: "WASM_LEAKY_RELU_F32X4"
    simd_expr: |
      v128_t mask = wasm_f32x4_lt(x, wasm_f32x4_splat(0.0f));
      v128_t scaled = wasm_f32x4_mul(x, wasm_f32x4_splat(0.01f));
      return wasm_v128_bitselect(scaled, x, mask);
    scalar_fallback: "({0} < 0.0f) ? (0.01f * {0}) : {0}"
  HardSwish:
    macro_name: "WASM_HARDSWISH_F32X4"
    simd_expr: |
      v128_t shifted = wasm_f32x4_add(x, wasm_f32x4_splat(3.0f));
      v128_t clamped = wasm_f32x4_min(wasm_f32x4_max(shifted, wasm_f32x4_splat(0.0f)), wasm_f32x4_splat(6.0f));
      return wasm_f32x4_mul(x, wasm_f32x4_mul(clamped, wasm_f32x4_splat(0.166666667f)));
    scalar_fallback: "{0} * std::max(0.0f, std::min(6.0f, {0} + 3.0f)) / 6.0f"
  HardSigmoid:
    macro_name: "WASM_HARDSIGMOID_F32X4"
    simd_expr: |
      v128_t scaled = wasm_f32x4_add(wasm_f32x4_mul(x, wasm_f32x4_splat(0.2f)), wasm_f32x4_splat(0.5f));
      return wasm_f32x4_min(wasm_f32x4_max(scaled, wasm_f32x4_splat(0.0f)), wasm_f32x4_splat(1.0f));
    scalar_fallback: "std::max(0.0f, std::min(1.0f, 0.2f * {0} + 0.5f))"
  GELU:
    macro_name: "WASM_GELU_F32X4"
    simd_expr: |
      v128_t x3 = wasm_f32x4_mul(wasm_f32x4_mul(x, x), x);
      v128_t inner = wasm_f32x4_mul(wasm_f32x4_splat(0.79788456f), wasm_f32x4_add(x, wasm_f32x4_mul(wasm_f32x4_splat(0.044715f), x3)));
      v128_t in2 = wasm_f32x4_mul(inner, inner);
      v128_t num = wasm_f32x4_add(inner, wasm_f32x4_mul(in2, inner));
      v128_t den = wasm_f32x4_add(wasm_f32x4_splat(1.0f), in2);
      v128_t tanh_val = wasm_f32x4_div(num, den);
      return wasm_f32x4_mul(wasm_f32x4_mul(wasm_f32x4_splat(0.5f), x), wasm_f32x4_add(wasm_f32x4_splat(1.0f), tanh_val));
    scalar_fallback: "0.5f * {0} * (1.0f + std::tanh(0.79788456f * ({0} + 0.044715f * {0} * {0} * {0})))"
  SiLU:
    macro_name: "WASM_SILU_F32X4"
    simd_expr: |
      v128_t neg_x = wasm_f32x4_neg(x);
      v128_t exp_nx = wasm_f32x4_add(wasm_f32x4_splat(1.0f), wasm_f32x4_add(neg_x, wasm_f32x4_mul(wasm_f32x4_splat(0.5f), wasm_f32x4_mul(neg_x, neg_x))));
      v128_t sig = wasm_f32x4_div(wasm_f32x4_splat(1.0f), wasm_f32x4_add(wasm_f32x4_splat(1.0f), exp_nx));
      return wasm_f32x4_mul(x, sig);
    scalar_fallback: "{0} / (1.0f + std::exp(-{0}))"
  Softplus:
    macro_name: "WASM_SOFTPLUS_F32X4"
    simd_expr: |
      v128_t ex = wasm_f32x4_add(wasm_f32x4_splat(1.0f), wasm_f32x4_add(x, wasm_f32x4_mul(wasm_f32x4_splat(0.5f), wasm_f32x4_mul(x, x))));
      v128_t z = wasm_f32x4_div(ex, wasm_f32x4_add(ex, wasm_f32x4_splat(2.0f)));
      v128_t z2 = wasm_f32x4_mul(z, z);
      return wasm_f32x4_mul(wasm_f32x4_splat(2.0f), wasm_f32x4_add(z, wasm_f32x4_mul(wasm_f32x4_splat(0.333333333f), wasm_f32x4_mul(z2, z))));
    scalar_fallback: "std::log1p(std::exp({0}))"
  Softsign:
    macro_name: "WASM_SOFTSIGN_F32X4"
    simd_expr: |
      v128_t den = wasm_f32x4_add(wasm_f32x4_splat(1.0f), wasm_f32x4_abs(x));
      return wasm_f32x4_div(x, den);
    scalar_fallback: "{0} / (1.0f + std::abs({0}))"
  Equal:
    macro_name: "WASM_EQUAL_F32X4"
    simd_expr: |
      v128_t mask = wasm_f32x4_eq(a, b);
      return wasm_v128_bitselect(wasm_f32x4_splat(1.0f), wasm_f32x4_splat(0.0f), mask);
    scalar_fallback: "({0} == {1}) ? 1.0f : 0.0f"
  NotEqual:
    macro_name: "WASM_NOTEQUAL_F32X4"
    simd_expr: |
      v128_t mask = wasm_f32x4_ne(a, b);
      return wasm_v128_bitselect(wasm_f32x4_splat(1.0f), wasm_f32x4_splat(0.0f), mask);
    scalar_fallback: "({0} != {1}) ? 1.0f : 0.0f"
  Greater:
    macro_name: "WASM_GREATER_F32X4"
    simd_expr: |
      v128_t mask = wasm_f32x4_gt(a, b);
      return wasm_v128_bitselect(wasm_f32x4_splat(1.0f), wasm_f32x4_splat(0.0f), mask);
    scalar_fallback: "({0} > {1}) ? 1.0f : 0.0f"
  GreaterEqual:
    macro_name: "WASM_GREATEREQUAL_F32X4"
    simd_expr: |
      v128_t mask = wasm_f32x4_ge(a, b);
      return wasm_v128_bitselect(wasm_f32x4_splat(1.0f), wasm_f32x4_splat(0.0f), mask);
    scalar_fallback: "({0} >= {1}) ? 1.0f : 0.0f"
  Less:
    macro_name: "WASM_LESS_F32X4"
    simd_expr: |
      v128_t mask = wasm_f32x4_lt(a, b);
      return wasm_v128_bitselect(wasm_f32x4_splat(1.0f), wasm_f32x4_splat(0.0f), mask);
    scalar_fallback: "({0} < {1}) ? 1.0f : 0.0f"
  LessEqual:
    macro_name: "WASM_LESSEQUAL_F32X4"
    simd_expr: |
      v128_t mask = wasm_f32x4_le(a, b);
      return wasm_v128_bitselect(wasm_f32x4_splat(1.0f), wasm_f32x4_splat(0.0f), mask);
    scalar_fallback: "({0} <= {1}) ? 1.0f : 0.0f"
  LogicalAnd:
    macro_name: "WASM_LOGICALAND_F32X4"
    simd_expr: |
      v128_t a_nz = wasm_f32x4_ne(a, wasm_f32x4_splat(0.0f));
      v128_t b_nz = wasm_f32x4_ne(b, wasm_f32x4_splat(0.0f));
      v128_t mask = wasm_v128_and(a_nz, b_nz);
      return wasm_v128_bitselect(wasm_f32x4_splat(1.0f), wasm_f32x4_splat(0.0f), mask);
    scalar_fallback: "({0} != 0.0f && {1} != 0.0f) ? 1.0f : 0.0f"
  LogicalOr:
    macro_name: "WASM_LOGICALOR_F32X4"
    simd_expr: |
      v128_t a_nz = wasm_f32x4_ne(a, wasm_f32x4_splat(0.0f));
      v128_t b_nz = wasm_f32x4_ne(b, wasm_f32x4_splat(0.0f));
      v128_t mask = wasm_v128_or(a_nz, b_nz);
      return wasm_v128_bitselect(wasm_f32x4_splat(1.0f), wasm_f32x4_splat(0.0f), mask);
    scalar_fallback: "({0} != 0.0f || {1} != 0.0f) ? 1.0f : 0.0f"
  LogicalXor:
    macro_name: "WASM_LOGICALXOR_F32X4"
    simd_expr: |
      v128_t a_nz = wasm_f32x4_ne(a, wasm_f32x4_splat(0.0f));
      v128_t b_nz = wasm_f32x4_ne(b, wasm_f32x4_splat(0.0f));
      v128_t mask = wasm_v128_xor(a_nz, b_nz);
      return wasm_v128_bitselect(wasm_f32x4_splat(1.0f), wasm_f32x4_splat(0.0f), mask);
    scalar_fallback: "(({0} != 0.0f) != ({1} != 0.0f)) ? 1.0f : 0.0f"
  UnknownSIMD_Op_Test:
    macro_name: ""
    simd_expr: ""
    scalar_fallback: "{0}"

scalars:
  logicaland: "return (a != 0.0f && b != 0.0f) ? 1.0f : 0.0f;"
  logicalor: "return (a != 0.0f || b != 0.0f) ? 1.0f : 0.0f;"
  logicalxor: "return ((a != 0.0f) != (b != 0.0f)) ? 1.0f : 0.0f;"
  equal: "return (a == b) ? 1.0f : 0.0f;"
  notequal: "return (a != b) ? 1.0f : 0.0f;"
  greater: "return (a > b) ? 1.0f : 0.0f;"
  less: "return (a < b) ? 1.0f : 0.0f;"
  greaterequal: "return (a >= b) ? 1.0f : 0.0f;"
  lessequal: "return (a <= b) ? 1.0f : 0.0f;"
  floordivide: "return std::floor(a / b);"
  power: "return std::pow(a, b);"
  sign: "return (a > 0.0f) ? 1.0f : ((a < 0.0f) ? -1.0f : 0.0f);"
  ceil: "return std::ceil(a);"
  floor: "return std::floor(a);"
  round: "return std::round(a);"
  rsqrt: "return 1.0f / std::sqrt(a);"
  reciprocal: "return 1.0f / a;"
  square: "return a * a;"
  log1p: "return std::log1p(a);"
  expm1: "return std::expm1(a);"
  log2: "return std::log2(a);"
  log10: "return std::log10(a);"
  sin: "return std::sin(a);"
  cos: "return std::cos(a);"
  tan: "return std::tan(a);"
  asin: "return std::asin(a);"
  acos: "return std::acos(a);"
  atan: "return std::atan(a);"
  sinh: "return std::sinh(a);"
  cosh: "return std::cosh(a);"
  tanh: "return std::tanh(a);"
  asinh: "return std::asinh(a);"
  acosh: "return std::acosh(a);"
  atanh: "return std::atanh(a);"
  erf: "return std::erf(a);"
  erfc: "return std::erfc(a);"
  gelu: "return 0.5f * a * (1.0f + std::tanh(0.7978845608f * (a + 0.044715f * a * a * a)));"
  swish: "return a / (1.0f + std::exp(-a));"
  silu: "return a / (1.0f + std::exp(-a));"
  mish: "return a * std::tanh(std::log1p(std::exp(a)));"
  softplus: "return std::log1p(std::exp(a));"
  softsign: "return a / (1.0f + std::abs(a));"
  hardswish: "return a * std::max(0.0f, std::min(6.0f, a + 3.0f)) / 6.0f;"
  hardsigmoid: "return std::max(0.0f, std::min(1.0f, 0.2f * a + 0.5f));"
  sigmoid: "return 1.0f / (1.0f + std::exp(-a));"
  cast: "return a;"
  bessel_j0: "return (float)::j0((double)a);"
  bessel_j1: "return (float)::j1((double)a);"
  hypot: "return std::hypot(a, b);"
  fmod: "return std::fmod(a, b);"
  remainder: "return std::remainder(a, b);"
  atan2: "return std::atan2(a, b);"
  cbrt: "return std::cbrt(a);"
  minimum: "return std::min(a, b);"
  maximum: "return std::max(a, b);"
  unknownsimd_op_test: "return a;"
