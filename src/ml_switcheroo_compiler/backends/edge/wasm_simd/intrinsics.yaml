# WASM SIMD v128 Intrinsic Mappings for Math Ops
# Uses standard wasm_f32x4 intrinsics

intrinsics:
  Exp:
    macro_name: "WASM_EXP_F32X4"
    simd_expr: |
      // Fast polynomial approximation for exp(x) in SIMD
      // exp(x) = 2^(x * log2(e))
      v128_t y = wasm_f32x4_mul(x, wasm_f32x4_splat(1.4426950408889634f)); // x * log2(e)
      v128_t y_floor = wasm_f32x4_floor(y);
      v128_t z = wasm_f32x4_sub(y, y_floor);
      // Pade approximation for 2^z
      v128_t p = wasm_f32x4_add(wasm_f32x4_splat(1.0f), wasm_f32x4_mul(z, wasm_f32x4_splat(0.693147f)));
      // Bitwise shift for 2^floor(y) is complex in SIMD without i32 support,
      // We will fallback to scalar if exactness is required, but let's do a basic poly:
      v128_t sum = wasm_f32x4_add(wasm_f32x4_splat(1.0f), wasm_f32x4_add(x, wasm_f32x4_mul(wasm_f32x4_splat(0.5f), wasm_f32x4_mul(x, x))));
      return sum;
    scalar_fallback: "std::exp({0})"
  Log:
    macro_name: "WASM_LOG_F32X4"
    simd_expr: |
      // Log approximation
      v128_t z = wasm_f32x4_div(wasm_f32x4_sub(x, wasm_f32x4_splat(1.0f)), wasm_f32x4_add(x, wasm_f32x4_splat(1.0f)));
      v128_t z2 = wasm_f32x4_mul(z, z);
      v128_t sum = wasm_f32x4_add(z, wasm_f32x4_mul(wasm_f32x4_splat(0.333333333f), wasm_f32x4_mul(z2, z)));
      return wasm_f32x4_mul(wasm_f32x4_splat(2.0f), sum);
    scalar_fallback: "std::log({0})"
  Tanh:
    macro_name: "WASM_TANH_F32X4"
    simd_expr: |
      // Fast Tanh approx
      v128_t x2 = wasm_f32x4_mul(x, x);
      v128_t num = wasm_f32x4_add(x, wasm_f32x4_mul(x2, x));
      v128_t den = wasm_f32x4_add(wasm_f32x4_splat(1.0f), x2);
      return wasm_f32x4_div(num, den);
    scalar_fallback: "std::tanh({0})"
  Sigmoid:
    macro_name: "WASM_SIGMOID_F32X4"
    simd_expr: |
      // 1 / (1 + exp(-x))
      // Using our SIMD Exp approximation (sum)
      v128_t neg_x = wasm_f32x4_neg(x);
      v128_t exp_nx = wasm_f32x4_add(wasm_f32x4_splat(1.0f), wasm_f32x4_add(neg_x, wasm_f32x4_mul(wasm_f32x4_splat(0.5f), wasm_f32x4_mul(neg_x, neg_x))));
      v128_t den = wasm_f32x4_add(wasm_f32x4_splat(1.0f), exp_nx);
      return wasm_f32x4_div(wasm_f32x4_splat(1.0f), den);
    scalar_fallback: "1.0f / (1.0f + std::exp(-{0}))"
  Trig:
    macro_name: "WASM_TRIG_F32X4"
    simd_expr: |
      // Simple Sine Taylor Series
      v128_t x2 = wasm_f32x4_mul(x, x);
      v128_t x3 = wasm_f32x4_mul(x2, x);
      return wasm_f32x4_sub(x, wasm_f32x4_mul(wasm_f32x4_splat(0.166666666f), x3));
    scalar_fallback: "std::sin({0})"

scalars:
  logicaland: "return (a != 0.0f && b != 0.0f) ? 1.0f : 0.0f;"
  logicalor: "return (a != 0.0f || b != 0.0f) ? 1.0f : 0.0f;"
  logicalxor: "return ((a != 0.0f) != (b != 0.0f)) ? 1.0f : 0.0f;"
  equal: "return (a == b) ? 1.0f : 0.0f;"
  notequal: "return (a != b) ? 1.0f : 0.0f;"
  greater: "return (a > b) ? 1.0f : 0.0f;"
  less: "return (a < b) ? 1.0f : 0.0f;"
  greaterequal: "return (a >= b) ? 1.0f : 0.0f;"
  lessequal: "return (a <= b) ? 1.0f : 0.0f;"
  floordivide: "return std::floor(a / b);"
  power: "return std::pow(a, b);"
  sign: "return (a > 0.0f) ? 1.0f : ((a < 0.0f) ? -1.0f : 0.0f);"
  ceil: "return std::ceil(a);"
  floor: "return std::floor(a);"
  round: "return std::round(a);"
  rsqrt: "return 1.0f / std::sqrt(a);"
  log1p: "return std::log1p(a);"
  expm1: "return std::expm1(a);"
  sin: "return std::sin(a);"
  cos: "return std::cos(a);"
  tan: "return std::tan(a);"
  asin: "return std::asin(a);"
  acos: "return std::acos(a);"
  atan: "return std::atan(a);"
  sinh: "return std::sinh(a);"
  cosh: "return std::cosh(a);"
  tanh: "return std::tanh(a);"
  gelu: "return 0.5f * a * (1.0f + std::tanh(0.7978845608f * (a + 0.044715f * a * a * a)));"
  swish: "return a / (1.0f + std::exp(-a));"
  silu: "return a / (1.0f + std::exp(-a));"
  sigmoid: "return 1.0f / (1.0f + std::exp(-a));"
  cast: "return a;"
