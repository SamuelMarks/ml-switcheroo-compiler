# WebGPU WGSL Declarative Kernels Specification
# Defines storage buffer binding layouts, memory alignment constraints, op mappings,
# and compute shader templates for WebGPU edge execution.

bindings:
  global_bindings: |
    // WebGPU WGSL generated by ml-switcheroo-compiler
    @group(0) @binding(0) var<storage, read> buf_in0_f32: array<f32>;
    @group(0) @binding(1) var<storage, read> buf_in1_f32: array<f32>;
    @group(0) @binding(2) var<storage, read> buf_in2_f32: array<f32>;
    @group(0) @binding(3) var<storage, read_write> buf_out_f32: array<f32>;
    @group(0) @binding(4) var<storage, read> buf_in0_i32: array<i32>;
    @group(0) @binding(5) var<storage, read> buf_in1_i32: array<i32>;
    @group(0) @binding(6) var<storage, read> buf_in2_i32: array<i32>;
    @group(0) @binding(7) var<storage, read_write> buf_out_i32: array<i32>;
  storage_buffers:
    - group: 0
      binding: 0
      name: buf_in0_f32
      access: read
      dtype: f32
    - group: 0
      binding: 1
      name: buf_in1_f32
      access: read
      dtype: f32
    - group: 0
      binding: 2
      name: buf_in2_f32
      access: read
      dtype: f32
    - group: 0
      binding: 3
      name: buf_out_f32
      access: read_write
      dtype: f32
    - group: 0
      binding: 4
      name: buf_in0_i32
      access: read
      dtype: i32
    - group: 0
      binding: 5
      name: buf_in1_i32
      access: read
      dtype: i32
    - group: 0
      binding: 6
      name: buf_in2_i32
      access: read
      dtype: i32
    - group: 0
      binding: 7
      name: buf_out_i32
      access: read_write
      dtype: i32

memory_alignment:
  struct_alignment_bytes: 16
  buffer_binding_alignment_bytes: 256
  storage_buffer_offset_alignment: 256

op_mappings:
  Constant:
    template: unary
    expr: "{const_val}f"
  Add:
    template: binary
    expr: "buf_in0_f32[in0_offset] + buf_in1_f32[in1_offset]"
  add:
    template: binary
    expr: "buf_in0_f32[in0_offset] + buf_in1_f32[in1_offset]"
  Sub:
    template: binary
    expr: "buf_in0_f32[in0_offset] - buf_in1_f32[in1_offset]"
  sub:
    template: binary
    expr: "buf_in0_f32[in0_offset] - buf_in1_f32[in1_offset]"
  Mul:
    template: binary
    expr: "buf_in0_f32[in0_offset] * buf_in1_f32[in1_offset]"
  mul:
    template: binary
    expr: "buf_in0_f32[in0_offset] * buf_in1_f32[in1_offset]"
  Div:
    template: binary
    expr: "buf_in0_f32[in0_offset] / buf_in1_f32[in1_offset]"
  div:
    template: binary
    expr: "buf_in0_f32[in0_offset] / buf_in1_f32[in1_offset]"
  Softmax:
    template: softmax
  softmax:
    template: softmax
  LayerNorm:
    template: layer_norm
  layer_norm:
    template: layer_norm
  MatMul:
    template: tiled_matmul
  matmul:
    template: tiled_matmul
  BatchMatMul:
    template: tiled_matmul
  Linear:
    template: tiled_matmul
  linear:
    template: tiled_matmul
  Conv2D:
    template: conv2d
  conv2d:
    template: conv2d
  MaxPool2D:
    template: MaxPool2D
  max_pool2d:
    template: MaxPool2D
  MaxPool:
    template: MaxPool2D
  max_pool:
    template: MaxPool2D
  AvgPool2D:
    template: AvgPool2D
  avg_pool2d:
    template: AvgPool2D
  AvgPool:
    template: AvgPool2D
  avg_pool:
    template: AvgPool2D
  Trig:
    template: unary
    expr: "sin(buf_in0_f32[in0_offset])"
  ReduceSum:
    template: reduction
    init_code: "var sum = 0.0;"
    loop_code: "sum = sum + buf_in0_f32[i];"
    post_loop_code: ""
    result_var: "sum"
  ReduceMax:
    template: reduction
    init_code: "var max_val = -1e38;"
    loop_code: "max_val = max(max_val, buf_in0_f32[i]);"
    post_loop_code: ""
    result_var: "max_val"
  ReduceMean:
    template: reduction
    init_code: "var sum = 0.0;"
    loop_code: "sum = sum + buf_in0_f32[i];"
    post_loop_code: "sum = sum / f32(N);"
    result_var: "sum"
  Transpose:
    template: transpose

templates:
  unary:
    workgroup_size: [64, 1, 1]
    body: |
      let idx = global_id.x;
      if (idx >= {nelem}u) {{
          return;
      }}
      {out_offset_code}
      {in0_offset_code}
      buf_out_f32[out_offset] = {expr};

  binary:
    workgroup_size: [64, 1, 1]
    body: |
      let idx = global_id.x;
      if (idx >= {nelem}u) {{
          return;
      }}
      {out_offset_code}
      {in0_offset_code}
      {in1_offset_code}
      buf_out_f32[out_offset] = {expr};

  elementwise:
    workgroup_size: [64, 1, 1]
    body: |
      let idx = global_id.x;
      if (idx >= {nelem}u) {{
          return;
      }}
      {out_offset_code}
      {in0_offset_code}
      {in1_offset_code}
      {in2_offset_code}
      buf_out_f32[out_offset] = {expr};

  matmul:
    workgroup_size: [16, 16, 1]
    body: |
      let col = global_id.x;
      let row = global_id.y;
      let N = {N}u;
      let M = {M}u;
      let K = {K}u;
      if (row >= M || col >= N) {{
          return;
      }}
      var acc: f32 = 0.0;
      for (var k: u32 = 0u; k < K; k = k + 1u) {{
          acc = acc + buf_in0_f32[row * K + k] * buf_in1_f32[k * N + col];
      }}
      buf_out_f32[row * N + col] = acc;

  tiled_matmul:
    workgroup_size: [16, 16, 1]
    body: |
      const TILE_SIZE: u32 = 16u;
      var<workgroup> tile_a: array<array<f32, 16>, 16>;
      var<workgroup> tile_b: array<array<f32, 16>, 16>;

      let col = global_id.x;
      let row = global_id.y;
      let local_col = local_id.x;
      let local_row = local_id.y;
      let N = {N}u;
      let M = {M}u;
      let K = {K}u;

      var acc: f32 = 0.0;
      let num_tiles = (K + TILE_SIZE - 1u) / TILE_SIZE;

      for (var t: u32 = 0u; t < num_tiles; t = t + 1u) {{
          let a_col = t * TILE_SIZE + local_col;
          let b_row = t * TILE_SIZE + local_row;

          if (row < M && a_col < K) {{
              tile_a[local_row][local_col] = buf_in0_f32[row * K + a_col];
          }} else {{
              tile_a[local_row][local_col] = 0.0;
          }}

          if (b_row < K && col < N) {{
              tile_b[local_row][local_col] = buf_in1_f32[b_row * N + col];
          }} else {{
              tile_b[local_row][local_col] = 0.0;
          }}

          workgroupBarrier();

          for (var k: u32 = 0u; k < TILE_SIZE; k = k + 1u) {{
              acc = acc + tile_a[local_row][k] * tile_b[k][local_col];
          }}

          workgroupBarrier();
      }}

      if (row < M && col < N) {{
          buf_out_f32[row * N + col] = acc;
      }}

  conv2d:
    workgroup_size: [16, 16, 1]
    body: |
      let out_x = global_id.x;
      let out_y = global_id.y;

      let out_width = {out_width}u;
      let out_height = {out_height}u;
      let in_channels = {in_channels}u;
      let out_channels = {out_channels}u;
      let stride_h = {stride_h}u;
      let stride_w = {stride_w}u;
      let filter_h = {filter_h}u;
      let filter_w = {filter_w}u;
      let in_width = {in_width}u;

      if (out_x >= out_width || out_y >= out_height) {{
          return;
      }}

      for (var oc: u32 = 0u; oc < out_channels; oc = oc + 1u) {{
          var sum: f32 = 0.0;
          for (var ic: u32 = 0u; ic < in_channels; ic = ic + 1u) {{
              for (var fy: u32 = 0u; fy < filter_h; fy = fy + 1u) {{
                  for (var fx: u32 = 0u; fx < filter_w; fx = fx + 1u) {{
                      let in_y = out_y * stride_h + fy;
                      let in_x = out_x * stride_w + fx;
                      let in_idx = (in_y * in_width + in_x) * in_channels + ic;
                      let w_idx = ((oc * in_channels + ic) * filter_h + fy) * filter_w + fx;
                      sum = sum + buf_in0_f32[in_idx] * buf_in1_f32[w_idx];
                  }}
              }}
          }}
          let out_idx = (out_y * out_width + out_x) * out_channels + oc;
          buf_out_f32[out_idx] = sum;
      }}

  softmax:
    workgroup_size: [256, 1, 1]
    body: |
      let row: u32 = global_id.x;
      if (row >= {M}u) {{
          return;
      }}
      let N: u32 = {N}u;
      let base: u32 = row * N;

      var max_val: f32 = -1e38;
      for (var j: u32 = 0u; j < N; j = j + 1u) {{
          max_val = max(max_val, buf_in0_f32[base + j]);
      }}

      var sum_exp: f32 = 0.0;
      for (var j: u32 = 0u; j < N; j = j + 1u) {{
          sum_exp = sum_exp + exp(buf_in0_f32[base + j] - max_val);
      }}

      for (var j: u32 = 0u; j < N; j = j + 1u) {{
          buf_out_f32[base + j] = exp(buf_in0_f32[base + j] - max_val) / sum_exp;
      }}

  layer_norm:
    workgroup_size: [256, 1, 1]
    body: |
      let row: u32 = global_id.x;
      if (row >= {M}u) {{
          return;
      }}
      let N: u32 = {N}u;
      let base: u32 = row * N;
      let eps: f32 = 1e-5;

      var mean: f32 = 0.0;
      for (var j: u32 = 0u; j < N; j = j + 1u) {{
          mean = mean + buf_in0_f32[base + j];
      }}
      mean = mean / f32(N);

      var variance: f32 = 0.0;
      for (var j: u32 = 0u; j < N; j = j + 1u) {{
          let diff = buf_in0_f32[base + j] - mean;
          variance = variance + diff * diff;
      }}
      variance = variance / f32(N);
      let inv_std = 1.0 / sqrt(variance + eps);

      for (var j: u32 = 0u; j < N; j = j + 1u) {{
          buf_out_f32[base + j] = (buf_in0_f32[base + j] - mean) * inv_std;
      }}

  reduction:
    workgroup_size: [64, 1, 1]
    body: |
      let row: u32 = global_id.y;
      let col: u32 = global_id.x;
      let M: u32 = {M}u;
      let N: u32 = {N}u;
      if (row >= M) {{
          return;
      }}
      let base: u32 = row * N;
      {init_code}
      for (var i: u32 = 0u; i < N; i = i + 1u) {{
          {loop_code}
      }}
      {post_loop_code}
      buf_out_f32[row] = {result_var};

  reduction_barrier:
    workgroup_size: [64, 1, 1]
    body: |
      var<workgroup> sdata: array<f32, 64>;
      let tid: u32 = local_id.x;
      let gid: u32 = global_id.x;
      let N: u32 = {nelem}u;

      var my_val: f32 = 0.0;
      if (gid < N) {{
          my_val = buf_in0_f32[gid];
      }}
      sdata[tid] = my_val;
      workgroupBarrier();

      for (var s: u32 = 32u; s > 0u; s = s / 2u) {{
          if (tid < s && gid + s < N) {{
              sdata[tid] = sdata[tid] + sdata[tid + s];
          }}
          workgroupBarrier();
      }}

      if (tid == 0u) {{
          buf_out_f32[workgroup_id.x] = sdata[0];
      }}

  transpose:
    workgroup_size: [64, 1, 1]
    body: |
      let idx: u32 = global_id.x;
      if (idx >= {nelem}u) {{
          return;
      }}
      {out_offset_code}
      {in0_offset_code}
      buf_out_f32[out_offset] = buf_in0_f32[in0_offset];

  coupled_bwd_matmul:
    workgroup_size: [16, 16, 1]
    body: |
      let col = global_id.x;
      let row = global_id.y;
      let N = {N}u;
      let M = {M}u;
      let K = {K}u;
      if (row < M && col < K) {{
          var grad_a: f32 = 0.0;
          for (var n: u32 = 0u; n < N; n = n + 1u) {{
              grad_a = grad_a + buf_in0_f32[row * N + n] * buf_in2_f32[col * N + n];
          }}
          buf_out_f32[row * K + col] = grad_a;
      }}

  coupled_bwd_elementwise:
    workgroup_size: [64, 1, 1]
    body: |
      let idx = global_id.x;
      if (idx >= {nelem}u) {{
          return;
      }}
      {out_offset_code}
      {in0_offset_code}
      {in1_offset_code}
      buf_out_f32[out_offset] = buf_in0_f32[in0_offset] * {grad_expr};

  coupled_bwd_softmax:
    workgroup_size: [256, 1, 1]
    body: |
      let row: u32 = global_id.x;
      if (row >= {M}u) {{
          return;
      }}
      let N: u32 = {N}u;
      let base: u32 = row * N;

      var dot_sum: f32 = 0.0;
      for (var j: u32 = 0u; j < N; j = j + 1u) {{
          let dy = buf_in0_f32[base + j];
          let y = buf_in1_f32[base + j];
          dot_sum = dot_sum + dy * y;
      }}

      for (var j: u32 = 0u; j < N; j = j + 1u) {{
          let dy = buf_in0_f32[base + j];
          let y = buf_in1_f32[base + j];
          buf_out_f32[base + j] = y * (dy - dot_sum);
      }}
