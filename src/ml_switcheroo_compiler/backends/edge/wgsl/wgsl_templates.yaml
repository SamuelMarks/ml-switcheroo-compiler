# wgsl_templates.yaml

templates:
  # Unary Ops
  unary:
    workgroup_size: [64, 1, 1]
    body: |
      let idx = global_id.x;
      if (idx >= {nelem}u) {{
          return;
      }}
      {out_offset_code}
      {in0_offset_code}
      buf_out_f32[out_offset] = {expr};


  # Ternary Ops
  ternary:
    workgroup_size: [64, 1, 1]
    body: |
      let idx = global_id.x;
      if (idx >= {nelem}u) {{
          return;
      }}
      {out_offset_code}
      {in0_offset_code}
      {in1_offset_code}
      {in2_offset_code}
      buf_out_f32[out_offset] = {expr};

  # Binary Ops
  binary:
    workgroup_size: [64, 1, 1]
    body: |
      let idx = global_id.x;
      if (idx >= {nelem}u) {{
          return;
      }}
      {out_offset_code}
      {in0_offset_code}
      {in1_offset_code}
      buf_out_f32[out_offset] = {expr};

  # Matrix Multiplication (MatMul, DotGeneral, Einsum)
  matmul:
    workgroup_size: [16, 16, 1]
    global_code: |
      var<workgroup> tileA_{clean_id} : array<array<f32, {TILE_SIZE}>, {TILE_SIZE}>;
      var<workgroup> tileB_{clean_id} : array<array<f32, {TILE_SIZE}>, {TILE_SIZE}>;
    body: |
      let row = global_id.y;
      let col = global_id.x;
      let local_x = local_id.x;
      let local_y = local_id.y;
      var sum = 0.0;
      let K = {K}u;
      let N = {N}u;
      let M = {M}u;
      let num_tiles = (K + {TILE_SIZE}u - 1u) / {TILE_SIZE}u;
      for (var t = 0u; t < num_tiles; t++) {{
          let tiled_k_a = t * {TILE_SIZE}u + local_x;
          if (row < M && tiled_k_a < K) {{
              tileA_{clean_id}[local_y][local_x] = buf_in0_f32[row * K + tiled_k_a];
          }} else {{
              tileA_{clean_id}[local_y][local_x] = 0.0;
          }}
          let tiled_k_b = t * {TILE_SIZE}u + local_y;
          if (tiled_k_b < K && col < N) {{
              tileB_{clean_id}[local_y][local_x] = buf_in1_f32[tiled_k_b * N + col];
          }} else {{
              tileB_{clean_id}[local_y][local_x] = 0.0;
          }}
          workgroupBarrier();
          for (var k = 0u; k < {TILE_SIZE}u; k++) {{
              sum = sum + tileA_{clean_id}[local_y][k] * tileB_{clean_id}[k][local_x];
          }}
          workgroupBarrier();
      }}
      if (row < M && col < N) {{
          buf_out_f32[row * N + col] = sum;
      }}

  # Simple Elementwise Pooling/Conv (Fallback)
  conv_pool_1d_flat:
    workgroup_size: [64, 1, 1]
    body: |
      let idx = global_id.x + global_id.y * 64u;
      if (idx >= {nelem}u) {{
          return;
      }}
      buf_out_f32[idx] = {expr};

  # Reductions
  reduction:
    workgroup_size: [256, 1, 1]
    body: |
      let idx = global_id.x;
      if (idx == 0u) {{
          {init_code}
          for (var i = {start_idx}u; i < {nelem_in}u; i++) {{
              {loop_code}
          }}
          {post_loop_code}
          buf_out_f32[0] = {result_var};
      }}
