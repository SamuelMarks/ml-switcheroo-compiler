global_bindings: '// WebGPU WGSL generated by ml-switcheroo-compiler

  @group(0) @binding(0) var<storage, read> buf_in0_f32: array<f32>;

  @group(0) @binding(1) var<storage, read> buf_in1_f32: array<f32>;

  @group(0) @binding(2) var<storage, read> buf_in2_f32: array<f32>;

  @group(0) @binding(3) var<storage, read_write> buf_out_f32: array<f32>;

  @group(0) @binding(4) var<storage, read> buf_in0_i32: array<i32>;

  @group(0) @binding(5) var<storage, read> buf_in1_i32: array<i32>;

  @group(0) @binding(6) var<storage, read> buf_in2_i32: array<i32>;

  @group(0) @binding(7) var<storage, read_write> buf_out_i32: array<i32>;

  '
js_orchestration:
  allocate_arena: 'const buf_arena_{arena_id} = device.createBuffer({{ size: {total_size},
    usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST | GPUBufferUsage.COPY_SRC
    }});

    '
  compute_pass: 'const pipe_{clean_id} = device.createComputePipeline({{ layout: ''auto'',
    compute: {{ module: shaderModule, entryPoint: ''compute_{clean_id}'' }} }});

    const bg_{clean_id} = device.createBindGroup({{ layout: pipe_{clean_id}.getBindGroupLayout(0),
    entries: [{entries}] }});

    const pass_{clean_id} = commandEncoder.beginComputePass();

    pass_{clean_id}.setPipeline(pipe_{clean_id});

    pass_{clean_id}.setBindGroup(0, bg_{clean_id});

    pass_{clean_id}.dispatchWorkgroups({dispatch_x}, {dispatch_y}, {dispatch_z});

    pass_{clean_id}.end();

    '
  copy_output: 'commandEncoder.copyBufferToBuffer(buf_arena_{arena_id}, {offset},
    out_{i}_staging, 0, {size});

    '
  create_staging: 'const out_{i}_staging = device.createBuffer({{ size: {size}, usage:
    GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST }});

    '
  init: // Handled externally by webgpu_runner.js natively.
  input_copy: 'const uploadBuffer_{idx} = device.createBuffer({ size: {size}, usage:
    GPUBufferUsage.MAP_WRITE | GPUBufferUsage.COPY_SRC });

    await uploadBuffer_{idx}.mapAsync(GPUMapMode.WRITE);

    new Float32Array(uploadBuffer_{idx}.getMappedRange()).set(inputs[{idx}]);

    uploadBuffer_{idx}.unmap();

    encoder.copyBufferToBuffer(uploadBuffer_{idx}, 0, buf_arena_{arena_id}, {offset},
    {size});'
  read_output: 'await out_{i}_staging.mapAsync(GPUMapMode.READ);

    const out_{i}_array = new Float32Array(out_{i}_staging.getMappedRange().slice());

    out_{i}_staging.unmap();

    '
  return_dict: "return {{\n  {returns}\n}};\n"
  webrtc_init: '// WebRTC multi-node communication setup

    const peerConnection = new RTCPeerConnection();

    const dataChannel = peerConnection.createDataChannel(''ml_tensor_sync'');

    dataChannel.binaryType = ''arraybuffer'';

    // Event listeners and signaling omitted for brevity

    '
  webrtc_recv: "// Wait for buffer over WebRTC\nawait new Promise((resolve) => {{\n\
    \    dataChannel.onmessage = (event) => {{\n        device.queue.writeBuffer(buf_arena_{arena_id},\
    \ 0, event.data);\n        resolve();\n    }};\n}});\n"
  webrtc_send: '// Serialize and send buffer over WebRTC

    dataChannel.send(buf_arena_{arena_id});

    '
  write_input: 'if (inputs.{nid}) device.queue.writeBuffer(buf_arena_{arena_id}, {offset},
    inputs.{nid});

    '
