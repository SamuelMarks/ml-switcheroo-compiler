templates:
  binary:
    body: "let idx = global_id.x;\nif (idx >= {nelem}u) {{{{\n    return;\n}}}}\n\
      {out_offset_code}\n{in0_offset_code}\n{in1_offset_code}\nbuf_out_f32[out_offset]\
      \ = {expr};\n"
    workgroup_size:
    - 64
    - 1
    - 1
  cond:
    body: "let idx = global_id.x;\nif (idx >= {nelem}u) {{\n    return;\n}}\nif ({condition_expr})\
      \ {{\n    {true_body}\n}} else {{\n    {false_body}\n}}\n"
    workgroup_size:
    - 64
    - 1
    - 1
  conv2d:
    body: "\n      let out_x = global_id.x;\n      let out_y = global_id.y;\n    \
      \  \n      let out_width = {out_width}u;\n      let out_height = {out_height}u;\n\
      \      let in_channels = {in_channels}u;\n      let out_channels = {out_channels}u;\n\
      \      \n      if (out_x >= out_width || out_y >= out_height) {{\n         \
      \ return;\n      }}\n      \n      let stride_h = {stride_h}u;\n      let stride_w\
      \ = {stride_w}u;\n      let filter_h = {filter_h}u;\n      let filter_w = {filter_w}u;\n\
      \      \n      for (var oc = 0u; oc < out_channels; oc++) {{\n          var\
      \ sum = 0.0;\n          for (var ic = 0u; ic < in_channels; ic++) {{\n     \
      \         for (var fy = 0u; fy < filter_h; fy++) {{\n                  for (var\
      \ fx = 0u; fx < filter_w; fx++) {{\n                      let in_y = out_y *\
      \ stride_h + fy;\n                      let in_x = out_x * stride_w + fx;\n\
      \                      \n                      let in_idx = (in_y * {in_width}u\
      \ + in_x) * in_channels + ic;\n                      let w_idx = ((fy * filter_w\
      \ + fx) * in_channels + ic) * out_channels + oc;\n                      \n \
      \                     sum = sum + buf_in0_f32[in_idx] * buf_in1_f32[w_idx];\n\
      \                  }}\n              }}\n          }}\n          let out_idx\
      \ = (out_y * out_width + out_x) * out_channels + oc;\n          buf_out_f32[out_idx]\
      \ = sum;\n      }}\n    "
    workgroup_size:
    - 16
    - 16
    - 1
  conv_pool_1d_flat:
    body: "let idx = global_id.x + global_id.y * 64u;\nif (idx >= {nelem}u) {{{{\n\
      \    return;\n}}}}\nbuf_out_f32[idx] = {expr};\n"
    workgroup_size:
    - 64
    - 1
    - 1
  matmul:
    body: "let row = global_id.y;\nlet col = global_id.x;\nlet local_x = local_id.x;\n\
      let local_y = local_id.y;\nvar sum = 0.0;\nlet K = {K}u;\nlet N = {N}u;\nlet\
      \ M = {M}u;\nlet num_tiles = (K + {TILE_SIZE}u - 1u) / {TILE_SIZE}u;\nfor (var\
      \ t = 0u; t < num_tiles; t++) {{{{\n    let tiled_k_a = t * {TILE_SIZE}u + local_x;\n\
      \    if (row < M && tiled_k_a < K) {{{{\n        tileA_{clean_id}[local_y][local_x]\
      \ = buf_in0_f32[row * K + tiled_k_a];\n    }}}} else {{{{\n        tileA_{clean_id}[local_y][local_x]\
      \ = 0.0;\n    }}}}\n    let tiled_k_b = t * {TILE_SIZE}u + local_y;\n    if\
      \ (tiled_k_b < K && col < N) {{{{\n        tileB_{clean_id}[local_y][local_x]\
      \ = buf_in1_f32[tiled_k_b * N + col];\n    }}}} else {{{{\n        tileB_{clean_id}[local_y][local_x]\
      \ = 0.0;\n    }}}}\n    workgroupBarrier();\n    for (var k = 0u; k < {TILE_SIZE}u;\
      \ k++) {{{{\n        sum = sum + tileA_{clean_id}[local_y][k] * tileB_{clean_id}[k][local_x];\n\
      \    }}}}\n    workgroupBarrier();\n}}}}\nif (row < M && col < N) {{{{\n   \
      \ buf_out_f32[row * N + col] = sum;\n}}}}\n"
    global_code: 'var<workgroup> tileA_{clean_id} : array<array<f32, {TILE_SIZE}>,
      {TILE_SIZE}>;

      var<workgroup> tileB_{clean_id} : array<array<f32, {TILE_SIZE}>, {TILE_SIZE}>;

      '
    workgroup_size:
    - 16
    - 16
    - 1
  reduction:
    body: "let idx = global_id.x;\nif (idx == 0u) {{{{\n    {init_code}\n    for (var\
      \ i = {start_idx}u; i < {nelem_in}u; i++) {{{{\n        {loop_code}\n    }}}}\n\
      \    {post_loop_code}\n    buf_out_f32[0] = {result_var};\n}}}}\n"
    workgroup_size:
    - 256
    - 1
    - 1
  scan:
    body: "let idx = global_id.x;\nif (idx >= {nelem}u) {{\n    return;\n}}\nvar acc\
      \ = {init_val};\nvar i = 0u;\nloop {{\n    if (i >= {nelem}u) {{\n        break;\n\
      \    }}\n    acc = {scan_op_expr};\n    i = i + 1u;\n}}\nbuf_out_f32[idx] =\
      \ acc;\n"
    workgroup_size:
    - 64
    - 1
    - 1
  ternary:
    body: "let idx = global_id.x;\nif (idx >= {nelem}u) {{{{\n    return;\n}}}}\n\
      {out_offset_code}\n{in0_offset_code}\n{in1_offset_code}\n{in2_offset_code}\n\
      buf_out_f32[out_offset] = {expr};\n"
    workgroup_size:
    - 64
    - 1
    - 1
  unary:
    body: "let idx = global_id.x;\nif (idx >= {nelem}u) {{{{\n    return;\n}}}}\n\
      {out_offset_code}\n{in0_offset_code}\nbuf_out_f32[out_offset] = {expr};\n"
    workgroup_size:
    - 64
    - 1
    - 1
  while_loop:
    body: "let idx = global_id.x;\nif (idx >= {nelem}u) {{\n    return;\n}}\nvar current_state\
      \ = {init_state};\nvar i = 0u;\nloop {{\n    if (!({condition_expr} && i < {max_iters}u))\
      \ {{\n        break;\n    }}\n    {loop_body}\n    i = i + 1u;\n}}\nbuf_out_f32[idx]\
      \ = current_state;\n"
    workgroup_size:
    - 64
    - 1
    - 1
  send:
    body: '// Send primitive: No-op in shader, handled by JS orchestrator

      '
    workgroup_size:
    - 1
    - 1
    - 1
  recv:
    body: '// Recv primitive: No-op in shader, handled by JS orchestrator

      '
    workgroup_size:
    - 1
    - 1
    - 1
js_orchestration:
  init: "// WebGPU JavaScript Orchestrator Code Generated by ml-switcheroo-compiler\n\
    async function run(inputs) {{\n  if (!navigator.gpu) throw new Error('WebGPU is\
    \ not supported on this browser.');\n  const adapter = await navigator.gpu.requestAdapter();\n\
    \  if (!adapter) throw new Error('No appropriate GPUAdapter found.');\n  const\
    \ device = await adapter.requestDevice();\n"
  allocate_arena: 'const buf_arena_{arena_id} = device.createBuffer({{ size: {total_size},
    usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST | GPUBufferUsage.COPY_SRC
    }});

    '
  write_input: 'if (inputs.{nid}) device.queue.writeBuffer(buf_arena_{arena_id}, {offset},
    inputs.{nid});

    '
  create_staging: 'const out_{i}_staging = device.createBuffer({{ size: {size}, usage:
    GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST }});

    '
  compute_pass: 'const pipe_{clean_id} = device.createComputePipeline({{ layout: ''auto'',
    compute: {{ module: shaderModule, entryPoint: ''compute_{clean_id}'' }} }});

    const bg_{clean_id} = device.createBindGroup({{ layout: pipe_{clean_id}.getBindGroupLayout(0),
    entries: [{entries}] }});

    const pass_{clean_id} = commandEncoder.beginComputePass();

    pass_{clean_id}.setPipeline(pipe_{clean_id});

    pass_{clean_id}.setBindGroup(0, bg_{clean_id});

    pass_{clean_id}.dispatchWorkgroups({dispatch_x}, {dispatch_y}, {dispatch_z});

    pass_{clean_id}.end();

    '
  copy_output: 'commandEncoder.copyBufferToBuffer(buf_arena_{arena_id}, {offset},
    out_{i}_staging, 0, {size});

    '
  read_output: 'await out_{i}_staging.mapAsync(GPUMapMode.READ);

    const out_{i}_array = new Float32Array(out_{i}_staging.getMappedRange().slice());

    out_{i}_staging.unmap();

    '
  return_dict: "return {{\n  {returns}\n}};\n"
  webrtc_init: '// WebRTC multi-node communication setup

    const peerConnection = new RTCPeerConnection();

    const dataChannel = peerConnection.createDataChannel(''ml_tensor_sync'');

    dataChannel.binaryType = ''arraybuffer'';

    // Event listeners and signaling omitted for brevity

    '
  webrtc_send: '// Serialize and send buffer over WebRTC

    dataChannel.send(buf_arena_{arena_id});

    '
  webrtc_recv: "// Wait for buffer over WebRTC\nawait new Promise((resolve) => {{\n\
    \    dataChannel.onmessage = (event) => {{\n        device.queue.writeBuffer(buf_arena_{arena_id},\
    \ 0, event.data);\n        resolve();\n    }};\n}});\n"
