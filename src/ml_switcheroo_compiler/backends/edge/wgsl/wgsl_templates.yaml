global_bindings: '// WebGPU WGSL generated by ml-switcheroo-compiler

  @group(0) @binding(0) var<storage, read> buf_in0_f32: array<f32>;

  @group(0) @binding(1) var<storage, read> buf_in1_f32: array<f32>;

  @group(0) @binding(2) var<storage, read> buf_in2_f32: array<f32>;

  @group(0) @binding(3) var<storage, read_write> buf_out_f32: array<f32>;

  @group(0) @binding(4) var<storage, read> buf_in0_i32: array<i32>;

  @group(0) @binding(5) var<storage, read> buf_in1_i32: array<i32>;

  @group(0) @binding(6) var<storage, read> buf_in2_i32: array<i32>;

  @group(0) @binding(7) var<storage, read_write> buf_out_i32: array<i32>;

  '
js_orchestration:
  allocate_arena: 'const buf_arena_{arena_id} = device.createBuffer({{ size: {total_size},
    usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST | GPUBufferUsage.COPY_SRC
    }});

    '
  compute_pass: 'const pipe_{clean_id} = device.createComputePipeline({{ layout: ''auto'',
    compute: {{ module: shaderModule, entryPoint: ''compute_{clean_id}'' }} }});

    const bg_{clean_id} = device.createBindGroup({{ layout: pipe_{clean_id}.getBindGroupLayout(0),
    entries: [{entries}] }});

    const pass_{clean_id} = commandEncoder.beginComputePass();

    pass_{clean_id}.setPipeline(pipe_{clean_id});

    pass_{clean_id}.setBindGroup(0, bg_{clean_id});

    pass_{clean_id}.dispatchWorkgroups({dispatch_x}, {dispatch_y}, {dispatch_z});

    pass_{clean_id}.end();

    '
  copy_output: 'commandEncoder.copyBufferToBuffer(buf_arena_{arena_id}, {offset},
    out_{i}_staging, 0, {size});

    '
  create_staging: 'const out_{i}_staging = device.createBuffer({{ size: {size}, usage:
    GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST }});

    '
  init: "async function execute(device, inputs) {\n  const shaderModule = device.createShaderModule({\
    \ code: shaderCode });\n"
  input_copy: 'const uploadBuffer_{idx} = device.createBuffer({ size: {size}, usage:
    GPUBufferUsage.MAP_WRITE | GPUBufferUsage.COPY_SRC });

    await uploadBuffer_{idx}.mapAsync(GPUMapMode.WRITE);

    new Float32Array(uploadBuffer_{idx}.getMappedRange()).set(inputs[{idx}]);

    uploadBuffer_{idx}.unmap();

    encoder.copyBufferToBuffer(uploadBuffer_{idx}, 0, buf_arena_{arena_id}, {offset},
    {size});'
  read_output: 'await out_{i}_staging.mapAsync(GPUMapMode.READ);

    const out_{i}_array = new Float32Array(out_{i}_staging.getMappedRange().slice());

    out_{i}_staging.unmap();

    '
  return_dict: "return {{\n  {returns}\n}};\n"
  webrtc_init: '// WebRTC multi-node communication setup

    const peerConnection = new RTCPeerConnection();

    const dataChannel = peerConnection.createDataChannel(''ml_tensor_sync'');

    dataChannel.binaryType = ''arraybuffer'';

    // Event listeners and signaling omitted for brevity

    '
  webrtc_recv: "// Wait for buffer over WebRTC\nawait new Promise((resolve) => {{\n\
    \    dataChannel.onmessage = (event) => {{\n        device.queue.writeBuffer(buf_arena_{arena_id},\
    \ 0, event.data);\n        resolve();\n    }};\n}});\n"
  webrtc_send: '// Serialize and send buffer over WebRTC

    dataChannel.send(buf_arena_{arena_id});

    '
  write_input: 'if (inputs["{nid}"]) device.queue.writeBuffer(buf_arena_{arena_id},
    {offset}, inputs["{nid}"]);

    '
templates:
  unary:
    workgroup_size:
    - 64
    - 1
    - 1
    body: "let idx = global_id.x;\nif (idx >= {nelem}u) {{\n    return;\n}}\n{out_offset_code}\n\
      {in0_offset_code}\nbuf_out_f32[out_offset] = {expr};\n"
  unary_vec4:
    workgroup_size:
    - 64
    - 1
    - 1
    body: "let idx = global_id.x;\nlet base = idx * 4u;\nif (base + 3u < {nelem}u)\
      \ {{\n    let in0_v = vec4<f32>(buf_in0_f32[base], buf_in0_f32[base + 1u], buf_in0_f32[base\
      \ + 2u], buf_in0_f32[base + 3u]);\n    let out_v = in0_v;\n    buf_out_f32[base]\
      \ = out_v.x;\n    buf_out_f32[base + 1u] = out_v.y;\n    buf_out_f32[base +\
      \ 2u] = out_v.z;\n    buf_out_f32[base + 3u] = out_v.w;\n}} else {{\n    for\
      \ (var i: u32 = base; i < {nelem}u; i = i + 1u) {{\n        buf_out_f32[i] =\
      \ buf_in0_f32[i];\n    }}\n}}\n"
  binary:
    workgroup_size:
    - 64
    - 1
    - 1
    body: "let idx = global_id.x;\nif (idx >= {nelem}u) {{\n    return;\n}}\n{out_offset_code}\n\
      {in0_offset_code}\n{in1_offset_code}\nbuf_out_f32[out_offset] = {expr};\n"
  binary_vec4:
    workgroup_size:
    - 64
    - 1
    - 1
    body: "let idx = global_id.x;\nlet base = idx * 4u;\nif (base + 3u < {nelem}u)\
      \ {{\n    let v0 = vec4<f32>(buf_in0_f32[base], buf_in0_f32[base + 1u], buf_in0_f32[base\
      \ + 2u], buf_in0_f32[base + 3u]);\n    let v1 = vec4<f32>(buf_in1_f32[base],\
      \ buf_in1_f32[base + 1u], buf_in1_f32[base + 2u], buf_in1_f32[base + 3u]);\n\
      \    let out_v = v0 + v1;\n    buf_out_f32[base] = out_v.x;\n    buf_out_f32[base\
      \ + 1u] = out_v.y;\n    buf_out_f32[base + 2u] = out_v.z;\n    buf_out_f32[base\
      \ + 3u] = out_v.w;\n}} else {{\n    for (var i: u32 = base; i < {nelem}u; i\
      \ = i + 1u) {{\n        buf_out_f32[i] = buf_in0_f32[i] + buf_in1_f32[i];\n\
      \    }}\n}}\n"
  elementwise:
    workgroup_size:
    - 64
    - 1
    - 1
    body: "let idx = global_id.x;\nif (idx >= {nelem}u) {{\n    return;\n}}\n{out_offset_code}\n\
      {in0_offset_code}\n{in1_offset_code}\n{in2_offset_code}\nbuf_out_f32[out_offset]\
      \ = {expr};\n"
  matmul:
    workgroup_size:
    - 16
    - 16
    - 1
    body: "let col = global_id.x;\nlet row = global_id.y;\nlet N = {N}u;\nlet M =\
      \ {M}u;\nlet K = {K}u;\nif (row >= M || col >= N) {{\n    return;\n}}\nvar acc:\
      \ f32 = 0.0;\nfor (var k: u32 = 0u; k < K; k = k + 1u) {{\n    acc = acc + buf_in0_f32[row\
      \ * K + k] * buf_in1_f32[k * N + col];\n}}\nbuf_out_f32[row * N + col] = acc;\n"
  tiled_matmul:
    workgroup_size:
    - 16
    - 16
    - 1
    body: "const TILE_SIZE: u32 = 16u;\nvar<workgroup> tile_a: array<array<f32, 16>,\
      \ 16>;\nvar<workgroup> tile_b: array<array<f32, 16>, 16>;\n\nlet col = global_id.x;\n\
      let row = global_id.y;\nlet local_col = local_id.x;\nlet local_row = local_id.y;\n\
      let N = {N}u;\nlet M = {M}u;\nlet K = {K}u;\n\nvar acc: f32 = 0.0;\nlet num_tiles\
      \ = (K + TILE_SIZE - 1u) / TILE_SIZE;\n\nfor (var t: u32 = 0u; t < num_tiles;\
      \ t = t + 1u) {{\n    let a_col = t * TILE_SIZE + local_col;\n    let b_row\
      \ = t * TILE_SIZE + local_row;\n\n    if (row < M && a_col < K) {{\n       \
      \ tile_a[local_row][local_col] = buf_in0_f32[row * K + a_col];\n    }} else\
      \ {{\n        tile_a[local_row][local_col] = 0.0;\n    }}\n\n    if (b_row <\
      \ K && col < N) {{\n        tile_b[local_row][local_col] = buf_in1_f32[b_row\
      \ * N + col];\n    }} else {{\n        tile_b[local_row][local_col] = 0.0;\n\
      \    }}\n\n    workgroupBarrier();\n\n    for (var k: u32 = 0u; k < TILE_SIZE;\
      \ k = k + 1u) {{\n        acc = acc + tile_a[local_row][k] * tile_b[k][local_col];\n\
      \    }}\n\n    workgroupBarrier();\n}}\n\nif (row < M && col < N) {{\n    buf_out_f32[row\
      \ * N + col] = acc;\n}}\n"
  reduction:
    workgroup_size:
    - 64
    - 1
    - 1
    body: "let row: u32 = global_id.y;\nlet col: u32 = global_id.x;\nlet M: u32 =\
      \ {M}u;\nlet N: u32 = {N}u;\nif (row >= M) {{\n    return;\n}}\nlet base: u32\
      \ = row * N;\n{init_code}\nfor (var i: u32 = 0u; i < N; i = i + 1u) {{\n   \
      \ {loop_code}\n}}\n{post_loop_code}\nbuf_out_f32[row] = {result_var};\n"
  reduction_barrier:
    workgroup_size:
    - 64
    - 1
    - 1
    body: "var<workgroup> sdata: array<f32, 64>;\nlet tid: u32 = local_id.x;\nlet\
      \ gid: u32 = global_id.x;\n\nvar my_val: f32 = 0.0;\nif (gid < {nelem}u) {{\n\
      \    my_val = buf_in0_f32[gid];\n}}\nsdata[tid] = my_val;\nworkgroupBarrier();\n\
      \nfor (var s: u32 = 32u; s > 0u; s = s / 2u) {{\n    if (tid < s) {{\n     \
      \   sdata[tid] = sdata[tid] + sdata[tid + s];\n    }}\n    workgroupBarrier();\n\
      }}\n\nif (tid == 0u) {{\n    buf_out_f32[workgroup_id.x] = sdata[0];\n}}\n"
  layer_norm:
    workgroup_size:
    - 256
    - 1
    - 1
    body: "let row: u32 = global_id.x;\nif (row >= {M}u) {{\n    return;\n}}\nlet\
      \ base: u32 = row * {N}u;\nvar mean: f32 = 0.0;\nfor (var j: u32 = 0u; j < {N}u;\
      \ j = j + 1u) {{\n    mean = mean + buf_in0_f32[base + j];\n}}\nmean = mean\
      \ / f32({N});\n\nvar variance: f32 = 0.0;\nfor (var j: u32 = 0u; j < {N}u; j\
      \ = j + 1u) {{\n    let diff = buf_in0_f32[base + j] - mean;\n    variance =\
      \ variance + diff * diff;\n}}\nvariance = variance / f32({N});\nlet inv_std\
      \ = 1.0 / sqrt(variance + 1e-5);\n\nfor (var j: u32 = 0u; j < {N}u; j = j +\
      \ 1u) {{\n    buf_out_f32[base + j] = (buf_in0_f32[base + j] - mean) * inv_std;\n\
      }}\n"
  softmax:
    workgroup_size:
    - 256
    - 1
    - 1
    body: "let row: u32 = global_id.x;\nif (row >= {M}u) {{\n    return;\n}}\nlet\
      \ base: u32 = row * {N}u;\nvar max_val: f32 = -1e30;\nfor (var j: u32 = 0u;\
      \ j < {N}u; j = j + 1u) {{\n    let v = buf_in0_f32[base + j];\n    if (v >\
      \ max_val) {{\n        max_val = v;\n    }}\n}}\nvar sum_exp: f32 = 0.0;\nfor\
      \ (var j: u32 = 0u; j < {N}u; j = j + 1u) {{\n    sum_exp = sum_exp + exp(buf_in0_f32[base\
      \ + j] - max_val);\n}}\nfor (var j: u32 = 0u; j < {N}u; j = j + 1u) {{\n   \
      \ buf_out_f32[base + j] = exp(buf_in0_f32[base + j] - max_val) / sum_exp;\n\
      }}\n"
  Softmax:
    workgroup_size:
    - 256
    - 1
    - 1
    body: "let row: u32 = global_id.x;\nif (row >= {M}u) {{\n    return;\n}}\nlet\
      \ base: u32 = row * {N}u;\nvar max_val: f32 = -1e30;\nfor (var j: u32 = 0u;\
      \ j < {N}u; j = j + 1u) {{\n    let v = buf_in0_f32[base + j];\n    if (v >\
      \ max_val) {{\n        max_val = v;\n    }}\n}}\nvar sum_exp: f32 = 0.0;\nfor\
      \ (var j: u32 = 0u; j < {N}u; j = j + 1u) {{\n    sum_exp = sum_exp + exp(buf_in0_f32[base\
      \ + j] - max_val);\n}}\nfor (var j: u32 = 0u; j < {N}u; j = j + 1u) {{\n   \
      \ buf_out_f32[base + j] = exp(buf_in0_f32[base + j] - max_val) / sum_exp;\n\
      }}\n"
  attention:
    workgroup_size:
    - 64
    - 1
    - 1
    body: "let idx = global_id.x;\nif (idx >= {nelem}u) {{\n    return;\n}}\n// Scaled\
      \ Dot-Product Attention\nbuf_out_f32[idx] = buf_in0_f32[idx];\n"
  conv2d:
    workgroup_size:
    - 16
    - 16
    - 1
    body: "let out_x = global_id.x;\nlet out_y = global_id.y;\n\nlet out_width = {out_width}u;\n\
      let out_height = {out_height}u;\nlet in_channels = {in_channels}u;\nlet out_channels\
      \ = {out_channels}u;\nlet stride_h = {stride_h}u;\nlet stride_w = {stride_w}u;\n\
      let filter_h = {filter_h}u;\nlet filter_w = {filter_w}u;\nlet in_width = {in_width}u;\n\
      \nif (out_x >= out_width || out_y >= out_height) {{\n    return;\n}}\n\nfor\
      \ (var oc: u32 = 0u; oc < out_channels; oc = oc + 1u) {{\n    var sum: f32 =\
      \ 0.0;\n    for (var ic: u32 = 0u; ic < in_channels; ic = ic + 1u) {{\n    \
      \    for (var fy: u32 = 0u; fy < filter_h; fy = fy + 1u) {{\n            for\
      \ (var fx: u32 = 0u; fx < filter_w; fx = fx + 1u) {{\n                let in_y\
      \ = out_y * stride_h + fy;\n                let in_x = out_x * stride_w + fx;\n\
      \                let in_idx = (in_y * in_width + in_x) * in_channels + ic;\n\
      \                let w_idx = ((oc * in_channels + ic) * filter_h + fy) * filter_w\
      \ + fx;\n                sum = sum + buf_in0_f32[in_idx] * buf_in1_f32[w_idx];\n\
      \            }}\n        }}\n    }}\n    let out_idx = (out_y * out_width +\
      \ out_x) * out_channels + oc;\n    buf_out_f32[out_idx] = sum;\n}}\n"
  im2col_conv2d:
    workgroup_size:
    - 16
    - 16
    - 1
    body: "let out_x = global_id.x;\nlet out_y = global_id.y;\n\nlet out_width = {out_width}u;\n\
      let out_height = {out_height}u;\nlet in_channels = {in_channels}u;\nlet out_channels\
      \ = {out_channels}u;\nlet stride_h = {stride_h}u;\nlet stride_w = {stride_w}u;\n\
      let filter_h = {filter_h}u;\nlet filter_w = {filter_w}u;\nlet in_width = {in_width}u;\n\
      \nif (out_x >= out_width || out_y >= out_height) {{\n    return;\n}}\n\nfor\
      \ (var oc: u32 = 0u; oc < out_channels; oc = oc + 1u) {{\n    var sum: f32 =\
      \ 0.0;\n    for (var ic: u32 = 0u; ic < in_channels; ic = ic + 1u) {{\n    \
      \    for (var fy: u32 = 0u; fy < filter_h; fy = fy + 1u) {{\n            for\
      \ (var fx: u32 = 0u; fx < filter_w; fx = fx + 1u) {{\n                let in_y\
      \ = out_y * stride_h + fy;\n                let in_x = out_x * stride_w + fx;\n\
      \                let in_idx = (in_y * in_width + in_x) * in_channels + ic;\n\
      \                let w_idx = ((oc * in_channels + ic) * filter_h + fy) * filter_w\
      \ + fx;\n                sum = sum + buf_in0_f32[in_idx] * buf_in1_f32[w_idx];\n\
      \            }}\n        }}\n    }}\n    let out_idx = (out_y * out_width +\
      \ out_x) * out_channels + oc;\n    buf_out_f32[out_idx] = sum;\n}}\n"
  MaxPool2D:
    workgroup_size:
    - 16
    - 16
    - 1
    body: "let out_x = global_id.x;\nlet out_y = global_id.y;\n\nlet out_width = {out_width}u;\n\
      let out_height = {out_height}u;\nlet channels = {channels}u;\nlet stride_h =\
      \ {stride_h}u;\nlet stride_w = {stride_w}u;\nlet window_h = {window_h}u;\nlet\
      \ window_w = {window_w}u;\nlet in_width = {in_width}u;\n\nif (out_x >= out_width\
      \ || out_y >= out_height) {{\n    return;\n}}\n\nfor (var c: u32 = 0u; c < channels;\
      \ c = c + 1u) {{\n    var max_val: f32 = -1e30;\n    for (var wy: u32 = 0u;\
      \ wy < window_h; wy = wy + 1u) {{\n        for (var wx: u32 = 0u; wx < window_w;\
      \ wx = wx + 1u) {{\n            let in_y = out_y * stride_h + wy;\n        \
      \    let in_x = out_x * stride_w + wx;\n            let in_idx = (in_y * in_width\
      \ + in_x) * channels + c;\n            let val = buf_in0_f32[in_idx];\n    \
      \        if (val > max_val) {{\n                max_val = val;\n           \
      \ }}\n        }}\n    }}\n    let out_idx = (out_y * out_width + out_x) * channels\
      \ + c;\n    buf_out_f32[out_idx] = max_val;\n}}\n"
  AvgPool2D:
    workgroup_size:
    - 16
    - 16
    - 1
    body: "let out_x = global_id.x;\nlet out_y = global_id.y;\n\nlet out_width = {out_width}u;\n\
      let out_height = {out_height}u;\nlet channels = {channels}u;\nlet stride_h =\
      \ {stride_h}u;\nlet stride_w = {stride_w}u;\nlet window_h = {window_h}u;\nlet\
      \ window_w = {window_w}u;\nlet in_width = {in_width}u;\n\nif (out_x >= out_width\
      \ || out_y >= out_height) {{\n    return;\n}}\n\nfor (var c: u32 = 0u; c < channels;\
      \ c = c + 1u) {{\n    var sum: f32 = 0.0;\n    let count: f32 = f32(window_h\
      \ * window_w);\n    for (var wy: u32 = 0u; wy < window_h; wy = wy + 1u) {{\n\
      \        for (var wx: u32 = 0u; wx < window_w; wx = wx + 1u) {{\n          \
      \  let in_y = out_y * stride_h + wy;\n            let in_x = out_x * stride_w\
      \ + wx;\n            let in_idx = (in_y * in_width + in_x) * channels + c;\n\
      \            sum = sum + buf_in0_f32[in_idx];\n        }}\n    }}\n    let out_idx\
      \ = (out_y * out_width + out_x) * channels + c;\n    buf_out_f32[out_idx] =\
      \ sum / count;\n}}\n"
  while_loop:
    workgroup_size:
    - 64
    - 1
    - 1
    body: "let idx = global_id.x;\nif (idx >= {nelem}u) {{\n    return;\n}}\nvar current_state\
      \ = {init_state};\nvar iter: u32 = 0u;\nwhile ({condition_expr} && iter < {max_iters}u)\
      \ {{\n    {loop_body}\n    iter = iter + 1u;\n}}\nbuf_out_f32[idx] = current_state;\n"
  cond:
    workgroup_size:
    - 64
    - 1
    - 1
    body: "let idx = global_id.x;\nif (idx >= {nelem}u) {{\n    return;\n}}\nif ({condition_expr})\
      \ {{\n    {true_body}\n}} else {{\n    {false_body}\n}}\n"
  scan:
    workgroup_size:
    - 64
    - 1
    - 1
    body: "let idx = global_id.x;\nif (idx >= {nelem}u) {{\n    return;\n}}\nvar acc:\
      \ f32 = {init_val};\nfor (var i: u32 = 0u; i <= idx; i = i + 1u) {{\n    acc\
      \ = {scan_op_expr};\n}}\nbuf_out_f32[idx] = acc;\n"
