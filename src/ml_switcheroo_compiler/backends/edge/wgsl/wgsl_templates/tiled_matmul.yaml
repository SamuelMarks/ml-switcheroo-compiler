tiled_matmul:
  body: "let row = global_id.y;\nlet col = global_id.x;\nlet local_x = local_id.x;\n\
    let local_y = local_id.y;\nvar sum = 0.0;\nlet K = {K}u;\nlet N = {N}u;\nlet M\
    \ = {M}u;\nlet num_tiles = (K + {TILE_K}u - 1u) / {TILE_K}u;\nfor (var t = 0u;\
    \ t < num_tiles; t++) {{\n    let tiled_k_a = t * {TILE_K}u + local_x;\n    if\
    \ (row < M && tiled_k_a < K) {{\n        tileA_{clean_id}[local_y][local_x] =\
    \ buf_in0_f32[row * K + tiled_k_a];\n    }} else {{\n        tileA_{clean_id}[local_y][local_x]\
    \ = 0.0;\n    }}\n    let tiled_k_b = t * {TILE_K}u + local_y;\n    if (tiled_k_b\
    \ < K && col < N) {{\n        tileB_{clean_id}[local_y][local_x] = buf_in1_f32[tiled_k_b\
    \ * N + col];\n    }} else {{\n        tileB_{clean_id}[local_y][local_x] = 0.0;\n\
    \    }}\n    workgroupBarrier();\n    for (var k = 0u; k < {TILE_K}u; k++) {{\n\
    \        sum = sum + tileA_{clean_id}[local_y][k] * tileB_{clean_id}[k][local_x];\n\
    \    }}\n    workgroupBarrier();\n}}\nif (row < M && col < N) {{\n    buf_out_f32[row\
    \ * N + col] = sum;\n}}\n"
  global_code: 'var<workgroup> tileA_{clean_id} : array<array<f32, {TILE_K}>, {TILE_M}>;

    var<workgroup> tileB_{clean_id} : array<array<f32, {TILE_N}>, {TILE_K}>;

    '
  workgroup_size:
  - 16
  - 16
  - 1
