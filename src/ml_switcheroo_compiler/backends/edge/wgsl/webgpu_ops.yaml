global_bindings: |
  // WebGPU WGSL generated by ml-switcheroo-compiler
  @group(0) @binding(0) var<storage, read> buf_in0_f32: array<f32>;
  @group(0) @binding(1) var<storage, read> buf_in1_f32: array<f32>;
  @group(0) @binding(2) var<storage, read> buf_in2_f32: array<f32>;
  @group(0) @binding(3) var<storage, read_write> buf_out_f32: array<f32>;
  @group(0) @binding(4) var<storage, read> buf_in0_i32: array<i32>;
  @group(0) @binding(5) var<storage, read> buf_in1_i32: array<i32>;
  @group(0) @binding(6) var<storage, read> buf_in2_i32: array<i32>;
  @group(0) @binding(7) var<storage, read_write> buf_out_i32: array<i32>;

offset_computation: |
  var {out_var}_offset: u32 = 0u;
  var {out_var}_remaining: u32 = {idx_var};
  {loops}
  let {out_var}: u32 = {out_var}_offset + {base_offset_words}u;

offset_loop: |
  let {out_var}_d{i}: u32 = {out_var}_remaining % {dim}u;
  {out_var}_remaining = {out_var}_remaining / {dim}u;
  {out_var}_offset = {out_var}_offset + {out_var}_d{i} * {stride}u;

dispatch_rules:
  matmul:
    x: "Math.ceil({N} / {wg_x})"
    y: "Math.ceil({M} / {wg_y})"
    z: "1"
  tiled_matmul:
    x: "Math.ceil({N} / {wg_x})"
    y: "Math.ceil({M} / {wg_y})"
    z: "1"
  conv2d:
    x: "Math.ceil({out_width} / {wg_x})"
    y: "Math.ceil({out_height} / {wg_y})"
    z: "1"
  im2col_conv2d:
    x: "Math.ceil({out_width} / {wg_x})"
    y: "Math.ceil({out_height} / {wg_y})"
    z: "1"
  MaxPool2D:
    x: "Math.ceil({out_width} / {wg_x})"
    y: "Math.ceil({out_height} / {wg_y})"
    z: "1"
  AvgPool2D:
    x: "Math.ceil({out_width} / {wg_x})"
    y: "Math.ceil({out_height} / {wg_y})"
    z: "1"
  while_loop:
    x: "Math.ceil({nelem} / {wg_x})"
    y: "1"
    z: "1"
  cond:
    x: "Math.ceil({nelem} / {wg_x})"
    y: "1"
    z: "1"
  scan:
    x: "Math.ceil({nelem} / {wg_x})"
    y: "1"
    z: "1"
  default:
    x: "Math.ceil({nelem} / ({wg_x} * {wg_y} * {wg_z}))"
    y: "1"
    z: "1"
