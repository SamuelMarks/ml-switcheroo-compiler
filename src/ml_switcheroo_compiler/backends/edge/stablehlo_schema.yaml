types:
  float32: f32
  float64: f64
  float16: f16
  bfloat16: bf16
  int64: i64
  int32: i32
  int16: i16
  int8: i8
  uint64: ui64
  uint32: ui32
  uint16: ui16
  uint8: ui8
  bool: i1
operations:
  fallback: stablehlo.custom_call
  stablehlo.cholesky: stablehlo.cholesky
  stablehlo.svd: stablehlo.svd
  stablehlo.lu_solve: stablehlo.lu_solve
bytecode:
  magic: 4D4CEF52
  version: 1
control_flow:
  if:
    op_type: stablehlo.if
    attributes:
    - pred
    - true_branch
    - false_branch
  while:
    op_type: stablehlo.while
    attributes:
    - cond
    - body
  custom_call:
    op_type: stablehlo.custom_call
    attributes:
    - call_target_name
    - backend_config
  conditional:
    op_type: stablehlo.case
    attributes:
    - branches
  sort:
    op_type: stablehlo.sort
    attributes:
    - dimension
    - is_stable
    - comparator
lowering_rules:
  dot_general:
    opcode: stablehlo.dot_general
    inputs:
    - lhs
    - rhs
    attributes:
      dot_dimension_numbers: "#stablehlo.dot"
    has_reduction_region: false
  convolution:
    opcode: stablehlo.convolution
    inputs:
    - lhs
    - rhs
    attributes:
      dimension_numbers: "#stablehlo.conv"
      window_strides: tensor<2xi64>
      padding: tensor<2x2xi64>
      lhs_dilation: tensor<2xi64>
      rhs_dilation: tensor<2xi64>
      feature_group_count: i64
      batch_group_count: i64
    has_reduction_region: false
  reduce_window:
    opcode: stablehlo.reduce_window
    inputs:
    - operand
    - init_value
    attributes:
      window_dimensions: tensor<4xi64>
      window_strides: tensor<4xi64>
      padding: tensor<4x2xi64>
      base_dilations: tensor<4xi64>
      window_dilations: tensor<4xi64>
    has_reduction_region: true
  pad:
    opcode: stablehlo.pad
    inputs:
    - operand
    - padding_value
    attributes:
      edge_padding_low: tensor<4xi64>
      edge_padding_high: tensor<4xi64>
      interior_padding: tensor<4xi64>
    has_reduction_region: false
  reduce:
    opcode: stablehlo.reduce
    inputs:
    - inputs
    - init_values
    attributes:
      dimensions: tensor<1xi64>
    has_reduction_region: true
op_mapping:
  # Arithmetic & Elementwise Binary
  Add: stablehlo.add
  Add_: stablehlo.add
  Subtract: stablehlo.subtract
  Sub: stablehlo.subtract
  Sub_: stablehlo.subtract
  Multiply: stablehlo.multiply
  Mul: stablehlo.multiply
  Mul_: stablehlo.multiply
  Divide: stablehlo.divide
  Div: stablehlo.divide
  Div_: stablehlo.divide
  TrueDivide: stablehlo.divide
  FloorDivide: stablehlo.divide
  Power: stablehlo.power
  Pow: stablehlo.power
  Pow_: stablehlo.power
  Maximum: stablehlo.maximum
  Max: stablehlo.maximum
  Minimum: stablehlo.minimum
  Min: stablehlo.minimum
  Remainder: stablehlo.remainder
  Mod: stablehlo.remainder
  Atan2: stablehlo.atan2
  ShiftLeft: stablehlo.shift_left
  ShiftRight: stablehlo.shift_right_logical
  BitwiseAnd: stablehlo.and
  BitwiseOr: stablehlo.or
  BitwiseXor: stablehlo.xor
  And: stablehlo.and
  Or: stablehlo.or
  Xor: stablehlo.xor
  LogicalAnd: stablehlo.and
  LogicalOr: stablehlo.or
  LogicalXor: stablehlo.xor
  # Elementwise Unary
  Abs: stablehlo.abs
  Abs_: stablehlo.abs
  Neg: stablehlo.negate
  Neg_: stablehlo.negate
  Negate: stablehlo.negate
  Exp: stablehlo.exponential
  Exp_: stablehlo.exponential
  Exponential: stablehlo.exponential
  Log: stablehlo.log
  Log_: stablehlo.log
  Sqrt: stablehlo.sqrt
  Sqrt_: stablehlo.sqrt
  Rsqrt: stablehlo.rsqrt
  Rsqrt_: stablehlo.rsqrt
  Sin: stablehlo.sine
  Sin_: stablehlo.sine
  Sine: stablehlo.sine
  Cos: stablehlo.cosine
  Cos_: stablehlo.cosine
  Cosine: stablehlo.cosine
  Tanh: stablehlo.tanh
  Tanh_: stablehlo.tanh
  Floor: stablehlo.floor
  Ceil: stablehlo.ceil
  Round: stablehlo.round_nearest_even
  Sign: stablehlo.sign
  Sign_: stablehlo.sign
  Cbrt: stablehlo.cbrt
  IsFinite: stablehlo.is_finite
  Expm1: stablehlo.exponential_minus_one
  Log1p: stablehlo.log_plus_one
  Logistic: stablehlo.logistic
  Sigmoid: stablehlo.logistic
  Sigmoid_: stablehlo.logistic
  Not: stablehlo.not
  LogicalNot: stablehlo.not
  Real: stablehlo.real
  Imag: stablehlo.imag
  # Comparison & Selection
  Equal: stablehlo.compare
  NotEqual: stablehlo.compare
  Less: stablehlo.compare
  LessEqual: stablehlo.compare
  Greater: stablehlo.compare
  GreaterEqual: stablehlo.compare
  Select: stablehlo.select
  Where: stablehlo.select
  Clamp: stablehlo.clamp
  Clip: stablehlo.clamp
  Relu: stablehlo.maximum
  Relu_: stablehlo.maximum
  # Reductions
  ReduceSum: stablehlo.reduce
  Sum: stablehlo.reduce
  ReduceMean: stablehlo.reduce
  Mean: stablehlo.reduce
  ReduceProd: stablehlo.reduce
  Prod: stablehlo.reduce
  ReduceMax: stablehlo.reduce
  ReduceMin: stablehlo.reduce
  # Tensor Reshaping & Movement
  Reshape: stablehlo.reshape
  Transpose: stablehlo.transpose
  BroadcastTo: stablehlo.broadcast_in_dim
  Broadcast: stablehlo.broadcast_in_dim
  Slice: stablehlo.slice
  Concat: stablehlo.concatenate
  Concatenate: stablehlo.concatenate
  Reverse: stablehlo.reverse
  Pad: stablehlo.pad
  Gather: stablehlo.gather
  Scatter: stablehlo.scatter
  Iota: stablehlo.iota
  Convert: stablehlo.convert
  Cast: stablehlo.convert
  Bitcast: stablehlo.bitcast_convert
  # Linear Algebra & Neural Network
  MatMul: stablehlo.dot_general
  Dot: stablehlo.dot_general
  BatchMatMul: stablehlo.dot_general
  Linear: stablehlo.dot_general
  Conv: stablehlo.convolution
  Conv2D: stablehlo.convolution
  Conv3D: stablehlo.convolution
  ReduceWindow: stablehlo.reduce_window
  MaxPool2D: stablehlo.reduce_window
  AvgPool2D: stablehlo.reduce_window
  BatchNorm: stablehlo.batch_norm_inference
  BatchNormInference: stablehlo.batch_norm_inference
  BatchNormTraining: stablehlo.batch_norm_training
  BatchNormGrad: stablehlo.batch_norm_grad
  Cholesky: stablehlo.cholesky
  TriangularSolve: stablehlo.triangular_solve
  Sort: stablehlo.sort
  FFT: stablehlo.fft
