types:
  float32: 1
  float64: 11
  float16: 10
  bfloat16: 16
  int64: 7
  int32: 6
  int16: 5
  int8: 3
  uint64: 17
  uint32: 13
  uint16: 14
  uint8: 2
  bool: 9
operations:
  fallback: CustomOp
  BatchNormalization:
    op_type: BatchNormalization
    domain: ''
    inputs:
    - X
    - scale
    - B
    - input_mean
    - input_var
    attributes:
    - epsilon
    - momentum
  LayerNormalization:
    op_type: LayerNormalization
    domain: ''
    inputs:
    - X
    - Scale
    - B
    attributes:
    - axis
    - epsilon
    - stash_type
control_flow:
  If:
    op_type: If
    domain: ''
    inputs:
    - cond
    attributes:
    - then_branch
    - else_branch
  Loop:
    op_type: Loop
    domain: ''
    inputs:
    - M
    - cond
    - v_initial
    attributes:
    - body
  Scan:
    op_type: Scan
    domain: ''
    inputs:
    - sequence_lens
    - initial_state_and_scan_inputs
    attributes:
    - body
    - num_scan_inputs
