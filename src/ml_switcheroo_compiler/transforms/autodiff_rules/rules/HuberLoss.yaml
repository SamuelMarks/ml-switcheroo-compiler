HuberLoss:
  jvp: ReduceMean(Mul(Where(Less(Abs(Sub($input[0], $input[1])), Constant(1.0)), Sub($input[0],
    $input[1]), Sign(Sub($input[0], $input[1]))), $tangent[0]))
  vjp:
  - Mul($cotangent, Where(Less(Abs(Sub($input[0], $input[1])), Constant(1.0)), Sub($input[0],
    $input[1]), Sign(Sub($input[0], $input[1]))))
  - Mul($cotangent, Neg(Where(Less(Abs(Sub($input[0], $input[1])), Constant(1.0)),
    Sub($input[0], $input[1]), Sign(Sub($input[0], $input[1])))))
