# Declarative definitions for SPMD communication injection logic

# State matrix for determining injected op based on sharding states
# Format: [input_sharded, node_sharded]
# Conditions can optionally check node types
communication_matrix:
  - state: [true, false]
    conditions:
      - is_reduction: true
        inject: "AllReduce"
      - is_grad: true
        inject: "AllReduce"
      - default: true
        inject: "AllGather"

  - state: [false, true]
    conditions:
      - is_grad: true
        inject: "ReduceScatter"
      - default: true
        inject: "none"

  - state: [true, true]
    conditions:
      - axes_match: false
        axes_length_match: true
        inject: "AllToAll"
      - default: true
        inject: "none"

reductions:
  - ReduceSum
  - ReduceMean
  - ReduceMax
  - ReduceMin
  - ReduceProd
  - MatMul
  - Einsum
  - DotGeneral
