MultiHeadAttentionFusion:
  pattern:
    capture: out_proj
    inputs:
    - capture: matmul2
      inputs:
      - capture: softmax
        inputs:
        - capture: scale
          inputs:
          - capture: matmul1
            inputs:
            - capture: q_proj
              inputs:
              - capture: x_q
              - capture: w_q
              op_type: MatMul
            - capture: k_proj
              inputs:
              - capture: x_k
              - capture: w_k
              op_type: MatMul
            op_type: MatMul
          - capture: scale_factor
          op_type: Multiply
        op_type: Softmax
      - capture: v_proj
        inputs:
        - capture: x_v
        - capture: w_v
        op_type: MatMul
      op_type: MatMul
    - capture: w_out
    op_type: MatMul
  replacement:
    capture_to_replace: out_proj
    inputs:
    - x_q
    - w_q
    - x_k
    - w_k
    - x_v
    - w_v
    - w_out
    - scale_factor
    op_type: FusedMultiHeadAttention
