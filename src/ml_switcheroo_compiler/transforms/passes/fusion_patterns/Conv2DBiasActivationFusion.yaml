Conv2DBiasReluFusion:
  pattern:
    capture: act
    inputs:
    - capture: bias_add
      inputs:
      - capture: conv
        inputs:
        - capture: x
        - capture: w
        op_type: Conv2D
      - capture: bias
      op_type: BiasAdd
    op_type: Relu
  replacement:
    capture_to_replace: act
    inputs:
    - x
    - w
    - bias
    op_type: FusedConv2DBiasRelu

Conv2DBiasGeluFusion:
  pattern:
    capture: act
    inputs:
    - capture: bias_add
      inputs:
      - capture: conv
        inputs:
        - capture: x
        - capture: w
        op_type: Conv2D
      - capture: bias
      op_type: BiasAdd
    op_type: Gelu
  replacement:
    capture_to_replace: act
    inputs:
    - x
    - w
    - bias
    op_type: FusedConv2DBiasGelu
