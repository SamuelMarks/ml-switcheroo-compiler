  Mish:
    vjp:
    - Mul($cotangent, Add(Tanh(Softplus($input[0])), Mul($input[0], Mul(Sub(Constant(1.0),
      Pow(Tanh(Softplus($input[0])), Constant(2.0))), Sigmoid($input[0])))))
  Mul:
    vjp:
    - Mul($cotangent, $input[1])
    - Mul($cotangent, $input[0])
  Norm:
    vjp:
    - Mul(BroadcastLike($cotangent, $input[0]), Div($input[0], BroadcastLike($output,
      $input[0])))
  RMSNorm:
    vjp:
    - Mul($cotangent, Div($input[1], Sqrt(Add(Mean(Pow($input[0], Constant(2.0))),
      Constant(1e-5)))))
    - ReduceSum(Mul($cotangent, Div($input[0], Sqrt(Add(Mean(Pow($input[0], Constant(2.0))),
      Constant(1e-5))))))
  ReduceMax:
    vjp:
    - Mul(BroadcastTo($cotangent, Shape($input[0])), Equal($input[0], ReduceMax($input[0],
      axis=-1, keepdims=True)))
  ReduceMean:
