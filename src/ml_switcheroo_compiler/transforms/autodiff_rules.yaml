jvp_rules:
  Add:
    jvp: Add($tangent[0], $tangent[1])
  AvgPool2D:
    jvp: AvgPool2D($tangent[0])
  BCELoss:
    jvp: ReduceMean(Mul(Div(Sub($input[0], $input[1]), Mul($input[0], Sub(Constant(1.0),
      $input[0]))), $tangent[0]))
  BatchMatMul:
    jvp: Add(BatchMatMul($tangent[0], $input[1]), BatchMatMul($input[0], $tangent[1]))
  BatchMatmul:
    jvp: Add(BatchMatMul($tangent[0], $input[1]), BatchMatMul($input[0], $tangent[1]))
  BatchNorm:
    jvp: Mul($tangent[0], Div($input[1], Sqrt(Add(Variance($input[0]), Constant(1e-5)))))
  Conv1D:
    jvp: Add(Conv1D($tangent[0], $input[1]), Conv1D($input[0], $tangent[1]))
  Conv2D:
    jvp: Add(Conv2D($tangent[0], $input[1]), Conv2D($input[0], $tangent[1]))
  Conv3D:
    jvp: Add(Conv3D($tangent[0], $input[1]), Conv3D($input[0], $tangent[1]))
  ConvTranspose2D:
    jvp: Add(ConvTranspose2D($tangent[0], $input[1]), ConvTranspose2D($input[0], $tangent[1]))
  CrossEntropyLoss:
    jvp: ReduceMean(Mul(Sub(Softmax($input[0]), $input[1]), $tangent[0]))
  Div:
    jvp: Div(Sub(Mul($tangent[0], $input[1]), Mul($input[0], $tangent[1])), Pow($input[1],
      Constant(2.0)))
  Dot:
    jvp: Add(Dot($tangent[0], $input[1]), Dot($input[0], $tangent[1]))
  ELU:
    jvp: Mul($tangent[0], Where(Greater($input[0], Constant(0.0)), Constant(1.0),
      Exp($input[0])))
  Einsum:
    jvp: Add(Einsum($tangent[0], $input[1]), Einsum($input[0], $tangent[1]))
  Elu:
    jvp: Mul($tangent[0], Where(Greater($input[0], Constant(0.0)), Constant(1.0),
      Exp($input[0])))
  Exp:
    jvp: Mul($tangent[0], Exp($input[0]))
  ExpandDims:
    jvp: ExpandDims($tangent[0])
  GELU:
    jvp: Mul($tangent[0], Add(Mul($input[0], Mul(Constant(0.3989422804), Exp(Mul(Constant(-0.5),
      Pow($input[0], Constant(2.0)))))), Mul(Constant(0.5), Add(Constant(1.0), Erf(Mul($input[0],
      Constant(0.7071067811)))))))
  Gelu:
    jvp: Mul($tangent[0], Add(Mul($input[0], Mul(Constant(0.3989422804), Exp(Mul(Constant(-0.5),
      Pow($input[0], Constant(2.0)))))), Mul(Constant(0.5), Add(Constant(1.0), Erf(Mul($input[0],
      Constant(0.7071067811)))))))
  GroupNorm:
    jvp: Mul($tangent[0], Div($input[1], Sqrt(Add(Variance($input[0]), Constant(1e-5)))))
  HuberLoss:
    jvp: ReduceMean(Mul(Where(Less(Abs(Sub($input[0], $input[1])), Constant(1.0)),
      Sub($input[0], $input[1]), Sign(Sub($input[0], $input[1]))), $tangent[0]))
  KLDivergenceLoss:
    jvp: ReduceMean(Mul(Sub(Constant(1.0), Div($input[1], $input[0])), $tangent[0]))
  L2Normalize:
    jvp: Div(Sub($tangent[0], Mul($output, ReduceSum(Mul($output, $tangent[0])))),
      Norm($input[0]))
  LayerNorm:
    jvp: Mul($tangent[0], Div($input[1], Sqrt(Add(Variance($input[0]), Constant(1e-5)))))
  LeakyReLU:
    jvp: Mul($tangent[0], Where(Greater($input[0], Constant(0.0)), Constant(1.0),
      Constant(0.01)))
  LeakyRelu:
    jvp: Mul($tangent[0], Where(Greater($input[0], Constant(0.0)), Constant(1.0),
      Constant(0.01)))
  Log:
    jvp: Div($tangent[0], $input[0])
  LogSoftmax:
    jvp: Sub($tangent[0], ReduceSum($tangent[0], axis=-1, keepdims=True))
  MSELoss:
    jvp: Mul(Constant(2.0), Div(ReduceMean(Mul(Sub($input[0], $input[1]), $tangent[0])),
      Constant(1.0)))
  MatMul:
    jvp: Add(MatMul($tangent[0], $input[1]), MatMul($input[0], $tangent[1]))
  Matmul:
    jvp: Add(MatMul($tangent[0], $input[1]), MatMul($input[0], $tangent[1]))
  MaxPool2D:
    jvp: Mul($tangent[0], Equal($input[0], BroadcastLike($output, $input[0])))
  Mul:
    jvp: Add(Mul($tangent[0], $input[1]), Mul($input[0], $tangent[1]))
  Norm:
    jvp: Div(ReduceSum(Mul($input[0], $tangent[0])), BroadcastLike($output, $input[0]))
  RMSNorm:
    jvp: Mul($tangent[0], Div($input[1], Sqrt(Add(Mean(Pow($input[0], Constant(2.0))),
      Constant(1e-5)))))
  ReduceMax:
    jvp: ReduceSum(Mul($tangent[0], Equal($input[0], BroadcastLike($output, $input[0]))))
  ReduceMean:
    jvp: ReduceMean($tangent[0])
  ReduceMin:
    jvp: ReduceSum(Mul($tangent[0], Equal($input[0], BroadcastLike($output, $input[0]))))
  ReduceProd:
    jvp: ReduceSum(Mul($tangent[0], Div(BroadcastLike($output, $input[0]), $input[0])))
  ReduceSum:
    jvp: ReduceSum($tangent[0])
  Relu:
    jvp: Mul($tangent[0], Greater($input[0], Constant(0.0)))
  Reshape:
    jvp: Reshape($tangent[0])
  SiLU:
    jvp: Mul($tangent[0], Add(Sigmoid($input[0]), Mul($output, Sub(Constant(1.0),
      Sigmoid($input[0])))))
  Sigmoid:
    jvp: Mul($tangent[0], Mul($output, Sub(Constant(1.0), $output)))
  Silu:
    jvp: Mul($tangent[0], Add(Sigmoid($input[0]), Mul($output, Sub(Constant(1.0),
      Sigmoid($input[0])))))
  Softmax:
    jvp: Mul($output, Sub($tangent[0], ReduceSum(Mul($tangent[0], $output), axis=-1,
      keepdims=True)))
  Softplus:
    jvp: Mul($tangent[0], Sigmoid($input[0]))
  Squeeze:
    jvp: Squeeze($tangent[0])
  Sub:
    jvp: Sub($tangent[0], $tangent[1])
  Tanh:
    jvp: Mul($tangent[0], Sub(Constant(1.0), Pow($output, Constant(2.0))))
  Transpose:
    jvp: Transpose($tangent[0])
vjp_rules:
  Add:
    vjp:
    - $cotangent
    - $cotangent
  AvgPool2D:
    vjp:
    - Div(BroadcastLike($cotangent, $input[0]), Numel($input[0]))
  BCELoss:
    vjp:
    - Mul($cotangent, Div(Sub($input[0], $input[1]), Mul($input[0], Sub(Constant(1.0),
      $input[0]))))
    - Mul($cotangent, Sub(Log(Sub(Constant(1.0), $input[0])), Log($input[0])))
  BatchMatMul:
    vjp:
    - BatchMatMul($cotangent, Transpose($input[1]))
    - BatchMatMul(Transpose($input[0]), $cotangent)
  BatchMatmul:
    vjp:
    - BatchMatMul($cotangent, Transpose($input[1]))
    - BatchMatMul(Transpose($input[0]), $cotangent)
  BatchNorm:
    vjp:
    - Mul($cotangent, Div($input[1], Sqrt(Add(Variance($input[0]), Constant(1e-5)))))
    - ReduceSum(Mul($cotangent, Sub($input[0], Mean($input[0]))))
    - ReduceSum($cotangent)
  Conv1D:
    vjp:
    - ConvTranspose1D($cotangent, $input[1])
    - Conv1D($input[0], $cotangent)
  Conv2D:
    vjp:
    - ConvTranspose2D($cotangent, $input[1])
    - Conv2D($input[0], $cotangent)
  Conv3D:
    vjp:
    - ConvTranspose3D($cotangent, $input[1])
    - Conv3D($input[0], $cotangent)
  ConvTranspose2D:
    vjp:
    - Conv2D($cotangent, $input[1])
    - ConvTranspose2D($input[0], $cotangent)
  CrossEntropyLoss:
    vjp:
    - Mul($cotangent, Div(Sub(Softmax($input[0]), $input[1]), Numel($input[0])))
    - Mul($cotangent, Neg(LogSoftmax($input[0])))
  Div:
    vjp:
    - Div($cotangent, $input[1])
    - Neg(Div(Mul($cotangent, $input[0]), Pow($input[1], Constant(2.0))))
  Dot:
    vjp:
    - Mul($cotangent, $input[1])
    - Mul($cotangent, $input[0])
  ELU:
    vjp:
    - Mul($cotangent, Where(Greater($input[0], Constant(0.0)), Constant(1.0), Exp($input[0])))
  Einsum:
    vjp:
    - Einsum($cotangent, $input[1])
    - Einsum($input[0], $cotangent)
  Elu:
    vjp:
    - Mul($cotangent, Where(Greater($input[0], Constant(0.0)), Constant(1.0), Exp($input[0])))
  Exp:
    vjp:
    - Mul($cotangent, Exp($input[0]))
  ExpandDims:
    vjp:
    - Squeeze($cotangent)
  GELU:
    vjp:
    - Mul($cotangent, Add(Mul($input[0], Mul(Constant(0.3989422804), Exp(Mul(Constant(-0.5),
      Pow($input[0], Constant(2.0)))))), Mul(Constant(0.5), Add(Constant(1.0), Erf(Mul($input[0],
      Constant(0.7071067811)))))))
  Gelu:
    vjp:
    - Mul($cotangent, Add(Mul($input[0], Mul(Constant(0.3989422804), Exp(Mul(Constant(-0.5),
      Pow($input[0], Constant(2.0)))))), Mul(Constant(0.5), Add(Constant(1.0), Erf(Mul($input[0],
      Constant(0.7071067811)))))))
  GroupNorm:
    vjp:
    - Mul($cotangent, Div($input[1], Sqrt(Add(Variance($input[0]), Constant(1e-5)))))
    - ReduceSum(Mul($cotangent, Sub($input[0], Mean($input[0]))))
    - ReduceSum($cotangent)
  HuberLoss:
    vjp:
    - Mul($cotangent, Where(Less(Abs(Sub($input[0], $input[1])), Constant(1.0)), Sub($input[0],
      $input[1]), Sign(Sub($input[0], $input[1]))))
    - Mul($cotangent, Neg(Where(Less(Abs(Sub($input[0], $input[1])), Constant(1.0)),
      Sub($input[0], $input[1]), Sign(Sub($input[0], $input[1])))))
  KLDivergenceLoss:
    vjp:
    - Mul($cotangent, Sub(Constant(1.0), Div($input[1], $input[0])))
    - Mul($cotangent, Sub(Log($input[1]), Log($input[0])))
  L2Normalize:
    vjp:
    - Div(Sub($cotangent, Mul($output, ReduceSum(Mul($output, $cotangent)))), Norm($input[0]))
  LayerNorm:
    vjp:
    - Mul($cotangent, Div($input[1], Sqrt(Add(Variance($input[0]), Constant(1e-5)))))
    - ReduceSum(Mul($cotangent, Sub($input[0], Mean($input[0]))))
    - ReduceSum($cotangent)
  LeakyReLU:
    vjp:
    - Mul($cotangent, Where(Greater($input[0], Constant(0.0)), Constant(1.0), Constant(0.01)))
  LeakyRelu:
    vjp:
    - Mul($cotangent, Where(Greater($input[0], Constant(0.0)), Constant(1.0), Constant(0.01)))
  Log:
    vjp:
    - Div($cotangent, $input[0])
  LogSoftmax:
    vjp:
    - Sub($cotangent, Mul(Exp($output), ReduceSum($cotangent, axis=-1, keepdims=True)))
  MSELoss:
    vjp:
    - Mul($cotangent, Mul(Constant(2.0), Div(Sub($input[0], $input[1]), Numel($input[0]))))
    - Mul($cotangent, Mul(Constant(-2.0), Div(Sub($input[0], $input[1]), Numel($input[0]))))
  MatMul:
    vjp:
    - MatMul($cotangent, Transpose($input[1]))
    - MatMul(Transpose($input[0]), $cotangent)
  Matmul:
    vjp:
    - MatMul($cotangent, Transpose($input[1]))
    - MatMul(Transpose($input[0]), $cotangent)
  MaxPool2D:
    vjp:
    - Mul(BroadcastLike($cotangent, $input[0]), Equal($input[0], BroadcastLike($output,
      $input[0])))
  Mul:
    vjp:
    - Mul($cotangent, $input[1])
    - Mul($cotangent, $input[0])
  Norm:
    vjp:
    - Mul(BroadcastLike($cotangent, $input[0]), Div($input[0], BroadcastLike($output,
      $input[0])))
  RMSNorm:
    vjp:
    - Mul($cotangent, Div($input[1], Sqrt(Add(Mean(Pow($input[0], Constant(2.0))),
      Constant(1e-5)))))
    - ReduceSum(Mul($cotangent, Div($input[0], Sqrt(Add(Mean(Pow($input[0], Constant(2.0))),
      Constant(1e-5))))))
  ReduceMax:
    vjp:
    - Mul(BroadcastLike($cotangent, $input[0]), Equal($input[0], BroadcastLike($output,
      $input[0])))
  ReduceMean:
    vjp:
    - Div(BroadcastLike($cotangent, $input[0]), Numel($input[0]))
  ReduceMin:
    vjp:
    - Mul(BroadcastLike($cotangent, $input[0]), Equal($input[0], BroadcastLike($output,
      $input[0])))
  ReduceProd:
    vjp:
    - Mul(BroadcastLike($cotangent, $input[0]), Div(BroadcastLike($output, $input[0]),
      $input[0]))
  ReduceSum:
    vjp:
    - BroadcastLike($cotangent, $input[0])
  Relu:
    vjp:
    - Mul($cotangent, Greater($input[0], Constant(0.0)))
  Reshape:
    vjp:
    - Reshape($cotangent)
  SiLU:
    vjp:
    - Mul($cotangent, Add(Sigmoid($input[0]), Mul($output, Sub(Constant(1.0), Sigmoid($input[0])))))
  Sigmoid:
    vjp:
    - Mul($cotangent, Mul($output, Sub(Constant(1.0), $output)))
  Silu:
    vjp:
    - Mul($cotangent, Add(Sigmoid($input[0]), Mul($output, Sub(Constant(1.0), Sigmoid($input[0])))))
  Softmax:
    vjp:
    - Mul($output, Sub($cotangent, ReduceSum(Mul($cotangent, $output), axis=-1, keepdims=True)))
  Softplus:
    vjp:
    - Mul($cotangent, Sigmoid($input[0]))
  Squeeze:
    vjp:
    - ExpandDims($cotangent)
  Sub:
    vjp:
    - $cotangent
    - Neg($cotangent)
  Tanh:
    vjp:
    - Mul($cotangent, Sub(Constant(1.0), Pow($output, Constant(2.0))))
  Transpose:
    vjp:
    - Transpose($cotangent)
