  MatMulGradA:
    vjp:
    - MatMul($cotangent, Transpose($input[1]))
  MatMulGradB:
    vjp:
    - MatMul(Transpose($input[0]), $cotangent)
  BatchMatMulGrad:
    vjp:
    - BatchMatMul($cotangent, Transpose($input[1]))
    - BatchMatMul(Transpose($input[0]), $cotangent)
  TransposeGrad:
    vjp:
    - Transpose($cotangent)
  ReshapeGrad:
    vjp:
    - Reshape($cotangent)
  LayerNormGrad:
    vjp:
    - Mul($cotangent, Div($input[1], Sqrt(Add(Variance($input[0]), Constant(1e-5)))))
  BatchNormGrad:
    vjp:
    - Mul($cotangent, Div($input[1], Sqrt(Add(Variance($input[0]), Constant(1e-5)))))
  RMSNormGrad:
    vjp:
    - Mul($cotangent, Div($input[1], Sqrt(Add(Mean(Pow($input[0], Constant(2.0))),
      Constant(1e-5)))))
  Solve:
    vjp:
    - Neg(MatMul(Solve(Transpose($input[0]), $cotangent), Transpose(Solve($input[0],
      $input[1]))))
    - Solve(Transpose($input[0]), $cotangent)
  Qr:
    vjp:
    - MatMul($cotangent, Transpose(Qr($input[0])))
  Svd:
    vjp:
    - MatMul($cotangent, Transpose($input[0]))
  Det:
    vjp:
    - Mul(Mul($cotangent, Det($input[0])), Transpose(Inverse($input[0])))
  Logdet:
    vjp:
    - Mul($cotangent, Transpose(Inverse($input[0])))
  Sin:
    vjp:
    - Mul($cotangent, Cos($input[0]))
  Cos:
    vjp:
    - Mul($cotangent, Neg(Sin($input[0])))
  Tan:
    vjp:
    - Mul($cotangent, Div(Constant(1.0), Pow(Cos($input[0]), Constant(2.0))))
  Pow:
    vjp:
    - Mul($cotangent, Mul($input[1], Pow($input[0], Sub($input[1], Constant(1.0)))))
    - Mul($cotangent, Mul(Log($input[0]), Pow($input[0], $input[1])))
  Sqrt:
    vjp:
    - Div($cotangent, Mul(Constant(2.0), Sqrt($input[0])))
  Erf:
    vjp:
    - Mul($cotangent, Mul(Constant(1.128379167), Exp(Neg(Pow($input[0], Constant(2.0))))))
higher_order_rules:
  Add:
    hvp: Constant(0.0)
    jvp_order: 2
    vjp_order: 2
  Sub:
    hvp: Constant(0.0)
    jvp_order: 2
    vjp_order: 2
  Neg:
    hvp: Constant(0.0)
    jvp_order: 2
    vjp_order: 2
  Negative:
    hvp: Constant(0.0)
    jvp_order: 2
    vjp_order: 2
  Mul:
    hvp: Add(Mul($tangent[0], $cotangent[1]), Mul($tangent[1], $cotangent[0]))
    jvp_order: 2
    vjp_order: 2
  Div:
    hvp: Div(Sub(Mul(Constant(2.0), Mul($input[0], Mul($tangent[1], $cotangent))),
      Mul($input[1], Add(Mul($tangent[0], $cotangent), Mul($input[0], Mul($tangent[1],
      $cotangent))))), Pow($input[1], Constant(3.0)))
    jvp_order: 2
    vjp_order: 2
  Exp:
    hvp: Mul($tangent[0], Mul($cotangent, Exp($input[0])))
    jvp_order: 2
    vjp_order: 2
  Log:
    hvp: Neg(Div(Mul($tangent[0], $cotangent), Pow($input[0], Constant(2.0))))
    jvp_order: 2
    vjp_order: 2
  Sin:
    hvp: Neg(Mul($tangent[0], Mul($cotangent, Sin($input[0]))))
    jvp_order: 2
    vjp_order: 2
  Cos:
    hvp: Neg(Mul($tangent[0], Mul($cotangent, Cos($input[0]))))
    jvp_order: 2
    vjp_order: 2
  Sinh:
    hvp: Mul($tangent[0], Mul($cotangent, Sinh($input[0])))
    jvp_order: 2
    vjp_order: 2
  Cosh:
    hvp: Mul($tangent[0], Mul($cotangent, Cosh($input[0])))
    jvp_order: 2
    vjp_order: 2
  Tanh:
    hvp: Neg(Mul(Constant(2.0), Mul($tangent[0], Mul($cotangent, Mul(Tanh($input[0]),
      Sub(Constant(1.0), Pow(Tanh($input[0]), Constant(2.0))))))))
    jvp_order: 2
    vjp_order: 2
  Sqrt:
    hvp: Neg(Div(Mul($tangent[0], $cotangent), Mul(Constant(4.0), Pow($input[0], Constant(1.5)))))
    jvp_order: 2
    vjp_order: 2
  Pow:
    hvp: Mul($tangent[0], Mul($cotangent, Mul($input[1], Mul(Sub($input[1], Constant(1.0)),
      Pow($input[0], Sub($input[1], Constant(2.0)))))))
    jvp_order: 2
    vjp_order: 2
  Sigmoid:
    hvp: Mul($tangent[0], Mul($cotangent, Mul(Sigmoid($input[0]), Mul(Sub(Constant(1.0),
      Sigmoid($input[0])), Sub(Constant(1.0), Mul(Constant(2.0), Sigmoid($input[0])))))))
    jvp_order: 2
    vjp_order: 2
  Relu:
    hvp: Constant(0.0)
    jvp_order: 2
    vjp_order: 2
  Abs:
    hvp: Constant(0.0)
    jvp_order: 2
    vjp_order: 2
  MatMul:
    hvp: Add(MatMul($tangent[0], $cotangent), MatMul($cotangent, $tangent[1]))
    jvp_order: 2
    vjp_order: 2
  BatchMatMul:
    hvp: Add(BatchMatMul($tangent[0], $cotangent), BatchMatMul($cotangent, $tangent[1]))
    jvp_order: 2
    vjp_order: 2
  Transpose:
    hvp: Transpose($tangent[0])
    jvp_order: 2
    vjp_order: 2
  Reshape:
    hvp: Reshape($tangent[0])
    jvp_order: 2
    vjp_order: 2
