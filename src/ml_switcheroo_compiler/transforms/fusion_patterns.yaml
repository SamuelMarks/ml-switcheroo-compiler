# Declarative operator fusion patterns for middle-end optimization passes
patterns:
  - name: ScaledDotProductAttention
    description: "Match Softmax(MatMul(Q, Transpose(K)) / sqrt(d)) * V -> FusedAttention"
    target:
      - Matmul
      - Transpose
      - Div
      - Softmax
      - Matmul
    fused_op: FusedAttention
    commutative: false
    wildcard: false

  - name: ConvBNActivation
    description: "Match Relu(BatchNorm(Conv2D(X, W))) -> FusedConv2D"
    target:
      - Conv2D
      - BatchNorm
      - Relu
    fused_op: FusedConv2D
    commutative: false
    wildcard: false

  - name: LayerNorm
    description: "Match (X - Mean(X)) / Sqrt(Var(X) + eps) * Gamma + Beta -> FusedLayerNorm"
    target:
      - Mean
      - Sub
      - Var
      - Add
      - Sqrt
      - Div
      - Mul
      - Add
    fused_op: FusedLayerNorm
    commutative: false
    broadcast_dims: true

  - name: MatMulBiasGelu
    description: "Match GELU(MatMul(X, W) + B) -> FusedLinearGELU"
    target:
      - Matmul
      - Add
      - Gelu
    fused_op: FusedLinearGELU
    commutative: true
    wildcard: false

  - name: Conv2DBatchNormFusion
    target:
      - Conv2D
      - BatchNorm
    fused_op: FusedConv2DBatchNorm
    commutative: false

  - name: Conv2DBiasActivationFusion
    target:
      - Conv2D
      - Add
      - Relu
    fused_op: FusedConv2DBiasRelu
    commutative: false

  - name: DotGeluFusion
    target:
      - Matmul
      - Gelu
    fused_op: FusedLinearGelu
    commutative: false

  - name: DotReluFusion
    target:
      - Matmul
      - Relu
    fused_op: FusedLinearRelu
    commutative: false

  - name: FMAFusion
    target:
      - Mul
      - Add
    fused_op: FusedMultiplyAdd
    commutative: true

  - name: MultiHeadAttentionFusion
    target:
      - Matmul
      - Div
      - Softmax
      - Matmul
    fused_op: ScaledDotProductAttention
    commutative: false
