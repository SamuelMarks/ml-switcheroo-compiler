# Declarative Algebraic Simplification Rules for Symbolic Dimensions
# Schema: AlgebraicRuleSetModel
version: "1.0.0"
description: "Declarative algebraic simplification and term rewriting rules for symbolic shape dimensions."
rules:
  - name: "add_zero_right"
    category: "identity"
    pattern: "x + 0"
    replacement: "x"
    description: "Adding zero to any symbolic dimension yields the dimension itself."

  - name: "add_zero_left"
    category: "identity"
    pattern: "0 + x"
    replacement: "x"
    description: "Adding zero to any symbolic dimension yields the dimension itself."

  - name: "sub_zero_right"
    category: "identity"
    pattern: "x - 0"
    replacement: "x"
    description: "Subtracting zero from any symbolic dimension yields the dimension itself."

  - name: "mul_one_right"
    category: "identity"
    pattern: "x * 1"
    replacement: "x"
    description: "Multiplying any symbolic dimension by one yields the dimension itself."

  - name: "mul_one_left"
    category: "identity"
    pattern: "1 * x"
    replacement: "x"
    description: "Multiplying one by any symbolic dimension yields the dimension itself."

  - name: "div_one_right"
    category: "identity"
    pattern: "x // 1"
    replacement: "x"
    description: "Floor-dividing any symbolic dimension by one yields the dimension itself."

  - name: "mul_zero_right"
    category: "cancellation"
    pattern: "x * 0"
    replacement: "0"
    description: "Multiplying any symbolic dimension by zero evaluates to zero."

  - name: "mul_zero_left"
    category: "cancellation"
    pattern: "0 * x"
    replacement: "0"
    description: "Multiplying zero by any symbolic dimension evaluates to zero."

  - name: "sub_self"
    category: "cancellation"
    pattern: "x - x"
    replacement: "0"
    description: "Subtracting any symbolic expression from itself evaluates to zero."

  - name: "add_sub_cancel"
    category: "cancellation"
    pattern: "(x + y) - y"
    replacement: "x"
    description: "Adding y and then subtracting y cancels out to x."

  - name: "mul_div_cancel"
    category: "cancellation"
    pattern: "(x * y) // y"
    replacement: "x"
    description: "Multiplying by y and then floor-dividing by y cancels out to x."

  - name: "add_commutative"
    category: "commutativity"
    pattern: "x + y"
    replacement: "y + x"
    description: "Addition of symbolic dimensions is commutative."

  - name: "mul_commutative"
    category: "commutativity"
    pattern: "x * y"
    replacement: "y * x"
    description: "Multiplication of symbolic dimensions is commutative."

  - name: "add_associative"
    category: "associativity"
    pattern: "(x + y) + z"
    replacement: "x + (y + z)"
    description: "Addition of symbolic dimensions is associative."

  - name: "mul_associative"
    category: "associativity"
    pattern: "(x * y) * z"
    replacement: "x * (y * z)"
    description: "Multiplication of symbolic dimensions is associative."

  - name: "distributive_mul_add"
    category: "distributivity"
    pattern: "x * (y + z)"
    replacement: "x * y + x * z"
    description: "Multiplication distributes over addition."
