webrtc_config:
  ice_servers:
    - urls: stun:stun.l.google.com:19302
    - urls: stun:stun1.l.google.com:19302
  signaling:
    timeout_ms: 5000

templates:
  init_peer_connection: |
    const peerId = Math.random().toString(36).substring(7);
    const signalingUrl = "http://127.0.0.1:8080";
    const peerConnection = new RTCPeerConnection({config});
    const dataChannel = peerConnection.createDataChannel("ml_switcheroo_collective");

    peerConnection.onicecandidate = async (event) => {{
        if (event.candidate) {{
            await fetch(`${{signalingUrl}}/candidate`, {{
                method: 'POST',
                body: JSON.stringify({{ peer_id: peerId, candidate: event.candidate }})
            }});
        }}
    }};

    // Setup message handler for distributed ops
    dataChannel.onmessage = async (event) => {{
        const message = JSON.parse(event.data);
        if (message.type === 'ALLREDUCE') {{
            // Handle AllReduce reduction logic
            {allreduce_handler}
        }} else if (message.type === 'ALLGATHER') {{
            // Handle AllGather concatenation logic
            {allgather_handler}
        }} else if (message.type === 'ALLTOALL') {{
            // Handle AllToAll split/concat logic
            {alltoall_handler}
        }} else if (message.type === 'REDUCESCATTER') {{
            // Handle ReduceScatter logic
            {reducescatter_handler}
        }}
    }};

    // Initiate signaling
    const offer = await peerConnection.createOffer();
    await peerConnection.setLocalDescription(offer);
    await fetch(`${{signalingUrl}}/offer`, {{
        method: 'POST',
        body: JSON.stringify({{ peer_id: peerId, offer: offer }})
    }});

  allgather_emit: |
    // Trigger WebRTC AllGather via client-side collective protocol
    const localData = {local_tensor_data};
    dataChannel.send(localData.buffer); // Binary send chunk_size: {chunk_size}
    await window.__ml_collective.allGather('{op_id}', localData);

  allreduce_emit: |
    // Trigger WebRTC AllReduce via client-side collective protocol
    const localData = {local_tensor_data};
    dataChannel.send(localData.buffer); // Binary send chunk_size: {chunk_size}
    await window.__ml_collective.allReduce('{op_id}', localData);

  alltoall_emit: |
    // Trigger WebRTC AllToAll via client-side collective protocol
    const localData = {local_tensor_data};
    dataChannel.send(localData.buffer); // Binary send chunk_size: {chunk_size}
    await window.__ml_collective.allToAll('{op_id}', localData);

  reducescatter_emit: |
    // Trigger WebRTC ReduceScatter via client-side collective protocol
    const localData = {local_tensor_data};
    dataChannel.send(localData.buffer); // Binary send chunk_size: {chunk_size}
    await window.__ml_collective.reduceScatter('{op_id}', localData);

  broadcast_emit: |
    // Trigger WebRTC Broadcast via client-side collective protocol
    const localData = {local_tensor_data};
    dataChannel.send(localData.buffer); // Binary send chunk_size: {chunk_size}
    await window.__ml_collective.broadcast('{op_id}', localData);
