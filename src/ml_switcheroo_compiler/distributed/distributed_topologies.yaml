        - [1.2, 0.0, 1.2, 1.2, 2.5, 2.5, 2.5, 2.5]
        - [1.2, 1.2, 0.0, 1.2, 2.5, 2.5, 2.5, 2.5]
        - [1.2, 1.2, 1.2, 0.0, 2.5, 2.5, 2.5, 2.5]
        - [2.5, 2.5, 2.5, 2.5, 0.0, 1.2, 1.2, 1.2]
        - [2.5, 2.5, 2.5, 2.5, 1.2, 0.0, 1.2, 1.2]
