strategies:
  DataParallelStrategy:
    all_reduce_algorithm: ring
    cross_device_ops: nccl
    registry_hooks:
      init: init_process_group
      sync: all_reduce
  MultiWorkerMirroredStrategy:
    all_reduce_algorithm: ring
    cross_device_ops: nccl
    registry_hooks:
      init: init_process_group
      sync: all_reduce
  ModelParallelStrategy:
    all_reduce_algorithm: ring
    row_parallel_dim: 0
    col_parallel_dim: 1
    registry_hooks:
      init: init_process_group
      partition: partition_linear
  ParameterServerStrategy:
    async_pull: true
    gradient_push_method: async
    registry_hooks:
      init: init_parameter_server
      pull: ps_pull_weights
      push: ps_push_gradients
    sync_interval_steps: 1
