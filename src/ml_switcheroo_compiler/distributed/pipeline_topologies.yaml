default:
  microbatch_splitting:
    num_microbatches: 4
    strategy: "1f1b"
  mesh_mapping:
    devices_per_stage: 1
  stage_communication:
    protocol: "tcp"
  dependencies: []
  schedule:
    phases:
      - type: "warmup"
        operations: ["forward"]
        count_expression: "num_stages - 1"
      - type: "steady"
        operations: ["forward", "backward"]
        count_expression: "num_microbatches - num_stages + 1"
      - type: "cooldown"
        operations: ["backward"]
        count_expression: "num_stages - 1"
