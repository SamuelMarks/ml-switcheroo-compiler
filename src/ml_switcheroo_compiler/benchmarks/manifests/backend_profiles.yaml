profiles:
  numpy:
    timer: "perf_counter"
    sync_method: "none"
    default_warmup_iterations: 5
    default_measured_iterations: 20
    memory_tracking: "rss"
    profiler_module: "ml_switcheroo_compiler.backends.numpy.profiler"
    profiler_class: "NumpyProfiler"

  pytorch:
    timer: "cuda_event"
    sync_method: "torch_sync"
    default_warmup_iterations: 5
    default_measured_iterations: 20
    memory_tracking: "cuda_allocated"
    profiler_module: "ml_switcheroo_compiler.backends.pytorch.profiler"
    profiler_class: "PyTorchProfiler"

  torch:
