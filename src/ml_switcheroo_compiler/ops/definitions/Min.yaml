operation: min
description: The Min operation.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: x
  type: array
- is_variadic: false
  kind: positional_or_keyword
  name: axis
  type: Optional[Union[int, Tuple[int, Ellipsis]]]
- is_variadic: false
  kind: positional_or_keyword
  name: keepdims
  type: bool
variants:
  cupy:
    eager: cp.min
    generator: cp.min
  dask:
    eager: da.min
    generator: da.min
  keras:
    eager: keras_ops.min
  numpy:
    generator: np.min
  pytorch:
    generator: torch.min({0}, dim={axis}, keepdim={keepdims})
  tensorflow: {}
  jax: {}
  mlx: {}
  edge_wgsl:
    template: binary
    expr: min(buf_in0_f32[in0_offset], buf_in1_f32[in1_offset])
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
  edge_wasm_simd:
    template: unary
    scalar_expr: in0_val
    simd_expr: in0_val
autodiff:
  vjp_rule_id: min_vjp
  jvp_rule_id: min_jvp
  vjp:
  - Multiply(Broadcast($cotangent), Equal($input[0], Broadcast(Min($input[0]))))
  jvp: Sum(Multiply($tangent[0], Equal($input[0], Broadcast(Min($input[0])))))
signature:
  args:
  - name: x
    type: array
    is_variadic: false
    kind: positional_or_keyword
  - name: axis
    type: Optional[Union[int, Tuple[int, Ellipsis]]]
    is_variadic: false
    kind: positional_or_keyword
  - name: keepdims
    type: bool
    is_variadic: false
    kind: positional_or_keyword
  input_tensors:
  - x
  output_tensors:
  - out
  has_variadic_args: false
  has_variadic_kwargs: false
  keyword_constraints: {}
  keyword_defaults: {}
dtype_rules:
  promotion_matrix: standard
  allowed_input_dtypes:
  - all
  output_dtype_inference: promote(in0, in1)
shape_signature:
  pattern: in0
  symbolic_expression: '[*shape] -> [*shape]'
  category: unary
invariants:
  is_commutative: false
  is_associative: false
  is_idempotent: false
  identity_value: null
  absorbing_value: null
