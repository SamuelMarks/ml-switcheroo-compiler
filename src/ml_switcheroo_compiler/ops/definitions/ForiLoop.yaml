operation: ForiLoop
description: Functional loop from lower to upper bound.
std_args:
  - is_variadic: false
    kind: positional_or_keyword
    name: lower
    type: int
  - is_variadic: false
    kind: positional_or_keyword
    name: upper
    type: int
  - is_variadic: false
    kind: positional_or_keyword
    name: body_fun
    type: Callable
  - is_variadic: false
    kind: positional_or_keyword
    name: init_val
    type: Any
variants:
  edge_onnx:
    generator: Loop
  edge_stablehlo:
    generator: stablehlo.while
  numpy:
    eager: numpy.foriloop
  cupy: {}
  dask: {}
  tensorflow:
    eager: tf.foriloop
  keras:
    eager: keras_ops.foriloop
  pytorch:
    eager: torch.foriloop
  jax:
    eager: jax.numpy.foriloop
  mlx:
    eager: mlx.core.foriloop
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
