operation: BenchmarkExecutionStats
description: Execution statistics for benchmarks.
std_args: []
variants:
  numpy:
    eager: numpy.benchmarkexecutionstats
  cupy: {}
  dask: {}
  tensorflow:
    eager: tf.benchmarkexecutionstats
  keras:
    eager: keras_ops.benchmarkexecutionstats
  pytorch:
    eager: torch.benchmarkexecutionstats
  jax:
    eager: jax.numpy.benchmarkexecutionstats
  mlx:
    eager: mlx.core.benchmarkexecutionstats
  edge_onnx: {}
  edge_stablehlo: {}
  edge_wgsl:
    template: unary
    expr: buf_in0_f32[in0_offset]
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
