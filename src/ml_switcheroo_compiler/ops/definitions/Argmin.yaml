operation: argmin
description: The Argmin operation.
std_args:
  - is_variadic: false
    kind: positional_or_keyword
    name: x
    type: array
  - is_variadic: false
    kind: positional_or_keyword
    name: axis
    type: Optional[int]
  - is_variadic: false
    kind: positional_or_keyword
    name: keepdims
    type: bool
variants:
  cupy:
    eager: cp.argmin
  dask:
    eager: da.argmin
  keras:
    eager: keras_ops.argmin
  pytorch:
    generator: torch.argmin({0}, dim={axis}, keepdim={keepdims})
  tensorflow:
    eager: tf.argmin
  numpy: {}
  jax: {}
  mlx: {}
  edge_onnx:
    generator: argmin
  edge_stablehlo:

    opcode: stablehlo.argmin
  edge_wgsl:
    template: reduction
    init_code: var res = 0.0;
    start_idx: '0'
    loop_code: res = max(res, buf_in0_f32[i]);
    post_loop_code: ''
    result_var: res
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
