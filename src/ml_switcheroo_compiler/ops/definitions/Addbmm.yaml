operation: Addbmm
description: Performs batch matrix-matrix product of matrices with reduced add step.
std_args:
  - is_variadic: false
    kind: positional_or_keyword
    name: input
    type: Tensor
  - is_variadic: false
    kind: positional_or_keyword
    name: batch1
    type: Tensor
  - is_variadic: false
    kind: positional_or_keyword
    name: batch2
    type: Tensor
  - default: 1.0
    is_variadic: false
    kind: positional_or_keyword
    name: beta
    type: float
  - default: 1.0
    is_variadic: false
    kind: positional_or_keyword
    name: alpha
    type: float
variants:
  numpy: {}
  cupy: {}
  dask: {}
  tensorflow: {}
  keras: {}
  pytorch: {}
  jax: {}
  mlx: {}
  edge_onnx:
    generator: Addbmm
  edge_stablehlo:

    opcode: stablehlo.addbmm
  edge_wgsl:
    template: binary
    expr: buf_in0_f32[in0_offset] + buf_in1_f32[in1_offset]
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
