operation: Bit
description: Internal bit casting/representation.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: x
  type: Any
variants:
  numpy:
    eager: numpy.bit
  cupy: {}
  dask: {}
  tensorflow:
    eager: tf.bit
  keras:
    eager: keras_ops.bit
  pytorch:
    eager: torch.bit
  jax:
    eager: jax.numpy.bit
  mlx:
    eager: mlx.core.bit
  edge_onnx: {}
  edge_stablehlo: {}
  edge_wgsl:
    template: unary
    expr: buf_in0_f32[in0_offset]
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
