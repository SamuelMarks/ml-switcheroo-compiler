operation: BaseRepr
description: Return a string representation of a number in the given base system.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: number
  type: int
- default: 2
  is_variadic: false
  kind: positional_or_keyword
  name: base
  type: int
variants:
  numpy:
    eager: numpy.baserepr
  cupy: {}
  dask: {}
  tensorflow:
    eager: tf.baserepr
  keras:
    eager: keras_ops.baserepr
  pytorch:
    eager: torch.baserepr
  jax:
    eager: jax.numpy.baserepr
  mlx:
    eager: mlx.core.baserepr
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
  edge_wasm_simd:
    template: unary
    scalar_expr: in0_val
    simd_expr: in0_val
  edge_wgsl:
    template: unary
    expr: buf_in0_f32[in0_offset]
signature:
  args:
  - name: number
    type: int
    is_variadic: false
    kind: positional_or_keyword
  - name: base
    type: int
    is_variadic: false
    kind: positional_or_keyword
  input_tensors:
  - number
  - base
  output_tensors:
  - out
  has_variadic_args: false
  has_variadic_kwargs: false
  keyword_constraints: {}
  keyword_defaults: {}
dtype_rules:
  promotion_matrix: standard
  allowed_input_dtypes:
  - all
  output_dtype_inference: promote(in0, in1)
shape_signature:
  pattern: in0
  symbolic_expression: '[*shape] -> [*shape]'
  category: unary
invariants:
  is_commutative: false
  is_associative: false
  is_idempotent: false
  identity_value: null
  absorbing_value: null
autodiff:
  vjp_rule_id: BaseRepr_vjp
  jvp_rule_id: BaseRepr_jvp
  vjp: null
  jvp: null
