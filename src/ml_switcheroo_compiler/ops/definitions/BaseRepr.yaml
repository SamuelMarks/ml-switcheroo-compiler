operation: BaseRepr
description: Return a string representation of a number in the given base system.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: number
  type: int
- default: 2
  is_variadic: false
  kind: positional_or_keyword
  name: base
  type: int
variants:
  numpy:
    eager: numpy.baserepr
  cupy: {}
  dask: {}
  tensorflow:
    eager: tf.baserepr
  keras:
    eager: keras_ops.baserepr
  pytorch:
    eager: torch.baserepr
  jax:
    eager: jax.numpy.baserepr
  mlx:
    eager: mlx.core.baserepr
  edge_onnx: {}
  edge_stablehlo: {}
  edge_wgsl:
    template: unary
    expr: buf_in0_f32[in0_offset]
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
