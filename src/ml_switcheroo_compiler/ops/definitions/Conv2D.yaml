operation: Conv2D
description: The Conv2D operation.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: input
  rank: 4
  shape_spec: '[B, C_in, H, W]'
  type: Tensor
- is_variadic: false
  kind: positional_or_keyword
  name: weight
  rank: 4
  type: Tensor
- is_variadic: false
  kind: positional_or_keyword
  name: bias
  type: Tensor
- default: 1
  is_variadic: false
  kind: positional_or_keyword
  name: stride
  type: int
- default: 0
  is_variadic: false
  kind: positional_or_keyword
  name: padding
  type: int
- default: 1
  is_variadic: false
  kind: positional_or_keyword
  name: dilation
  type: int
- default: 1
  is_variadic: false
  kind: positional_or_keyword
  name: groups
  type: int
type: attribute
variants:
  edge_onnx:
    generator: Conv
  edge_stablehlo:
    generator: stablehlo.convolution
  edge_wgsl:
    template: conv_pool_1d_flat
    expr: buf_in0_f32[0] * buf_in1_f32[0]
  edge_wasm_simd:
    template: conv_pool_1d_flat
    math_op: '* 1.0f'
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
autodiff:
  vjp:
  - ConvTranspose2D($cotangent, $input[1])
  - Conv2D($input[0], Transpose($cotangent))
  jvp: Add(Conv2D($tangent[0], $input[1]), Conv2D($input[0], $tangent[1]))
