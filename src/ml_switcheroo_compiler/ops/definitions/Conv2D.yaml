operation: Conv2D
description: The Conv2D operation.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: input
  rank: 4
  shape_spec: '[B, C_in, H, W]'
  type: Tensor
- is_variadic: false
  kind: positional_or_keyword
  name: weight
  rank: 4
  type: Tensor
- is_variadic: false
  kind: positional_or_keyword
  name: bias
  type: Tensor
- default: 1
  is_variadic: false
  kind: positional_or_keyword
  name: stride
  type: int
- default: 0
  is_variadic: false
  kind: positional_or_keyword
  name: padding
  type: int
- default: 1
  is_variadic: false
  kind: positional_or_keyword
  name: dilation
  type: int
- default: 1
  is_variadic: false
  kind: positional_or_keyword
  name: groups
  type: int
type: attribute
variants:
  edge_onnx:
    generator: Conv
  edge_stablehlo:
    generator: stablehlo.convolution
  edge_wgsl:
    template: im2col_conv2d
  edge_wasm_simd:
    template: conv_pool_1d_flat
    math_op: '* 1.0f'
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
autodiff:
  vjp_rule_id: Conv2D_vjp
  jvp_rule_id: Conv2D_jvp
  vjp:
  - ConvTranspose2D($cotangent, $input[1])
  - Conv2D($input[0], Transpose($cotangent))
  jvp: Add(Conv2D($tangent[0], $input[1]), Conv2D($input[0], $tangent[1]))
signature:
  args:
  - name: input
    type: Tensor
    is_variadic: false
    kind: positional_or_keyword
  - name: weight
    type: Tensor
    is_variadic: false
    kind: positional_or_keyword
  - name: bias
    type: Tensor
    is_variadic: false
    kind: positional_or_keyword
  - name: stride
    type: int
    is_variadic: false
    kind: positional_or_keyword
  - name: padding
    type: int
    is_variadic: false
    kind: positional_or_keyword
  - name: dilation
    type: int
    is_variadic: false
    kind: positional_or_keyword
  - name: groups
    type: int
    is_variadic: false
    kind: positional_or_keyword
  input_tensors:
  - input
  - weight
  - bias
  - stride
  - padding
  - dilation
  - groups
  output_tensors:
  - out
  has_variadic_args: false
  has_variadic_kwargs: false
  keyword_constraints: {}
  keyword_defaults: {}
dtype_rules:
  promotion_matrix: standard
  allowed_input_dtypes:
  - all
  output_dtype_inference: promote(in0, in1)
shape_signature:
  pattern: conv2d(N, C_in, H, W), (C_out, C_in, kH, kW) -> (N, C_out, H_out, W_out)
  symbolic_expression: '[*shape] -> [*shape]'
  category: spatial
invariants:
  is_commutative: false
  is_associative: false
  is_idempotent: false
  identity_value: null
  absorbing_value: null
