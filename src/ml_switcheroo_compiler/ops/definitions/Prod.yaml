operation: prod
description: The Prod operation.
std_args:
  - is_variadic: false
    kind: positional_or_keyword
    name: x
    type: array
  - is_variadic: false
    kind: positional_or_keyword
    name: axis
    type: Optional[Union[int, Tuple[int, Ellipsis]]]
  - is_variadic: false
    kind: positional_or_keyword
    name: dtype
    type: Optional[dtype]
  - is_variadic: false
    kind: positional_or_keyword
    name: keepdims
    type: bool
variants:
  cupy:
    eager: cp.prod
  dask:
    eager: da.prod
  keras:
    eager: keras_ops.prod
  pytorch:
    generator: torch.prod({0}, dim={axis}, keepdim={keepdims})
  numpy:
    eager: numpy.prod
  tensorflow:
    eager: tf.prod
  jax:
    eager: jax.numpy.prod
  mlx:
    eager: mlx.core.prod
  edge_onnx:
    generator: prod
  edge_stablehlo:

    opcode: stablehlo.prod
  edge_wgsl:
    template: reduction
    init_code: var res = 1.0;
    start_idx: '0'
    loop_code: res = res * buf_in0_f32[i];
    post_loop_code: ''
    result_var: res
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
autodiff:
  vjp:
    - Multiply(Broadcast(Multiply($cotangent, Prod($input[0]))), TrueDivide(Constant(1.0),
      $input[0]))
  jvp: Sum(Multiply($tangent[0], Multiply(Broadcast(Prod($input[0])), TrueDivide(Constant(1.0),
    $input[0]))))
