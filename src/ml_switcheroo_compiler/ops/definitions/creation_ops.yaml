    jvp: null
    jvp_rule_id: arange_jvp
    vjp: null
    vjp_rule_id: arange_vjp
  broadcast_semantics: numpy
  description: The Arange operation.
  domain: creation
  input_tensors: &id001 []
  math_semantics:
    differentiable: false
    is_associative: false
    is_commutative: false
    is_idempotent: false
  operation: Arange
  output_tensors:
  - out
  signature:
    args: []
    output_dtype_formula: float32
    output_shape_formula: shape
  type_promotion: standard
  variants:
    cupy: {}
    dask: {}
    edge_wasm_simd:
      scalar_expr: in0_val
      simd_expr: in0_val
      template: unary
    edge_wgsl:
      expr: buf_in0_f32[in0_offset]
      template: unary
    jax: {}
    keras: {}
    llvm_cpp:
      scalar_expr: in0_val
      template: unary
    mlx: {}
    numpy:
      generator: np.arange
    pytorch:
      generator: torch.arange({0})
    tensorflow: {}
