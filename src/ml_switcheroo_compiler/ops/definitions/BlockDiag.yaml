operation: BlockDiag
description: Create a block diagonal matrix from provided tensors.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: tensors
  type: Any
variants:
  numpy:
    eager: numpy.blockdiag
  cupy: {}
  dask: {}
  tensorflow:
    eager: tf.blockdiag
  keras:
    eager: keras_ops.blockdiag
  pytorch:
    eager: torch.blockdiag
  jax:
    eager: jax.numpy.blockdiag
  mlx:
    eager: mlx.core.blockdiag
  edge_onnx: {}
  edge_stablehlo: {}
  edge_wgsl:
    template: unary
    expr: buf_in0_f32[in0_offset]
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
