operation: RandLike
description: Returns a tensor with the same size as input that is filled with random
  numbers from a uniform distribution.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: input
  type: Tensor
- default: None
  is_variadic: false
  kind: positional_or_keyword
  name: dtype
  type: Any
variants:
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
