operation: AttentionLayer
description: Dot-product attention layer, a.k.a. Luong-style attention.
std_args:
- default: false
  is_variadic: false
  kind: positional_or_keyword
  name: use_scale
  type: bool
- default: dot
  is_variadic: false
  kind: positional_or_keyword
  name: score_mode
  options:
  - dot
  - concat
  type: str
- default: 0.0
  is_variadic: false
  kind: positional_or_keyword
  name: dropout
  type: float
- is_variadic: false
  kind: positional_or_keyword
  name: seed
  type: int
variants:
  numpy:
    eager: numpy.attentionlayer
  cupy: {}
  dask: {}
  tensorflow:
    eager: tf.attentionlayer
  keras:
    eager: keras_ops.attentionlayer
  pytorch:
    eager: torch.attentionlayer
  jax:
    eager: jax.numpy.attentionlayer
  mlx:
    eager: mlx.core.attentionlayer
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
  edge_wasm_simd:
    template: unary
    scalar_expr: in0_val
    simd_expr: in0_val
  edge_wgsl:
    template: unary
    expr: buf_in0_f32[in0_offset]
signature:
  args:
  - name: use_scale
    type: bool
    is_variadic: false
    kind: positional_or_keyword
  - name: score_mode
    type: str
    is_variadic: false
    kind: positional_or_keyword
  - name: dropout
    type: float
    is_variadic: false
    kind: positional_or_keyword
  - name: seed
    type: int
    is_variadic: false
    kind: positional_or_keyword
  input_tensors:
  - use_scale
  - score_mode
  - dropout
  - seed
  output_tensors:
  - out
  has_variadic_args: false
  has_variadic_kwargs: false
  keyword_constraints: {}
  keyword_defaults: {}
dtype_rules:
  promotion_matrix: standard
  allowed_input_dtypes:
  - all
  output_dtype_inference: promote(in0, in1)
shape_signature:
  pattern: in0
  symbolic_expression: '[*shape] -> [*shape]'
  category: unary
invariants:
  is_commutative: false
  is_associative: false
  is_idempotent: false
  identity_value: null
  absorbing_value: null
autodiff:
  vjp_rule_id: AttentionLayer_vjp
  jvp_rule_id: AttentionLayer_jvp
  vjp: null
  jvp: null
