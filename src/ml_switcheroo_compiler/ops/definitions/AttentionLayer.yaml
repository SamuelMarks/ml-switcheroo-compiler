operation: AttentionLayer
description: Dot-product attention layer, a.k.a. Luong-style attention.
std_args:
- default: false
  is_variadic: false
  kind: positional_or_keyword
  name: use_scale
  type: bool
- default: dot
  is_variadic: false
  kind: positional_or_keyword
  name: score_mode
  options:
  - dot
  - concat
  type: str
- default: 0.0
  is_variadic: false
  kind: positional_or_keyword
  name: dropout
  type: float
- is_variadic: false
  kind: positional_or_keyword
  name: seed
  type: int
variants:
  numpy:
    eager: numpy.attentionlayer
  cupy: {}
  dask: {}
  tensorflow:
    eager: tf.attentionlayer
  keras:
    eager: keras_ops.attentionlayer
  pytorch:
    eager: torch.attentionlayer
  jax:
    eager: jax.numpy.attentionlayer
  mlx:
    eager: mlx.core.attentionlayer
  edge_onnx: {}
  edge_stablehlo: {}
  edge_wgsl:
    template: unary
    expr: buf_in0_f32[in0_offset]
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
