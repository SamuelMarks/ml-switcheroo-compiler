operation: full
description: The Full operation.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: shape
  type: Union[int, Tuple[int, Ellipsis]]
- is_variadic: false
  kind: positional_or_keyword
  name: fill_value
  type: Union[bool, int, float, complex]
- is_variadic: false
  kind: positional_or_keyword
  name: dtype
  type: Optional[dtype]
- is_variadic: false
  kind: positional_or_keyword
  name: device
  type: Optional[device]
type: attribute
variants:
  numpy:
    generator: np.full
  pytorch:
    generator: torch.full({shape}, {fill_value})
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
  edge_wasm_simd:
    template: unary
    scalar_expr: in0_val
    simd_expr: in0_val
  edge_wgsl:
    template: unary
    expr: buf_in0_f32[in0_offset]
signature:
  args:
  - name: shape
    type: Union[int, Tuple[int, Ellipsis]]
    is_variadic: false
    kind: positional_or_keyword
  - name: fill_value
    type: Union[bool, int, float, complex]
    is_variadic: false
    kind: positional_or_keyword
  - name: dtype
    type: Optional[dtype]
    is_variadic: false
    kind: positional_or_keyword
  - name: device
    type: Optional[device]
    is_variadic: false
    kind: positional_or_keyword
  input_tensors:
  - shape
  - fill_value
  - dtype
  - device
  output_tensors:
  - out
  has_variadic_args: false
  has_variadic_kwargs: false
  keyword_constraints: {}
  keyword_defaults: {}
dtype_rules:
  promotion_matrix: standard
  allowed_input_dtypes:
  - all
  output_dtype_inference: promote(in0, in1)
shape_signature:
  pattern: in0
  symbolic_expression: '[*shape] -> [*shape]'
  category: unary
invariants:
  is_commutative: false
  is_associative: false
  is_idempotent: false
  identity_value: null
  absorbing_value: null
autodiff:
  vjp_rule_id: full_vjp
  jvp_rule_id: full_jvp
  vjp: null
  jvp: null
