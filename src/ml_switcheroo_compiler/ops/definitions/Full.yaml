operation: full
description: The Full operation.
std_args:
  - is_variadic: false
    kind: positional_or_keyword
    name: shape
    type: Union[int, Tuple[int, Ellipsis]]
  - is_variadic: false
    kind: positional_or_keyword
    name: fill_value
    type: Union[bool, int, float, complex]
  - is_variadic: false
    kind: positional_or_keyword
    name: dtype
    type: Optional[dtype]
  - is_variadic: false
    kind: positional_or_keyword
    name: device
    type: Optional[device]
type: attribute
variants:
  numpy:
    generator: np.full
  pytorch:
    generator: torch.full({shape}, {fill_value})
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
