operation: CanCast
description: Determines if a type conversion is allowed under casting rules.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: from_dtype
  type: DType
- is_variadic: false
  kind: positional_or_keyword
  name: to_dtype
  type: DType
variants:
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
  edge_wasm_simd:
    template: unary
    scalar_expr: in0_val
    simd_expr: in0_val
  edge_wgsl:
    template: unary
    expr: buf_in0_f32[in0_offset]
signature:
