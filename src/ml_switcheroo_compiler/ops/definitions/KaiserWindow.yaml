operation: KaiserWindow
description: The KaiserWindow operation.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: window_length
  type: int
- default: true
  is_variadic: false
  kind: positional_or_keyword
  name: periodic
  type: bool
- default: 12.0
  is_variadic: false
  kind: positional_or_keyword
  name: beta
  type: float
variants:
  pytorch:
    generator: torch.kaiser_window({window_length}, periodic={periodic}, beta={beta})
  numpy:
    eager: numpy.kaiserwindow
  cupy: {}
  dask: {}
  tensorflow:
    eager: tf.kaiserwindow
  keras:
    eager: keras_ops.kaiserwindow
  jax:
    eager: jax.numpy.kaiserwindow
  mlx:
    eager: mlx.core.kaiserwindow
  edge_onnx: {}
  edge_stablehlo: {}
  edge_wgsl:
    template: binary
    expr: f32(buf_in0_f32[in0_offset] != 0.0 && buf_in1_f32[in1_offset] != 0.0)
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
