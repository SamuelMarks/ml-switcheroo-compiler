  numpy:
    eager: load
    requires_plugin: io_handler
  cupy: {}
  dask: {}
  tensorflow:
    eager: tf.torchload
  keras:
    eager: keras_ops.torchload
  mlx:
    eager: mlx.core.torchload
  edge_onnx: {}
  edge_stablehlo: {}
