    kind: positional_or_keyword
    name: x
    type: array
  - is_variadic: false
    kind: positional_or_keyword
    name: upper
    type: bool
type: attribute
variants:
  cupy:
    eager: cp.linalg.cholesky
  dask:
    eager: da.linalg.cholesky
  keras:
    eager: keras_ops.cholesky
  numpy:
