operation: AdditiveAttention
description: Additive attention layer, a.k.a. Bahdanau-style attention.
std_args:
- default: true
  is_variadic: false
  kind: positional_or_keyword
  name: use_scale
  type: bool
- default: 0.0
  is_variadic: false
  kind: positional_or_keyword
  name: dropout
  type: float
variants:
  numpy: {}
  cupy: {}
  dask: {}
  tensorflow: {}
  keras: {}
  pytorch: {}
  jax: {}
  mlx: {}
  edge_onnx: {}
  edge_stablehlo: {}
  edge_wgsl:
    template: binary
    expr: buf_in0_f32[in0_offset] + buf_in1_f32[in1_offset]
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
