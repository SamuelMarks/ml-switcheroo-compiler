operation: AdditiveAttention
description: Additive attention layer, a.k.a. Bahdanau-style attention.
std_args:
- default: true
  is_variadic: false
  kind: positional_or_keyword
  name: use_scale
  type: bool
- default: 0.0
  is_variadic: false
  kind: positional_or_keyword
  name: dropout
  type: float
variants:
  numpy: {}
  cupy: {}
  dask: {}
  tensorflow: {}
  keras: {}
  pytorch: {}
  jax: {}
  mlx: {}
  edge_wgsl:
    template: binary
    expr: buf_in0_f32[in0_offset] + buf_in1_f32[in1_offset]
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
  edge_wasm_simd:
    template: unary
    scalar_expr: in0_val
    simd_expr: in0_val
signature:
  args:
  - name: use_scale
    type: bool
    is_variadic: false
    kind: positional_or_keyword
  - name: dropout
    type: float
    is_variadic: false
    kind: positional_or_keyword
  input_tensors:
  - use_scale
  - dropout
  output_tensors:
  - out
  has_variadic_args: false
  has_variadic_kwargs: false
  keyword_constraints: {}
  keyword_defaults: {}
dtype_rules:
  promotion_matrix: standard
  allowed_input_dtypes:
  - all
  output_dtype_inference: promote(in0, in1)
shape_signature:
  pattern: in0
  symbolic_expression: '[*shape] -> [*shape]'
  category: unary
invariants:
  is_commutative: false
  is_associative: false
  is_idempotent: false
  identity_value: null
  absorbing_value: null
autodiff:
  vjp_rule_id: AdditiveAttention_vjp
  jvp_rule_id: AdditiveAttention_jvp
  vjp: null
  jvp: null
