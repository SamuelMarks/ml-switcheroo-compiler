operation: sin
description: The Sin operation.
std_args:
  - is_variadic: false
    kind: positional_or_keyword
    name: x
    type: array
variants:
  cupy:
    eager: cp.sin
    generator: cp.sin
  dask:
    eager: da.sin
    generator: da.sin
  edge_onnx:
    generator: Sin
  edge_stablehlo:
    generator: stablehlo.sine
  keras:
    eager: keras_ops.sin
  numpy:
    generator: np.sin
  tensorflow:
    eager: tf.sin
  pytorch: {}
  jax: {}
  mlx: {}
  edge_wgsl:
    template: unary
    expr: sin(buf_in0_f32[in0_offset])
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
autodiff:
  vjp:
    - Multiply($cotangent, Cos($input[0]))
  jvp: Multiply($tangent[0], Cos($input[0]))
