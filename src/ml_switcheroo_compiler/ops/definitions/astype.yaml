operation: astype
description: Copies an array to a specified data type irrespective of type-promotion
  rules.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: x
  type: array
- is_variadic: false
  kind: positional_or_keyword
  name: dtype
  type: dtype
- is_variadic: false
  kind: positional_or_keyword
  name: copy
  type: bool
- is_variadic: false
  kind: positional_or_keyword
  name: device
  type: Optional[device]
variants:
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
signature:
  args:
  - name: x
    type: array
    is_variadic: false
    kind: positional_or_keyword
  - name: dtype
    type: dtype
    is_variadic: false
    kind: positional_or_keyword
  - name: copy
    type: bool
    is_variadic: false
    kind: positional_or_keyword
  - name: device
    type: Optional[device]
    is_variadic: false
    kind: positional_or_keyword
  input_tensors:
  - x
  output_tensors:
  - out
  has_variadic_args: false
  has_variadic_kwargs: false
  keyword_constraints: {}
  keyword_defaults: {}
dtype_rules:
  promotion_matrix: standard
  allowed_input_dtypes:
  - all
  output_dtype_inference: promote(in0, in1)
shape_signature:
  pattern: in0
  symbolic_expression: '[*shape] -> [*shape]'
  category: unary
invariants:
  is_commutative: false
  is_associative: false
  is_idempotent: false
  identity_value: null
  absorbing_value: null
autodiff:
  vjp_rule_id: astype_vjp
  jvp_rule_id: astype_jvp
  vjp: null
  jvp: null
