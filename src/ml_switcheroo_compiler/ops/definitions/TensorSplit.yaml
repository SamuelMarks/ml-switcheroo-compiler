operation: TensorSplit
description: Splits a tensor into multiple sub-tensors.
std_args:
  - is_variadic: false
    kind: positional_or_keyword
    name: input
    type: Tensor
  - is_variadic: false
    kind: positional_or_keyword
    name: indices_or_sections
    type: Union[int, List[int]]
  - default: 0
    is_variadic: false
    kind: positional_or_keyword
    name: axis
    type: int
variants:
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
