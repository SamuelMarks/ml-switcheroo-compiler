operation: TensorSplit
description: Splits a tensor into multiple sub-tensors.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: input
  type: Tensor
- is_variadic: false
  kind: positional_or_keyword
  name: indices_or_sections
  type: Union[int, List[int]]
- default: 0
  is_variadic: false
  kind: positional_or_keyword
  name: axis
  type: int
variants:
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
signature:
  args:
  - name: input
    type: Tensor
    is_variadic: false
    kind: positional_or_keyword
  - name: indices_or_sections
    type: Union[int, List[int]]
    is_variadic: false
    kind: positional_or_keyword
  - name: axis
    type: int
    is_variadic: false
    kind: positional_or_keyword
  input_tensors:
  - input
  - indices_or_sections
  - axis
  output_tensors:
  - out
  has_variadic_args: false
  has_variadic_kwargs: false
  keyword_constraints: {}
  keyword_defaults: {}
dtype_rules:
  promotion_matrix: standard
  allowed_input_dtypes:
  - all
  output_dtype_inference: promote(in0, in1)
shape_signature:
  pattern: split(in0, num_or_size_splits, axis)
  symbolic_expression: '[*shape] -> [*shape]'
  category: split
invariants:
  is_commutative: false
  is_associative: false
  is_idempotent: false
  identity_value: null
  absorbing_value: null
autodiff:
  vjp_rule_id: TensorSplit_vjp
  jvp_rule_id: TensorSplit_jvp
  vjp: null
  jvp: null
