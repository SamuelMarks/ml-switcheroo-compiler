operation: less
description: The Less operation.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: x1
  type: Union[array, int, float]
- is_variadic: false
  kind: positional_or_keyword
  name: x2
  type: Union[array, int, float]
variants:
  cupy:
    eager: cp.less
    generator: cp.less
  dask:
    eager: da.less
    generator: da.less
  edge_onnx:
    generator: Less
  edge_stablehlo:
    generator: stablehlo.compare
  keras:
    eager: keras_ops.less
  numpy:
    generator: np.less
  tensorflow:
    eager: tf.less
  pytorch:
    eager: torch.less
  jax:
    eager: jax.numpy.less
  mlx:
    eager: mlx.core.less
  edge_wgsl:
    template: binary
    expr: f32(buf_in0_f32[in0_offset] < buf_in1_f32[in1_offset])
  edge_wasm_simd:
    template: binary
    simd_expr: wasm_v128_bitselect(wasm_f32x4_splat(1.0f), wasm_f32x4_splat(0.0f),
      wasm_f32x4_lt(in0_val, in1_val))
    scalar_expr: 'in0_val < in1_val ? 1.0f : 0.0f'
  llvm_cpp:
    template: binary
    scalar_expr: 'in0_val < in1_val ? 1.0f : 0.0f'
