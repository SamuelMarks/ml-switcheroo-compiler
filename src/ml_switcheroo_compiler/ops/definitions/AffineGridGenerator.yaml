operation: AffineGridGenerator
description: Generates a 2D or 3D flow field (sampling grid), given a batch of affine
  matrices.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: theta
  type: Tensor
- is_variadic: false
  kind: positional_or_keyword
  name: size
  type: List[int]
- default: false
  is_variadic: false
  kind: positional_or_keyword
  name: align_corners
  type: bool
variants:
  numpy: {}
  cupy: {}
  dask: {}
  tensorflow: {}
  keras: {}
  pytorch: {}
  jax: {}
  mlx: {}
  edge_onnx: {}
  edge_stablehlo: {}
  edge_wgsl: {}
  edge_wasm_simd: {}
  llvm_cpp: {}
