operation: AffineGridGenerator
description: Generates a 2D or 3D flow field (sampling grid), given a batch of affine
  matrices.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: theta
  type: Tensor
- is_variadic: false
  kind: positional_or_keyword
  name: size
  type: List[int]
- default: false
  is_variadic: false
  kind: positional_or_keyword
  name: align_corners
  type: bool
variants:
  numpy: {}
  cupy: {}
  dask: {}
  tensorflow: {}
  keras: {}
  pytorch: {}
  jax: {}
  mlx: {}
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
  edge_wasm_simd:
    template: unary
    scalar_expr: in0_val
    simd_expr: in0_val
  edge_wgsl:
    template: unary
    expr: buf_in0_f32[in0_offset]
signature:
  args:
  - name: theta
    type: Tensor
    is_variadic: false
    kind: positional_or_keyword
  - name: size
    type: List[int]
    is_variadic: false
    kind: positional_or_keyword
  - name: align_corners
    type: bool
    is_variadic: false
    kind: positional_or_keyword
  input_tensors:
  - theta
  - size
  - align_corners
  output_tensors:
  - out
  has_variadic_args: false
  has_variadic_kwargs: false
  keyword_constraints: {}
  keyword_defaults: {}
dtype_rules:
  promotion_matrix: standard
  allowed_input_dtypes:
  - all
  output_dtype_inference: promote(in0, in1)
shape_signature:
  pattern: in0
  symbolic_expression: '[*shape] -> [*shape]'
  category: unary
invariants:
  is_commutative: false
  is_associative: false
  is_idempotent: false
  identity_value: null
  absorbing_value: null
autodiff:
  vjp_rule_id: AffineGridGenerator_vjp
  jvp_rule_id: AffineGridGenerator_jvp
  vjp: null
  jvp: null
