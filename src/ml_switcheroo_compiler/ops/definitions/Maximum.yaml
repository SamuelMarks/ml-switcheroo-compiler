operation: Maximum
description: The Maximum operation.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: x1
  type: Union[array, int, float]
- is_variadic: false
  kind: positional_or_keyword
  name: x2
  type: Union[array, int, float]
variants:
  cupy:
    eager: cp.maximum
  dask:
    eager: da.maximum
  keras:
    eager: keras_ops.maximum
  tensorflow:
    eager: tf.maximum
  numpy: {}
  pytorch: {}
  jax: {}
  mlx: {}
  edge_onnx: {}
  edge_stablehlo: {}
  edge_wgsl:
    template: binary
    expr: max(buf_in0_f32[in0_offset], buf_in1_f32[in1_offset])
  edge_wasm_simd:
    template: binary
    simd_expr: wasm_f32x4_max(in0_val, in1_val)
    scalar_expr: std::max(in0_val, in1_val)
  llvm_cpp:
    template: binary
    scalar_expr: std::max(in0_val, in1_val)
autodiff:
  vjp:
  - Multiply($cotangent, Greater($input[0], $input[1]))
  - Multiply($cotangent, LessEqual($input[0], $input[1]))
  jvp: Add(Multiply($tangent[0], Greater($input[0], $input[1])), Multiply($tangent[1],
    LessEqual($input[0], $input[1])))
