operation: SetPrintoptions
description: Set printing options.
std_args:
- is_variadic: true
  kind: positional_or_keyword
  name: args
  type: Any
- is_variadic: false
  kind: var_keyword
  name: kwargs
  type: Any
variants:
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
