operation: ReduceProd
description: Computes the product of elements across dimensions of a tensor.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: input
  type: Tensor
- is_variadic: false
  kind: positional_or_keyword
  name: axis
  type: int | List[int]
- default: false
  is_variadic: false
  kind: positional_or_keyword
  name: keepdims
  type: bool
variants:
  edge_wgsl:
    template: reduction
    init_code: var res = 1.0;
    start_idx: '0'
    loop_code: res = res * buf_in0_f32[i];
    post_loop_code: ''
    result_var: res
  edge_wasm_simd:
    template: reduction
    init_val: '1.0'
    simd_expr: wasm_f32x4_mul(sum_{clean_id}, val)
    scalar_expr: scalar_sum_{clean_id} * val
    final_combine: _simd_reduce_mul(sum_{clean_id}) * scalar_sum_{clean_id}
  llvm_cpp:
    template: reduction
    init_val: '1.0'
    scalar_expr: res * val
    final_combine: res
  edge_onnx:
    generator: ReduceProd
autodiff:
  vjp_rule_id: ReduceProd_vjp
  jvp_rule_id: ReduceProd_jvp
  vjp:
  - Multiply(Broadcast(Multiply($cotangent, ReduceProd($input[0]))), TrueDivide(Constant(1.0),
    $input[0]))
  jvp: ReduceSum(Multiply($tangent[0], Multiply(Broadcast(ReduceProd($input[0])),
    TrueDivide(Constant(1.0), $input[0]))))
signature:
  args:
  - name: input
    type: Tensor
    is_variadic: false
    kind: positional_or_keyword
  - name: axis
    type: int | List[int]
    is_variadic: false
    kind: positional_or_keyword
  - name: keepdims
    type: bool
    is_variadic: false
    kind: positional_or_keyword
  input_tensors:
  - input
  - axis
  - keepdims
  output_tensors:
  - out
  has_variadic_args: false
  has_variadic_kwargs: false
  keyword_constraints: {}
  keyword_defaults: {}
dtype_rules:
  promotion_matrix: standard
  allowed_input_dtypes:
  - all
  output_dtype_inference: promote(in0, in1)
shape_signature:
  pattern: reduce(in0, axis, keepdims)
  symbolic_expression: '[*shape] -> [*shape]'
  category: reduction
invariants:
  is_commutative: false
  is_associative: false
  is_idempotent: false
  identity_value: null
  absorbing_value: null
