  cupy: {}
  dask: {}
  tensorflow:
    eager: tf.bertmodel
  keras:
    eager: keras_ops.bertmodel
  pytorch:
    eager: torch.bertmodel
  jax:
    eager: jax.numpy.bertmodel
  mlx:
    eager: mlx.core.bertmodel
  edge_onnx: {}
  edge_stablehlo: {}
  edge_wgsl:
    template: unary
    expr: buf_in0_f32[in0_offset]
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
