FFT:
  autodiff:
    jvp: null
    jvp_rule_id: fft_jvp
    vjp: null
    vjp_rule_id: fft_vjp
  broadcast_semantics: numpy
  description: The Fft operation.
  domain: signal
  input_tensors: &id001
  - x
  math_semantics:
    differentiable: true
    is_associative: false
    is_commutative: false
    is_idempotent: false
  operation: FFT
  output_tensors:
  - out
  signature:
    args:
    - is_variadic: false
      name: x
      type: Tensor
    output_dtype_formula: x.dtype
    output_shape_formula: x.shape
  type_promotion: standard
  variants:
    cupy:
      eager: cp.fft
    dask:
      eager: da.fft
    edge_stablehlo:
      opcode: stablehlo.fft
    edge_wasm_simd:
      scalar_expr: in0_val
      simd_expr: in0_val
      template: unary
    edge_wgsl:
      expr: buf_in0_f32[in0_offset]
      template: unary
    jax: {}
    keras:
      eager: keras_ops.fft
    llvm_cpp:
      scalar_expr: in0_val
      template: unary
    mlx: {}
    numpy:
      generator: np.fft.fft
    pytorch: {}
    tensorflow: {}
