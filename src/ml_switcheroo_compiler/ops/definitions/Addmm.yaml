operation: Addmm
description: Performs a matrix multiplication of the matrices mat1 and mat2. The matrix
  input is added to the final result.
std_args:
  - is_variadic: false
    kind: positional_or_keyword
    name: input
    type: Tensor
  - is_variadic: false
    kind: positional_or_keyword
    name: mat1
    type: Tensor
  - is_variadic: false
    kind: positional_or_keyword
    name: mat2
    type: Tensor
  - default: 1.0
    is_variadic: false
    kind: positional_or_keyword
    name: beta
    type: float
  - default: 1.0
    is_variadic: false
    kind: positional_or_keyword
    name: alpha
    type: float
variants:
  numpy: {}
  cupy: {}
  dask: {}
  tensorflow: {}
  keras: {}
  pytorch: {}
  jax: {}
  mlx: {}
  edge_onnx:
    generator: Addmm
  edge_stablehlo:

    opcode: stablehlo.addmm
  edge_wgsl:
    template: binary
    expr: buf_in0_f32[in0_offset] + buf_in1_f32[in1_offset]
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
