operation: atan
description: The Atan operation.
std_args:
  - is_variadic: false
    kind: positional_or_keyword
    name: x
    type: array
variants:
  cupy:
    generator: cp.arctan
  dask:
    generator: da.arctan
  numpy:
    generator: np.arctan
  tensorflow:
    eager: tf.atan
  keras:
    eager: keras_ops.atan
  pytorch:
    eager: torch.atan
  jax:
    eager: jax.numpy.arctan
  mlx:
    eager: mlx.core.atan
  edge_onnx:
    generator: Atan
  edge_stablehlo:

    opcode: stablehlo.atan
  edge_wgsl:
    template: unary
    expr: atan(buf_in0_f32[in0_offset])
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
