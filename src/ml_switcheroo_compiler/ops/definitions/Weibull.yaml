operation: Weibull
description: "Samples from a two-parameter Weibull distribution.\n\nExample:\n\n \
  \   >>> # xdoctest: +IGNORE_WANT(\"non-deterministic\")\n    >>> m = Weibull(torch.tensor([1.0]),\
  \ torch.tensor([1.0]))\n    >>> m.sample()  # sample from a Weibull distribution\
  \ with scale=1, concentration=1\n    tensor([ 0.4784])\n\nArgs:\n    scale (float\
  \ or Tensor): Scale parameter of distribution (lambda).\n    concentration (float\
  \ or Tensor): Concentration parameter of distribution (k/shape).\n    validate_args\
  \ (bool, optional): Whether to validate arguments. Default: None."
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: scale
  type: Any
- is_variadic: false
  kind: positional_or_keyword
  name: concentration
  type: Any
- is_variadic: false
  kind: positional_or_keyword
  name: validate_args
  type: Any
variants:
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
signature:
  args:
  - name: scale
    type: Any
    is_variadic: false
    kind: positional_or_keyword
  - name: concentration
    type: Any
    is_variadic: false
    kind: positional_or_keyword
  - name: validate_args
    type: Any
    is_variadic: false
    kind: positional_or_keyword
  input_tensors:
  - scale
  - concentration
  - validate_args
  output_tensors:
  - out
  has_variadic_args: false
  has_variadic_kwargs: false
  keyword_constraints: {}
  keyword_defaults: {}
dtype_rules:
  promotion_matrix: standard
  allowed_input_dtypes:
