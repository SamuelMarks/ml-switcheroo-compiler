  kind: positional_or_keyword
  name: input
  type: Tensor
- is_variadic: false
  kind: positional_or_keyword
  name: dim
  type: int
- is_variadic: false
  kind: positional_or_keyword
  name: index
  type: Tensor
- is_variadic: false
  kind: positional_or_keyword
  name: value
  type: number
variants:
