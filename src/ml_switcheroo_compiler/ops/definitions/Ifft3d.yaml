    generator: torch.fft.ifftn({0}, s={s}, dim={axes})
  numpy:
    eager: numpy.ifft3d
  cupy: {}
  dask: {}
  tensorflow:
    eager: tf.ifft3d
  keras:
    eager: keras_ops.ifft3d
  jax:
    eager: jax.numpy.ifft3d
  mlx:
    eager: mlx.core.ifft3d
  edge_onnx: {}
  edge_stablehlo: {}
  edge_wgsl:
    template: unary
    expr: buf_in0_f32[in0_offset]
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
