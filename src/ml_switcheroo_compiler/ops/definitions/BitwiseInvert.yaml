operation: BitwiseInvert
description: Compute bit-wise inversion, or bit-wise NOT, element-wise.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: x
  type: Tensor
variants:
  numpy:
    eager: numpy.bitwiseinvert
  cupy: {}
  dask: {}
  tensorflow:
    eager: tf.bitwiseinvert
  keras:
    eager: keras_ops.bitwiseinvert
  pytorch:
    eager: torch.bitwiseinvert
  jax:
    eager: jax.numpy.bitwiseinvert
  mlx:
    eager: mlx.core.bitwiseinvert
  edge_onnx: {}
  edge_stablehlo: {}
  edge_wgsl:
    template: binary
    expr: f32(buf_in0_f32[in0_offset] != 0.0 && buf_in1_f32[in1_offset] != 0.0)
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
