operation: remainder
description: The Remainder operation.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: x1
  type: Union[array, int, float]
- is_variadic: false
  kind: positional_or_keyword
  name: x2
  type: Union[array, int, float]
variants:
  cupy:
    eager: cp.remainder
  dask:
    eager: da.remainder
  numpy:
    eager: numpy.remainder
  tensorflow:
    eager: tf.remainder
  keras:
    eager: keras_ops.remainder
  pytorch:
    eager: torch.remainder
  jax:
    eager: jax.numpy.remainder
  mlx:
    eager: mlx.core.remainder
  edge_onnx: {}
  edge_stablehlo: {}
  edge_wgsl:
    template: binary
    expr: buf_in0_f32[in0_offset] - buf_in1_f32[in1_offset] * floor(buf_in0_f32[in0_offset]
      / buf_in1_f32[in1_offset])
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
