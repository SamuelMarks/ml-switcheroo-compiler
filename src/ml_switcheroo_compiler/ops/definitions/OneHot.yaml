operation: OneHot
description: The OneHot operation.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: x
  type: Tensor
- is_variadic: false
  kind: positional_or_keyword
  name: num_classes
  type: int
variants:
  keras:
    eager: keras_ops.one_hot
  numpy:
    generator: np.eye({depth})[{0}]
  tensorflow:
    eager: tf.one_hot
  cupy: {}
  dask: {}
  pytorch: {}
  jax: {}
  mlx: {}
  edge_onnx: {}
  edge_stablehlo: {}
  edge_wgsl:
    template: unary
    expr: buf_in0_f32[in0_offset]
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
