operation: SavezCompressed
description: Save several arrays to a compressed .npz format.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: file
  type: str
- is_variadic: true
  kind: positional_or_keyword
  name: args
  type: Any
variants:
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
