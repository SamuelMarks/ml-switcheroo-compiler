operation: asinh
description: The Asinh operation.
std_args:
  - is_variadic: false
    kind: positional_or_keyword
    name: x
    type: array
variants:
  cupy:
    generator: cp.arcsinh
  dask:
    generator: da.arcsinh
  numpy:
    generator: np.arcsinh
  tensorflow:
    eager: tf.asinh
  keras:
    eager: keras_ops.asinh
  pytorch:
    eager: torch.asinh
  jax:
    eager: jax.numpy.arcsinh
  mlx:
    eager: mlx.core.asinh
  edge_onnx:
    generator: Asinh
  edge_stablehlo:

    opcode: stablehlo.asinh
  edge_wgsl:
    template: unary
    expr: asinh(buf_in0_f32[in0_offset])
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
