operation: AreDeterministicAlgorithmsEnabled
description: Returns True if global deterministic flag is turned on.
std_args: []
variants:
  numpy:
    eager: numpy.aredeterministicalgorithmsenabled
  cupy: {}
  dask: {}
  tensorflow:
    eager: tf.aredeterministicalgorithmsenabled
  keras:
    eager: keras_ops.aredeterministicalgorithmsenabled
  pytorch:
    eager: torch.aredeterministicalgorithmsenabled
  jax:
    eager: jax.numpy.aredeterministicalgorithmsenabled
  mlx:
    eager: mlx.core.aredeterministicalgorithmsenabled
  edge_onnx: {}
  edge_stablehlo: {}
  edge_wgsl:
    template: binary
    expr: f32(buf_in0_f32[in0_offset] != 0.0 && buf_in1_f32[in1_offset] != 0.0)
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
