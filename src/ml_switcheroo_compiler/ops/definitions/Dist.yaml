operation: Dist
description: Returns the p-norm of (input - other).
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: input
  type: Tensor
- is_variadic: false
  kind: positional_or_keyword
  name: other
  type: Tensor
- default: 2.0
  is_variadic: false
  kind: positional_or_keyword
  name: p
  type: float
variants:
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
