operation: LogicalXor
description: The LogicalXor operation.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: input
  type: Tensor
- is_variadic: false
  kind: positional_or_keyword
  name: other
  type: Tensor
variants:
  cupy:
    eager: cp.logical_xor
  dask:
    eager: da.logical_xor
  keras:
    eager: keras_ops.logical_xor
  tensorflow:
    eager: tf.math.logical_xor
  numpy:
    eager: numpy.logicalxor
  pytorch:
    eager: torch.logicalxor
  jax:
    eager: jax.numpy.logicalxor
  mlx:
    eager: mlx.core.logicalxor
  edge_stablehlo:
    opcode: stablehlo.xor
  edge_wgsl:
    template: binary
    expr: f32((buf_in0_f32[in0_offset] != 0.0) != (buf_in1_f32[in1_offset] != 0.0))
  edge_wasm_simd:
    template: binary
    simd_expr: wasm_v128_bitselect(wasm_f32x4_splat(1.0f), wasm_f32x4_splat(0.0f),
      wasm_v128_xor(wasm_f32x4_ne(in0_val, wasm_f32x4_splat(0.0f)), wasm_f32x4_ne(in1_val,
      wasm_f32x4_splat(0.0f))))
    scalar_expr: _scalar_logicalxor(in0_val, in1_val)
  llvm_cpp:
    template: binary
    scalar_expr: '(in0_val != 0.0f) != (in1_val != 0.0f) ? 1.0f : 0.0f'
