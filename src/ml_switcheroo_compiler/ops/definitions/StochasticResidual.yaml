- default: 1.0
  is_variadic: false
  kind: positional_or_keyword
  name: residual_weight
  type: float
- default: 1.0
  is_variadic: false
  kind: positional_or_keyword
  name: survival_prob
  type: float
variants:
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
