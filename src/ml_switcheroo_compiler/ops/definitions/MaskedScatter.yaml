operation: MaskedScatter
description: Copies elements from source into self tensor at positions where the mask
  is True.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: input
  type: Tensor
- is_variadic: false
  kind: positional_or_keyword
  name: mask
  type: Tensor
- is_variadic: false
  kind: positional_or_keyword
  name: source
  type: Tensor
variants:
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
signature:
  args:
  - name: input
    type: Tensor
    is_variadic: false
    kind: positional_or_keyword
  - name: mask
    type: Tensor
    is_variadic: false
    kind: positional_or_keyword
  - name: source
    type: Tensor
    is_variadic: false
    kind: positional_or_keyword
  input_tensors:
  - input
  - mask
  - source
  output_tensors:
