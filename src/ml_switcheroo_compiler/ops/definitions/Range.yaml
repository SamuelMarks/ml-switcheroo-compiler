operation: Range
description: Returns a 1-D tensor of size floor((end - start) / step) + 1 with values
  from start to end with step step.
std_args:
- default: 0
  is_variadic: false
  kind: positional_or_keyword
  name: start
  type: float
- is_variadic: false
  kind: positional_or_keyword
  name: end
  type: float
- default: 1
  is_variadic: false
  kind: positional_or_keyword
  name: step
  type: float
variants:
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
signature:
  args:
  - name: start
    type: float
    is_variadic: false
    kind: positional_or_keyword
  - name: end
    type: float
    is_variadic: false
    kind: positional_or_keyword
  - name: step
    type: float
    is_variadic: false
    kind: positional_or_keyword
  input_tensors:
  - start
  - end
  - step
  output_tensors:
  - out
  has_variadic_args: false
  has_variadic_kwargs: false
  keyword_constraints: {}
  keyword_defaults: {}
dtype_rules:
  promotion_matrix: standard
  allowed_input_dtypes:
  - all
  output_dtype_inference: promote(in0, in1)
shape_signature:
  pattern: in0
  symbolic_expression: '[*shape] -> [*shape]'
  category: unary
invariants:
  is_commutative: false
  is_associative: false
  is_idempotent: false
  identity_value: null
  absorbing_value: null
autodiff:
  vjp_rule_id: Range_vjp
  jvp_rule_id: Range_jvp
  vjp: null
  jvp: null
