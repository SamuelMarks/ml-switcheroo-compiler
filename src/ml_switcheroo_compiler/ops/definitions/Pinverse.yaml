operation: Pinverse
description: Computes the pseudoinverse (Moore-Penrose inverse) of a matrix.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: input
  type: Tensor
- default: 1e-15
  is_variadic: false
  kind: positional_or_keyword
  name: rcond
  type: float
variants:
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
