operation: Sum
description: The Sum operation.
std_args:
  - is_variadic: false
    kind: positional_or_keyword
    name: x
    type: array
  - is_variadic: false
    kind: positional_or_keyword
    name: axis
    type: Optional[Union[int, Tuple[int, Ellipsis]]]
  - is_variadic: false
    kind: positional_or_keyword
    name: dtype
    type: Optional[dtype]
  - is_variadic: false
    kind: positional_or_keyword
    name: keepdims
    type: bool
variants:
  cupy:
    eager: cp.sum
    generator: cp.sum
  dask:
    eager: da.sum
    generator: da.sum
  keras:
    eager: keras_ops.sum
  numpy:
    generator: np.sum
  pytorch:
    generator: torch.sum({0}, dim={axis}, keepdim={keepdims})
  tensorflow:
    eager: tf.sum
  jax:
    eager: jax.numpy.sum
  mlx:
    eager: mlx.core.sum
  edge_onnx:
    generator: Sum
  edge_stablehlo:

    opcode: stablehlo.sum
  edge_wgsl:
    template: reduction
    init_code: var res = 0.0;
    start_idx: '0'
    loop_code: res = res + buf_in0_f32[i];
    post_loop_code: ''
    result_var: res
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
autodiff:
  vjp:
    - Broadcast($cotangent)
  jvp: Sum($tangent[0])
