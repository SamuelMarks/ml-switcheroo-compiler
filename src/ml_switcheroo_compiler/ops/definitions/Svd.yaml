operation: SVD
description: The Svd operation.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: x
  type: array
- is_variadic: false
  kind: positional_or_keyword
  name: full_matrices
  type: bool
type: attribute
variants:
  cupy:
    eager: cp.linalg.svd
  dask:
    eager: da.linalg.svd
  keras:
    eager: keras_ops.svd
  numpy:
    generator: np.linalg.svd
  tensorflow:
    eager: tf.linalg.svd
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
autodiff:
  vjp:
  - MatMul($cotangent, Transpose($input[0]))
  jvp: MatMul($tangent[0], Transpose($input[0]))
