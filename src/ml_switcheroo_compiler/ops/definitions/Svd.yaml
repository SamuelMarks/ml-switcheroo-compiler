operation: SVD
description: The Svd operation.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: x
  type: array
- is_variadic: false
  kind: positional_or_keyword
  name: full_matrices
  type: bool
type: attribute
variants:
  cupy:
    eager: cp.linalg.svd
  dask:
    eager: da.linalg.svd
  keras:
    eager: keras_ops.svd
  numpy:
    generator: np.linalg.svd
  tensorflow:
    eager: tf.linalg.svd
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
  edge_wasm_simd:
    template: unary
    scalar_expr: in0_val
    simd_expr: in0_val
  edge_wgsl:
    template: unary
    expr: buf_in0_f32[in0_offset]
autodiff:
  vjp_rule_id: SVD_vjp
  jvp_rule_id: SVD_jvp
  vjp:
  - MatMul($cotangent, Transpose($input[0]))
  jvp: MatMul($tangent[0], Transpose($input[0]))
signature:
  args:
  - name: x
    type: array
    is_variadic: false
    kind: positional_or_keyword
  - name: full_matrices
    type: bool
    is_variadic: false
    kind: positional_or_keyword
  input_tensors:
  - x
  output_tensors:
  - out
  has_variadic_args: false
  has_variadic_kwargs: false
  keyword_constraints: {}
  keyword_defaults: {}
dtype_rules:
  promotion_matrix: standard
  allowed_input_dtypes:
  - all
  output_dtype_inference: promote(in0, in1)
shape_signature:
  pattern: in0
  symbolic_expression: '[*shape] -> [*shape]'
  category: unary
invariants:
  is_commutative: false
  is_associative: false
  is_idempotent: false
  identity_value: null
  absorbing_value: null
