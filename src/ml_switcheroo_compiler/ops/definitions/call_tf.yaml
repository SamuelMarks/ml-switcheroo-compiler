operation: call_tf
description: Calls a TensorFlow function from JAX, with support for reverse autodiff.
std_args:
- callable_tf
- has_side_effects
- ordered
- output_shape_dtype
- call_tf_graph
type: function
variants:
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
signature:
  args: []
  input_tensors:
  - x
  output_tensors:
  - out
  has_variadic_args: false
  has_variadic_kwargs: false
  keyword_constraints: {}
  keyword_defaults: {}
dtype_rules:
  promotion_matrix: standard
  allowed_input_dtypes:
  - all
  output_dtype_inference: promote(in0, in1)
shape_signature:
