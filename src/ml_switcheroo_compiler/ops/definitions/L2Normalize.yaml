    eager: tf.linalg.l2_normalize
  numpy:
    eager: numpy.l2normalize
  cupy: {}
  dask: {}
  keras:
    eager: keras_ops.l2normalize
  pytorch:
    eager: torch.l2normalize
  jax:
    eager: jax.numpy.l2normalize
  mlx:
    eager: mlx.core.l2normalize
  edge_onnx: {}
  edge_stablehlo: {}
  edge_wgsl:
    template: conv_pool_1d_flat
    expr: buf_in0_f32[idx]
  edge_wasm_simd:
    template: conv_pool_1d_flat
    math_op: '* 1.0f'
