operation: Rand
description: Returns a tensor filled with random numbers from a uniform distribution
  on [0, 1).
std_args:
- is_variadic: true
  kind: positional_or_keyword
  name: size
  type: int
- default: None
  is_variadic: false
  kind: positional_or_keyword
  name: dtype
  type: Any
variants:
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
