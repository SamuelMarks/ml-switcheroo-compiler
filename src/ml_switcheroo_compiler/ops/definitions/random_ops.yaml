Bernoulli:
  autodiff:
    jvp: null
    jvp_rule_id: Bernoulli_jvp
    vjp: null
    vjp_rule_id: Bernoulli_vjp
  broadcast_semantics: numpy
  description: Draws binary random numbers (0 or 1) from a Bernoulli distribution.
  domain: random
  input_tensors: &id001
  - shape
  math_semantics:
    differentiable: true
    is_associative: false
    is_commutative: false
    is_idempotent: false
  operation: Bernoulli
  output_tensors:
  - out
  signature:
    args:
    - is_variadic: false
      name: shape
      type: Tensor
    output_dtype_formula: shape.dtype
    output_shape_formula: shape.shape
  type_promotion: standard
  variants:
    cupy: {}
    dask: {}
    edge_wasm_simd:
      scalar_expr: in0_val
      simd_expr: in0_val
      template: unary
    edge_wgsl:
      expr: buf_in0_f32[in0_offset]
      template: unary
    jax:
      eager: jax.numpy.bernoulli
    keras:
      eager: keras_ops.bernoulli
    llvm_cpp:
      scalar_expr: in0_val
      template: unary
    mlx:
      eager: mlx.core.bernoulli
    numpy:
      eager: numpy.bernoulli
    pytorch:
      eager: torch.bernoulli
    tensorflow:
      eager: tf.bernoulli
