operation: SaveSafetensors
description: Save arrays to Safetensors format.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: file
  type: str
- is_variadic: false
  kind: positional_or_keyword
  name: arrays
  type: Dict[str, Tensor]
- is_variadic: false
  kind: positional_or_keyword
  name: metadata
  type: Dict[str, str] | None
variants:
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
