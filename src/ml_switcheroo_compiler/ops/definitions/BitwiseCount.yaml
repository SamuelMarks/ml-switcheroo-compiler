operation: BitwiseCount
description: Computes the number of 1-bits in the absolute value of x.
std_args:
  - is_variadic: false
    kind: positional_or_keyword
    name: x
    type: Array
variants:
  numpy:
    eager: numpy.bitwisecount
  cupy: {}
  dask: {}
  tensorflow:
    eager: tf.bitwisecount
  keras:
    eager: keras_ops.bitwisecount
  pytorch:
    eager: torch.bitwisecount
  jax:
    eager: jax.numpy.bitwisecount
  mlx:
    eager: mlx.core.bitwisecount
  edge_onnx:
    generator: BitwiseCount
  edge_stablehlo:

    opcode: stablehlo.bitwise_count
  edge_wgsl:
    template: binary
    expr: f32(buf_in0_f32[in0_offset] != 0.0 && buf_in1_f32[in1_offset] != 0.0)
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
