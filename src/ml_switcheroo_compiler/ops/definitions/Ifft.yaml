operation: ifft
description: The Ifft operation.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: x
  type: array
- is_variadic: false
  kind: positional_or_keyword
  name: n
  type: Optional[int]
- is_variadic: false
  kind: positional_or_keyword
  name: axis
  type: int
- is_variadic: false
  kind: positional_or_keyword
  name: norm
  type: Literal[backward, ortho, forward]
type: function
variants:
  cupy:
    eager: cp.fft.ifft
  dask:
    eager: da.fft.ifft
  numpy:
    generator: np.fft.ifft
  pytorch:
    generator: torch.fft.ifft({0}, n={n}, dim={axis})
  tensorflow:
    eager: tf.ifft
  keras:
    eager: keras_ops.ifft
  jax:
    eager: jax.numpy.ifft
  mlx:
    eager: mlx.core.ifft
  edge_onnx: {}
  edge_stablehlo: {}
  edge_wgsl:
    template: unary
    expr: buf_in0_f32[in0_offset]
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
