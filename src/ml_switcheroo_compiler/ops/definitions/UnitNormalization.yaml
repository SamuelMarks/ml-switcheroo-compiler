operation: UnitNormalization
description: Normalize a batch of inputs so that each input in the batch has a L2
  norm equal to 1.
std_args:
- default: -1
  is_variadic: false
  kind: positional_or_keyword
  name: axis
  type: int
variants:
  edge_wasm_simd:
    template: conv_pool_1d_flat
    math_op: '* 1.0f'
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
