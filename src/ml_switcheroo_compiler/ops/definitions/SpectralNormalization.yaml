operation: SpectralNormalization
description: Performs spectral normalization on the weights of a target layer.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: layer
  type: Any
- default: 1
  is_variadic: false
  kind: positional_or_keyword
  name: power_iterations
  type: int
variants:
  edge_wasm_simd:
    template: conv_pool_1d_flat
    math_op: '* 1.0f'
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
