operation: RandomRotation
description: Randomly rotates images during training.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: factor
  type: float
- default: reflect
  is_variadic: false
  kind: positional_or_keyword
  name: fill_mode
  type: str
- default: bilinear
  is_variadic: false
  kind: positional_or_keyword
  name: interpolation
  type: str
- is_variadic: false
  kind: positional_or_keyword
  name: seed
  type: int
variants:
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
