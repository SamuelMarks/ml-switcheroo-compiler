operation: QuantizePerTensorDynamic
description: Converts a float tensor to a quantized tensor with scale and zero_point
  calculated dynamically.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: input
  type: Tensor
- is_variadic: false
  kind: positional_or_keyword
  name: dtype
  type: Any
- default: 'False'
  is_variadic: false
  kind: positional_or_keyword
  name: reduce_range
  type: bool
variants:
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
