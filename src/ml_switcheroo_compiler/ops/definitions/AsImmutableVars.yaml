operation: AsImmutableVars
description: Converts specific variables.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: node
  type: Any
variants:
  numpy:
    eager: numpy.asimmutablevars
  cupy: {}
  dask: {}
  tensorflow:
    eager: tf.asimmutablevars
  keras:
    eager: keras_ops.asimmutablevars
  pytorch:
    eager: torch.asimmutablevars
  jax:
    eager: jax.numpy.asimmutablevars
  mlx:
    eager: mlx.core.asimmutablevars
  edge_onnx: {}
  edge_stablehlo: {}
  edge_wgsl:
    template: unary
    expr: buf_in0_f32[in0_offset]
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
