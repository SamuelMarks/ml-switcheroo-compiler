operation: SinusoidalPositionalEncoding
description: Injects sinusoidal positional encodings.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: dims
  type: int
- default: 0.0001
  is_variadic: false
  kind: positional_or_keyword
  name: min_freq
  type: float
variants:
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
