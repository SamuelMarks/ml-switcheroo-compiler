operation: FormatFloatScientific
description: Format a floating-point scalar as a decimal string in scientific notation.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: x
  type: float
- is_variadic: false
  kind: positional_or_keyword
  name: precision
  type: int
variants:
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
