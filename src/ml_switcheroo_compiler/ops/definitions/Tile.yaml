operation: tile
description: The Tile operation.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: x
  type: array
- is_variadic: false
  kind: positional_or_keyword
  name: repetitions
  type: Tuple[int, Ellipsis]
variants:
  cupy:
    eager: cp.tile
  dask:
    eager: da.tile
  keras:
    eager: keras_ops.tile
  tensorflow:
    eager: tf.tile
  numpy:
    eager: numpy.tile
  pytorch:
    eager: torch.tile
  jax:
    eager: jax.numpy.tile
  mlx:
    eager: mlx.core.tile
  edge_onnx: {}
  edge_stablehlo: {}
  edge_wgsl:
    template: unary
    expr: buf_in0_f32[in0_offset]
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
