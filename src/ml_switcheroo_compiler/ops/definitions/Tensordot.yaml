    kind: positional_or_keyword
    name: x1
    type: array
  - is_variadic: false
    kind: positional_or_keyword
    name: x2
    type: array
  - is_variadic: false
    kind: positional_or_keyword
    name: axes
    type: Union[int, Tuple[Sequence[int], Sequence[int]]]
variants:
