  tensorflow:
    eager: tf.tensordot
  pytorch:
    eager: torch.tensordot
  jax:
    eager: jax.numpy.tensordot
  mlx:
    eager: mlx.core.tensordot
  edge_onnx:
    generator: Tensordot
  edge_stablehlo:

    opcode: stablehlo.tensordot
  llvm_cpp:
