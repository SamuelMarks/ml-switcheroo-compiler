operation: Tensordot
description: The Tensordot operation.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: x1
  type: array
- is_variadic: false
  kind: positional_or_keyword
  name: x2
  type: array
- is_variadic: false
  kind: positional_or_keyword
  name: axes
  type: Union[int, Tuple[Sequence[int], Sequence[int]]]
variants:
  cupy:
    eager: cp.tensordot
  dask:
    eager: da.tensordot
  keras:
    eager: keras_ops.tensordot
  numpy:
    generator: np.tensordot({0}, {1}, axes={axes})
  tensorflow:
    eager: tf.tensordot
  pytorch:
    eager: torch.tensordot
  jax:
    eager: jax.numpy.tensordot
  mlx:
    eager: mlx.core.tensordot
  edge_onnx: {}
  edge_stablehlo: {}
  edge_wgsl:
    template: unary
    expr: buf_in0_f32[in0_offset]
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
