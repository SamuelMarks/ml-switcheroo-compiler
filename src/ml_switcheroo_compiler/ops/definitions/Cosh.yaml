    eager: cp.cosh
  dask:
    eager: da.cosh
  keras:
    eager: keras_ops.cosh
  tensorflow:
    eager: tf.cosh
  numpy: {}
  pytorch: {}
  jax: {}
  mlx: {}
  edge_onnx:
    generator: cosh
  edge_stablehlo:

    opcode: stablehlo.cosh
