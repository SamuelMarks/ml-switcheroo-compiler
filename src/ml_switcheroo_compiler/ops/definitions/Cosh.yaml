operation: cosh
description: The Cosh operation.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: x
  type: array
variants:
  cupy:
    eager: cp.cosh
  dask:
    eager: da.cosh
  keras:
    eager: keras_ops.cosh
  tensorflow:
    eager: tf.cosh
  numpy: {}
  pytorch: {}
  jax: {}
  mlx: {}
  edge_onnx: {}
  edge_stablehlo: {}
  edge_wgsl:
    template: unary
    expr: cosh(buf_in0_f32[in0_offset])
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
autodiff:
  vjp:
  - Multiply($cotangent, Sinh($input[0]))
  jvp: Multiply($tangent[0], Sinh($input[0]))
