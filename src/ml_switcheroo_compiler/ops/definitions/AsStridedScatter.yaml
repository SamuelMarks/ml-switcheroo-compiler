operation: AsStridedScatter
description: Embeds values into input using strides.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: input
  type: Tensor
- is_variadic: false
  kind: positional_or_keyword
  name: src
  type: Tensor
- is_variadic: false
  kind: positional_or_keyword
  name: size
  type: Sequence[int]
- is_variadic: false
  kind: positional_or_keyword
  name: stride
  type: Sequence[int]
- is_variadic: false
  kind: positional_or_keyword
  name: storage_offset
  type: int
