    eager: numpy.arraystr
  cupy: {}
  dask: {}
  tensorflow:
    eager: tf.arraystr
  keras:
    eager: keras_ops.arraystr
  pytorch:
    eager: torch.arraystr
  jax:
    eager: jax.numpy.arraystr
  mlx:
    eager: mlx.core.arraystr
  edge_onnx: {}
  edge_stablehlo: {}
