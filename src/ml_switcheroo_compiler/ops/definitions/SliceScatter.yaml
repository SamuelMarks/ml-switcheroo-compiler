operation: SliceScatter
description: Embeds values into the tensor at a given dimension slice.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: input
  type: Tensor
- is_variadic: false
  kind: positional_or_keyword
  name: src
  type: Tensor
- default: 0
  is_variadic: false
  kind: positional_or_keyword
  name: dim
  type: int
- is_variadic: false
  kind: positional_or_keyword
  name: start
  type: int
- is_variadic: false
  kind: positional_or_keyword
  name: end
  type: int
- default: 1
  is_variadic: false
  kind: positional_or_keyword
  name: step
  type: int
variants:
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
