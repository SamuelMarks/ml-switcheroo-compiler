operation: FillDiagonal
description: Fill the main diagonal of the given array of any dimensionality.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: a
  type: Array
- is_variadic: false
  kind: positional_or_keyword
  name: val
  type: Any
- default: false
  is_variadic: false
  kind: positional_or_keyword
  name: wrap
  type: bool
variants:
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
