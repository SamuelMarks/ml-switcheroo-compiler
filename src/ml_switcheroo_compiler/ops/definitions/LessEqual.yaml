operation: LessEqual
description: The LessEqual operation.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: input
  type: Tensor
- is_variadic: false
  kind: positional_or_keyword
  name: other
  type: Tensor
variants:
  cupy:
    eager: cp.less_equal
  dask:
    eager: da.less_equal
  keras:
    eager: keras_ops.less_equal
  tensorflow:
    eager: tf.less_equal
  numpy:
    eager: numpy.lessequal
  pytorch:
    eager: torch.lessequal
  jax:
    eager: jax.numpy.lessequal
  mlx:
    eager: mlx.core.lessequal
  edge_onnx: {}
  edge_stablehlo: {}
  edge_wgsl:
    template: binary
    expr: f32(buf_in0_f32[in0_offset] <= buf_in1_f32[in1_offset])
  edge_wasm_simd:
    template: binary
    simd_expr: wasm_v128_bitselect(wasm_f32x4_splat(1.0f), wasm_f32x4_splat(0.0f),
      wasm_f32x4_le(in0_val, in1_val))
    scalar_expr: 'in0_val <= in1_val ? 1.0f : 0.0f'
  llvm_cpp:
    template: binary
    scalar_expr: 'in0_val <= in1_val ? 1.0f : 0.0f'
