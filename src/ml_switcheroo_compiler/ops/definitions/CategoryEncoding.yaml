operation: CategoryEncoding
description: A preprocessing layer which encodes integer features.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: num_tokens
  type: int
- default: multi_hot
  is_variadic: false
  kind: positional_or_keyword
  name: output_mode
  type: str
- default: false
  is_variadic: false
  kind: positional_or_keyword
  name: sparse
  type: bool
variants:
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
