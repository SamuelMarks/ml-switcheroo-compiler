operation: default
description: "Implement this method in a subclass such that it returns\na serializable\
  \ object for ``o``, or calls the base implementation\n(to raise a ``TypeError``).\n\
  \nFor example, to support arbitrary iterators, you could\nimplement default like\
  \ this::\n\n    def default(self, o):\n        try:\n            iterable = iter(o)\n\
  \        except TypeError:\n            pass\n        else:\n            return\
  \ list(iterable)\n        # Let the base class default method raise the TypeError\n\
  \        return super().default(o)"
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: self
  type: Any
- is_variadic: false
  kind: positional_or_keyword
  name: obj
  type: Any
variants:
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
signature:
  args:
  - name: self
    type: Any
    is_variadic: false
    kind: positional_or_keyword
  - name: obj
    type: Any
    is_variadic: false
    kind: positional_or_keyword
  input_tensors:
  - self
  - obj
  output_tensors:
  - out
  has_variadic_args: false
  has_variadic_kwargs: false
  keyword_constraints: {}
  keyword_defaults: {}
dtype_rules:
  promotion_matrix: standard
  allowed_input_dtypes:
  - all
  output_dtype_inference: promote(in0, in1)
shape_signature:
  pattern: in0
  symbolic_expression: '[*shape] -> [*shape]'
  category: unary
invariants:
  is_commutative: false
  is_associative: false
  is_idempotent: false
  identity_value: null
  absorbing_value: null
autodiff:
  vjp_rule_id: default_vjp
  jvp_rule_id: default_jvp
  vjp: null
  jvp: null
