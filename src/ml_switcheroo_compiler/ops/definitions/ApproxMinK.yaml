operation: ApproxMinK
description: Returns min k values and their indices using approximate search.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: operand
  type: Tensor
- is_variadic: false
  kind: positional_or_keyword
  name: k
  type: int
- default: -1
  is_variadic: false
  kind: positional_or_keyword
  name: reduction_dimension
  type: int
variants:
  numpy: {}
  cupy: {}
  dask: {}
  tensorflow: {}
  keras: {}
  pytorch: {}
  jax: {}
  mlx: {}
  edge_onnx: {}
  edge_stablehlo: {}
  edge_wgsl:
    template: unary
    expr: buf_in0_f32[in0_offset]
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
