operation: ApproxMinK
description: Returns min k values and their indices using approximate search.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: operand
  type: Tensor
- is_variadic: false
  kind: positional_or_keyword
  name: k
  type: int
- default: -1
  is_variadic: false
  kind: positional_or_keyword
  name: reduction_dimension
  type: int
variants:
  numpy: {}
  cupy: {}
  dask: {}
  tensorflow: {}
  keras: {}
  pytorch: {}
  jax: {}
  mlx: {}
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
  edge_wasm_simd:
    template: unary
    scalar_expr: in0_val
    simd_expr: in0_val
  edge_wgsl:
    template: unary
    expr: buf_in0_f32[in0_offset]
signature:
  args:
  - name: operand
    type: Tensor
    is_variadic: false
    kind: positional_or_keyword
  - name: k
    type: int
    is_variadic: false
    kind: positional_or_keyword
  - name: reduction_dimension
    type: int
    is_variadic: false
    kind: positional_or_keyword
  input_tensors:
  - operand
  - k
  - reduction_dimension
  output_tensors:
  - out
  has_variadic_args: false
  has_variadic_kwargs: false
  keyword_constraints: {}
  keyword_defaults: {}
dtype_rules:
  promotion_matrix: standard
  allowed_input_dtypes:
  - all
  output_dtype_inference: promote(in0, in1)
shape_signature:
  pattern: in0
  symbolic_expression: '[*shape] -> [*shape]'
  category: unary
invariants:
  is_commutative: false
  is_associative: false
  is_idempotent: false
  identity_value: null
  absorbing_value: null
autodiff:
  vjp_rule_id: ApproxMinK_vjp
  jvp_rule_id: ApproxMinK_jvp
  vjp: null
  jvp: null
