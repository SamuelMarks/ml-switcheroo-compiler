operation: FrobeniusNorm
description: Calculates the Frobenius norm of a matrix.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: input
  type: Tensor
- is_variadic: false
  kind: positional_or_keyword
  name: dim
  type: List[int]
- default: false
  is_variadic: false
  kind: positional_or_keyword
  name: keepdim
  type: bool
variants:
  edge_wasm_simd:
    template: conv_pool_1d_flat
    math_op: '* 1.0f'
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
