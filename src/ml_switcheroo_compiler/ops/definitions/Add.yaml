operation: Add
description: The Add operation.
std_args:
- name: x1
  type: Union[array, int, float, complex]
  is_variadic: false
  kind: positional_or_keyword
- name: x2
  type: Union[array, int, float, complex]
  is_variadic: false
  kind: positional_or_keyword
variants:
  cupy:
    eager: cp.add
    generator: cp.add
  dask:
    eager: da.add
    generator: da.add
  edge_onnx:
    generator: Add
  edge_stablehlo:
    generator: stablehlo.add
  keras:
    eager: keras_ops.add
    args:
      inputs: inputs
      kwargs: kwargs
    macro_template: keras.ops.add({input}, {other} * {alpha})
  numpy:
    generator: np.add
    macro_template: numpy.add({input}, {other} * {alpha})
  tensorflow:
    eager: tf.add
    macro_template: tf.math.add({input}, {other} * {alpha})
  pytorch:
    eager: torch.add
    args:
      self: self
      x: x
      y: y
  jax:
    eager: jax.numpy.add
    args: {}
    macro_template: jax.numpy.add({input}, {other} * {alpha})
  mlx:
    eager: mlx.core.add
    args:
      args: args
      kwargs: kwargs
    macro_template: mlx.core.add({input}, {other} * {alpha})
  edge_wgsl:
    template: binary
    expr: buf_in0_f32[in0_offset] + buf_in1_f32[in1_offset]
  edge_wasm_simd:
    template: binary
    simd_expr: wasm_f32x4_add(in0_val, in1_val)
    scalar_expr: in0_val + in1_val
  llvm_cpp:
    template: binary
    scalar_expr: in0_val + in1_val
autodiff:
  vjp:
  - $cotangent
  - $cotangent
  jvp: Add($tangent[0], $tangent[1])
