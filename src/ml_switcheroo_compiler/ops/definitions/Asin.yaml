operation: asin
description: The Asin operation.
std_args:
  - is_variadic: false
    kind: positional_or_keyword
    name: x
    type: array
variants:
  cupy:
    generator: cp.arcsin
  dask:
    generator: da.arcsin
  numpy:
    generator: np.arcsin
  tensorflow:
    eager: tf.asin
  keras:
    eager: keras_ops.asin
  pytorch:
    eager: torch.asin
  jax:
    eager: jax.numpy.arcsin
  mlx:
    eager: mlx.core.asin
  edge_onnx:
    generator: Asin
  edge_stablehlo:

    opcode: stablehlo.asin
  edge_wgsl:
    template: unary
    expr: asin(buf_in0_f32[in0_offset])
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
