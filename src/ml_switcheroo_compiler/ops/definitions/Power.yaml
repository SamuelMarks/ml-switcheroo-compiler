  - Multiply($cotangent, Multiply(Log($input[0]), Power($input[0], $input[1])))
  jvp: Add(Multiply($tangent[0], Multiply($input[1], Power($input[0], Subtract($input[1],
    Constant(1.0))))), Multiply($tangent[1], Multiply(Log($input[0]), Power($input[0],
    $input[1]))))
