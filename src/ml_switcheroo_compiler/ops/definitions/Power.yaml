operation: Power
description: The Power operation.
std_args: []
variants:
  cupy:
    eager: cp.power
  dask:
    eager: da.power
  keras:
    eager: keras_ops.power
  numpy:
    eager: numpy.power
  tensorflow:
    eager: tf.power
  pytorch:
    eager: torch.power
  jax:
    eager: jax.numpy.power
  mlx:
    eager: mlx.core.power
  edge_onnx:
    generator: Power
  edge_stablehlo:

    opcode: stablehlo.power
  edge_wgsl:
    template: binary
    expr: pow(buf_in0_f32[in0_offset], buf_in1_f32[in1_offset])
  llvm_cpp:
