operation: TriangularSolve
description: The TriangularSolve operation.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: b
  type: Tensor
- is_variadic: false
  kind: positional_or_keyword
  name: A
  type: Tensor
- default: true
  is_variadic: false
  kind: positional_or_keyword
  name: upper
  type: bool
- default: false
  is_variadic: false
  kind: positional_or_keyword
  name: transpose
  type: bool
- default: false
  is_variadic: false
  kind: positional_or_keyword
  name: unitriangular
  type: bool
variants:
  numpy:
    generator: scipy.linalg.solve_triangular({0}, {1}, lower={lower}, unit_diagonal={unit_diagonal},
      trans=1 if {adjoint} else 0, check_finite=False)
  tensorflow:
    eager: tf.linalg.triangular_solve
  cupy: {}
  dask: {}
  keras:
    eager: keras_ops.triangularsolve
  pytorch:
    eager: torch.triangularsolve
  jax:
    eager: jax.numpy.triangularsolve
  mlx:
    eager: mlx.core.triangularsolve
  edge_onnx: {}
  edge_stablehlo: {}
  edge_wgsl:
    template: unary
    expr: buf_in0_f32[in0_offset]
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
