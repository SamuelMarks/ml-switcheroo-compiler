operation: Stft
description: The Stft operation.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: input
  type: Tensor
- is_variadic: false
  kind: positional_or_keyword
  name: n_fft
  type: int
- is_variadic: false
  kind: positional_or_keyword
  name: hop_length
  type: Optional[int]
- is_variadic: false
  kind: positional_or_keyword
  name: win_length
  type: Optional[int]
- is_variadic: false
  kind: positional_or_keyword
  name: window
  type: Optional[Tensor]
- default: true
  is_variadic: false
  kind: positional_or_keyword
  name: center
  type: bool
- default: false
  is_variadic: false
  kind: positional_or_keyword
  name: normalized
  type: bool
- default: true
  is_variadic: false
  kind: positional_or_keyword
  name: onesided
  type: bool
- is_variadic: false
  kind: positional_or_keyword
  name: return_complex
  type: bool
variants:
  keras:
    eager: keras_ops.stft
  pytorch:
    generator: torch.stft({0}, n_fft={n_fft}, hop_length={hop_length}, win_length={win_length},
      window={window}, center={center}, normalized={normalized}, onesided={onesided},
      return_complex={return_complex})
  numpy:
    eager: numpy.stft
  cupy: {}
  dask: {}
  tensorflow:
    eager: tf.stft
  jax:
    eager: jax.numpy.stft
  mlx:
    eager: mlx.core.stft
  edge_onnx: {}
  edge_stablehlo: {}
  edge_wgsl:
    template: unary
    expr: buf_in0_f32[in0_offset]
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
