operation: RandomHue
description: Randomly adjusts the hue on given images.
std_args:
  - is_variadic: false
    kind: positional_or_keyword
    name: factor
    type: float
  - default:
      - 0
      - 255
    is_variadic: false
    kind: positional_or_keyword
    name: value_range
    type: Tuple[int, int]
  - is_variadic: false
    kind: positional_or_keyword
    name: seed
    type: int
variants:
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
