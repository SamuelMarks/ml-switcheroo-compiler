operation: broadcast_to
description: Broadcasts an array to a specified shape.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: x
  type: array
- is_variadic: false
  kind: positional_or_keyword
  name: shape
  type: Tuple[int, Ellipsis]
variants:
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
