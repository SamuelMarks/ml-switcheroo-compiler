  is_variadic: false
  kind: positional_or_keyword
  name: factor
  type: float
- default: 1.0
  is_variadic: false
  kind: positional_or_keyword
  name: scale
  type: float
- default: bilinear
  is_variadic: false
  kind: positional_or_keyword
  name: interpolation
  type: str
- is_variadic: false
  kind: positional_or_keyword
  name: seed
  type: int
variants:
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
