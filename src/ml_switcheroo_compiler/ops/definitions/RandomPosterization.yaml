operation: RandomPosterization
description: Reduces the number of bits for each color channel.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: factor
  type: int
- default:
  - 0
  - 255
  is_variadic: false
  kind: positional_or_keyword
  name: value_range
  type: Tuple[int, int]
- is_variadic: false
  kind: positional_or_keyword
  name: seed
  type: int
variants:
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
