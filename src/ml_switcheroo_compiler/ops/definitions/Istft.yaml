operation: istft
description: The Istft operation.
std_args: []
variants:
  keras:
    eager: keras_ops.istft
  pytorch:
    generator: torch.istft({0}, n_fft={n_fft}, hop_length={hop_length}, win_length={win_length},
      window={window}, center={center}, normalized={normalized}, onesided={onesided},
      length={length}, return_complex={return_complex})
  numpy:
    eager: numpy.istft
  cupy: {}
  dask: {}
  tensorflow:
    eager: tf.istft
  jax:
    eager: jax.numpy.istft
  mlx:
    eager: mlx.core.istft
  edge_onnx: {}
  edge_stablehlo: {}
  edge_wgsl:
    template: binary
    expr: f32(buf_in0_f32[in0_offset] != 0.0 && buf_in1_f32[in1_offset] != 0.0)
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
