operation: SetFloat32MatmulPrecision
description: Sets internal precision for float32 matrix multiplications.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: precision
  options:
  - highest
  - high
  - medium
  type: str
variants:
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
