operation: conv_tbc
description: Applies a 1D convolution over input (Time, Batch, Channels).
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: input
  shape_spec: '[T, B, C]'
  type: Tensor
- is_variadic: false
  kind: positional_or_keyword
  name: weight
  type: Tensor
- is_variadic: false
  kind: positional_or_keyword
  name: bias
  type: Tensor
- default: 0
  is_variadic: false
  kind: positional_or_keyword
  name: pad
  type: int
type: attribute
variants:
  edge_wasm_simd:
    template: conv_pool_1d_flat
    math_op: '* 1.0f'
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
signature:
  args:
  - name: input
    type: Tensor
    is_variadic: false
    kind: positional_or_keyword
  - name: weight
    type: Tensor
    is_variadic: false
    kind: positional_or_keyword
  - name: bias
    type: Tensor
    is_variadic: false
    kind: positional_or_keyword
  - name: pad
    type: int
    is_variadic: false
    kind: positional_or_keyword
  input_tensors:
  - input
  - weight
  - bias
  - pad
  output_tensors:
  - out
  has_variadic_args: false
  has_variadic_kwargs: false
  keyword_constraints: {}
  keyword_defaults: {}
dtype_rules:
  promotion_matrix: standard
  allowed_input_dtypes:
  - all
  output_dtype_inference: promote(in0, in1)
shape_signature:
  pattern: in0
  symbolic_expression: '[*shape] -> [*shape]'
  category: unary
invariants:
  is_commutative: false
  is_associative: false
  is_idempotent: false
  identity_value: null
  absorbing_value: null
autodiff:
  vjp_rule_id: conv_tbc_vjp
  jvp_rule_id: conv_tbc_jvp
  vjp: null
  jvp: null
