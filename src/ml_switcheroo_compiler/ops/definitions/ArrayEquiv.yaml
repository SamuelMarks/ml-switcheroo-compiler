operation: ArrayEquiv
description: Returns True if input arrays are shape consistent and all elements equal.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: a1
  type: Array
- is_variadic: false
  kind: positional_or_keyword
  name: a2
  type: Array
variants:
  numpy:
    eager: numpy.arrayequiv
  cupy: {}
  dask: {}
  tensorflow:
    eager: tf.arrayequiv
  keras:
    eager: keras_ops.arrayequiv
  pytorch:
    eager: torch.arrayequiv
  jax:
    eager: jax.numpy.arrayequiv
  mlx:
    eager: mlx.core.arrayequiv
  edge_onnx: {}
  edge_stablehlo: {}
  edge_wgsl:
    template: unary
    expr: buf_in0_f32[in0_offset]
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
