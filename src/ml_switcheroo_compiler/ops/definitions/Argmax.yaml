operation: argmax
description: The Argmax operation.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: x
  type: array
- is_variadic: false
  kind: positional_or_keyword
  name: axis
  type: Optional[int]
- is_variadic: false
  kind: positional_or_keyword
  name: keepdims
  type: bool
variants:
  cupy:
    eager: cp.argmax
  dask:
    eager: da.argmax
  keras:
    eager: keras_ops.argmax
  pytorch:
    generator: torch.argmax({0}, dim={axis}, keepdim={keepdims})
  tensorflow:
    eager: tf.argmax
  numpy: {}
  jax: {}
  mlx: {}
  edge_onnx: {}
  edge_stablehlo: {}
  edge_wgsl: {}
  edge_wasm_simd: {}
  llvm_cpp: {}
