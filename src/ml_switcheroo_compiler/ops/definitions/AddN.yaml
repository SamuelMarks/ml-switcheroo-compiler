operation: AddN
description: The AddN operation.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: inputs
  type: List[Tensor]
variants:
  tensorflow:
    eager: tf.add_n
  numpy:
    generator: sum
  cupy:
    generator: sum
  dask:
    generator: sum
  keras:
    eager: keras_ops.add
  pytorch:
    eager: torch.stack
  jax:
    eager: jax.tree_util.tree_reduce
  mlx:
    eager: mlx.core.add
  edge_onnx:
    generator: Sum
  edge_stablehlo: {}
  edge_wgsl:
    template: binary
    expr: buf_in0_f32[in0_offset] + buf_in1_f32[in1_offset]
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
