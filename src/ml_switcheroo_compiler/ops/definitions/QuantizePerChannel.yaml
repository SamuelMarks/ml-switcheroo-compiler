operation: QuantizePerChannel
description: Converts a float tensor to a per-channel quantized tensor with given
  scales and zero points.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: input
  type: Tensor
- is_variadic: false
  kind: positional_or_keyword
  name: scales
  type: Tensor
- is_variadic: false
  kind: positional_or_keyword
  name: zero_points
  type: Tensor
- is_variadic: false
  kind: positional_or_keyword
  name: axis
  type: int
- is_variadic: false
  kind: positional_or_keyword
  name: dtype
  type: Any
variants:
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
