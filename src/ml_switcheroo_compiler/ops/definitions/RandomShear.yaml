operation: RandomShear
description: Randomly applies shear transformations.
std_args:
- default: 0.0
  is_variadic: false
  kind: positional_or_keyword
  name: x_factor
  type: float
- default: 0.0
  is_variadic: false
  kind: positional_or_keyword
  name: y_factor
  type: float
- default: bilinear
  is_variadic: false
  kind: positional_or_keyword
  name: interpolation
  type: str
- is_variadic: false
  kind: positional_or_keyword
  name: seed
  type: int
variants:
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
