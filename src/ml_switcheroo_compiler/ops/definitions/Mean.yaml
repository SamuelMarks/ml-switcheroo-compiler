operation: Mean
description: The Mean operation.
std_args:
  - x
variants:
  cupy:
    eager: cp.mean
    generator: cp.mean
  dask:
    eager: da.mean
    generator: da.mean
  keras:
    eager: keras_ops.mean
  numpy:
    generator: np.mean
  pytorch:
    generator: torch.mean({0}, dim={axis}, keepdim={keepdims})
  jax:
    eager: jax.numpy.mean
  tensorflow:
    eager: tf.math.reduce_mean
  mlx:
    eager: mlx.core.mean
  edge_onnx:
    generator: Mean
  edge_stablehlo:

    opcode: stablehlo.mean
  edge_wgsl:
    template: reduction
    init_code: var res = 0.0;
    start_idx: '0'
    loop_code: res = res + buf_in0_f32[i];
    post_loop_code: res = res / f32({nelem_in}u);
    result_var: res
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
autodiff:
  vjp:
    - TrueDivide(Broadcast($cotangent), Constant($nelem))
  jvp: Mean($tangent[0])
