operation: Minimum
description: The Minimum operation.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: x1
  type: Union[array, int, float]
- is_variadic: false
  kind: positional_or_keyword
  name: x2
  type: Union[array, int, float]
variants:
  cupy:
    eager: cp.minimum
  dask:
    eager: da.minimum
  keras:
    eager: keras_ops.minimum
  tensorflow:
    eager: tf.minimum
  numpy: {}
  pytorch: {}
  jax: {}
  mlx: {}
  edge_stablehlo:
    opcode: stablehlo.minimum
  edge_wgsl:
    template: binary
    expr: min(buf_in0_f32[in0_offset], buf_in1_f32[in1_offset])
  edge_wasm_simd:
    template: binary
    simd_expr: wasm_f32x4_min(in0_val, in1_val)
    scalar_expr: std::min(in0_val, in1_val)
  llvm_cpp:
    template: binary
    scalar_expr: std::min(in0_val, in1_val)
autodiff:
  vjp_rule_id: Minimum_vjp
  jvp_rule_id: Minimum_jvp
  vjp:
  - Multiply($cotangent, Less($input[0], $input[1]))
  - Multiply($cotangent, GreaterEqual($input[0], $input[1]))
  jvp: Add(Multiply($tangent[0], Less($input[0], $input[1])), Multiply($tangent[1],
    GreaterEqual($input[0], $input[1])))
signature:
  args:
  - name: x1
    type: Union[array, int, float]
    is_variadic: false
    kind: positional_or_keyword
  - name: x2
    type: Union[array, int, float]
    is_variadic: false
    kind: positional_or_keyword
  input_tensors:
  - x1
  - x2
  output_tensors:
  - out
  has_variadic_args: false
  has_variadic_kwargs: false
  keyword_constraints: {}
  keyword_defaults: {}
dtype_rules:
  promotion_matrix: standard
  allowed_input_dtypes:
  - all
  output_dtype_inference: promote(in0, in1)
shape_signature:
  pattern: broadcast(in0, in1)
  symbolic_expression: '[*shape], [*shape] -> [*shape]'
  category: elementwise
invariants:
  is_commutative: true
  is_associative: true
  is_idempotent: false
  identity_value: null
  absorbing_value: null
