operation: AverageGradients
description: Average the gradients across distributed processes.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: gradients
  type: Any
variants:
  numpy:
    eager: numpy.averagegradients
  cupy: {}
  dask: {}
  tensorflow:
    eager: tf.averagegradients
  keras:
    eager: keras_ops.averagegradients
  pytorch:
    eager: torch.averagegradients
  jax:
    eager: jax.numpy.averagegradients
  mlx:
    eager: mlx.core.averagegradients
  edge_onnx: {}
  edge_stablehlo: {}
  edge_wgsl:
    template: unary
    expr: buf_in0_f32[in0_offset]
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
