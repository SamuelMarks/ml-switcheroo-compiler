operation: GridSample
description: The GridSample operation.
variants:
  pytorch:
    generator: torch.nn.functional.grid_sample({0}, {1}, mode={mode}, padding_mode={padding_mode},
      align_corners={align_corners})
  numpy:
    eager: numpy.gridsample
  cupy: {}
  dask: {}
  tensorflow:
    eager: tf.gridsample
  keras:
    eager: keras_ops.gridsample
  jax:
    eager: jax.numpy.gridsample
  mlx:
    eager: mlx.core.gridsample
  edge_onnx: {}
  edge_stablehlo: {}
  edge_wgsl:
    template: unary
    expr: buf_in0_f32[in0_offset]
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
