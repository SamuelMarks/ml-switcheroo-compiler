operation: ApproxMaxK
description: Returns max k values and their indices using approximate search (TPU
  optimized).
std_args:
  - is_variadic: false
    kind: positional_or_keyword
    name: operand
    type: Tensor
  - is_variadic: false
    kind: positional_or_keyword
    name: k
    type: int
  - default: -1
    is_variadic: false
    kind: positional_or_keyword
    name: reduction_dimension
    type: int
variants:
  numpy: {}
  cupy: {}
  dask: {}
  tensorflow: {}
  keras: {}
  pytorch: {}
  jax: {}
  mlx: {}
  edge_onnx:
    generator: ApproxMaxK
  edge_stablehlo:

    opcode: stablehlo.approx_max_k
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
