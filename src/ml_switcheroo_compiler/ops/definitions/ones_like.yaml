operation: ones_like
description: Returns a new array filled with ones and having the same ``shape`` as
  an input array ``x``.
std_args:
  - is_variadic: false
    kind: positional_or_keyword
    name: x
    type: array
  - is_variadic: false
    kind: positional_or_keyword
    name: dtype
    type: Optional[dtype]
  - is_variadic: false
    kind: positional_or_keyword
    name: device
    type: Optional[device]
type: attribute
variants:
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
