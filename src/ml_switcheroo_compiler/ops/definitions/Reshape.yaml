operation: Reshape
description: The Reshape operation.
std_args:
  - is_variadic: false
    kind: positional_or_keyword
    name: x
    type: array
  - is_variadic: false
    kind: positional_or_keyword
    name: shape
    type: Tuple[int, Ellipsis]
  - is_variadic: false
    kind: positional_or_keyword
    name: copy
    type: Optional[bool]
variants:
  cupy:
    eager: cp.reshape
    generator: cp.reshape
  dask:
    eager: da.reshape
    generator: da.reshape
  edge_onnx:
    generator: Reshape
  edge_stablehlo:
    generator: stablehlo.reshape
  keras:
    eager: keras_ops.reshape
  numpy:
    generator: np.reshape
  pytorch:
    generator: torch.reshape({0}, {shape})
  tensorflow:
    eager: tf.reshape
  jax:
    eager: jax.numpy.reshape
  mlx:
    eager: mlx.core.reshape
  edge_wasm_simd:
    template: fallback_copy
  llvm_cpp:
    template: fallback_copy
