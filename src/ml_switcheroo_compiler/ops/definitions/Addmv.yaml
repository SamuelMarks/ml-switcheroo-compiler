operation: Addmv
description: Performs a matrix-vector product of the matrix mat and the vector vec.
  The vector input is added to the final result.
std_args:
  - is_variadic: false
    kind: positional_or_keyword
    name: input
    type: Tensor
  - is_variadic: false
    kind: positional_or_keyword
    name: mat
    type: Tensor
  - is_variadic: false
    kind: positional_or_keyword
    name: vec
    type: Tensor
  - default: 1.0
    is_variadic: false
    kind: positional_or_keyword
    name: beta
    type: float
  - default: 1.0
    is_variadic: false
    kind: positional_or_keyword
    name: alpha
    type: float
variants:
  numpy: {}
  cupy: {}
  dask: {}
  tensorflow: {}
  keras: {}
  pytorch: {}
  jax: {}
  mlx: {}
  edge_onnx:
    generator: Addmv
  edge_stablehlo:

    opcode: stablehlo.addmv
  edge_wgsl:
    template: binary
    expr: buf_in0_f32[in0_offset] + buf_in1_f32[in1_offset]
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
