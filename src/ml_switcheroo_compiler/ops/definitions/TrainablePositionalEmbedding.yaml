operation: TrainablePositionalEmbedding
description: Generates trainable position embedding for a given 1-d sequence.
std_args:
- default: 10240
  is_variadic: false
  kind: positional_or_keyword
  name: max_seq_length
  type: int
- default: 0
  is_variadic: false
  kind: positional_or_keyword
  name: embedding_dims
  type: int
variants:
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
