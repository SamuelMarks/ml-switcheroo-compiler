operation: equal
description: The Equal operation.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: x1
  type: Union[array, int, float, complex, bool]
- is_variadic: false
  kind: positional_or_keyword
  name: x2
  type: Union[array, int, float, complex, bool]
variants:
  cupy:
    eager: cp.equal
    generator: cp.equal
  dask:
    eager: da.equal
    generator: da.equal
  edge_onnx:
    generator: Equal
  edge_stablehlo:
    generator: stablehlo.compare
  keras:
    eager: keras_ops.equal
  numpy:
    generator: np.equal
  tensorflow:
    eager: tf.equal
  pytorch: {}
  jax: {}
  mlx: {}
  edge_wgsl:
    template: binary
    expr: f32(buf_in0_f32[in0_offset] == buf_in1_f32[in1_offset])
  edge_wasm_simd:
    template: binary
    simd_expr: wasm_v128_bitselect(wasm_f32x4_splat(1.0f), wasm_f32x4_splat(0.0f),
      wasm_f32x4_eq(in0_val, in1_val))
    scalar_expr: 'in0_val == in1_val ? 1.0f : 0.0f'
  llvm_cpp:
    template: binary
    scalar_expr: 'in0_val == in1_val ? 1.0f : 0.0f'
