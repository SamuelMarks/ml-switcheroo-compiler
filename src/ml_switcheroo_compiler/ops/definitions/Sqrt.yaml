operation: Sqrt
description: The Sqrt operation.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: x
  type: array
variants:
  cupy:
    eager: cp.sqrt
  dask:
    eager: da.sqrt
  edge_onnx:
    generator: Sqrt
  edge_stablehlo:
    generator: stablehlo.sqrt
  keras:
    eager: keras_ops.sqrt
  tensorflow:
    eager: tf.sqrt
  numpy:
    eager: numpy.sqrt
  pytorch:
    eager: torch.sqrt
  jax:
    eager: jax.numpy.sqrt
  mlx:
    eager: mlx.core.sqrt
  edge_wgsl:
    template: unary
    expr: sqrt(buf_in0_f32[in0_offset])
  edge_wasm_simd:
    template: unary
    simd_expr: wasm_f32x4_sqrt(in0_val)
    scalar_expr: std::sqrt(in0_val)
  llvm_cpp:
    template: unary
    scalar_expr: std::sqrt(in0_val)
autodiff:
  vjp:
  - Multiply($cotangent, TrueDivide(Constant(0.5), Sqrt($input[0])))
  jvp: Multiply($tangent[0], TrueDivide(Constant(0.5), Sqrt($input[0])))
