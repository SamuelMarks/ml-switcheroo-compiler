operation: RegisterVariableName
description: Register a pair of Linen collection name and its NNX type.
std_args:
  - is_variadic: false
    kind: positional_or_keyword
    name: name
    type: str
  - is_variadic: false
    kind: positional_or_keyword
    name: typ
    type: type
variants:
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
