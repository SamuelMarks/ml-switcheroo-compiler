operation: BinaryRepr
description: Return the binary representation of the input number as a string.
std_args:
  - is_variadic: false
    kind: positional_or_keyword
    name: num
    type: int
  - is_variadic: false
    kind: positional_or_keyword
    name: width
    type: int
variants:
  numpy:
    eager: numpy.binaryrepr
  cupy: {}
  dask: {}
  tensorflow:
    eager: tf.binaryrepr
  keras:
    eager: keras_ops.binaryrepr
  pytorch:
    eager: torch.binaryrepr
  jax:
    eager: jax.numpy.binaryrepr
  mlx:
    eager: mlx.core.binaryrepr
  edge_onnx:
    generator: BinaryRepr
  edge_stablehlo:

    opcode: stablehlo.binary_repr
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
