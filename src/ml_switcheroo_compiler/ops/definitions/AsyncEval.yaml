operation: AsyncEval
description: Asynchronously evaluate an array or tree of arrays.
std_args:
  - is_variadic: true
    kind: positional_or_keyword
    name: tensors
    type: Tensor
variants:
  numpy:
    eager: numpy.asynceval
  cupy: {}
  dask: {}
  tensorflow:
    eager: tf.asynceval
  keras:
    eager: keras_ops.asynceval
  pytorch:
    eager: torch.asynceval
  jax:
    eager: jax.numpy.asynceval
  mlx:
    eager: mlx.core.asynceval
  edge_onnx:
    generator: AsyncEval
  edge_stablehlo:

    opcode: stablehlo.async_eval
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
