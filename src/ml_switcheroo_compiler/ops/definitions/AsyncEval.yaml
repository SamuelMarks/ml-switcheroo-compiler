operation: AsyncEval
description: Asynchronously evaluate an array or tree of arrays.
std_args:
- is_variadic: true
  kind: positional_or_keyword
  name: tensors
  type: Tensor
variants:
  numpy:
    eager: numpy.asynceval
  cupy: {}
  dask: {}
  tensorflow:
    eager: tf.asynceval
  keras:
    eager: keras_ops.asynceval
  pytorch:
    eager: torch.asynceval
  jax:
    eager: jax.numpy.asynceval
  mlx:
    eager: mlx.core.asynceval
  edge_onnx: {}
  edge_stablehlo: {}
  edge_wgsl:
    template: unary
    expr: buf_in0_f32[in0_offset]
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
