operation: ImportFunction
description: Import a function from a serialized file format (MLX specific, mapping
  to JIT/SavedModel load).
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: file
  type: str
- default: cpu
  is_variadic: false
  kind: positional_or_keyword
  name: map_location
  type: str
variants:
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
