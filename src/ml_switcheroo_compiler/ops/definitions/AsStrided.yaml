operation: AsStrided
description: Create a view of an existing tensor with specified size, stride and storage_offset.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: x
  type: Tensor
- is_variadic: false
  kind: positional_or_keyword
  name: size
  type: Sequence[int]
- is_variadic: false
  kind: positional_or_keyword
  name: stride
  type: Sequence[int]
- is_variadic: false
  kind: positional_or_keyword
  name: storage_offset
  type: int
variants:
  numpy:
    eager: numpy.asstrided
  cupy: {}
  dask: {}
  tensorflow:
    eager: tf.asstrided
  keras:
    eager: keras_ops.asstrided
  pytorch:
    eager: torch.asstrided
  jax:
    eager: jax.numpy.asstrided
  mlx:
    eager: mlx.core.asstrided
  edge_onnx: {}
  edge_stablehlo: {}
  edge_wgsl:
    template: unary
    expr: buf_in0_f32[in0_offset]
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
