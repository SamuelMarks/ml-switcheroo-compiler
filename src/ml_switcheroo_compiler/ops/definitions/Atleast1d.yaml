operation: Atleast1d
description: Returns a 1-dimensional view of each input tensor with zero dimensions.
std_args:
- is_variadic: true
  kind: positional_or_keyword
  name: tensors
  type: Tensor
variants:
  numpy:
    eager: numpy.atleast1d
  cupy: {}
  dask: {}
  tensorflow:
    eager: tf.atleast1d
  keras:
    eager: keras_ops.atleast1d
  pytorch:
    eager: torch.atleast1d
  jax:
    eager: jax.numpy.atleast1d
  mlx:
    eager: mlx.core.atleast1d
  edge_onnx: {}
  edge_stablehlo: {}
  edge_wgsl:
    template: unary
    expr: buf_in0_f32[in0_offset]
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
