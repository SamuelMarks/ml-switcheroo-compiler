operation: ConvertPaddingsToMask
description: Converts binary paddings to a logit mask ready to add to attention matrix.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: paddings
  type: Tensor
- is_variadic: false
  kind: positional_or_keyword
  name: dtype
  type: Any
variants:
  edge_wasm_simd:
    template: conv_pool_1d_flat
    math_op: '* 1.0f'
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
