operation: PromoteTypes
description: Returns the dtype with the smallest size and scalar kind that is not
  smaller than either type1 or type2.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: type1
  type: DType
- is_variadic: false
  kind: positional_or_keyword
  name: type2
  type: DType
variants:
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
