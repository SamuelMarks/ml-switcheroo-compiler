operation: MaskedFill
description: Fills elements of self tensor with value where mask is True.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: input
  type: Tensor
- dtype: bool
  is_variadic: false
  kind: positional_or_keyword
  name: mask
  type: Tensor
- is_variadic: false
  kind: positional_or_keyword
  name: value
  type: float
variants:
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
