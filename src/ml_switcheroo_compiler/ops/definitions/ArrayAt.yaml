operation: ArrayAt
description: Interface for indexed updates (JAX style).
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: x
  type: Tensor
variants:
  numpy:
    eager: numpy.arrayat
  cupy: {}
  dask: {}
  tensorflow:
    eager: tf.arrayat
  keras:
    eager: keras_ops.arrayat
  pytorch:
    eager: torch.arrayat
  jax:
    eager: jax.numpy.arrayat
  mlx:
    eager: mlx.core.arrayat
  edge_onnx: {}
  edge_stablehlo: {}
  edge_wgsl:
    template: unary
    expr: buf_in0_f32[in0_offset]
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
