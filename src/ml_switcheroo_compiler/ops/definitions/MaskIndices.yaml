operation: MaskIndices
description: Return the indices to access (n, n) arrays, given a masking function.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: n
  type: int
- is_variadic: false
  kind: positional_or_keyword
  name: mask_func
  type: Callable
- default: 0
  is_variadic: false
  kind: positional_or_keyword
  name: k
  type: int
variants:
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
