operation: bitwise_invert
description: Inverts (flips) each bit for each element ``x_i`` of the input array
  ``x``.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: x
  type: array
variants:
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
