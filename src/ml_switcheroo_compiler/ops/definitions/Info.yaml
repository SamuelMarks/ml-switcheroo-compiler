operation: Info
description: Get help information for an array, function, class, or module. Interactive
  use only.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: object
  type: Any
- is_variadic: false
  kind: positional_or_keyword
  name: maxwidth
  type: Any
- is_variadic: false
  kind: positional_or_keyword
  name: output
  type: Any
- is_variadic: false
  kind: positional_or_keyword
  name: toplevel
  type: Any
variants:
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
signature:
  args:
  - name: object
    type: Any
    is_variadic: false
    kind: positional_or_keyword
  - name: maxwidth
    type: Any
    is_variadic: false
    kind: positional_or_keyword
  - name: output
    type: Any
    is_variadic: false
    kind: positional_or_keyword
  - name: toplevel
    type: Any
    is_variadic: false
    kind: positional_or_keyword
  input_tensors:
  - object
  - maxwidth
  - output
  - toplevel
  output_tensors:
  - out
  has_variadic_args: false
  has_variadic_kwargs: false
  keyword_constraints: {}
  keyword_defaults: {}
dtype_rules:
  promotion_matrix: standard
  allowed_input_dtypes:
  - all
  output_dtype_inference: promote(in0, in1)
shape_signature:
  pattern: in0
  symbolic_expression: '[*shape] -> [*shape]'
  category: unary
invariants:
  is_commutative: false
  is_associative: false
  is_idempotent: false
  identity_value: null
  absorbing_value: null
autodiff:
  vjp_rule_id: Info_vjp
  jvp_rule_id: Info_jvp
  vjp: null
  jvp: null
