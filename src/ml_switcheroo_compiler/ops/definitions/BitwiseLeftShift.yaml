operation: BitwiseLeftShift
description: Computes the left arithmetic shift of input by other bits.
std_args:
  - is_variadic: false
    kind: positional_or_keyword
    name: input
    type: Any
  - is_variadic: false
    kind: positional_or_keyword
    name: other
    type: Any
variants:
  numpy:
    eager: numpy.bitwiseleftshift
  cupy: {}
  dask: {}
  tensorflow:
    eager: tf.bitwiseleftshift
  keras:
    eager: keras_ops.bitwiseleftshift
  pytorch:
    eager: torch.bitwiseleftshift
  jax:
    eager: jax.numpy.bitwiseleftshift
  mlx:
    eager: mlx.core.bitwiseleftshift
  edge_onnx:
    generator: BitwiseLeftShift
  edge_stablehlo:

    opcode: stablehlo.bitwise_left_shift
  edge_wgsl:
    template: binary
    expr: f32(buf_in0_f32[in0_offset] != 0.0 && buf_in1_f32[in1_offset] != 0.0)
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
