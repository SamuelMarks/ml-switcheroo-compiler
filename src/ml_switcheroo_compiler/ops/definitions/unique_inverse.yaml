operation: unique_inverse
description: Returns the unique elements of an input array ``x`` and the indices from
  the set of unique elements that reconstruct ``x``.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: x
  type: array
variants:
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
