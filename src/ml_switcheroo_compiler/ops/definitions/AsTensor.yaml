operation: AsTensor
description: Converts data into a tensor, sharing data and preserving autograd history
  if possible.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: data
  type: Any
- is_variadic: false
  kind: positional_or_keyword
  name: dtype
  type: dtype
- is_variadic: false
  kind: positional_or_keyword
  name: device
  type: Device
variants:
  numpy:
    eager: numpy.astensor
  cupy: {}
  dask: {}
  tensorflow:
    eager: tf.astensor
  keras:
    eager: keras_ops.astensor
  pytorch:
    eager: torch.astensor
  jax:
    eager: jax.numpy.astensor
  mlx:
    eager: mlx.core.astensor
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
  edge_wasm_simd:
    template: unary
    scalar_expr: in0_val
    simd_expr: in0_val
  edge_wgsl:
    template: unary
    expr: buf_in0_f32[in0_offset]
signature:
  args:
  - name: data
    type: Any
    is_variadic: false
    kind: positional_or_keyword
  - name: dtype
    type: dtype
    is_variadic: false
    kind: positional_or_keyword
  - name: device
    type: Device
    is_variadic: false
    kind: positional_or_keyword
  input_tensors:
  - data
  - dtype
  - device
  output_tensors:
  - out
  has_variadic_args: false
  has_variadic_kwargs: false
  keyword_constraints: {}
  keyword_defaults: {}
dtype_rules:
  promotion_matrix: standard
  allowed_input_dtypes:
  - all
  output_dtype_inference: promote(in0, in1)
shape_signature:
  pattern: in0
  symbolic_expression: '[*shape] -> [*shape]'
  category: unary
invariants:
  is_commutative: false
  is_associative: false
  is_idempotent: false
  identity_value: null
  absorbing_value: null
autodiff:
  vjp_rule_id: AsTensor_vjp
  jvp_rule_id: AsTensor_jvp
  vjp: null
  jvp: null
