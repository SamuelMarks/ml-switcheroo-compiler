operation: CholeskyInverse
description: Computes the inverse of a symmetric positive-definite matrix using its
  Cholesky factor.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: input
  type: Tensor
- default: false
  is_variadic: false
  kind: positional_or_keyword
  name: upper
  type: bool
variants:
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
