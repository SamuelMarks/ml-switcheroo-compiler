operation: Discretization
description: Buckets continuous features by ranges.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: bin_boundaries
  type: List[float]
- is_variadic: false
  kind: positional_or_keyword
  name: num_bins
  type: int
- default: 0.01
  is_variadic: false
  kind: positional_or_keyword
  name: epsilon
  type: float
variants:
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
