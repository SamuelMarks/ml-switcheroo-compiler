operation: Rescaling
description: Preprocessing layer which rescales input values to a new range.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: scale
  type: float
- default: 0.0
  is_variadic: false
  kind: positional_or_keyword
  name: offset
  type: float
variants:
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
