operation: TridiagonalSolve
description: The TridiagonalSolve operation.
variants:
  numpy:
    generator: scipy.linalg.solve_banded((1, 1), np.stack([{2}, {1}, {0}], axis=-2),
      {3})
  tensorflow:
    eager: tf.linalg.tridiagonal_solve
  cupy: {}
  dask: {}
  keras:
    eager: keras_ops.tridiagonalsolve
  pytorch:
    eager: torch.tridiagonalsolve
  jax:
    eager: jax.numpy.tridiagonalsolve
  mlx:
    eager: mlx.core.tridiagonalsolve
  edge_onnx: {}
  edge_stablehlo: {}
  edge_wgsl:
    template: unary
    expr: buf_in0_f32[in0_offset]
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
