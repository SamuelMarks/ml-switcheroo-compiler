operation: MaxNumBoundingBoxes
description: Ensure the maximum number of bounding boxes.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: max_number
  type: int
- default: -1.0
  is_variadic: false
  kind: positional_or_keyword
  name: fill_value
  type: float
variants:
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
