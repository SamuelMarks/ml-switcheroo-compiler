operation: EinsumPath
description: Evaluates the lowest cost contraction order for an einsum expression.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: subscripts
  type: str
- is_variadic: true
  kind: positional_or_keyword
  name: operands
  type: Tensor
variants:
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
signature:
  args:
  - name: subscripts
    type: str
    is_variadic: false
    kind: positional_or_keyword
  - name: operands
    type: Tensor
    is_variadic: true
    kind: positional_or_keyword
  input_tensors:
  - subscripts
  - operands
  output_tensors:
  - out
  has_variadic_args: true
  has_variadic_kwargs: false
  keyword_constraints: {}
  keyword_defaults: {}
dtype_rules:
  promotion_matrix: standard
  allowed_input_dtypes:
  - all
  output_dtype_inference: promote(in0, in1)
shape_signature:
  pattern: in0
  symbolic_expression: '[*shape] -> [*shape]'
  category: unary
invariants:
  is_commutative: false
  is_associative: false
  is_idempotent: false
  identity_value: null
  absorbing_value: null
autodiff:
  vjp_rule_id: EinsumPath_vjp
  jvp_rule_id: EinsumPath_jvp
  vjp: null
  jvp: null
