operation: EinsumPath
description: Evaluates the lowest cost contraction order for an einsum expression.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: subscripts
  type: str
- is_variadic: true
  kind: positional_or_keyword
  name: operands
  type: Tensor
variants:
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
