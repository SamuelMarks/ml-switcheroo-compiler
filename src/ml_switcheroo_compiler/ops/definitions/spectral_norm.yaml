operation: spectral_norm
description: Apply spectral normalization to a parameter in the given module.
std_args:
- module
- name
- n_power_iterations
- eps
- dim
type: function
variants:
  edge_wasm_simd:
    template: conv_pool_1d_flat
    math_op: '* 1.0f'
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
