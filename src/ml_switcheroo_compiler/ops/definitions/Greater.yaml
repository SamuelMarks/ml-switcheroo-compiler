operation: Greater
description: The Greater operation.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: x1
  type: Union[array, int, float]
- is_variadic: false
  kind: positional_or_keyword
  name: x2
  type: Union[array, int, float]
variants:
  cupy:
    eager: cp.greater
    generator: cp.greater
  dask:
    eager: da.greater
    generator: da.greater
  edge_onnx:
    generator: Greater
  edge_stablehlo:
    generator: stablehlo.compare
  keras:
    eager: keras_ops.greater
  numpy:
    generator: np.greater
  tensorflow:
    eager: tf.greater
  pytorch:
    eager: torch.greater
  jax:
    eager: jax.numpy.greater
  mlx:
    eager: mlx.core.greater
  edge_wgsl:
    template: binary
    expr: f32(buf_in0_f32[in0_offset] > buf_in1_f32[in1_offset])
  edge_wasm_simd:
    template: binary
    simd_expr: wasm_v128_bitselect(wasm_f32x4_splat(1.0f), wasm_f32x4_splat(0.0f),
      wasm_f32x4_gt(in0_val, in1_val))
    scalar_expr: 'in0_val > in1_val ? 1.0f : 0.0f'
  llvm_cpp:
    template: binary
    scalar_expr: 'in0_val > in1_val ? 1.0f : 0.0f'
autodiff:
  vjp:
  - Constant(0.0)
  - Constant(0.0)
  jvp: Constant(0.0)
