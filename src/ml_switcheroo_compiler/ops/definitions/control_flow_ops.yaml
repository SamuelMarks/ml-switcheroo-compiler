    vjp_rule_id: Cond_vjp
  broadcast_semantics: numpy
  description: The Cond operation.
  domain: control_flow
  input_tensors: &id001
  - pred
  - true_fn
  - false_fn
  math_semantics:
    differentiable: false
    is_associative: false
    is_commutative: false
    is_idempotent: false
  operation: Cond
  output_tensors:
  - out
  signature:
    args:
    - is_variadic: false
      name: pred
      type: Tensor
    - is_variadic: false
      name: true_fn
      type: Tensor
    - is_variadic: false
      name: false_fn
      type: Tensor
    output_dtype_formula: pred.dtype
    output_shape_formula: pred.shape
  type_promotion: standard
  variants:
    edge_onnx:
      generator: If
    edge_stablehlo:
      generator: stablehlo.cond
    edge_wasm_simd:
      scalar_expr: in0_val
      simd_expr: in0_val
      template: unary
    edge_wgsl:
      expr: buf_in0_f32[in0_offset]
      template: unary
    keras:
      eager: keras_ops.cond
    llvm_cpp:
      scalar_expr: in0_val
      template: unary
    numpy:
      generator: np.linalg.cond
    tensorflow:
      eager: tf.cond
