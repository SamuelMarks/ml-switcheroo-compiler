operation: Multiply
description: The Multiply operation.
std_args:
- name: x1
  type: Union[array, int, float, complex]
  is_variadic: false
  kind: positional_or_keyword
- name: x2
  type: Union[array, int, float, complex]
  is_variadic: false
  kind: positional_or_keyword
variants:
  cupy:
    eager: cp.multiply
    generator: cp.multiply
  dask:
    eager: da.multiply
    generator: da.multiply
  edge_onnx:
    generator: Mul
  edge_stablehlo:
    generator: stablehlo.multiply
  keras:
    eager: keras_ops.multiply
    args:
      inputs: inputs
      kwargs: kwargs
  numpy:
    generator: np.multiply
    args: {}
  tensorflow:
    eager: tf.multiply
  jax:
    eager: jax.numpy.multiply
  pytorch:
    eager: torch.multiply
  stablehlo:
    eager: stablehlo.multiply
  mlx:
    eager: mlx.core.multiply
    args:
      args: args
      kwargs: kwargs
  edge_wgsl:
    template: binary
    expr: buf_in0_f32[in0_offset] * buf_in1_f32[in1_offset]
  edge_wasm_simd:
    template: binary
    simd_expr: wasm_f32x4_mul(in0_val, in1_val)
    scalar_expr: in0_val * in1_val
  llvm_cpp:
    template: binary
    scalar_expr: in0_val * in1_val
autodiff:
  vjp:
  - Multiply($cotangent, $input[1])
  - Multiply($cotangent, $input[0])
  jvp: Add(Multiply($tangent[0], $input[1]), Multiply($tangent[1], $input[0]))
