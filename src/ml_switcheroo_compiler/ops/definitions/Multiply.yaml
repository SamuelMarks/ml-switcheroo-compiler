operation: Multiply
description: The Multiply operation.
std_args:
- name: x1
  type: Union[array, int, float, complex]
  is_variadic: false
  kind: positional_or_keyword
- name: x2
  type: Union[array, int, float, complex]
  is_variadic: false
  kind: positional_or_keyword
variants:
  cupy:
    eager: cp.multiply
    generator: cp.multiply
  dask:
    eager: da.multiply
    generator: da.multiply
  edge_onnx:
    generator: Mul
  edge_stablehlo:
    eager: stablehlo.multiply
    generator: stablehlo.multiply
  keras:
    eager: keras_ops.multiply
  mlx:
    eager: mlx.core.multiply
    args:
      args: args
      kwargs: kwargs
  edge_wgsl:
    template: binary
    expr: buf_in0_f32[in0_offset] * buf_in1_f32[in1_offset]
  edge_wasm_simd:
    template: binary
    simd_expr: wasm_f32x4_mul(in0_val, in1_val)
    scalar_expr: in0_val * in1_val
  llvm_cpp:
    template: binary
    scalar_expr: in0_val * in1_val
autodiff:
  vjp_rule_id: Multiply_vjp
  jvp_rule_id: Multiply_jvp
  vjp:
  - Multiply($cotangent, $input[1])
  - Multiply($cotangent, $input[0])
  jvp: Add(Multiply($tangent[0], $input[1]), Multiply($tangent[1], $input[0]))
signature:
  args:
  - name: x1
    type: Union[array, int, float, complex]
    is_variadic: false
    kind: positional_or_keyword
  - name: x2
    type: Union[array, int, float, complex]
    is_variadic: false
    kind: positional_or_keyword
  input_tensors:
  - x1
  - x2
  output_tensors:
  - out
  has_variadic_args: false
  has_variadic_kwargs: false
  keyword_constraints: {}
  keyword_defaults: {}
dtype_rules:
  promotion_matrix: standard
  allowed_input_dtypes:
  - all
  output_dtype_inference: promote(in0, in1)
shape_signature:
  pattern: broadcast(in0, in1)
  symbolic_expression: '[*shape], [*shape] -> [*shape]'
  category: elementwise
invariants:
  is_commutative: true
  is_associative: true
  is_idempotent: false
  identity_value: 1
  absorbing_value: 0
