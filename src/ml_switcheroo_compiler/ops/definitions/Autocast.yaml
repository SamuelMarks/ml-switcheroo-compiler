operation: Autocast
description: Context manager or decorator to allow regions of script to run in mixed
  precision.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: device_type
  type: str
- is_variadic: false
  kind: positional_or_keyword
  name: dtype
  type: dtype
- default: true
  is_variadic: false
  kind: positional_or_keyword
  name: enabled
  type: bool
- is_variadic: false
  kind: positional_or_keyword
  name: cache_enabled
  type: bool
variants:
  numpy:
    eager: numpy.autocast
  cupy: {}
  dask: {}
  tensorflow:
    eager: tf.autocast
  keras:
    eager: keras_ops.autocast
  pytorch:
    eager: torch.autocast
  jax:
    eager: jax.numpy.autocast
  mlx:
    eager: mlx.core.autocast
  edge_onnx: {}
  edge_stablehlo: {}
  edge_wgsl:
    template: unary
    expr: buf_in0_f32[in0_offset]
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
