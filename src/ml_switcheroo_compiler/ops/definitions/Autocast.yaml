operation: Autocast
description: Context manager or decorator to allow regions of script to run in mixed
  precision.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: device_type
  type: str
- is_variadic: false
  kind: positional_or_keyword
  name: dtype
  type: dtype
- default: true
  is_variadic: false
  kind: positional_or_keyword
  name: enabled
  type: bool
- is_variadic: false
  kind: positional_or_keyword
  name: cache_enabled
  type: bool
variants:
  numpy:
    eager: numpy.autocast
  cupy: {}
  dask: {}
  tensorflow:
    eager: tf.autocast
  keras:
    eager: keras_ops.autocast
  pytorch:
    eager: torch.autocast
  jax:
    eager: jax.numpy.autocast
  mlx:
    eager: mlx.core.autocast
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
  edge_wasm_simd:
    template: unary
    scalar_expr: in0_val
    simd_expr: in0_val
  edge_wgsl:
    template: unary
    expr: buf_in0_f32[in0_offset]
signature:
  args:
  - name: device_type
    type: str
    is_variadic: false
    kind: positional_or_keyword
  - name: dtype
    type: dtype
    is_variadic: false
    kind: positional_or_keyword
  - name: enabled
    type: bool
    is_variadic: false
    kind: positional_or_keyword
  - name: cache_enabled
    type: bool
    is_variadic: false
    kind: positional_or_keyword
  input_tensors:
  - device_type
  - dtype
  - enabled
  - cache_enabled
  output_tensors:
  - out
  has_variadic_args: false
  has_variadic_kwargs: false
  keyword_constraints: {}
  keyword_defaults: {}
dtype_rules:
  promotion_matrix: standard
  allowed_input_dtypes:
  - all
  output_dtype_inference: promote(in0, in1)
shape_signature:
  pattern: in0
  symbolic_expression: '[*shape] -> [*shape]'
  category: unary
invariants:
  is_commutative: false
  is_associative: false
  is_idempotent: false
  identity_value: null
  absorbing_value: null
autodiff:
  vjp_rule_id: Autocast_vjp
  jvp_rule_id: Autocast_jvp
  vjp: null
  jvp: null
