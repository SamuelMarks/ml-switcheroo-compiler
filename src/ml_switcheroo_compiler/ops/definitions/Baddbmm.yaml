operation: Baddbmm
description: Performs a batch matrix-matrix product of matrices in batch1 and batch2.
  input is added to final result.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: input
  type: Tensor
- is_variadic: false
  kind: positional_or_keyword
  name: batch1
  type: Tensor
- is_variadic: false
  kind: positional_or_keyword
  name: batch2
  type: Tensor
- default: 1.0
  is_variadic: false
  kind: positional_or_keyword
  name: beta
  type: float
- default: 1.0
  is_variadic: false
  kind: positional_or_keyword
  name: alpha
  type: float
variants:
  numpy:
    eager: numpy.baddbmm
  cupy: {}
  dask: {}
  tensorflow:
    eager: tf.baddbmm
  keras:
    eager: keras_ops.baddbmm
  pytorch:
    eager: torch.baddbmm
  jax:
    eager: jax.numpy.baddbmm
  mlx:
    eager: mlx.core.baddbmm
  edge_onnx: {}
  edge_stablehlo: {}
  edge_wgsl: {}
  edge_wasm_simd: {}
  llvm_cpp: {}
