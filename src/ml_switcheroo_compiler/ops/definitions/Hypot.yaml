operation: hypot
description: The Hypot operation.
std_args:
  - is_variadic: false
    kind: positional_or_keyword
    name: x1
    type: Union[array, int, float]
  - is_variadic: false
    kind: positional_or_keyword
    name: x2
    type: Union[array, int, float]
variants:
  cupy:
    eager: cp.hypot
  dask:
    eager: da.hypot
  numpy:
    eager: numpy.hypot
  tensorflow:
    eager: tf.hypot
  keras:
    eager: keras_ops.hypot
  pytorch:
    eager: torch.hypot
  jax:
    eager: jax.numpy.hypot
  mlx:
    eager: mlx.core.hypot
  edge_onnx:
    generator: hypot
  edge_stablehlo:

    opcode: stablehlo.hypot
  edge_wgsl:
    template: binary
    expr: sqrt(buf_in0_f32[in0_offset] * buf_in0_f32[in0_offset] + buf_in1_f32[in1_offset]
      * buf_in1_f32[in1_offset])
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
