BatchMatMul:
  autodiff:
    jvp: null
    jvp_rule_id: Bmm_jvp
    vjp: null
    vjp_rule_id: Bmm_vjp
  broadcast_semantics: numpy
  description: Performs a batch matrix-matrix product.
  domain: linalg
  input_tensors: &id001
  - a
  - b
  math_semantics:
    differentiable: true
    is_associative: false
    is_commutative: false
    is_idempotent: false
  operation: BatchMatMul
  output_tensors:
  - out
  signature:
    args:
    - is_variadic: false
      name: a
      type: Tensor
    - is_variadic: false
      name: b
      type: Tensor
    output_dtype_formula: promote(x1.dtype, x2.dtype)
    output_shape_formula: broadcast(x1.shape, x2.shape)
  type_promotion: standard
  variants:
    edge_wasm_simd:
      template: matmul
    llvm_cpp:
      template: matmul
Cholesky:
  autodiff:
    jvp: MatMul($tangent[0], Transpose($input[0]))
    jvp_rule_id: Cholesky_jvp
    vjp:
    - MatMul($cotangent, Transpose($input[0]))
    vjp_rule_id: Cholesky_vjp
  broadcast_semantics: numpy
  description: The Cholesky operation.
  domain: linalg
  input_tensors: *id001
  math_semantics:
    differentiable: true
    is_associative: false
    is_commutative: false
    is_idempotent: false
