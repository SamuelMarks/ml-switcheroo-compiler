      name: b
      type: Tensor
    output_dtype_formula: promote(x1.dtype, x2.dtype)
    output_shape_formula: broadcast(x1.shape, x2.shape)
  type_promotion: standard
  variants:
    cupy:
      eager: cp.linalg.cholesky
    dask:
      eager: da.linalg.cholesky
    edge_stablehlo:
      generator: stablehlo.cholesky
    edge_wasm_simd:
      scalar_expr: in0_val
      simd_expr: in0_val
      template: unary
    edge_wgsl:
      expr: buf_in0_f32[in0_offset]
      template: unary
    keras:
      eager: keras_ops.cholesky
    llvm_cpp:
      scalar_expr: in0_val
      template: unary
    numpy:
      generator: np.linalg.cholesky
    tensorflow:
      eager: tf.linalg.cholesky
