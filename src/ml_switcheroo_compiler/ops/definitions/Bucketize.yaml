operation: Bucketize
description: Returns the indices of the buckets to which each value in the input belongs.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: input
  type: Tensor
- is_variadic: false
  kind: positional_or_keyword
  name: boundaries
  type: Tensor
- default: false
  is_variadic: false
  kind: positional_or_keyword
  name: out_int32
  type: bool
- default: false
  is_variadic: false
  kind: positional_or_keyword
  name: right
  type: bool
variants:
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
  edge_wasm_simd:
    template: unary
    scalar_expr: in0_val
    simd_expr: in0_val
  edge_wgsl:
    template: unary
    expr: buf_in0_f32[in0_offset]
signature:
  args:
  - name: input
    type: Tensor
    is_variadic: false
    kind: positional_or_keyword
  - name: boundaries
    type: Tensor
    is_variadic: false
    kind: positional_or_keyword
  - name: out_int32
    type: bool
    is_variadic: false
    kind: positional_or_keyword
  - name: right
    type: bool
    is_variadic: false
    kind: positional_or_keyword
  input_tensors:
  - input
  - boundaries
  - out_int32
  - right
  output_tensors:
  - out
  has_variadic_args: false
  has_variadic_kwargs: false
  keyword_constraints: {}
  keyword_defaults: {}
dtype_rules:
  promotion_matrix: standard
  allowed_input_dtypes:
  - all
  output_dtype_inference: promote(in0, in1)
shape_signature:
  pattern: in0
  symbolic_expression: '[*shape] -> [*shape]'
  category: unary
invariants:
  is_commutative: false
  is_associative: false
  is_idempotent: false
  identity_value: null
  absorbing_value: null
autodiff:
  vjp_rule_id: Bucketize_vjp
  jvp_rule_id: Bucketize_jvp
  vjp: null
  jvp: null
