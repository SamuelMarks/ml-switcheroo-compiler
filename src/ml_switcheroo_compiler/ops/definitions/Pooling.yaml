operation: Pooling
description: Pooling layer, performing max or average pooling.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: window_shape
  type: Sequence[int]
- is_variadic: false
  kind: positional_or_keyword
  name: window_stride
  type: Sequence[int]
- is_variadic: false
  kind: positional_or_keyword
  name: pooling_type
  options:
  - MAX
  - AVG
  type: str
variants:
  edge_wasm_simd:
    template: conv_pool_1d_flat
    math_op: '* 1.0f'
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
