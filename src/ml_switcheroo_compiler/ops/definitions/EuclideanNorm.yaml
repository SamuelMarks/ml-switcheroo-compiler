operation: EuclideanNorm
description: Computes the Euclidean norm of elements across dimensions.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: x
  type: Tensor
- is_variadic: false
  kind: positional_or_keyword
  name: axis
  type: int
- default: false
  is_variadic: false
  kind: positional_or_keyword
  name: keepdims
  type: bool
variants:
  edge_wasm_simd:
    template: conv_pool_1d_flat
    math_op: '* 1.0f'
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
