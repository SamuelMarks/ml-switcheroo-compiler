operation: HammingWindow
description: The HammingWindow operation.
std_args:
  - is_variadic: false
    kind: positional_or_keyword
    name: window_length
    type: int
  - default: true
    is_variadic: false
    kind: positional_or_keyword
    name: periodic
    type: bool
  - default: 0.54
    is_variadic: false
    kind: positional_or_keyword
    name: alpha
    type: float
  - default: 0.46
    is_variadic: false
    kind: positional_or_keyword
    name: beta
    type: float
  - is_variadic: false
    kind: positional_or_keyword
    name: dtype
    type: str
variants:
  pytorch:
    generator: torch.hamming_window({window_length}, periodic={periodic}, alpha={alpha},
      beta={beta})
  numpy:
    eager: numpy.hammingwindow
  cupy: {}
  dask: {}
  tensorflow:
    eager: tf.hammingwindow
  keras:
    eager: keras_ops.hammingwindow
  jax:
    eager: jax.numpy.hammingwindow
  mlx:
    eager: mlx.core.hammingwindow
  edge_onnx:
    generator: HammingWindow
  edge_stablehlo:

    opcode: stablehlo.hamming_window
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
