operation: ArrayEqual
description: True if two arrays have the same shape and elements.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: a1
  type: Tensor
- is_variadic: false
  kind: positional_or_keyword
  name: a2
  type: Tensor
variants:
  numpy:
    eager: numpy.arrayequal
  cupy: {}
  dask: {}
  tensorflow:
    eager: tf.arrayequal
  keras:
    eager: keras_ops.arrayequal
  pytorch:
    eager: torch.arrayequal
  jax:
    eager: jax.numpy.arrayequal
  mlx:
    eager: mlx.core.arrayequal
  edge_wgsl:
    template: binary
    expr: f32(buf_in0_f32[in0_offset] != 0.0 && buf_in1_f32[in1_offset] != 0.0)
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
  edge_wasm_simd:
    template: unary
    scalar_expr: in0_val
    simd_expr: in0_val
signature:
  args:
  - name: a1
    type: Tensor
    is_variadic: false
    kind: positional_or_keyword
  - name: a2
    type: Tensor
    is_variadic: false
    kind: positional_or_keyword
  input_tensors:
  - a1
  - a2
  output_tensors:
  - out
  has_variadic_args: false
  has_variadic_kwargs: false
  keyword_constraints: {}
  keyword_defaults: {}
dtype_rules:
  promotion_matrix: standard
  allowed_input_dtypes:
  - all
  output_dtype_inference: promote(in0, in1)
shape_signature:
  pattern: in0
  symbolic_expression: '[*shape] -> [*shape]'
  category: unary
invariants:
  is_commutative: false
  is_associative: false
  is_idempotent: false
  identity_value: null
  absorbing_value: null
autodiff:
  vjp_rule_id: ArrayEqual_vjp
  jvp_rule_id: ArrayEqual_jvp
  vjp: null
  jvp: null
