operation: ArrayEqual
description: True if two arrays have the same shape and elements.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: a1
  type: Tensor
- is_variadic: false
  kind: positional_or_keyword
  name: a2
  type: Tensor
variants:
  numpy:
    eager: numpy.arrayequal
  cupy: {}
  dask: {}
  tensorflow:
    eager: tf.arrayequal
  keras:
    eager: keras_ops.arrayequal
  pytorch:
    eager: torch.arrayequal
  jax:
    eager: jax.numpy.arrayequal
  mlx:
    eager: mlx.core.arrayequal
  edge_onnx: {}
  edge_stablehlo: {}
  edge_wgsl:
    template: binary
    expr: f32(buf_in0_f32[in0_offset] != 0.0 && buf_in1_f32[in1_offset] != 0.0)
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
