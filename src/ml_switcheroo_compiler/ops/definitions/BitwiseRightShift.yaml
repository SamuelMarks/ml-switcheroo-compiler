operation: BitwiseRightShift
description: Computes the right arithmetic shift of input by other bits.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: input
  type: Any
- is_variadic: false
  kind: positional_or_keyword
  name: other
  type: Any
variants:
  numpy:
    eager: numpy.bitwiserightshift
  cupy: {}
  dask: {}
  tensorflow:
    eager: tf.bitwiserightshift
  keras:
    eager: keras_ops.bitwiserightshift
  pytorch:
    eager: torch.bitwiserightshift
  jax:
    eager: jax.numpy.bitwiserightshift
  mlx:
    eager: mlx.core.bitwiserightshift
  edge_onnx: {}
  edge_stablehlo: {}
  edge_wgsl:
    template: binary
    expr: f32(buf_in0_f32[in0_offset] != 0.0 && buf_in1_f32[in1_offset] != 0.0)
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
