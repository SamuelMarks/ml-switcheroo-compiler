operation: Cdist
description: Computes batched the p-norm distance between each pair of the two collections
  of row vectors.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: x1
  type: Tensor
- is_variadic: false
  kind: positional_or_keyword
  name: x2
  type: Tensor
- default: 2.0
  is_variadic: false
  kind: positional_or_keyword
  name: p
  type: float
variants:
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
