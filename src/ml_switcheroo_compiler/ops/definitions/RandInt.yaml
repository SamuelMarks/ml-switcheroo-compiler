operation: RandInt
description: Returns a tensor filled with random integers generated uniformly between
  low (inclusive) and high (exclusive).
std_args:
- default: 0
  is_variadic: false
  kind: positional_or_keyword
  name: low
  type: int
- is_variadic: false
  kind: positional_or_keyword
  name: high
  type: int
- is_variadic: true
  kind: positional_or_keyword
  name: size
  type: int
variants:
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
signature:
  args:
  - name: low
    type: int
    is_variadic: false
    kind: positional_or_keyword
  - name: high
    type: int
    is_variadic: false
    kind: positional_or_keyword
  - name: size
    type: int
    is_variadic: true
    kind: positional_or_keyword
  input_tensors:
  - low
  - high
  - size
  output_tensors:
  - out
  has_variadic_args: true
  has_variadic_kwargs: false
  keyword_constraints: {}
  keyword_defaults: {}
dtype_rules:
  promotion_matrix: standard
  allowed_input_dtypes:
  - all
  output_dtype_inference: promote(in0, in1)
shape_signature:
  pattern: in0
  symbolic_expression: '[*shape] -> [*shape]'
  category: unary
invariants:
  is_commutative: false
  is_associative: false
  is_idempotent: false
  identity_value: null
  absorbing_value: null
autodiff:
  vjp_rule_id: RandInt_vjp
  jvp_rule_id: RandInt_jvp
  vjp: null
  jvp: null
