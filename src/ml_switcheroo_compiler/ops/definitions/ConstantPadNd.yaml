operation: ConstantPadNd
description: Pads a tensor with a constant value.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: input
  type: Tensor
- is_variadic: false
  kind: positional_or_keyword
  name: pad
  type: List[int]
- default: 0.0
  is_variadic: false
  kind: positional_or_keyword
  name: value
  type: float
variants:
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
