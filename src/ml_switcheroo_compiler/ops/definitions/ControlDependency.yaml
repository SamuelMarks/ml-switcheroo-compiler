operation: ControlDependency
description: Insert dependencies between arrays in the graph.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: inputs
  type: Union[Tensor, Sequence[Tensor]]
- is_variadic: false
  kind: positional_or_keyword
  name: dependencies
  type: Union[Tensor, Sequence[Tensor]]
variants:
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
  edge_wgsl:
    template: unary
    expr: buf_in0_f32[in0_offset]
signature:
  args:
  - name: inputs
    type: Union[Tensor, Sequence[Tensor]]
    is_variadic: false
    kind: positional_or_keyword
  - name: dependencies
    type: Union[Tensor, Sequence[Tensor]]
    is_variadic: false
    kind: positional_or_keyword
  input_tensors:
  - inputs
  - dependencies
  output_tensors:
  - out
  has_variadic_args: false
  has_variadic_kwargs: false
  keyword_constraints: {}
  keyword_defaults: {}
dtype_rules:
  promotion_matrix: standard
  allowed_input_dtypes:
  - all
  output_dtype_inference: promote(in0, in1)
shape_signature:
  pattern: in0
  symbolic_expression: '[*shape] -> [*shape]'
  category: unary
invariants:
  is_commutative: false
  is_associative: false
  is_idempotent: false
  identity_value: null
  absorbing_value: null
autodiff:
  vjp_rule_id: ControlDependency_vjp
  jvp_rule_id: ControlDependency_jvp
  vjp: null
  jvp: null
