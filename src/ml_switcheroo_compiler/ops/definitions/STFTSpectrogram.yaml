operation: STFTSpectrogram
description: Computes the Short-Time Fourier Transform (STFT) spectrogram.
std_args:
- default: 256
  is_variadic: false
  kind: positional_or_keyword
  name: frame_length
  type: int
- is_variadic: false
  kind: positional_or_keyword
  name: frame_step
  type: int
- is_variadic: false
  kind: positional_or_keyword
  name: fft_length
  type: int
variants:
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
