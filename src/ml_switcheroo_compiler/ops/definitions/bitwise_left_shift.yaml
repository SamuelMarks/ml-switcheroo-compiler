operation: bitwise_left_shift
description: Shifts the bits of each element ``x1_i`` of the input array ``x1`` to
  the left by appending ``x2_i`` (i.e., the respective element in the input array
  ``x2``) zeros to the right of ``x1_i``.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: x1
  type: Union[array, int]
- is_variadic: false
  kind: positional_or_keyword
  name: x2
  type: Union[array, int]
variants:
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
signature:
  args:
  - name: x1
    type: Union[array, int]
    is_variadic: false
    kind: positional_or_keyword
  - name: x2
    type: Union[array, int]
    is_variadic: false
    kind: positional_or_keyword
  input_tensors:
  - x1
  - x2
  output_tensors:
  - out
  has_variadic_args: false
  has_variadic_kwargs: false
  keyword_constraints: {}
  keyword_defaults: {}
dtype_rules:
  promotion_matrix: standard
  allowed_input_dtypes:
  - all
  output_dtype_inference: promote(in0, in1)
shape_signature:
  pattern: in0
  symbolic_expression: '[*shape] -> [*shape]'
  category: unary
invariants:
  is_commutative: false
  is_associative: false
  is_idempotent: false
  identity_value: null
  absorbing_value: null
autodiff:
  vjp_rule_id: bitwise_left_shift_vjp
  jvp_rule_id: bitwise_left_shift_jvp
  vjp: null
  jvp: null
