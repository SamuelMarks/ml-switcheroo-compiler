operation: Convolution
description: Generic convolution operator.
std_args:
- input
- weight
- bias
- stride
- padding
- dilation
- groups
variants:
  edge_wasm_simd:
    template: conv_pool_1d_flat
    math_op: '* 1.0f'
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
  edge_stablehlo:
    generator: stablehlo.convolution
  edge_wgsl:
    template: unary
    expr: buf_in0_f32[in0_offset]
signature:
  args: []
  input_tensors:
  - x
  output_tensors:
  - out
  has_variadic_args: false
  has_variadic_kwargs: false
  keyword_constraints: {}
  keyword_defaults: {}
dtype_rules:
  promotion_matrix: standard
  allowed_input_dtypes:
  - all
  output_dtype_inference: promote(in0, in1)
shape_signature:
  pattern: conv2d(N, C_in, H, W), (C_out, C_in, kH, kW) -> (N, C_out, H_out, W_out)
  symbolic_expression: '[*shape] -> [*shape]'
  category: spatial
invariants:
  is_commutative: false
  is_associative: false
  is_idempotent: false
  identity_value: null
  absorbing_value: null
autodiff:
  vjp_rule_id: Convolution_vjp
  jvp_rule_id: Convolution_jvp
  vjp: null
  jvp: null
