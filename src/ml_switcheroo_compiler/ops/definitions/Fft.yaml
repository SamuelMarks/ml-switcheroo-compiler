operation: fft
description: The Fft operation.
std_args:
  - is_variadic: false
    kind: positional_or_keyword
    name: x
    type: array
  - is_variadic: false
    kind: positional_or_keyword
    name: n
    type: Optional[int]
  - is_variadic: false
    kind: positional_or_keyword
    name: axis
    type: int
  - is_variadic: false
    kind: positional_or_keyword
    name: norm
    type: Literal[backward, ortho, forward]
type: function
variants:
  cupy:
    eager: cp.fft
  dask:
    eager: da.fft
  keras:
    eager: keras_ops.fft
  numpy:
    generator: np.fft.fft
  tensorflow: {}
  pytorch: {}
  jax: {}
  mlx: {}
  edge_onnx:
    generator: fft
  edge_stablehlo:

    opcode: stablehlo.fft
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
