operation: fft
description: The Fft operation.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: x
  type: array
- is_variadic: false
  kind: positional_or_keyword
  name: n
  type: Optional[int]
- is_variadic: false
  kind: positional_or_keyword
  name: axis
  type: int
- is_variadic: false
  kind: positional_or_keyword
  name: norm
  type: Literal[backward, ortho, forward]
type: function
variants:
  cupy:
    eager: cp.fft
  dask:
    eager: da.fft
  keras:
    eager: keras_ops.fft
  numpy:
    generator: np.fft.fft
  tensorflow: {}
  pytorch: {}
  jax: {}
  mlx: {}
  edge_stablehlo:
    opcode: stablehlo.fft
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
  edge_wasm_simd:
    template: unary
    scalar_expr: in0_val
    simd_expr: in0_val
  edge_wgsl:
    template: unary
    expr: buf_in0_f32[in0_offset]
signature:
  args:
  - name: x
    type: array
    is_variadic: false
    kind: positional_or_keyword
  - name: n
    type: Optional[int]
    is_variadic: false
    kind: positional_or_keyword
  - name: axis
    type: int
    is_variadic: false
    kind: positional_or_keyword
  - name: norm
    type: Literal[backward, ortho, forward]
    is_variadic: false
    kind: positional_or_keyword
  input_tensors:
  - x
  output_tensors:
  - out
  has_variadic_args: false
  has_variadic_kwargs: false
  keyword_constraints: {}
  keyword_defaults: {}
dtype_rules:
  promotion_matrix: standard
  allowed_input_dtypes:
  - all
  output_dtype_inference: promote(in0, in1)
shape_signature:
  pattern: in0
  symbolic_expression: '[*shape] -> [*shape]'
  category: unary
invariants:
  is_commutative: false
  is_associative: false
  is_idempotent: false
  identity_value: null
  absorbing_value: null
autodiff:
  vjp_rule_id: fft_vjp
  jvp_rule_id: fft_jvp
  vjp: null
  jvp: null
