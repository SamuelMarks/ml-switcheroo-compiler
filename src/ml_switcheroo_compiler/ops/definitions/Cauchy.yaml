operation: Cauchy
description: "Samples from a Cauchy (Lorentz) distribution. The distribution of the\
  \ ratio of\nindependent normally distributed random variables with means `0` follows\
  \ a\nCauchy distribution.\n\nExample::\n\n    >>> # xdoctest: +IGNORE_WANT(\"non-deterministic\"\
  )\n    >>> m = Cauchy(torch.tensor([0.0]), torch.tensor([1.0]))\n    >>> m.sample()\
  \  # sample from a Cauchy distribution with loc=0 and scale=1\n    tensor([ 2.3214])\n\
  \nArgs:\n    loc (float or Tensor): mode or median of the distribution.\n    scale\
  \ (float or Tensor): half width at half maximum."
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: loc
  type: Any
- is_variadic: false
  kind: positional_or_keyword
  name: scale
  type: Any
- is_variadic: false
  kind: positional_or_keyword
  name: validate_args
  type: Any
variants:
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
  edge_wasm_simd:
    template: unary
    scalar_expr: in0_val
    simd_expr: in0_val
  edge_wgsl:
    template: unary
    expr: buf_in0_f32[in0_offset]
signature:
  args:
  - name: loc
    type: Any
    is_variadic: false
    kind: positional_or_keyword
  - name: scale
    type: Any
    is_variadic: false
    kind: positional_or_keyword
  - name: validate_args
    type: Any
    is_variadic: false
    kind: positional_or_keyword
  input_tensors:
  - loc
  - scale
  - validate_args
  output_tensors:
  - out
  has_variadic_args: false
  has_variadic_kwargs: false
  keyword_constraints: {}
  keyword_defaults: {}
dtype_rules:
  promotion_matrix: standard
  allowed_input_dtypes:
  - all
  output_dtype_inference: promote(in0, in1)
shape_signature:
  pattern: in0
  symbolic_expression: '[*shape] -> [*shape]'
  category: unary
invariants:
  is_commutative: false
  is_associative: false
  is_idempotent: false
  identity_value: null
  absorbing_value: null
autodiff:
