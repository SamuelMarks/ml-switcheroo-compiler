operation: ApplyAlongAxis
description: Apply a function to 1-D slices along the given axis.
std_args:
  - is_variadic: false
    kind: positional_or_keyword
    name: func1d
    type: Callable
  - is_variadic: false
    kind: positional_or_keyword
    name: axis
    type: int
  - is_variadic: false
    kind: positional_or_keyword
    name: arr
    type: Tensor
variants:
  numpy: {}
  cupy: {}
  dask: {}
  tensorflow: {}
  keras: {}
  pytorch: {}
  jax: {}
  mlx: {}
  edge_onnx:
    generator: ApplyAlongAxis
  edge_stablehlo:

    opcode: stablehlo.apply_along_axis
  edge_wgsl:
    template: binary
    expr: f32(buf_in0_f32[in0_offset] != 0.0 && buf_in1_f32[in1_offset] != 0.0)
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
