operation: ApplyAlongAxis
description: Apply a function to 1-D slices along the given axis.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: func1d
  type: Callable
- is_variadic: false
  kind: positional_or_keyword
  name: axis
  type: int
- is_variadic: false
  kind: positional_or_keyword
  name: arr
  type: Tensor
variants:
  numpy: {}
  cupy: {}
  dask: {}
  tensorflow: {}
  keras: {}
  pytorch: {}
  jax: {}
  mlx: {}
