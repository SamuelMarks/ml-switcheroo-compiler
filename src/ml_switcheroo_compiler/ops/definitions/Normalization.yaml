operation: Normalization
description: A preprocessing layer that normalizes continuous features.
std_args:
- default: -1
  is_variadic: false
  kind: positional_or_keyword
  name: axis
  type: int
- is_variadic: false
  kind: positional_or_keyword
  name: mean
  type: float
- is_variadic: false
  kind: positional_or_keyword
  name: variance
  type: float
variants:
  edge_wasm_simd:
    template: conv_pool_1d_flat
    math_op: '* 1.0f'
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
