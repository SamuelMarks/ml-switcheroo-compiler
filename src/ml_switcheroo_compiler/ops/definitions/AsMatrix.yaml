operation: AsMatrix
description: Interpret the input as a matrix.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: data
  type: Any
variants:
  numpy:
    eager: numpy.asmatrix
  cupy: {}
  dask: {}
  tensorflow:
    eager: tf.asmatrix
  keras:
    eager: keras_ops.asmatrix
  pytorch:
    eager: torch.asmatrix
  jax:
    eager: jax.numpy.asmatrix
  mlx:
    eager: mlx.core.asmatrix
  edge_onnx: {}
  edge_stablehlo: {}
  edge_wgsl:
    template: unary
    expr: buf_in0_f32[in0_offset]
  edge_wasm_simd:
    template: unary
    simd_expr: in0_val
    scalar_expr: in0_val
  llvm_cpp:
    template: unary
    scalar_expr: in0_val
