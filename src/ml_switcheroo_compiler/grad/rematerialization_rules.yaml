# Declarative Rematerialization and Checkpointing Policies
default_policy: "recompute_all"

policies:
  recompute_all:
    description: "Recompute forward operations during backward pass to minimize memory footprint"
    target_ops:
      - Relu
      - Gelu
      - Silu
      - Sigmoid
      - Add
      - Subtract
      - Multiply
      - TrueDivide
      - Sqrt
      - Exp
      - Log
      - Tanh
      - LayerNorm
      - RMSNorm
      - BatchNorm
      - Dropout
    high_cost_ops:
      - MatMul
      - BatchMatMul
      - Conv1D
      - Conv2D
      - Conv3D
      - SVD
      - Cholesky
      - Solve
    evict_activations: true

  memory_budget:
    description: "Evict activations exceeding threshold bytes"
    max_activation_bytes: 1048576
    evict_activations: true
    target_ops:
      - Relu
      - Gelu
      - Silu
      - Sigmoid
      - Add
      - Multiply
    high_cost_ops:
      - MatMul
      - Conv2D

  selective:
    description: "Preserve heavy operations and recompute elementwise activations"
    target_ops:
      - Relu
      - Gelu
      - Silu
      - Sigmoid
      - Add
      - Multiply
      - LayerNorm
      - RMSNorm
    high_cost_ops:
      - MatMul
      - BatchMatMul
      - Conv1D
      - Conv2D
      - Conv3D
    evict_activations: true

target_ops:
  - Relu
  - Gelu
  - Silu
  - Sigmoid
  - Add
  - Subtract
  - Multiply
  - TrueDivide
  - Sqrt
  - Exp
  - Log
  - Tanh
  - LayerNorm
  - RMSNorm
  - BatchNorm
  - Dropout

high_cost_ops:
  - MatMul
  - BatchMatMul
  - Conv1D
  - Conv2D
  - Conv3D
  - SVD
  - Cholesky
  - Solve

thresholds:
  min_memory_bytes: 1048576
  max_compute_to_memory_ratio: 10.0
